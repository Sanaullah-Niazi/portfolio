# ---------------------------------------------------------------
# Site settings. Change these when you move to your own domain.
# ---------------------------------------------------------------
title: Sana Ullah Khan
tagline: Early-career researcher · MS Artificial Intelligence
description: >-
  Sana Ullah Khan is an AI cybersecurity researcher (MS Artificial Intelligence)
  working on machine learning and NLP for phishing, scam and fraud detection
  and AI-generated text detection.
lang: en

# Languages of the site. English lives at the root (/), the others under /ur/, /de/ and /zh/.
# Their text is in _data/strings.yml (English) and _data/<code>/ (the translations).
languages:
  - { code: en, name: English, tag: en }
  - { code: ur, name: اردو, tag: ur }
  - { code: de, name: Deutsch, tag: de }
  - { code: zh, name: 中文, tag: zh-Hans }

# The site lives on its own domain (set in the CNAME file), so baseurl is empty.
url: https://sanaullahniazi.com
baseurl: ""

# Contact form, delivered to your inbox by Web3Forms (free).
# Get an access key at https://web3forms.com (enter your email, the key is
# emailed to you) and paste it here. The key is meant to be public.
web3forms_access_key: "2b287e6d-2d29-4bf0-ad1d-de6332d90d1c"

# Used by search engines and link previews.
author:
  name: Sana Ullah Khan
  url: https://sanaullahniazi.com/
social:
  name: Sana Ullah Khan
  links:
    - https://github.com/Sanaullah-Niazi
    - https://www.linkedin.com/in/sanaullahkhanniazi
    - https://scholar.google.com/citations?user=V1nFOOkAAAAJ&hl=en
    # Add your ORCID link here too once you have it, e.g. - https://orcid.org/0000-0000-0000-0000

# Picture shown when a page is shared on WhatsApp, LinkedIn, Facebook, Slack...
# A page can use its own picture by adding "image: /assets/img/your-picture.png" to its front matter.
locale: en_US

# ---------------------------------------------------------------
# You normally don't need to change anything below this line.
# ---------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:name/
  # Daily security briefs, written by scripts/security_news.py (see .github/workflows/security-news.yml).
  briefs:
    output: true
    permalink: /security-news/:name/

defaults:
  - scope: { path: "" }
    values:
      image:
        path: /assets/img/social-card.png
        width: 1200
        height: 630
        alt: "Sana Ullah Khan · AI × Cybersecurity researcher"
  - scope: { path: "google68fd583c48fd5ed6.html" }
    values: { sitemap: false }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: briefs }
    values: { layout: brief }

permalink: /blog/:year/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: blog/feed.xml

markdown: kramdown
sass:
  style: compressed

# Jekyll skips folders that start with a dot, so list the security.txt folder here.
include:
  - .well-known

exclude:
  - README.md
  - assets/cv/README.md
  - assets/img/certificates/README.md
  - Gemfile
  - Gemfile.lock
  - templates/
  - scripts/
  - vendor/
