# ---------------------------------------------------------------
# Site settings. Change these when you move to your own domain.
# ---------------------------------------------------------------
title: Sana Ullah Khan
tagline: Early-career researcher · MS Artificial Intelligence
description: >-
  Sana Ullah Khan is an AI cybersecurity researcher (MS Artificial Intelligence)
  working on machine learning and NLP for phishing, scam and fraud detection
  and AI-generated text detection.
lang: en

# Languages of the site. English lives at the root (/), the others under /ur/, /de/ and /zh/.
# Their text is in _data/strings.yml (English) and _data/<code>/ (the translations).
languages:
  - { code: en, name: English, tag: en }
  - { code: ur, name: اردو, tag: ur }
  - { code: de, name: Deutsch, tag: de }
  - { code: zh, name: 中文, tag: zh-Hans }

# The site lives on its own domain (set in the CNAME file), so baseurl is empty.
url: https://sanaullahniazi.com
baseurl: ""

# Contact form, delivered to your inbox by Web3Forms (free).
# Get an access key at https://web3forms.com (enter your email, the key is
# emailed to you) and paste it here. The key is meant to be public.
web3forms_access_key: "2b287e6d-2d29-4bf0-ad1d-de6332d90d1c"

# Website Health & Security Checker (/tools/website-health-checker/). It needs the Cloudflare Worker in worker/
# (setup steps in worker/README.md). api: the Worker's address, for example https://site-checker.<you>.workers.dev
# turnstile_sitekey: the Turnstile site key (public; the secret key goes in the Worker, never here).
# Until both are filled in, the tool page shows a "not set up yet" note.
health_checker:
  api: "https://api.sanaullahniazi.com"
  turnstile_sitekey: "0x4AAAAAAFnnZEkRDo4FeZE5"
  report_days: 7

# Public copy of the tools' code (kept in sync by .github/workflows/sync-tool-repos.yml). Linked from /tools/.
tools_repo: https://github.com/Sanaullah-Niazi/free-security-tools

# Visitor statistics without cookies (so no cookie banner is needed). Fill in ONE of these; empty = no statistics script.
# The privacy page follows this setting.
# - Cloudflare Web Analytics (recommended: the site already runs on Cloudflare, so there is no new account).
#   Cloudflare dashboard > Analytics & Logs > Web Analytics > Add a site > sanaullahniazi.com, choose the
#   JavaScript snippet (manual) setup, and paste the token from the snippet ("token": "...") here.
cloudflare_analytics_token: ""
#   Or, if Web Analytics is set to "Enable" (Cloudflare adds the snippet itself), set this to true instead of
#   pasting a token, so the site's security policy lets Cloudflare's script run.
cloudflare_analytics_auto: true
# - GoatCounter: create a site at https://www.goatcounter.com/signup and paste its code here
#   (for https://sanaullah.goatcounter.com the code is "sanaullah").
goatcounter: ""

# Ads. Off for now: no ad code is loaded anywhere. Only pages with "ads: true" can ever show ads; the defaults below
# turn that on for the tools, roadmaps and security news pages (in every language) and nowhere else.
# When Google AdSense approves the site: put your publisher ID (ca-pub-...) in client, set enabled: true, and
# set up Google's consent message for EU/UK/Swiss visitors in AdSense > Privacy & messaging. ads.txt is built from client.
# The privacy page already says ads may be shown on these pages; check its wording when ads go live.
ads:
  enabled: false
  client: ""        # ca-pub-...
  slot: ""          # the ad unit ID from AdSense > Ads > By ad unit

# Used by search engines and link previews.
author:
  name: Sana Ullah Khan
  url: https://sanaullahniazi.com/
social:
  name: Sana Ullah Khan
  links:
    - https://github.com/Sanaullah-Niazi
    - https://www.linkedin.com/in/sanaullahkhanniazi
    - https://scholar.google.com/citations?user=V1nFOOkAAAAJ&hl=en
    # Add your ORCID link here too once you have it, e.g. - https://orcid.org/0000-0000-0000-0000

# Picture shown when a page is shared on WhatsApp, LinkedIn, Facebook, Slack...
# A page can use its own picture by adding "image: /assets/img/your-picture.png" to its front matter.
locale: en_US

# ---------------------------------------------------------------
# You normally don't need to change anything below this line.
# ---------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:name/
  # Daily security briefs, written by scripts/security_news.py (see .github/workflows/security-news.yml).
  briefs:
    output: true
    permalink: /security-news/:name/

defaults:
  - scope: { path: "" }
    values:
      image:
        path: /assets/img/social-card.png
        width: 1200
        height: 630
        alt: "Sana Ullah Khan · AI × Cybersecurity researcher"
  - scope: { path: "google68fd583c48fd5ed6.html" }
    values: { sitemap: false }
  - scope: { path: "", type: projects }
    values: { layout: project, seo: { type: CreativeWork } }   # a project page, not a blog post
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: briefs }
    values: { layout: brief }
  # Pages where ads may be shown later (see "ads" above). Nowhere else.
  - scope: { path: "tools" }
    values: { ads: true }
  - scope: { path: "roadmaps" }
    values: { ads: true }
  - scope: { path: "security-news" }
    values: { ads: true }
  - scope: { path: "ur/tools" }
    values: { ads: true }
  - scope: { path: "ur/roadmaps" }
    values: { ads: true }
  - scope: { path: "ur/security-news" }
    values: { ads: true }
  - scope: { path: "de/tools" }
    values: { ads: true }
  - scope: { path: "de/roadmaps" }
    values: { ads: true }
  - scope: { path: "de/security-news" }
    values: { ads: true }
  - scope: { path: "zh/tools" }
    values: { ads: true }
  - scope: { path: "zh/roadmaps" }
    values: { ads: true }
  - scope: { path: "zh/security-news" }
    values: { ads: true }

permalink: /blog/:year/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: blog/feed.xml

markdown: kramdown
sass:
  style: compressed

# Jekyll skips names that start with a dot or an underscore, so list the security.txt folder and the
# Cloudflare headers file here.
include:
  - .well-known
  - _headers

exclude:
  - README.md
  - worker/
  - cloudflare/
  - assets/cv/README.md
  - assets/img/certificates/README.md
  - Gemfile
  - Gemfile.lock
  - templates/
  - scripts/
  - mirrors/
  - vendor/
