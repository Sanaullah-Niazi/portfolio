# Builds the website with Jekyll and uploads it to Cloudflare (cloudflare/wrangler.toml). The new version is live
# within seconds of the upload, on every Cloudflare server at once, so there is no cache delay like on GitHub Pages.
# Runs on every push to main, after the daily Security news update, or by hand from the Actions tab
# ("Deploy website" > "Run workflow"). It uses the same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets as
# deploy-worker.yml. More in cloudflare/README.md.
name: Deploy website

on:
  push:
    branches: [main]
    paths-ignore: ["worker/**", "mirrors/**", ".github/workflows/deploy-worker.yml"]
  # The daily news commit is pushed by another workflow, which doesn't start this one on its own.
  workflow_run:
    workflows: ["Security news"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# When several changes land close together, only the newest one needs to go out.
concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  # Where the uploaded site answers. Checked after each upload.
  SITE_URL: https://sanaullahniazi.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The Cloudflare token is given only to the steps that need it, never to the build: installing gems and npm
      # packages runs their code, and none of it should be able to read the token.
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first (see worker/README.md)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main
          # Full history, so the sitemap can date each page by its last commit.
          fetch-depth: 0

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build the site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build
          # Lets the last step (and you) see which commit is live: open /version.txt on the site.
          git rev-parse HEAD > _site/version.txt
          # Every sitemap address gets the date its page last changed.
          python3 scripts/sitemap_lastmod.py _site/sitemap.xml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install wrangler
        working-directory: cloudflare
        run: npm ci

      - name: Upload to Cloudflare
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          npx wrangler deploy --config www/wrangler.toml

      - name: Check the new version is live
        run: |
          want=$(cat _site/version.txt)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "$SITE_URL/version.txt" 2>/dev/null || true)
            if [ "$got" = "$want" ]; then echo "Live at $SITE_URL"; exit 0; fi
            sleep 10
          done
          echo "::warning::$SITE_URL isn't showing this version yet. A new custom domain can take a few minutes the first time."
