# Temporary: reads the live checker's state to debug a failing scan. Not for merging.
name: Diagnose website checker
on:
  push:
    branches: [claude/project-thread-b309uo]
    paths: [".github/workflows/diag-checker.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: API answers
        run: |
          curl -sS -i https://api.sanaullahniazi.com/ | head -20
          echo; echo "--- preflight"
          curl -sS -i -X OPTIONS -H "Origin: https://sanaullahniazi.com" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://api.sanaullahniazi.com/scan | head -20
          echo; echo "--- POST /scan with a dummy token"
          curl -sS -i -X POST -H "Origin: https://sanaullahniazi.com" -H "content-type: application/json" -d '{"url":"https://sanaullahniazi.com","token":"x","lang":"en"}' https://api.sanaullahniazi.com/scan | head -20
      - name: Live page headers and CSP
        run: |
          curl -sS -D - -o /tmp/page https://sanaullahniazi.com/tools/website-health-checker/ | grep -iv "^report-to\|^nel" 
          grep -o '<meta http-equiv="Content-Security-Policy"[^>]*>' /tmp/page
          grep -o 'data-api="[^"]*"\|health-checker.js[^"]*' /tmp/page | head
      - name: Watch the Worker's logs for 7 minutes (retry a scan meanwhile)
        run: |
          timeout 420 npx wrangler tail site-checker --format pretty || true
      - name: Recent scans
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(l.find(x=>x.name==="site-checker").uuid)')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler d1 execute site-checker --remote --json --command "SELECT id, url, datetime(created/1000,'unixepoch') AS at, core IS NOT NULL AS c, length(core) AS cl, substr(core,1,120) AS core_head, psi_mobile IS NOT NULL AS pm, substr(psi_mobile,1,80) AS pm_head, psi_desktop IS NOT NULL AS pd, links0 IS NOT NULL AS l0, substr(ssl,1,120) AS ssl, ssl_polls FROM scans ORDER BY created DESC LIMIT 12" > /tmp/scans.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/scans.json","utf8"))[0].results;for(const x of r)console.log(JSON.stringify(x))' 
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/scans.json","utf8"))[0].results;require("fs").writeFileSync("/tmp/ids",r.map(x=>x.id).join("\n"))'
          npx wrangler d1 execute site-checker --remote --json --command "SELECT k, n, datetime(reset/1000,'unixepoch') AS reset FROM hits ORDER BY reset DESC LIMIT 10" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"))[0].results;for(const x of r)console.log(x.k.slice(0,14), x.n, x.reset)'
      - name: Fetch those reports
        run: |
          for id in $(cat /tmp/ids); do echo "--- $id"; curl -sS -o /tmp/r -w "%{http_code} %{size_download}\n" -H "Origin: https://sanaullahniazi.com" https://api.sanaullahniazi.com/report/$id; head -c 300 /tmp/r; echo; done
