# Updates the Pakistan current affairs page of the BPSC section (/bpsc-interview/news/) every morning: collects the
# headlines with scripts/pk_news.py, commits them, and "Deploy website" publishes the site after it (workflow_run).
# It also writes a short AI daily brief with possible viva questions when the repository has a GEMINI_API_KEY secret
# (free, from aistudio.google.com) or an ANTHROPIC_API_KEY secret, the same keys as the Security news brief.
# Run it by hand any time from the Actions tab ("PK news" > "Run workflow").
name: PK news

on:
  schedule:
    - cron: "30 1 * * *"   # every day at 01:30 UTC (06:30 in Pakistan)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pk-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the Claude SDK (only used when the API key is set)
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install --quiet "anthropic>=0.80"

      - name: Collect the news and write the brief
        run: python3 scripts/pk_news.py

      - name: Commit the update
        run: |
          git add _data/pk_news.json _pk_briefs
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Pakistan news"
          git pull --rebase --quiet
          git push
