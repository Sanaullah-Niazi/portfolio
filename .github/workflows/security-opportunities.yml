# Updates the Security scholarships page (/scholarships/) once a day: collects security PhD and master's positions,
# scholarships and fellowships from public feeds with scripts/security_opportunities.py, drops closed ones,
# checks the links of the yearly programmes in _data/sec_programs.yml, and commits the result. "Deploy website"
# then publishes it. Run it by hand any time from the Actions tab ("Security scholarships" > "Run workflow").
# On a pull request that changes the script it only does a test run and prints what it found (nothing is saved).
name: Security scholarships

on:
  schedule:
    - cron: "41 3 * * *"   # every day at 03:41 UTC (08:41 in Pakistan)
  workflow_dispatch:
  pull_request:
    paths: ["scripts/security_opportunities.py", "_data/sec_programs.yml", ".github/workflows/security-opportunities.yml"]

permissions:
  contents: write

concurrency:
  group: security-opportunities-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Probe candidate feeds (temporary)
        if: github.event_name == 'pull_request'
        run: python3 .github/probe_feeds.py 'https://www.jobs.ac.uk/feeds/subject-areas/computer-sciences' 'https://www.jobs.ac.uk/feeds' 'https://www.jobs.ac.uk/feeds/type-roles/research.rss' 'https://www.jobs.ac.uk/feeds/type-roles/academic-or-research.rss' 'https://www.academictransfer.com/en/jobs/rss/' 'https://www.higheredjobs.com/rss/categoryFeed.cfm?catID=103' 'https://jobrxiv.org/feed/?post_type=job_listing' 'https://cra.org/ads/feed/' 'https://iacr.org/jobs/' 'https://opportunitydesk.org/?s=cyber+security&feed=rss2' 'https://www.scholars4dev.com/?s=cyber+security&feed=rss2' 'https://www.scholars4dev.com/?s=computer+science&feed=rss2' 'https://www.timeshighereducation.com/unijobs/jobsrss/?keywords=phd+security' 'https://www.timeshighereducation.com/unijobs/jobsrss/?keywords=studentship' 'https://www.timeshighereducation.com/unijobs/jobsrss/?keywords=doctoral+cyber' 'https://scholarshipdb.net/rss' 'https://www.nature.com/naturecareers/rss' 'https://academicjobsonline.org/ajo/rss' 'https://www.jobbnorge.no/en/rss' 'https://main.hercjobs.org/jobs/?display=rss&keywords=cyber+security' 'https://jobs.nottingham.ac.uk/rss/rss.aspx?cat=600' 'https://www.academicpositions.com/feed/rss?field=computer-security-and-reliability' 'https://www.findamasters.com/robots.txt' 'https://www.timeshighereducation.com/unijobs/jobsrss/?keywords=scholarship+cyber'

      - name: Collect the openings
        run: python3 scripts/security_opportunities.py ${{ github.event_name == 'pull_request' && '--report' || '' }}

      - name: Commit the update
        if: github.event_name != 'pull_request'
        run: |
          git add _data/security_opportunities.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update security scholarships"
          git pull --rebase --quiet
          git push

      - name: Show the data (temporary, for the preview)
        if: github.event_name == 'pull_request'
        run: echo "JSONSTART"; cat _data/security_opportunities.json; echo "JSONEND"
