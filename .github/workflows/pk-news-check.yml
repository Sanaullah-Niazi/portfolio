# Tests the Pakistan news feeds whenever scripts/pk_news.py changes in a pull request (or by hand): robots.txt,
# whether each feed answers, how many stories it gives, and whether a few story links open. Writes nothing.
name: PK news feed check

on:
  pull_request:
    paths: ["scripts/pk_news.py", "scripts/security_news.py", ".github/workflows/pk-news-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test the feeds
        run: python3 scripts/pk_news.py --check
