# Checks every link on the Roadmaps, Certifications and Security roadmaps pages (_data/roadmaps.yml, _data/cert_roadmaps.yml,
# _data/sec_frameworks.yml and _data/sec_domains/*.yml) once a week, and whenever one of those files changes.
# If a link is broken the run fails and GitHub emails you; the log lists the broken links.
name: Check roadmap links

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  push:
    paths: ["_data/roadmaps.yml", "_data/cert_roadmaps.yml", "_data/sec_frameworks.yml", "_data/sec_domains/**"]
  pull_request:
    paths: ["_data/roadmaps.yml", "_data/cert_roadmaps.yml", "_data/sec_frameworks.yml", "_data/sec_domains/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Some big sites (Coursera, Kaggle, Khan Academy) refuse automated checks with 403 or 429.
          # Those answers mean "the site is up but won't talk to robots", so they count as fine.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200..=299,403,429
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
            _data/roadmaps.yml
            _data/cert_roadmaps.yml
            _data/sec_frameworks.yml
            _data/sec_domains/*.yml
          fail: true
