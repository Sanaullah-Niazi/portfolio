# The Certifications page (/roadmaps/certifications/), in English. This file holds every certification and every track.
# The translations in _data/<code>/cert_roadmaps.yml only hold the text; prices and links always come from here.
#
# Prices change. When you review them, update "checked" and each "cost" from the official page ("url").
# To add a certification: add it under "certs:" with a new id, then put that id in a track's "steps".
# To add a track: copy one block under "tracks:" and give it a new id.
#   level: entry, mid or advanced
#   steps: in order; each step lists one or more cert ids. When a step has two, either one is fine.
# Every link here is checked once a week by .github/workflows/check-roadmap-links.yml.

checked: 2026-10-27   # the day the prices and rules below were last checked

# ---- Page text. Only change the text after the colon. ----
eyebrow: "Certifications"
title: "Certification roadmaps"
lede: "Which certifications to take, in what order, for each career. With the real cost, what the exam is like, how long it stays valid, and an honest word on which ones are worth it."
pill: "Prices in US dollars, checked"
advice_title: "Read this first"
advice:
  - "A certification gets your CV past filters and into interviews. Your skills and projects get you the job. Do the matching learning roadmap alongside it."
  - "Start with the cheap, hands-on ones. Leave expensive certifications for when an employer can pay for them."
  - "One certification per step is enough. When a step shows two, pick the one employers near you ask for."
  - "Prices are US list prices before tax. Many vendors charge less in some countries and give student discounts, so check the official page before you pay."
  - "Never use exam dumps (leaked questions). They break the exam rules, and vendors revoke certifications for it."
tracks_label: "Choose a career"
step: "Step"
or: "or"
levels:
  entry: "Entry"
  mid: "Intermediate"
  advanced: "Advanced"
cost: "Cost"
exam: "Exam"
valid: "Valid for"
needs: "Before you start"
official: "Official page"
