how_title: "How these roadmaps work"
how:
  - "Every roadmap uses the same four stages: Beginner, Intermediate, Advanced and Expert. Each stage ends with a checkpoint. Move on when you can do everything in it."
  - "Start with one of the six core domains. Most specialist areas build on one of them."
