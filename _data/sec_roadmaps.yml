# ---- The categories, in the order shown ----
categories:
  - id: core
    icon: shield
    title: "Core domains"
    summary: "The six foundations of a security career. Start here."
    domains: [secops, network, iam, cloud, appsec, dfir]
    planned: []

  - id: infra
    icon: monitor
    title: "IT security and infrastructure"
    summary: "Securing the machines, networks and services an organisation runs on."
    domains: [endpoint, hardening, container, email, webedge]
    planned: []

  - id: data
    icon: lock
    title: "Information security and data protection"
    summary: "Protecting information itself: who can see it, where it lives and how long it is kept."
    domains: [datasec, privacy, crypto, pqc]
    planned: []

  - id: engineering
    icon: code
    title: "Application, engineering and product security"
    summary: "Building security into software, pipelines and products from the first line of code."
    domains: [devsecops, supplychain, secarch, prodsec, hwsec]
    planned: []

  - id: defence
    icon: radar
    title: "Defensive security and threat management"
    summary: "Finding, understanding and stopping attacks."
    domains: [detection, hunting, cti, malware, vulnmgmt, soar]
    planned: []

  - id: offence
    icon: bug
    title: "Offensive security and assessment"
    summary: "Testing defences the way attackers would, with permission and within agreed rules."
    domains: []
    planned: ["Penetration Testing", "Red Teaming", "Purple Teaming", "Security Auditing", "Vulnerability Research", "Security Code Review", "Web and API Security Assessment", "Cloud Security Assessment", "Wireless Security Assessment", "Mobile Security Assessment", "Hardware and Firmware Assessment", "Adversary Emulation", "Bug Bounty and Coordinated Disclosure", "Security Quality Assurance", "Attack Path Analysis"]

  - id: grc
    icon: briefcase
    title: "Governance, risk, compliance and audit"
    summary: "Deciding what to protect, proving it is protected, and keeping the business running."
    domains: [grc, risk, audit, tprm, resilience, awareness, leadership]
    planned: []

  - id: ai
    icon: brain
    title: "AI and machine learning security"
    summary: "Securing AI systems, and using AI to defend everything else."
    domains: [llmsec, agentsec, mlsec, ai-redteam, ai-grc, ai-supply, ai-secops]
    planned: []

  - id: special
    icon: chip
    title: "Specialised and emerging"
    summary: "Security for particular industries, physical systems and new technology."
    domains: []
    planned: ["OT Security", "ICS Security", "SCADA Security", "IoT Security", "Automotive Cybersecurity", "Railway and Transportation Security", "Aviation Cybersecurity", "Maritime Cybersecurity", "Energy and Utility Security", "Healthcare Cybersecurity", "Financial Services Security", "Telecommunications Security", "Satellite and Space Cybersecurity", "Aerospace and Defense Security", "Government and Public Sector Security", "Critical Infrastructure Protection", "Blockchain and Web3 Security", "Quantum Security", "Physical Security", "Cyber-Physical Systems Security", "Operational Safety and Cybersecurity", "Privacy and Identity Technologies", "Electronic Fraud and Abuse Prevention", "Digital Trust and Assurance", "Cybersecurity Research and Education"]
