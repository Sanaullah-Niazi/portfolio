# The Cybersecurity & AI Security Roadmaps index (/roadmaps/security/), in English.
# Each finished roadmap is its own file in _data/sec_domains/<id>.yml, with a page stub at
# roadmaps/security/<id>/index.html. List its id under its category's "domains:".
# "planned:" lists the roadmaps that are written later; they show on the index as "coming soon".
#
# To finish a planned roadmap: copy _data/sec_domains/secops.yml to a new id, fill it in,
# copy roadmaps/security/secops/index.html (change permalink, title, description and domain),
# then move the name from "planned:" to that id under "domains:".
# Every link in the roadmap files is checked once a week by .github/workflows/check-roadmap-links.yml.

reviewed: 2026-10-27

