# The Roadmaps page (/roadmaps/), in English. This file holds every path, stage and link.
# The translations in _data/<code>/roadmaps.yml only hold the text; links always come from here.
#
# To add a path: copy one block under "paths:", give it a new id, and fill it in. It appears on
# every language at once (in English until you add its text to the other roadmaps.yml files).
# To add a resource: add a line under a stage's "resources:". Use only free, reputable sources:
# a university, the project's own documentation, or a long-running non-profit.
#   type:  course, book, docs, practice, video, paper or tool (shown as a small label)
#   A link to this site starts with "/". Add local: true when the page exists in every language (e.g. a tool).
#   audit: true when the course is free to watch but the certificate costs money
# Every link here is checked once a week by .github/workflows/check-roadmap-links.yml.

reviewed: 2026-10-27   # change this date whenever you review the links and content

