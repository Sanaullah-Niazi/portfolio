# ---- Groups of learning paths in the first section of the library, in order. A path appears once. ----
groups:
  - id: start
    icon: cap
    title: "Start here"
    paths: [foundations, networking, linux, cybersecurity]
  - id: build
    icon: code
    title: "Build and run systems"
    paths: [web, cloud-devops]
  - id: ai
    icon: brain
    title: "AI and data"
    paths: [ai-ml, ai-security, data]

# ---- Shortcuts in the bar above every roadmap page: security roadmap ids, with a short label. ----
quick:
  - { to: secops, label: "SOC analyst" }
  - { to: pentest, label: "Pentesting" }
  - { to: cloud, label: "Cloud security" }
  - { to: llmsec, label: "LLM security" }
  - { to: grc, label: "GRC" }

# ---- The paths. "needs" lists the ids of paths (or "foundations") to do first. ----
paths:
  - id: foundations
    icon: cap
    start: true
    title: "Foundations of computer science"
    summary: "Programming, the tools every developer uses, data structures, and how computers and networks really work."
    who: "Anyone starting out, or anyone who learnt to code from tutorials and has gaps."
    roles: ["Every other path"]
    stages:
      - title: "Learn to program"
        weeks: "6–8"
        learn: ["Variables, conditions and loops", "Functions", "Lists and dictionaries", "Reading error messages", "Debugging"]
        build: "A small command-line program you design yourself, such as an expense tracker that saves to a file."
        ready: "You can write a 100-line program without following a tutorial."
        resources:
          - { name: "CS50x: Introduction to Computer Science", by: "Harvard University", url: "https://cs50.harvard.edu/x/", type: course }
          - { name: "The Python Tutorial", by: "Python Software Foundation", url: "https://docs.python.org/3/tutorial/", type: docs }
      - title: "The terminal, Git and Linux"
        weeks: "3–4"
        learn: ["Shell commands and pipes", "Files and permissions", "Git commits, branches and merges", "GitHub", "A code editor"]
        build: "Put every program you have written on GitHub, each with a short README."
        ready: "You can work in the terminal without a mouse and fix a merge conflict."
        resources:
          - { name: "The Missing Semester of Your CS Education", by: "MIT", url: "https://missing.csail.mit.edu/", type: course }
          - { name: "Pro Git", by: "Scott Chacon and Ben Straub", url: "https://git-scm.com/book/en/v2", type: book }
          - { name: "The Linux Command Line", by: "William Shotts", url: "https://linuxcommand.org/tlcl.php", type: book }
      - title: "Data structures and algorithms"
        weeks: "8–10"
        learn: ["Big-O notation", "Arrays, linked lists, stacks and queues", "Hash tables", "Trees and graphs", "Sorting, searching and recursion"]
        build: "Write your own hash table and a graph search (BFS and DFS), with tests."
        ready: "You can explain why a dictionary lookup is fast and choose the right structure for a problem."
        resources:
          - { name: "6.006 Introduction to Algorithms", by: "MIT OpenCourseWare", url: "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/", type: course }
          - { name: "Open Data Structures", by: "Pat Morin", url: "https://opendatastructures.org/", type: book }
      - title: "How computers and networks work"
        weeks: "8–10"
        learn: ["Logic gates to CPU", "Memory and processes", "Operating systems", "TCP/IP, DNS and HTTP", "Concurrency basics"]
        build: "A tiny web server written with raw sockets that serves a page to your browser."
        ready: "You can explain everything that happens between typing a web address and seeing the page."
        resources:
          - { name: "Nand2Tetris", by: "Noam Nisan and Shimon Schocken", url: "https://www.nand2tetris.org/", type: course }
          - { name: "Operating Systems: Three Easy Pieces", by: "University of Wisconsin–Madison", url: "https://pages.cs.wisc.edu/~remzi/OSTEP/", type: book }
          - { name: "Computer Networks: A Systems Approach", by: "Larry Peterson and Bruce Davie", url: "https://book.systemsapproach.org/", type: book }
      - title: "Math and databases"
        weeks: "6–8"
        learn: ["Logic and proofs", "Sets, counting and probability", "Relational databases", "SQL queries and joins", "Designing tables"]
        build: "Design a database for a small library or shop and answer 20 questions about it in SQL."
        ready: "You can write a query with joins and grouping, and reason about a simple probability."
        resources:
          - { name: "6.042J Mathematics for Computer Science", by: "MIT OpenCourseWare", url: "https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-fall-2010/", type: course }
          - { name: "SQLBolt", by: "SQLBolt", url: "https://sqlbolt.com/", type: practice }
          - { name: "Intro to Database Systems (CMU 15-445)", by: "Carnegie Mellon University", url: "https://15445.courses.cs.cmu.edu/", type: course }

  - id: web
    icon: code
    title: "Web development"
    summary: "Build websites and web apps, from the page people see to the server and database behind it."
    who: "People who want to build things others can use right away, in a browser."
    needs: ["foundations"]
    roles: ["Front-end developer", "Back-end developer", "Full-stack developer"]
    stages:
      - title: "HTML, CSS and how the web works"
        weeks: "4–6"
        learn: ["Semantic HTML", "Accessibility", "CSS layout with flexbox and grid", "Responsive design", "Browser developer tools"]
        build: "A personal page that works on a phone and passes an accessibility check."
        ready: "You can rebuild the layout of a site you like from scratch."
        resources:
          - { name: "Learn web development", by: "MDN (Mozilla)", url: "https://developer.mozilla.org/en-US/docs/Learn_web_development", type: course }
          - { name: "Learn HTML, CSS and Accessibility", by: "web.dev (Google Chrome team)", url: "https://web.dev/learn", type: course }
      - title: "JavaScript in depth"
        weeks: "6–8"
        learn: ["The DOM and events", "Functions, closures and objects", "Promises and async/await", "Fetching data from APIs", "Modules"]
        build: "An app that uses a public API, such as a weather or book search app."
        ready: "You can build an interactive page without a framework."
        resources:
          - { name: "The Modern JavaScript Tutorial", by: "javascript.info", url: "https://javascript.info/", type: book }
          - { name: "The Odin Project", by: "The Odin Project (open source)", url: "https://www.theodinproject.com/", type: course }
      - title: "A front-end framework and TypeScript"
        weeks: "6–8"
        learn: ["Components and state", "Forms and validation", "Routing", "TypeScript types", "Testing components"]
        build: "A multi-page app with forms, saved state and at least a few tests."
        ready: "You can explain when a component re-renders and why."
        resources:
          - { name: "Learn React", by: "React team", url: "https://react.dev/learn", type: docs }
          - { name: "The TypeScript Handbook", by: "Microsoft", url: "https://www.typescriptlang.org/docs/handbook/intro.html", type: docs }
          - { name: "Full Stack Open", by: "University of Helsinki", url: "https://fullstackopen.com/en/", type: course }
      - title: "Back end and databases"
        weeks: "8–10"
        learn: ["HTTP in detail", "Building REST APIs", "Login, sessions and tokens", "PostgreSQL", "Automated tests"]
        build: "An API with user accounts and a database, with tests, used by your front end."
        ready: "You can design an API, store data safely, and test it."
        resources:
          - { name: "Learn Node.js", by: "OpenJS Foundation", url: "https://nodejs.org/en/learn", type: docs }
          - { name: "HTTP", by: "MDN (Mozilla)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP", type: docs }
          - { name: "PostgreSQL Tutorial", by: "PostgreSQL Global Development Group", url: "https://www.postgresql.org/docs/current/tutorial.html", type: docs }
      - title: "Ship it, safely"
        weeks: "4–6"
        learn: ["Deploying an app", "Environment variables and secrets", "HTTPS", "Continuous integration", "The OWASP Top 10"]
        build: "Deploy your full app with automatic tests on every push, and check it against the OWASP Top 10."
        ready: "Strangers can use your app and you would know if it broke."
        resources:
          - { name: "OWASP Top 10", by: "OWASP Foundation", url: "https://owasp.org/Top10/2025/", type: docs }
          - { name: "OWASP Cheat Sheet Series", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/", type: docs }
          - { name: "GitHub Actions documentation", by: "GitHub", url: "https://docs.github.com/en/actions", type: docs }

  - id: networking
    icon: wifi
    title: "Computer networking"
    summary: "How data really moves between computers: addresses, protocols, routing and the traffic you will defend or attack in every security job."
    who: "Anyone heading into security, cloud or IT support. Every security role assumes you can read network traffic."
    needs: ["foundations"]
    roles: ["Network administrator", "Network security engineer", "SOC analyst", "Cloud engineer"]
    stages:
      - title: "How networks work"
        weeks: "3–4"
        learn: ["The OSI and TCP/IP models", "IP addresses and subnetting", "Ethernet, MAC addresses and ARP", "Switches and routers", "Ports and sockets"]
        build: "Draw your home network: every device, its IP and MAC address, your router, and how a packet reaches the internet."
        ready: "You can subnet a /24 by hand and explain what happens between typing a web address and seeing the page."
        resources:
          - { name: "Computer Networks: A Systems Approach", by: "Larry Peterson and Bruce Davie", url: "https://book.systemsapproach.org/", type: book }
          - { name: "Network+ training course", by: "Professor Messer", url: "https://www.professormesser.com/network-plus/n10-009/n10-009-video/n10-009-training-course/", type: video }
      - title: "The protocols you will see every day"
        weeks: "4–6"
        learn: ["TCP and UDP", "DNS", "DHCP and NAT", "HTTP, HTTPS and TLS", "ICMP, ping and traceroute"]
        build: "Capture your own traffic in Wireshark while you load a website, and label the DNS lookup, the TCP handshake and the TLS handshake."
        ready: "You can open a packet capture and say which device talked to which, over what protocol, and why."
        resources:
          - { name: "Wireshark User's Guide", by: "Wireshark Foundation", url: "https://www.wireshark.org/docs/wsug_html_chunked/", type: docs }
          - { name: "HTTP", by: "MDN (Mozilla)", url: "https://developer.mozilla.org/en-US/docs/Web/HTTP", type: docs }
      - title: "Switching, routing and IPv6"
        weeks: "4–6"
        learn: ["VLANs and trunking", "Static and dynamic routing (OSPF)", "How BGP connects the internet", "Wi-Fi standards and security", "IPv6 addressing"]
        build: "Build a small office network in Packet Tracer: two VLANs, a router between them, DHCP and a guest Wi-Fi that cannot reach the office."
        ready: "You can design a segmented network and troubleshoot why two machines cannot talk."
        resources:
          - { name: "Cisco Packet Tracer", by: "Cisco Networking Academy", url: "https://www.netacad.com/cisco-packet-tracer", type: tool }
          - { name: "Cisco Networking Academy", by: "Cisco", url: "https://www.netacad.com/", type: course }
      - title: "Network security"
        weeks: "4–6"
        learn: ["Firewalls and segmentation", "VPNs", "Scanning your own network with Nmap", "IDS and network monitoring", "Spotting attacks in packet captures"]
        build: "Scan your home lab with Nmap, close what should not be open, then analyse one malware traffic exercise and write up what happened."
        ready: "You can find exposed services on a network you own and explain an attack from its traffic."
        resources:
          - { name: "Nmap Network Scanning", by: "Gordon Lyon (Nmap project)", url: "https://nmap.org/book/", type: book }
          - { name: "Malware Traffic Analysis exercises", by: "Brad Duncan", url: "https://www.malware-traffic-analysis.net/", type: practice }

  - id: linux
    icon: terminal
    title: "Linux and operating systems"
    summary: "Use Linux and Windows like a professional: the command line, how an operating system works inside, running servers, and locking them down."
    who: "Anyone heading into security, DevOps or cloud. Most servers, security tools and attacks live on these systems."
    needs: ["foundations"]
    roles: ["Linux system administrator", "Security engineer", "DevOps engineer", "SOC analyst"]
    stages:
      - title: "The Linux command line"
        weeks: "3–4"
        learn: ["Moving around the file system", "Files, users and permissions", "Pipes and redirection", "grep, find, sed and awk", "Installing software with a package manager"]
        build: "Finish the first 20 levels of OverTheWire Bandit and keep notes on every command you learned."
        ready: "You can do everyday work in a terminal without a mouse and read a man page to learn a new command."
        resources:
          - { name: "The Linux Command Line", by: "William Shotts", url: "https://linuxcommand.org/tlcl.php", type: book }
          - { name: "OverTheWire: Bandit", by: "OverTheWire", url: "https://overthewire.org/wargames/bandit/", type: practice }
      - title: "How operating systems work"
        weeks: "4–6"
        learn: ["Processes and threads", "Memory and virtual memory", "File systems", "System calls", "How a computer boots"]
        build: "Write a tiny shell in C or Python that runs commands, supports pipes, and handles Ctrl+C."
        ready: "You can explain what happens, step by step, when you run a program."
        resources:
          - { name: "Operating Systems: Three Easy Pieces", by: "Remzi and Andrea Arpaci-Dusseau (University of Wisconsin)", url: "https://pages.cs.wisc.edu/~remzi/OSTEP/", type: book }
          - { name: "The Missing Semester of Your CS Education", by: "MIT", url: "https://missing.csail.mit.edu/", type: course }
      - title: "Running a Linux server"
        weeks: "4–6"
        learn: ["Users, groups and sudo", "Services with systemd", "Logs and journalctl", "SSH keys", "Scheduled jobs and backups"]
        build: "Set up a Linux server in a virtual machine that serves a web page, logs in only with SSH keys, and backs itself up every night."
        ready: "You can find out why a service failed from its logs and fix it."
        resources:
          - { name: "Ubuntu Server documentation", by: "Canonical", url: "https://documentation.ubuntu.com/server/", type: docs }
          - { name: "ArchWiki", by: "Arch Linux community", url: "https://wiki.archlinux.org/", type: docs }
      - title: "Windows and PowerShell"
        weeks: "3–4"
        learn: ["PowerShell basics", "Windows services and the registry", "Event logs", "Active Directory: users, groups and domains", "Group Policy"]
        build: "Build a small Windows lab with one domain controller and one client, and write a PowerShell script that lists every user and their last sign-in."
        ready: "You can explain how a Windows domain sign-in works and where it is logged."
        resources:
          - { name: "PowerShell documentation", by: "Microsoft", url: "https://learn.microsoft.com/en-us/powershell/scripting/overview", type: docs }
          - { name: "Active Directory Domain Services overview", by: "Microsoft", url: "https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/virtual-dc/active-directory-domain-services-overview", type: docs }
      - title: "Scripting and hardening"
        weeks: "3–4"
        learn: ["Bash scripting", "Automating tasks with Python", "Firewalls on the host", "CIS Benchmarks", "Auditing a system for weak settings"]
        build: "Audit your server with Lynis, fix the most important findings, and write a script that checks they stay fixed."
        ready: "You can harden a fresh server and prove what you changed."
        resources:
          - { name: "CIS Benchmarks", by: "Center for Internet Security", url: "https://www.cisecurity.org/cis-benchmarks", type: docs }
          - { name: "Lynis", by: "CISOfy", url: "https://cisofy.com/lynis/", type: tool }

  - id: cybersecurity
    icon: shield
    title: "Cybersecurity fundamentals"
    to_security: true
    summary: "The beginner on-ramp to security: understand how systems are attacked so you can defend them. Specialise afterwards with the security roadmaps below."
    who: "Curious people who like taking things apart and want to protect people and systems."
    needs: ["foundations"]
    note: "Only test systems you own or have written permission to test. Use the practice labs below; attacking other systems is illegal almost everywhere."
    roles: ["SOC analyst", "Penetration tester", "Security engineer", "AI security researcher"]
    stages:
      - title: "Networking and Linux for security"
        weeks: "6–8"
        learn: ["The TCP/IP model and common ports", "DNS, HTTP and TLS on the wire", "Reading traffic in Wireshark", "Linux users, permissions and logs", "Shell scripting"]
        build: "Capture your own browsing in Wireshark and write a short explanation of what each part of the traffic is."
        ready: "You can read a packet capture and say what happened, and you have finished most of OverTheWire Bandit."
        resources:
          - { name: "OverTheWire: Bandit", by: "OverTheWire", url: "https://overthewire.org/wargames/bandit/", type: practice }
          - { name: "Wireshark documentation", by: "Wireshark Foundation", url: "https://www.wireshark.org/docs/", type: docs }
          - { name: "Computer Networks: A Systems Approach", by: "Larry Peterson and Bruce Davie", url: "https://book.systemsapproach.org/", type: book }
      - title: "Security fundamentals"
        weeks: "6–8"
        learn: ["Confidentiality, integrity and availability", "Authentication and access control", "Hashing, encryption and certificates", "Common attacks and malware", "Risk and security frameworks"]
        build: "A one-page threat model for an app you built: what could go wrong, how likely it is, and what you would fix first."
        ready: "You can explain how TLS protects a login and why passwords are hashed, not encrypted."
        resources:
          - { name: "Security+ (SY0-701) video course", by: "Professor Messer", url: "https://www.professormesser.com/", type: video }
          - { name: "Cryptography I", by: "Stanford University (Coursera)", url: "https://www.coursera.org/learn/crypto", type: course, audit: true }
          - { name: "Cybersecurity Framework", by: "NIST", url: "https://www.nist.gov/cyberframework", type: docs }
      - title: "Web application security"
        weeks: "8–10"
        learn: ["SQL injection", "Cross-site scripting", "Broken access control", "Authentication flaws", "Server-side request forgery", "Using Burp Suite"]
        build: "Find and write up at least ten vulnerabilities in OWASP Juice Shop, including how to fix each one."
        ready: "You can explain, exploit in a lab, and fix each class in the OWASP Top 10."
        resources:
          - { name: "Web Security Academy", by: "PortSwigger", url: "https://portswigger.net/web-security", type: practice }
          - { name: "OWASP Juice Shop", by: "OWASP Foundation", url: "https://owasp.org/www-project-juice-shop/", type: practice }
          - { name: "OWASP Top 10", by: "OWASP Foundation", url: "https://owasp.org/Top10/2025/", type: docs }
      - title: "Pick a side: defend or attack"
        weeks: "10–12"
        learn: ["Defence: logs, SIEM and alert triage", "Defence: incident response", "Attack: reconnaissance and exploitation", "Attack: privilege escalation", "Both: MITRE ATT&CK", "Both: writing clear reports"]
        build: "Defence: a home lab that collects logs and detects three ATT&CK techniques. Attack: solve 20 picoCTF challenges and publish write-ups."
        ready: "You can show your lab or write-ups to an employer and talk through your reasoning."
        resources:
          - { name: "MITRE ATT&CK", by: "MITRE", url: "https://attack.mitre.org/", type: docs }
          - { name: "Security Onion documentation", by: "Security Onion Solutions", url: "https://docs.securityonion.net/", type: docs }
          - { name: "picoCTF", by: "Carnegie Mellon University", url: "https://picoctf.org/", type: practice }
          - { name: "6.858 Computer Systems Security", by: "MIT OpenCourseWare", url: "https://ocw.mit.edu/courses/6-858-computer-systems-security-fall-2014/", type: course }
      - title: "Specialise and keep up"
        learn: ["Cloud security", "AI and LLM security", "Malware analysis", "Governance, risk and compliance", "Following advisories"]
        build: "Publish something others can use: a write-up, a detection rule, or a small tool."
        ready: "This stage never ends. Security changes every month."
        resources:
          - { name: "OWASP Top 10 for LLM Applications", by: "OWASP Foundation", url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/", type: docs }
          - { name: "MITRE ATLAS (attacks on AI systems)", by: "MITRE", url: "https://atlas.mitre.org/", type: docs }
          - { name: "AI Risk Management Framework", by: "NIST", url: "https://www.nist.gov/itl/ai-risk-management-framework", type: docs }
          - { name: "Free cybersecurity training", by: "CISA", url: "https://www.cisa.gov/resources-tools/training", type: course }

  - id: ai-ml
    icon: brain
    title: "AI and machine learning"
    summary: "From the math behind learning to training models, working with language models, and putting them into use responsibly."
    who: "People comfortable with programming who enjoy math and experiments."
    needs: ["foundations"]
    roles: ["Machine learning engineer", "Data scientist", "AI researcher", "MLOps engineer"]
    stages:
      - title: "Math for machine learning"
        weeks: "6–8"
        learn: ["Vectors and matrices", "Derivatives and gradients", "Probability", "Statistics", "Optimisation"]
        build: "Implement linear regression with gradient descent using only NumPy, and plot the loss going down."
        ready: "You can explain gradient descent on a whiteboard."
        resources:
          - { name: "Essence of Linear Algebra", by: "3Blue1Brown", url: "https://www.3blue1brown.com/topics/linear-algebra", type: video }
          - { name: "Mathematics for Machine Learning", by: "Deisenroth, Faisal and Ong (Cambridge University Press)", url: "https://mml-book.github.io/", type: book }
          - { name: "Statistics and probability", by: "Khan Academy", url: "https://www.khanacademy.org/math/statistics-probability", type: course }
      - title: "Python for data"
        weeks: "3–4"
        learn: ["NumPy arrays", "pandas data frames", "Cleaning messy data", "Plotting", "Jupyter notebooks"]
        build: "Clean and explore a public dataset, and write down three things you found."
        ready: "You can load, clean and summarise a dataset you have never seen."
        resources:
          - { name: "NumPy quickstart", by: "NumPy", url: "https://numpy.org/doc/stable/user/quickstart.html", type: docs }
          - { name: "pandas getting started", by: "pandas", url: "https://pandas.pydata.org/docs/getting_started/index.html", type: docs }
          - { name: "Kaggle Learn", by: "Kaggle", url: "https://www.kaggle.com/learn", type: practice }
      - title: "Classical machine learning"
        weeks: "8–10"
        learn: ["Training, validation and test sets", "Overfitting and regularisation", "Regression and classification", "Decision trees and ensembles", "Choosing the right metric"]
        build: "A model trained end to end, tested on data it never saw, with an honest note on where it fails."
        ready: "You can tell when a good score is really data leakage."
        resources:
          - { name: "Machine Learning Crash Course", by: "Google", url: "https://developers.google.com/machine-learning/crash-course", type: course }
          - { name: "An Introduction to Statistical Learning", by: "James, Witten, Hastie, Tibshirani and Taylor", url: "https://www.statlearning.com/", type: book }
          - { name: "scikit-learn user guide", by: "scikit-learn", url: "https://scikit-learn.org/stable/user_guide.html", type: docs }
      - title: "Deep learning"
        weeks: "10–12"
        learn: ["Neural networks and backpropagation", "PyTorch", "Convolutional networks", "Transformers and attention", "Training on a GPU"]
        build: "Train an image or text classifier and compare it with the classical model from the last stage."
        ready: "You can build and debug a training loop yourself."
        resources:
          - { name: "Practical Deep Learning for Coders", by: "fast.ai", url: "https://course.fast.ai/", type: course }
          - { name: "Neural Networks: Zero to Hero", by: "Andrej Karpathy", url: "https://karpathy.ai/zero-to-hero.html", type: video }
          - { name: "Dive into Deep Learning", by: "d2l.ai (open source)", url: "https://d2l.ai/", type: book }
          - { name: "PyTorch tutorials", by: "PyTorch Foundation", url: "https://pytorch.org/tutorials/", type: docs }
      - title: "Language models"
        weeks: "8–10"
        learn: ["Tokens and embeddings", "How large language models are trained", "Fine-tuning", "Retrieval-augmented generation", "Evaluating outputs"]
        build: "A question-answering app over your own notes, with a small test set to measure how often it is right."
        ready: "You can explain why a model gave a wrong answer and measure whether a change helped."
        resources:
          - { name: "LLM Course", by: "Hugging Face", url: "https://huggingface.co/learn/llm-course/chapter1/1", type: course }
          - { name: "CS224N: NLP with Deep Learning", by: "Stanford University", url: "https://web.stanford.edu/class/cs224n/", type: course }
      - title: "Put models into use, responsibly"
        learn: ["Serving a model behind an API", "Monitoring and data drift", "Bias and fairness", "Privacy", "Attacks on AI systems"]
        build: "Deploy one of your models with monitoring and a short model card that says what it should not be used for."
        ready: "This stage never ends. Keep shipping and measuring."
        resources:
          - { name: "Made With ML", by: "Goku Mohandas", url: "https://madewithml.com/", type: course }
          - { name: "Rules of Machine Learning", by: "Google", url: "https://developers.google.com/machine-learning/guides/rules-of-ml", type: docs }
          - { name: "AI Risk Management Framework", by: "NIST", url: "https://www.nist.gov/itl/ai-risk-management-framework", type: docs }

  - id: ai-security
    icon: lock
    title: "AI security"
    to_security: true
    summary: "How AI systems are attacked and how to defend them: from the threats to models and LLM apps, through adversarial machine learning and red teaming, to the rules that govern AI."
    who: "People who know the basics of both machine learning and security, and want to work where the two meet."
    needs: ["ai-ml", "cybersecurity"]
    note: "Only attack models, apps and systems you own or have written permission to test. Use the labs and open-source tools below."
    roles: ["AI security engineer", "AI red teamer", "ML security researcher", "AI governance and risk specialist"]
    stages:
      - title: "Foundations: machine learning and security basics"
        weeks: "4–6"
        learn: ["How models are trained and evaluated", "Training, validation and test data", "Threat modelling", "Common web and API attacks", "Where AI fits in a normal system"]
        build: "Draw the architecture of a small ML or LLM app (data, model, API, users) and mark every place an attacker could reach."
        ready: "You can train a simple classifier and explain the OWASP Top 10 web risks. If not, do the first stages of the AI and machine learning and Cybersecurity fundamentals paths first."
        resources:
          - { name: "Machine Learning Crash Course", by: "Google", url: "https://developers.google.com/machine-learning/crash-course", type: course }
          - { name: "OWASP Top 10", by: "OWASP Foundation", url: "https://owasp.org/Top10/2025/", type: docs }
          - { name: "Threat Modeling Cheat Sheet", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html", type: docs }
      - title: "Threats to AI systems"
        weeks: "3–4"
        learn: ["OWASP Top 10 for LLM Applications", "MITRE ATLAS tactics and techniques", "The AI supply chain: data, models and libraries", "Attacks across the ML lifecycle", "Real AI incidents"]
        build: "A threat model for your app from stage 1, mapped to OWASP LLM risks and MITRE ATLAS techniques, with one mitigation for each."
        ready: "For any AI feature, you can name the three most likely attacks and where each one enters."
        resources:
          - { name: "OWASP Top 10 for LLM Applications", by: "OWASP Foundation", url: "https://owasp.org/www-project-top-10-for-large-language-model-applications/", type: docs }
          - { name: "MITRE ATLAS", by: "MITRE", url: "https://atlas.mitre.org/", type: docs }
          - { name: "OWASP AI Exchange", by: "OWASP Foundation", url: "https://owaspai.org/", type: docs }
          - { name: "Adversarial Machine Learning: A Taxonomy and Terminology (AI 100-2)", by: "NIST", url: "https://csrc.nist.gov/pubs/ai/100/2/e2025/final", type: paper }
      - title: "Adversarial machine learning"
        weeks: "8–10"
        learn: ["Evasion attacks (adversarial examples)", "Data poisoning and backdoors", "Model extraction", "Privacy attacks: membership inference and model inversion", "Defences and how to evaluate them honestly"]
        build: "Attack your own image or text classifier with an evasion attack using the Adversarial Robustness Toolbox, then add a defence and measure how much it really helps."
        ready: "You can run an evasion and a poisoning attack on your own model and explain why most simple defences fail."
        resources:
          - { name: "Adversarial Robustness: Theory and Practice", by: "Zico Kolter and Aleksander Madry", url: "https://adversarial-ml-tutorial.org/", type: course }
          - { name: "Adversarial Robustness Toolbox", by: "Linux Foundation AI & Data", url: "https://github.com/Trusted-AI/adversarial-robustness-toolbox", type: tool }
          - { name: "Explaining and Harnessing Adversarial Examples", by: "Goodfellow, Shlens and Szegedy (ICLR 2015)", url: "https://arxiv.org/abs/1412.6572", type: paper }
          - { name: "Membership Inference Attacks against Machine Learning Models", by: "Shokri et al. (IEEE S&P 2017)", url: "https://arxiv.org/abs/1610.05820", type: paper }
          - { name: "Stealing Machine Learning Models via Prediction APIs", by: "Tramèr et al. (USENIX Security 2016)", url: "https://arxiv.org/abs/1609.02943", type: paper }
      - title: "LLM security in practice"
        weeks: "6–8"
        learn: ["Direct and indirect prompt injection", "Jailbreaks", "Insecure output handling and excessive agency", "Red teaming LLM apps", "Guardrails, input and output checks", "Hidden text in documents and web pages"]
        build: "Build a small LLM app that reads documents, red-team it with garak or PyRIT, then add guardrails and show the before and after results."
        ready: "You can find a prompt injection in an LLM app you didn't write, explain the root cause and propose a fix that doesn't rely on the prompt alone."
        resources:
          - { name: "Web LLM attacks (free labs)", by: "PortSwigger Web Security Academy", url: "https://portswigger.net/web-security/llm-attacks", type: practice }
          - { name: "LLM Prompt Injection Prevention Cheat Sheet", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/cheatsheets/LLM_Prompt_Injection_Prevention_Cheat_Sheet.html", type: docs }
          - { name: "garak: LLM vulnerability scanner", by: "NVIDIA (open source)", url: "https://github.com/NVIDIA/garak", type: tool }
          - { name: "PyRIT: Python Risk Identification Tool", by: "Microsoft (open source)", url: "https://github.com/Azure/PyRIT", type: tool }
          - { name: "Hidden text and prompt injection finder", by: "This site", url: "/tools/hidden-text-detector/", local: true, type: tool }
      - title: "Governance, risk and regulation"
        weeks: "4–6"
        learn: ["NIST AI Risk Management Framework", "The generative AI profile", "EU AI Act basics: risk levels and duties", "ISO/IEC 42001 AI management systems", "Secure AI development guidelines"]
        build: "A two-page risk assessment for your LLM app using the NIST AI RMF functions (Govern, Map, Measure, Manage), including which EU AI Act risk level it would fall under."
        ready: "You can explain to a manager what the EU AI Act asks of a high-risk system and how the NIST AI RMF helps meet it."
        resources:
          - { name: "AI Risk Management Framework", by: "NIST", url: "https://www.nist.gov/itl/ai-risk-management-framework", type: docs }
          - { name: "Generative AI Profile (NIST AI 600-1)", by: "NIST", url: "https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-generative-artificial-intelligence", type: docs }
          - { name: "AI Act: regulatory framework", by: "European Commission", url: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai", type: docs }
          - { name: "ISO/IEC 42001 overview", by: "ISO", url: "https://www.iso.org/standard/42001", type: docs }
          - { name: "Guidelines for secure AI system development", by: "UK NCSC, CISA and partners", url: "https://www.ncsc.gov.uk/collection/guidelines-secure-ai-system-development", type: docs }
      - title: "Specialise and keep up"
        learn: ["AI for the SOC", "AI red teaming", "Agent and tool security", "Reading new research papers", "AI security CTFs"]
        build: "Publish something others can use: a write-up of an AI CTF, a reproduction of a recent attack paper, or a small open-source tool."
        ready: "This stage never ends. New attacks on AI appear every month."
        resources:
          - { name: "LLM and generative AI security roadmap", by: "This site", url: "/roadmaps/security/llmsec/", type: docs }
          - { name: "AI red teaming and evaluation roadmap", by: "This site", url: "/roadmaps/security/ai-redteam/", type: docs }
          - { name: "AI for security operations roadmap", by: "This site", url: "/roadmaps/security/ai-secops/", type: docs }
          - { name: "Agentic AI and MCP security roadmap", by: "This site", url: "/roadmaps/security/agentsec/", type: docs }
          - { name: "AI Village", by: "AI Village (DEF CON, non-profit)", url: "https://aivillage.org/", type: practice }
          - { name: "Cryptography and Security papers (latest)", by: "arXiv (Cornell University)", url: "https://arxiv.org/list/cs.CR/recent", type: paper }

  - id: data
    icon: chart
    title: "Data analysis and engineering"
    summary: "Turn raw data into answers people can act on, and build the pipelines that keep that data flowing."
    who: "People who like asking questions and finding the answer in numbers."
    needs: ["foundations"]
    roles: ["Data analyst", "Analytics engineer", "Data engineer"]
    stages:
      - title: "SQL in depth"
        weeks: "4–6"
        learn: ["Filtering and sorting", "Joins", "Grouping and aggregates", "Subqueries", "Window functions"]
        build: "Answer 15 real questions about a public dataset using only SQL."
        ready: "You can answer most business questions with one well-written query."
        resources:
          - { name: "SQLBolt", by: "SQLBolt", url: "https://sqlbolt.com/", type: practice }
          - { name: "Select Star SQL", by: "Zi Chong Kao", url: "https://selectstarsql.com/", type: book }
          - { name: "Intro to SQL", by: "Kaggle", url: "https://www.kaggle.com/learn/intro-to-sql", type: practice }
      - title: "Statistics"
        weeks: "6–8"
        learn: ["Averages, spread and distributions", "Sampling", "Confidence intervals", "Hypothesis tests and A/B tests", "Correlation is not causation"]
        build: "Analyse an A/B test dataset and write the conclusion in plain language for a manager."
        ready: "You can say how sure you are of a result, not just what the result is."
        resources:
          - { name: "OpenIntro Statistics", by: "OpenIntro (non-profit)", url: "https://www.openintro.org/book/os/", type: book }
          - { name: "Statistics and probability", by: "Khan Academy", url: "https://www.khanacademy.org/math/statistics-probability", type: course }
      - title: "Analysis with Python or R"
        weeks: "6–8"
        learn: ["Loading and cleaning data", "Tidy data", "Reshaping and joining tables", "Notebooks and reports", "Reproducible work"]
        build: "A full report that starts from messy raw data and anyone can re-run."
        ready: "You can go from a raw file to a clear answer in an afternoon."
        resources:
          - { name: "Python for Data Analysis", by: "Wes McKinney", url: "https://wesmckinney.com/book/", type: book }
          - { name: "R for Data Science", by: "Hadley Wickham, Mine Çetinkaya-Rundel and Garrett Grolemund", url: "https://r4ds.hadley.nz/", type: book }
      - title: "Visualisation and storytelling"
        weeks: "3–4"
        learn: ["Choosing the right chart", "Honest axes and scales", "Colour and accessibility", "Dashboards", "Writing a clear summary"]
        build: "A dashboard or one-page report that a non-technical person understands without your help."
        ready: "Your charts answer a question at a glance."
        resources:
          - { name: "Fundamentals of Data Visualization", by: "Claus O. Wilke", url: "https://clauswilke.com/dataviz/", type: book }
      - title: "Data engineering"
        weeks: "8–10"
        learn: ["ETL and ELT pipelines", "Data warehouses", "Scheduling and orchestration", "Transformations with dbt", "Big data with Spark"]
        build: "A scheduled pipeline that pulls data from an API, stores it in a warehouse and feeds your dashboard."
        ready: "Your pipeline runs on its own and tells you when it fails."
        resources:
          - { name: "Data Engineering Zoomcamp", by: "DataTalks.Club", url: "https://github.com/DataTalksClub/data-engineering-zoomcamp", type: course }
          - { name: "dbt Learn", by: "dbt Labs", url: "https://www.getdbt.com/dbt-learn", type: course }
          - { name: "Spark quick start", by: "Apache Software Foundation", url: "https://spark.apache.org/docs/latest/quick-start.html", type: docs }

  - id: cloud-devops
    icon: cloud
    title: "Cloud and DevOps"
    summary: "Run software reliably: servers, containers, automation, cloud platforms and keeping things up."
    who: "People who like making systems faster, safer and automatic."
    needs: ["foundations"]
    roles: ["DevOps engineer", "Cloud engineer", "Site reliability engineer", "Platform engineer"]
    stages:
      - title: "Linux and networking for operations"
        weeks: "6–8"
        learn: ["Processes and services", "SSH and keys", "Shell scripting", "DNS, load balancers and firewalls", "Reading logs"]
        build: "Set up a Linux server, lock down SSH, and host a site on it with HTTPS."
        ready: "You can find out why a server is slow or a site is down."
        resources:
          - { name: "The Linux Command Line", by: "William Shotts", url: "https://linuxcommand.org/tlcl.php", type: book }
          - { name: "The Missing Semester of Your CS Education", by: "MIT", url: "https://missing.csail.mit.edu/", type: course }
          - { name: "Computer Networks: A Systems Approach", by: "Larry Peterson and Bruce Davie", url: "https://book.systemsapproach.org/", type: book }
      - title: "Containers"
        weeks: "4–6"
        learn: ["Images and containers", "Writing a Dockerfile", "Volumes and networks", "Docker Compose", "Building apps that are easy to run anywhere"]
        build: "Package a web app and its database with Docker Compose so it starts with one command."
        ready: "Anyone can run your app on their machine in one step."
        resources:
          - { name: "Docker getting started", by: "Docker", url: "https://docs.docker.com/get-started/", type: docs }
          - { name: "The Twelve-Factor App", by: "Adam Wiggins", url: "https://12factor.net/", type: book }
      - title: "Automation: CI/CD and infrastructure as code"
        weeks: "6–8"
        learn: ["Pipelines that test and build", "Automatic deploys", "Terraform", "Managing secrets", "Rolling back safely"]
        build: "A pipeline that tests, builds and deploys on every push, with the infrastructure written in Terraform."
        ready: "You can rebuild your whole setup from code."
        resources:
          - { name: "GitHub Actions documentation", by: "GitHub", url: "https://docs.github.com/en/actions", type: docs }
          - { name: "Terraform tutorials", by: "HashiCorp", url: "https://developer.hashicorp.com/terraform/tutorials", type: docs }
      - title: "One cloud platform, properly"
        weeks: "6–8"
        learn: ["Compute and storage", "Identity and access (IAM)", "Virtual networks", "Managed databases", "Costs and budgets"]
        build: "Deploy your app to one cloud with least-privilege access and a budget alert."
        ready: "You can explain your cloud bill and who can access what."
        resources:
          - { name: "AWS Skill Builder", by: "Amazon Web Services", url: "https://skillbuilder.aws/", type: course }
          - { name: "Microsoft Learn (Azure)", by: "Microsoft", url: "https://learn.microsoft.com/en-us/training/", type: course }
          - { name: "Google Cloud Skills Boost", by: "Google Cloud", url: "https://www.cloudskillsboost.google/", type: course }
      - title: "Kubernetes and reliability"
        weeks: "8–10"
        learn: ["Pods, deployments and services", "Monitoring and alerts", "Service level objectives", "Incident response", "Post-mortems"]
        build: "Run your app on a local Kubernetes cluster with monitoring and a dashboard for its service level objective."
        ready: "You know when your service is unhealthy before your users do."
        resources:
          - { name: "Learn Kubernetes Basics", by: "Kubernetes (CNCF)", url: "https://kubernetes.io/docs/tutorials/kubernetes-basics/", type: docs }
          - { name: "Prometheus overview", by: "Prometheus (CNCF)", url: "https://prometheus.io/docs/introduction/overview/", type: docs }
          - { name: "Site Reliability Engineering", by: "Google", url: "https://sre.google/sre-book/table-of-contents/", type: book }
