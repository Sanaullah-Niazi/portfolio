# The tools on /tools/, in the order they are listed. Same in every language.
# slug: the page address (/tools/<slug>/, /de/tools/<slug>/ ...). key: the prefix of the tool's text in _data/tools.yml
# and the name of its markup in _includes/tools/<key>.html. group: security or dev. words: needs the passphrase word list.
- { key: pw,   slug: password-strength-checker, icon: key,      group: security, old: password }
- { key: leak, slug: leaked-password-checker,   icon: alert,    group: security }
- { key: gen,  slug: password-generator,        icon: dice,     group: security, old: generator, words: true }
- { key: ph,   slug: phishing-link-checker,     icon: link,     group: security, old: phishing }
- { key: look, slug: lookalike-domain-checker,  icon: globe,    group: security }
- { key: exif, slug: photo-metadata-remover,    icon: image,    group: security }
- { key: hid,  slug: hidden-text-detector,      icon: eye,      group: security, old: hidden }
- { key: hash, slug: hash-generator,            icon: hash,     group: security, old: hash }
- { key: jwt,  slug: jwt-decoder,               icon: token,    group: security, old: jwt }
- { key: json, slug: json-formatter,            icon: braces,   group: dev }
- { key: b64,  slug: base64-encoder-decoder,    icon: binary,   group: dev }
- { key: url,  slug: url-encoder-decoder,       icon: percent,  group: dev }
- { key: ts,   slug: unix-timestamp-converter,  icon: clock,    group: dev }
- { key: uuid, slug: uuid-generator,            icon: fingerprint, group: dev }
