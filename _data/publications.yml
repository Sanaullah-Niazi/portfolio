  keywords: [Artificial intelligence, Predictive analytics, Risk assessment, Workplace safety]
  summary: >-
    How AI can move occupational risk assessment in oil and gas from reacting to predicting. A survey
    of safety and AI professionals, analysed with regression and structural equation modelling, shows
    that AI adoption and predictive risk assessment are strongly linked to better safety outcomes
    (the model explains 69% of the variance), while data quality, cost and limited expertise remain barriers.
