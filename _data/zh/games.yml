      a: "每天在你所在时区的午夜开始新的一题。成绩下方的倒计时会显示还剩多久。"
    - q: "为什么朋友的谜题和我的不一样？"
      a: "同一日期的所有人拿到的谜题相同。如果你的朋友所在时区已经到了第二天，他们会先看到下一题。分享的链接会打开朋友玩过的那一道题。"
    - q: "可以玩往期谜题吗？"
      a: "可以。完成后，点按钮就能玩前一天的谜题。往期谜题很适合练习，但不计入连胜。"
    - q: "怎样保持连胜？"
      a: "每天都破解谜题。错过一天或没能破解，连胜就会从零开始。连胜保存在当前浏览器里，所以请用同一部手机或电脑来玩。"

# ---------- Scam or Not ----------
scam_title: "是不是诈骗？"
