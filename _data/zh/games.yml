hack_questions:
  - q: "你有多少个账号用的是同一个密码？"
    a: ["没有，每个账号都不一样", "有几个", "大部分都是", "一个密码走天下"]
    fix: "每个账号都用不同的密码。密码管理器会帮你记住它们，你只需要记住一个强主密码。"
  - q: "你的邮箱和微信/WhatsApp 有没有开启两步验证（短信验证码或身份验证器应用）？"
    a: ["有，所有重要账号都开了", "部分开了", "那是什么？"]
    fix: "为邮箱、聊天软件和银行开启两步验证。这样即使有人偷到你的密码，也登录不进去。"
  - q: "你的主要密码最像哪一种？"
    a: ["一长串词，比如 mango-river-tiger-cloud", "类似 P@ssw0rd! 这样的", "名字加出生年份，比如 Ali1998", "123456 或 password"]
    fix: "使用由四个或更多随机单词组成的长密码短语。名字、出生年份、用符号替换字母，都是攻击者最先尝试的。"
  - q: "你收到一条短信：“您的包裹被扣留，请在此支付 5 元”，附带一个链接。你会……"
    a: ["不理它，去快递公司的官方 App 查", "点开链接看看而已", "付了，反正才 5 元"]
    fix: "绝不要通过意外消息里的链接付款或登录。打开公司的官方 App，或者自己输入网址。"
  - q: "有人自称“你的银行”打来电话，向你索要刚收到的短信验证码。"
    a: ["挂断，银行从不会要这个", "先让对方证明身份", "念给他听，听起来很正规"]
    fix: "验证码绝不告诉任何人，哪怕对方知道你的名字和账户信息。这个验证码就是你账户的钥匙。"
  - q: "在咖啡馆或机场的免费 Wi-Fi 上，你会……"
    a: ["涉及隐私的事都用流量或 VPN", "随便浏览，但不登录网银", "什么都做，包括网银"]
    fix: "在公共 Wi-Fi 上，网银和登录请用手机流量；如果热点要求你安装任何东西，直接拒绝。"
  - q: "手机提示“有可用更新”。你会……"
    a: ["当天就安装", "点“稍后”拖几周", "永远点“稍后”"]
    fix: "尽快安装更新。大部分更新修补的是攻击者早已知道的安全漏洞。"
  - q: "你从哪里安装 App？"
    a: ["只从官方应用商店", "大多从商店，偶尔装别人发来的 APK", "哪里有免费版或破解版就去哪里"]
    fix: "只从官方商店安装 App。破解版 App 和聊天里收到的 APK 是感染间谍软件最容易的途径之一。"
  - q: "你的社交媒体主页上能看到……"
    a: ["很少的信息，而且是私密的", "一些照片，仅好友可见", "生日、学校、宠物名字和电话号码，全部公开"]
    fix: "把主页设为私密，隐藏生日、学校和宠物名字：这些都是常见的密保问题。发照片前先去掉其中隐藏的位置信息。"
  - q: "如果你的手机今天被偷了……"
    a: ["有密码或指纹锁，而且有备份", "有锁屏，但没有备份", "根本没有锁屏"]
    fix: "设置锁屏（至少六位数字的密码）并开启备份，这样丢了手机也只是丢了一部手机。"
  - q: "你有没有查过自己的密码是否在数据泄露中曝光？"
    a: ["查过，而且改掉了泄露的密码", "还没有", "从没听说过"]
    fix: "查一查你的密码是否已经出现在泄露名单里，如果有就立刻更换。泄露的密码几天之内就会被拿到各个网站上尝试。"
hack_results:
  - { max: 14, emoji: "🥷", title: "网络忍者", text: "黑客看了你一眼，叹口气，转身去找更容易的目标。你属于最顶尖的那一档。" }
  - { max: 34, emoji: "🛡️", title: "人形防火墙", text: "习惯很扎实，只有几个小漏洞。补上它们，你就无懈可击。" }
  - { max: 54, emoji: "🍀", title: "全靠运气", text: "目前还没出事，但运气不是安全方案。改几处就会大不一样。" }
  - { max: 74, emoji: "🍪", title: "黑客最爱的小零食", text: "攻击者会很喜欢你。好消息是：下面的改进只需要几分钟，而不是几天。" }
  - { max: 100, emoji: "🚨", title: "行走的数据泄露", text: "你的账号就像一场自助餐。今天就从下面第一条改进开始，然后逐条往下做。" }
hack_info:
  about:
    - "这个测验关注的是决定大多数真实入侵的日常习惯：重复使用的弱密码、没有两步验证、诈骗链接和电话、过时的软件、非官方 App 以及过度分享。每个答案都有分值，你的指数就是你累计的风险分占满分的比例。"
    - "攻击者很少靠高明的代码闯进来。大多数账号是因为泄露的密码、一个假链接或一通索要验证码的电话而被盗。所以小习惯比昂贵的工具更重要。"
    - "你的答案只在这个页面、你的浏览器里使用。除了保存在你自己设备上的最好成绩，什么都不会被发送或保存。"
  faq:
    - q: "我的数据会被发送到别处吗？"
      a: "不会。测验完全在你的浏览器中运行。你的答案从不发送，只有你的最好成绩会保存在你自己的设备上，方便你以后挑战它。"
    - q: "指数是怎么算的？"
      a: "每个答案根据该习惯导致真实账号被盗的频率，计 0 到 3 个风险分。你的指数是你的分数占满分的百分比：0% 是完美，100% 是风险最高。"
    - q: "怎样快速降低我的指数？"
      a: "为邮箱和聊天软件开启两步验证，不要重复使用密码，绝不把验证码告诉别人。这三点就能挡住大多数账号盗用。"

