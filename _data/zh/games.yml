scam_lede: "十条就像你手机里那样的消息：钱包提醒、银行验证码、包裹费、幸运抽奖，还有“我换号了”的 WhatsApp。逐条判断是诈骗还是真的，看清危险信号，再挑战家人来超过你的分数。"
