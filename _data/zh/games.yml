scam_msgs:
  wallet_block:
    t: "尊敬的客户，由于您的生物识别验证未完成，您的 TezPay 账户将于今天被冻结。请立即更新以保持账户正常：tezpay-verify.top/kyc 忽略 = 永久冻结。"
    why:
      - "它来自一个普通手机号。真正的 TezPay 消息显示的发件人是 TezPay，而不是一串号码。"
      - "它用期限吓唬你（“今天被冻结”），让你来不及思考就行动。"
      - "这个链接不是 TezPay 的网站。tezpay-verify.top 这样的域名谁都能买。"
      - "钱包的生物识别验证只在 App 里或门店办理，绝不会通过短信链接。"
  lucky_draw:
    name: "TezPay 幸运抽奖 🎁"
    t: "Mubarak ho！🎉 您的号码在 TezPay 十周年幸运抽奖中赢得 Rs 2,50,000 和一辆摩托车。领奖请先将 Rs 3,500 手续费转到 03••-•••8120，并通过 WhatsApp 发送您的身份证（CNIC）正反面照片。"
    why:
      - "你根本没参加过抽奖，不可能中奖。"
      - "真正的奖品绝不会让你先交钱。这笔手续费就是骗局本身。"
      - "它要你的身份证照片，可以被用来以你的名义办电话卡和开账户。"
      - "手续费转进的是个人号码，而不是公司账户。"
  bank_code:
    name: "Chandni 银行客服"
    t: "Assalam o Alaikum。这里是 Chandni 银行总部。您的账户误转出了一笔 Rs 48,000 的交易。为撤回该交易，请把您刚刚收到的 6 位短信验证码发给我们。"
    why:
      - "银行绝不会索要验证码。谁拿到这个验证码，谁就能掏空你的账户。"
      - "在 WhatsApp 上谁都可以随便起名字。有个银行的名字，并不代表就是银行。"
      - "先给你一笔吓人的交易，再给个简单的解决办法，这是逼你着急的经典套路。"
      - "如果担心，自己拨打银行卡背面印的电话。"
  wrong_transfer:
    t:
      - "TezPay：您已收到来自 ASIF ALI 的 Rs 15,000。交易号：4471902385。您的新余额为 Rs 15,312。"
      - "兄弟，我不小心把 15,000 转到你的号码上了 🙏 那是我孩子的学费。麻烦转回这个号码。"
    why:
      - "这张“收款通知”来自普通手机号。真正的 TezPay 提醒来自发件人 TezPay。"
      - "打开 TezPay App 看看余额：钱根本没到账。"
      - "紧跟着的可怜故事，是为了让你用真钱去还假钱。"
      - "如果真有人转错了钱，钱包客服可以帮忙撤回，用不着你自己转。"
  relief_fund:
    t: "Khushhali 救助计划：您的身份证已被选中，可获得 Rs 25,000 资助。如需领取，请将您的姓名和身份证号发送到本号码，并缴纳 Rs 500 登记费。仅限 24 小时内有效。"
    why:
      - "政府补助从来不收登记费。"
      - "官方项目用自己的短号码发消息，而不是个人手机号。"
      - "“仅限 24 小时”是在施压，不是政策。"
      - "提供身份证信息之前，自己去该项目的官方网站或办公室核实。"
  parcel_fee:
    t: "SwiftPost：由于地址不完整，您的包裹被扣留在仓库。请在 12 小时内支付 Rs 150 重新派送费，否则将被退回：swiftpost.redelivery-help.com"
    why:
      - "这里真正的网站是 redelivery-help.com，开头的“swiftpost”只是装饰。"
      - "你真的在等包裹吗？骗子群发给所有人，等着碰巧撞上的那一个。"
      - "小小的费用只是诱饵，他们真正想要的是你在假页面上输入的卡号和验证码。"
      - "它来自普通号码，而不是 SwiftPost 的发件人名称。"
  like_job:
    name: "Priya HR"
    t: "您好，我是一家数字营销公司的 Priya 😊 我们在招兼职：只要给 YouTube 视频点赞，在家每天就能赚 ₹3,000 到 ₹8,000。无需经验。加入我们的 Telegram 群领取第一个任务吧！"
    why:
      - "真正的工作不会因为点赞就每天付你几千块。"
      - "前几个任务给点小钱骗取信任，接着让你“投资”更大的任务，然后钱就没了。"
      - "你从没申请过这份工作，是它主动找上了你。"
      - "把你拉到 Telegram，是为了让你远离可能提醒你的人。"
  power_cut:
    t: "尊敬的用户，由于您上月电费未更新，您的电力将于今晚 9:30 停止供应。请立即联系我们的电力专员 7•••• ••213。谢谢"
    why:
      - "电力公司不会用个人手机号发停电警告。"
      - "没有户号，也没有金额：这条消息可以发给任何人。"
      - "“今晚 9:30”是制造紧迫感，让你不核实就打电话。"
      - "这位“专员”会让你安装 App 或通过链接付款。还是去官方 App 里查账单吧。"
  kyc_expired:
    t: "尊敬的 Sitara 银行用户，您的账户 KYC 已过期，账户将在 24 小时内被暂停。请立即更新您的 PAN 信息：sitarabank-kyc.in/update"
    why:
      - "银行不会通过短信链接暂停账户。它们会让你在 App 里或去网点更新 KYC。"
      - "sitarabank-kyc.in 不是银行的网站，只是故意起得很像。"
      - "它来自手机号，而不是银行的发件人名称。"
      - "24 小时的期限，就是为了不让你去核实。"
  new_number:
    t: "妈，这是我的新号码，我手机掉水里了 😔 我急需 Rs 20,000，请转到这个 TezPay 账户：03••-•••7712。我回头再解释，现在没法说话，我在上课。"
    why:
      - "“这是我的新号码”加上急着要钱，是最常见的 WhatsApp 诈骗之一。"
      - "他们不肯通话，因为一通电话就会露馅。打孩子的旧号码，或者问一个只有他知道的问题。"
      - "没听到对方的声音之前，绝不要给新号码转钱。"
  wa_code:
    name: "Bilal（表哥）"
    t: "嘿，不好意思，我不小心把我的 WhatsApp 验证码发到你的号码上了 🙈 你能把刚收到的 6 位验证码转给我吗？挺急的"
    why:
      - "那个验证码是你自己 WhatsApp 账户的。把它给别人，就等于把账户交出去。"
      - "你表哥的账户很可能已经被盗，骗子正在用它来接近你。"
      - "开启 WhatsApp 的两步验证，这样光有验证码也盗不走你的账户。"
      - "打电话提醒你表哥，不要在聊天里回复。"
  refund_app:
    name: "Bazaarly 客服"
    t: "您的 Rs 4,999 退款已批准 ✅ 为了把退款打到您的账户，请安装屏幕共享 App QuickHelp，并把 9 位代码告诉我们的客服。"
    why:
      - "退款从来不需要屏幕共享 App。装了它，骗子就能看到你的屏幕，包括验证码和 PIN。"
      - "真正的公司会用已认证的商家账号聊天，而不是一个挂着公司名字的陌生号码。"
      - "自己在购物 App 的订单里查看退款。"
  wallet_receipt:
    t: "已收到来自 ASIF ALI 03••-•••2731 的 Rs 15,000。交易号 8841230957。新余额：Rs 15,312。切勿向任何人透露您的 PIN 或验证码。"
    why:
      - "它来自发件人 TezPay，和你以前的 TezPay 消息在同一个对话里。"
      - "它不要求你做任何事：没有链接、没有电话、没有验证码。"
      - "你可以在 TezPay App 里查看余额来确认。"
  bank_otp:
    t: "482913 是您登录 Chandni 银行网银的一次性验证码，5 分钟内有效。Chandni 银行绝不会向您索要此验证码。请勿告诉任何人。"
    why:
      - "它是在你自己登录时收到的：是你自己申请的。"
      - "它来自银行的发件人名称，并提醒你永远不要把验证码告诉别人。"
      - "它只能输入到银行自己的 App 或网站里。如果有人打电话或发消息来要，那就是诈骗。"
  parcel_cod:
    t: "您来自 Bazaarly 的包裹 SP4471902 今天派送。骑手：Imran。货到付款：Rs 1,850。可在 SwiftPost App 中跟踪。"
    why:
      - "它和你下过的订单、你选的货到付款金额都对得上。"
      - "没有链接，没有要你在线支付的费用，也没有期限。"
      - "它让你去官方 App，而不是点链接。"
  upi_debit:
    t: "您尾号 XX4417 的账户于 10 月 31 日通过 UPI 向 FreshCart 支出 ₹1,250.00。不是您本人？请拨打借记卡背面的电话。"
    why:
      - "它来自银行的发件人名称，只告诉你发生了什么。"
      - "它让你打自己卡上的电话，而不是消息里的号码。"
      - "没有链接，也不索要验证码或 PIN。"
  mehndi:
    name: "Ayesha（大学同学）"
    t: "周六 Sana 的 mehndi 你来吗？💃 我到了就发定位给你。记得穿黄色的！"
    why:
      - "它来自你认识的已保存联系人，语气和平时一样。"
      - "它不要钱、不要验证码、没有链接，也不问个人信息。"
      - "不是所有消息都是诈骗。知道正常的样子，才更容易发现不正常的。"
  data_bundle:
    t: "尊敬的客户，您本月的流量套餐已使用 80%。剩余：2 GB，有效期至 11 月 15 日。打开 Orbit App 查看使用情况。"
    why:
      - "它来自你运营商的发件人名称，和你的套餐对得上。"
      - "它只提供信息，并让你去官方 App 查看。"
      - "没有奖品、没有威胁、没有费用。"
  card_due:
    t: "提醒：您的 Sitara 银行信用卡账单 ₹8,430 将于 11 月 5 日到期。请通过 Sitara 银行 App 或网银还款。如已还款，请忽略。"
    why:
      - "它来自银行的发件人名称，说的是你真有的一张卡。"
      - "它让你在银行自己的 App 里还款，而不是点链接或转到个人账户。"
      - "“如已还款，请忽略”是真提醒的平和语气，不是威胁。"
  order_shipped:
    t: "您好！📦 您的订单 #BZ-20931（无线耳机）已发货，预计 2 到 3 天送达。随时可在 Bazaarly App 的“我的订单”中查看物流。"
    why:
      - "它来自 Bazaarly 已认证的商家账号（名字旁边的勾），和你买的东西对得上。"
      - "它让你去 App 查看，什么都不要。"
      - "真正的商家聊天从不会让你安装别的 App、交费用或分享验证码。"
  new_login:
    t: "您的 TezPay 账户于 10 月 31 日 11:42 在一部新的安卓手机上登录。如果不是您本人，请打开 TezPay App，进入 设置 > 设备。"
    why:
      - "它来自 TezPay 自己的发件人名称，告诉你发生了什么。"
      - "没有链接，它让你自己去 App 里操作。"
      - "如果不是你本人，这正是正确的建议：去 App 里检查，而不是回复消息。"
scam_info:
  about:
    - "每一轮从更大的题库中随机抽取 10 条消息：手机钱包提醒、银行验证码、包裹和快递消息、幸运抽奖、政府补助、招聘信息，还有说自己“换了新号码”的家人。有的是诈骗，有的是完全正常的消息。你来判断哪个是哪个。"
    - "每次回答后，你都会看到危险信号，或者一条真消息为什么是真的。巴基斯坦和印度的大多数诈骗都离不开这几招：冒充身份的发件人、限时期限、先交费才能拿钱、通往假网站的链接，或者索要你的验证码。"
    - "游戏中的所有品牌、姓名、号码和链接都是虚构的，号码也隐藏了一部分，无法拨打。你的回答不会发送到任何地方，只有你的最好成绩会保存在你自己的设备上。"
  faq:
    - q: "这些是真实的诈骗消息吗？"
      a: "它们是为这个游戏写的，但每一条都模仿了巴基斯坦和印度真实存在的套路：假冒钱包冻结、要交手续费的幸运抽奖、“转错账”退款、索要验证码、包裹费、KYC 更新，以及家人“换了新号码”的消息。"
    - q: "“挑战好友”是怎么玩的？"
      a: "你的分享链接里包含你的分数和你答的那 10 条消息。打开链接的人会玩完全相同的 10 条消息，看看能不能超过你。"
    - q: "我收到了类似的消息，该怎么办？"
      a: "不要点链接，不要回复，也绝不要分享验证码。自己打开官方 App，或拨打银行卡上印的电话核实。然后在聊天软件里屏蔽并举报这个号码。"
