# Shown under the story, so people searching for the other spelling of the name find this site.
aka: "我的名字也写作 Sanaullah Khan Niazi。"
story:
  - 我在俾路支省的查曼长大。我的道路并不笔直。中学毕业后，我读了三年制的职业安全、健康与环境技术专科，在那里学会了用风险、危害和预防的方式思考问题。如今，我把同样的思维方式用在数字系统上。
  - 之后，我在奎达的 BUITEMS 学习信息技术，第一次修读了安全和网络方面的课程。我的本科成绩并不能代表我的最佳水平：那时很多时间花在了板球、足球和自由职业上。到了学业后期，我学会了管理时间，开始认真对待学习。
  - 在巴哈瓦尔布尔伊斯兰大学攻读人工智能硕士是我的转折点。我以 3.66 的 CGPA 毕业，与不同团队合作发表了三篇同行评审论文，并完成了一篇关于 AI 生成文本检测的学位论文。同时，我还以客座讲师的身份为本科生讲授信息技术课程。
  - 我的大学没有网络安全方向，所以我自己补上了这部分：完成了 Cisco 的 Junior Cybersecurity Analyst 和 Ethical Hacker 课程，以及 NAVTTC 的数字取证课程。这份动力也来自个人经历：我曾遭遇网络诈骗和勒索软件攻击，也看到巴基斯坦对网络攻击的防护仍然薄弱。AI 让攻击变得更快、更有说服力，而我想站在防守的一方。
