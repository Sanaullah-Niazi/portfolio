web_disclaimer: "请只检测你自己的网站或已获授权测试的网站。结果是自动生成的提示，不是完整的安全审计。为了完成检测，你输入的网址会发送到我的服务器，以及 Google PageSpeed Insights、Mozilla Observatory 和 SSL Labs；报告会在 {days} 天后删除。"
web_privacy: "隐私政策"
