# 每个工具下方的“工作原理”和常见问题（也作为 FAQ 提供给搜索引擎）。
info:
  pw:
    about:
      - "大多数强度计只看长度和字符种类，所以“Password1!”看起来很强。这个检测器更像真正的破解工具：它会找出常见密码、加了数字的单词和名字、用符号替换字母（p@ssw0rd）、qwerty 这样的键盘模式、重复字符和年份，只把剩下的部分算作随机。"
      - "然后估算密码在三种情况下能坚持多久：在线猜测一个限制尝试次数的网站，以及离线破解被盗的密码数据库，分别是存储得当（bcrypt）和存储不当（快速哈希，用 GPU 破解）。"
    faq:
      - q: "在这里输入真实密码安全吗？"
        a: "安全。检测完全在你的浏览器中运行，页面的安全策略禁止它发送任何内容。不过最稳妥的习惯是测试一个和你的密码相似的密码，而不是真实密码。"
      - q: "什么样的密码才算强？"
        a: "足够长且不可预测。由五个以上随机单词组成的口令短语，或由密码管理器生成的 16 位以上随机字符，都胜过一个塞满符号的短密码。"
      - q: "为什么我的密码有符号和数字，得分还是很低？"
        a: "因为攻击者会优先尝试常见单词加数字和符号的组合。“Summer2024!”遵循的是几乎人人都用的模式，所以很快就会被猜中。"
  leak:
    about:
      - "你的密码会在浏览器里用 SHA-1 计算哈希。只有哈希的前 5 个字符会发送给 Have I Been Pwned 的 Pwned Passwords 服务。它返回所有以这 5 个字符开头的泄露哈希（几百个），本页面在其中查找你的那一个。这种方法叫 k-匿名：服务方永远不会知道你的密码，甚至不知道完整的哈希。"
      - "这个列表收录了从公开数据泄露中收集的数亿个真实密码。如果你的密码在里面，攻击者就会把它放在最先尝试的字典里，不管它看起来多强。"
    faq:
      - q: "能告诉我是哪个网站泄露了我的密码吗？"
        a: "不能。密码列表刻意与泄露事件名称分开，使密码无法关联到具体的人。想知道你的邮箱出现在哪些泄露事件中，请在 haveibeenpwned.com 上查询。"
      - q: "我的密码被找到了，该怎么办？"
        a: "在所有用过它的地方立即更换，先从邮箱和银行开始，并开启双重验证。每个网站使用不同的密码，最好用密码管理器生成。"
      - q: "我的密码没有被找到，那它安全吗？"
        a: "它没有出现在已知泄露中，这是好事，但它仍可能很弱。也请用密码强度检测工具检查一下。"
  gen:
    about:
      - "每个密码都由 crypto.getRandomValues 生成，这是浏览器自带的密码学安全随机数生成器，并且没有取模偏差。不会存储或发送任何内容。"
      - "口令短语使用 EFF 短词表（1,296 个单词）。每个单词约提供 10.3 位随机性，六个单词约 62 位：容易输入和记忆，却极难猜中。"
    faq:
      - q: "用口令短语还是随机字符？"
        a: "需要记住或手动输入的地方，比如电脑登录或密码管理器的主密码，用口令短语。所有由密码管理器自动填写的地方，用长随机字符。"
      - q: "密码应该多长？"
        a: "日常账号至少 12 个字符，重要账号 16 个以上。口令短语用五到六个随机单词。"
      - q: "这些密码会被保存在哪里吗？"
        a: "不会。它们只存在于这个页面上，关闭页面就没了。"
  ph:
    about:
      - "粘贴一个链接或整段消息。检测器会提取每个链接，找出真实域名（包括 @ 符号前加文字、伪装的 IP 地址和链接内跳转等手法），并按照我在钓鱼检测研究中使用的信号进行检查：品牌名出现在错误的域名上、形似拼写、高风险域名后缀、免费托管、短链接和施压词语。"
      - "它从不打开链接，所以检查可疑消息是安全的。它还会给出一个“去武装”的副本（hxxp、[.]），你可以发给 IT 部门而不必担心有人误点。"
    faq:
      - q: "怎样判断一个链接是不是钓鱼链接？"
        a: "看真实域名，也就是第一个单斜杠之前的部分。如果消息自称来自你的银行，但域名不属于银行，那就是假的。这个工具会帮你找出域名，即使它被隐藏了。"
      - q: "检测器没发现警示信号，链接就安全吗？"
        a: "不一定。这些只是经验规则，新的钓鱼网站可能看起来很干净。如果消息催你登录或付款，请打开官方应用或自己输入网址。"
      - q: "它会用黑名单检查链接吗？"
        a: "不会。链接不会被发送到任何地方，所以无法查询在线黑名单。它只根据地址本身判断。"
  look:
    about:
      - "域名可以使用任何文字的字母。西里尔字母“а”和拉丁字母“a”看起来一模一样，所以 аpple.com（用西里尔字母 а）与 apple.com 是不同的网站。这类名称在底层以 Punycode 存储，以 xn-- 开头，本工具会把它显示给你。"
      - "它还会像人一样“读”这个名字，把形似字母还原成拉丁字母，再检查结果是否在模仿知名品牌。仿冒变体列表则反过来：列出你自己域名的拼写错误和字符替换，方便你查看哪些已被别人注册。"
    faq:
      - q: "什么是 Punycode？"
        a: "Punycode 是用纯 ASCII 表示国际化域名的方式。例如 münchen.de 会变成 xn--mnchen-3ya.de。浏览器通常显示可读形式，这正是攻击者可以利用的地方。"
      - q: "什么是同形异义字攻击？"
        a: "用看起来与真实字母完全相同的字母（常来自西里尔或希腊字母）构造的假域名，让地址栏看起来像是真网站。"
      - q: "什么是域名抢注拼写（Typosquatting）？"
        a: "注册热门域名的错误拼写，比如 gooogle.com 或 paypa1.com，用来截获打错字或没仔细看的人。"
  exif:
    about:
      - "照片中带有叫做 EXIF 的元数据。手机照片通常包含拍摄地的 GPS 坐标、日期时间、手机型号，有时还有序列号或机主姓名。很多聊天应用会去掉这些信息，但电子邮件、云盘链接和一些网站不会。"
      - "本工具在你的浏览器里读取这些数据并生成干净的副本。对 JPEG、PNG 和 WebP，它直接剪掉元数据，不会重新压缩图片，所以画质不变，并且只保留旋转方向，避免照片横着显示。其他格式会重新绘制成新图片。"
    faq:
      - q: "怎样删除照片里的位置信息？"
        a: "在上方选择照片并下载干净副本即可。想以后不再记录，请在手机设置里关闭相机应用的定位权限。"
      - q: "会降低照片画质吗？"
        a: "JPEG、PNG 和 WebP 不会：图像数据原样复制。HEIC 等其他格式会被重新绘制并保存，文件可能会有细微变化。"
      - q: "我的照片会被上传吗？"
        a: "不会。照片在你自己的设备上读取和清理。不会上传任何内容，页面的安全策略也禁止它发送数据。"
  hid:
    about:
      - "文本中可能含有看不见的字符：零宽空格、会改变文字顺序的双向控制符、看起来像拉丁字母的其他文字字母，以及 Unicode“标签”字符。人看不到标签字符，但很多 AI 模型会把它们当作普通文本读取，因此可以用来隐藏指令，这就是提示词注入。"
      - "检测器会显示每一个隐藏字符，解码隐藏信息，列出针对 AI 助手的语句，并给出清理后的副本。乌尔都语、波斯语和表情符号需要的连接符会被保留。"
    faq:
      - q: "什么是提示词注入？"
        a: "隐藏在 AI 助手会读取的内容（如网页或邮件）中的指令，试图让它无视用户、去做别的事，比如泄露数据。"
      - q: "怎样删除零宽字符？"
        a: "把文本粘贴到上方，扫描后点击“复制清理后的文本”。它会删除不可见字符，并把形似字母替换为正常字母。"
      - q: "文本里为什么会有不可见字符？"
        a: "有些是无害的，来自从 PDF 或网页复制的内容。有些则用于给文本加水印、绕过过滤，或向 AI 模型隐藏指令。"
  hash:
    about:
      - "哈希是数据的简短指纹：改动一个字节，哈希就完全不同。软件发布者会公布下载文件的 SHA-256 哈希，方便你确认拿到的文件和他们发布的完全一致。"
      - "SHA 哈希由浏览器内置的加密库计算，MD5 由本页面计算。文件在你的设备上读取，从不上传，所以大文件和私密文件也可以放心计算。"
    faq:
      - q: "怎样检查文件的 SHA-256？"
        a: "选择“文件”，选中下载的文件，再把发布者网站上的哈希粘贴到对比框。匹配就说明文件和发布的完全一致。"
      - q: "MD5 还安全吗？"
        a: "用于安全目的已不安全：可以构造出 MD5 相同的两个不同文件。用来发现意外损坏仍然可以。重要场合请用 SHA-256。"
      - q: "哈希能反推出原文吗？"
        a: "不能，但短的或常见的输入（如密码）可以通过猜测并比对哈希找出来。所以密码应该用 bcrypt 或 Argon2 这类慢哈希存储。"
  jwt:
    about:
      - "JSON Web Token 由点分隔的三部分组成：头部、载荷和签名。前两部分只是 Base64url 编码，并没有加密，任何拿到令牌的人都能读取。这个解码器会显示这两部分，并把日期声明（exp、iat、nbf）转成可读时间。"
      - "它还会标出常导致漏洞的设置：“none”算法、缺少过期时间、有效期过长、头部中指定密钥，以及载荷中的机密或个人数据。"
    faq:
      - q: "在这里粘贴令牌安全吗？"
        a: "令牌只在你的浏览器中解码，绝不会发送出去。不过仍应把线上令牌当作密码对待，最好使用测试令牌。"
      - q: "为什么不验证签名？"
        a: "验证签名需要服务器的密钥或公钥。没有它，任何工具都无法判断令牌是否真实。"
      - q: "JWT 是加密的吗？"
        a: "普通的签名 JWT（JWS）不是。只有 JWE 令牌是加密的，而且只能读取其头部。"
  json:
    about:
      - "粘贴或输入 JSON，它会实时检查。有效的 JSON 会按你选择的缩进美化，或压缩成一行；你还可以按键名排序，方便比较两个文档。"
      - "JSON 有错时，会用指针标出错误所在的行和列，并提示常见原因：单引号、末尾多余的逗号、键名没加引号以及注释，这些 JSON 都不允许。"
    faq:
      - q: "怎样校验 JSON？"
        a: "粘贴到上方即可。绿色提示表示有效；红色提示会准确指出第一个错误的位置。"
      - q: "为什么我的 JSON 无效？"
        a: "最常见的原因是用了单引号而不是双引号、最后一项后面多了逗号、键名没有引号，以及写了注释。JSON 比 JavaScript 更严格。"
      - q: "我的数据会被发送到服务器吗？"
        a: "不会。所有解析都在你的浏览器中完成，所以格式化含私密数据的 API 响应或配置文件也很安全。"
  b64:
    about:
      - "Base64 只用 64 个安全字符来表示任何数据（文本或文件），让它可以在邮件、JSON 或 URL 中传输。它是一种编码，不是加密：任何人都能解码。"
      - "文本会先转换成 UTF-8，所以中文和表情符号来回转换都不会出错。如果解码结果不是文本，工具会根据开头的字节识别常见文件类型（PNG、JPEG、PDF、ZIP），并让你下载文件。"
    faq:
      - q: "Base64 是加密吗？"
        a: "不是。它什么也没隐藏，只是改变了数据的书写方式。绝不要用它保护密码或机密。"
      - q: "什么是 URL 安全的 Base64？"
        a: "一种用 - 和 _ 代替 + 和 / 的变体，通常还去掉 = 补位，这样结果就能放进 URL 或文件名。JWT 就用这种格式。"
      - q: "怎样把图片转成 Base64？"
        a: "选择“文件”，选中图片，然后复制 Base64 或完整的 data URI，可以直接粘贴到 HTML 或 CSS 中。"
  url:
    about:
      - "URL 只能包含特定字符。空格、带重音的字母、中文以及 & 或 # 等符号必须进行百分号编码（空格变成 %20），否则链接会失效或含义改变。"
      - "“编码”把文本变成安全的链接片段。“编码完整 URL”会保留赋予 URL 结构的字符（: / ? & =）。“解码”把 % 编码还原成可读文本，各部分视图会列出解码后的主机、路径和每个查询参数。"
    faq:
      - q: "“编码”和“编码完整 URL”有什么区别？"
        a: "“编码”（encodeURIComponent）会转义除字母、数字和少数符号以外的所有字符，适用于单个参数值。“编码完整 URL”（encodeURI）保留结构字符，适用于整个地址。"
      - q: "为什么 + 有时代表空格？"
        a: "HTML 表单把空格编码为 +。解码表单数据或搜索 URL 时，请打开“空格写作 +”。"
      - q: "为什么要在点击前解码链接？"
        a: "钓鱼链接常把真实目标藏在编码文本或跳转参数里。解码后就能看出它到底通往哪里。"
  ts:
    about:
      - "Unix 时间戳计算的是自 1970 年 1 月 1 日 UTC 零点起经过的秒数。很多系统改用毫秒（JavaScript、Java），有的用微秒或纳秒，所以转换器会根据数字长度判断单位。"
      - "结果会以 UTC、你所在时区、ISO 8601 以及相对现在的时间显示。你也可以选择一个日期时间来获得对应的时间戳。"
    faq:
      - q: "怎样把 Unix 时间戳转换成日期？"
        a: "粘贴到上方即可。10 位数字通常是秒，13 位是毫秒。"
      - q: "什么是 2038 年问题？"
        a: "用有符号 32 位整数存储 Unix 时间的系统，会在 2038 年 1 月 19 日 03:14:07 UTC（时间戳 2147483647）溢出。大多数现代系统使用 64 位。"
      - q: "Unix 时间戳有时区吗？"
        a: "没有。它在全世界表示同一个时刻，只有显示方式取决于时区。"
  uuid:
    about:
      - "UUID 是 128 位标识符。版本 4 完全随机（122 个随机位），不泄露任何信息。版本 7 于 2024 年在 RFC 9562 中标准化，以毫秒时间开头，因此新 ID 会按顺序排列，有助于保持数据库索引的速度。"
      - "所有 ID 都由浏览器的安全随机数生成器生成。检查器会读取任意 UUID 的版本和变体，并显示基于时间的 UUID（v1、v6、v7）的生成时间。"
    faq:
      - q: "用 UUID v4 还是 v7？"
        a: "数据库主键以及需要按创建时间排序的场景用 v7。不希望 ID 暴露生成时间时用 v4。"
      - q: "两个 UUID 会重复吗？"
        a: "实际上不会。使用 v4 时，你需要每秒生成数十亿个并持续多年，碰撞才可能发生。"
      - q: "UUID 能当作秘密令牌吗？"
        a: "随机的 v4 UUID 很难猜，但它并不是为保密设计的。基于时间的版本部分可预测，v1 还可能包含网卡的 MAC 地址。秘密请使用专门的随机令牌。"

