# Website Health & Security Checker (key: web). Its backend is the Cloudflare Worker in worker/.
web_title: "网站健康与安全检测"
web_lede: "输入一个网址，大约一分钟就能得到完整报告：安全响应头、HTTPS 与 SSL、邮件安全、速度与 Core Web Vitals、SEO、无障碍、移动端设计和过时软件，附带分数、等级和通俗易懂的修复建议。"
web_card: "检测任意网站的安全响应头、SSL、速度、SEO、无障碍和过时的库，得到带分数和修复建议的报告。"
web_private: "只做被动检测。报告 {days} 天后删除"
