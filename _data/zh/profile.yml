headline: AI × 网络安全：构建能识别威胁、欺诈和 AI 生成内容的智能系统。
intro: >-
  我是一名青年研究者，拥有人工智能硕士学位。我构建机器学习和自然语言处理模型，用来分辨真假：区分 AI
  生成的文本和人类写的文本，区分欺诈交易和正常交易，区分诈骗信息和真实信息。下一步，我希望让 AI 系统本身更加安全。
