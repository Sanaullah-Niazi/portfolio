paths:
  foundations:
    title: "计算机科学基础"
    summary: "编程、每个开发者都会用的工具、数据结构，以及计算机和网络真正的工作原理。"
    who: "适合刚入门的人，也适合靠教程自学编程、觉得知识有漏洞的人。"
    roles: ["其他所有路线"]
    stages:
      - title: "学会编程"
        learn: ["变量、条件和循环", "函数", "列表和字典", "读懂错误信息", "调试"]
        build: "一个你自己设计的小型命令行程序，例如把数据保存到文件的记账工具。"
        ready: "你能不照着教程写出一个 100 行的程序。"
      - title: "终端、Git 和 Linux"
        learn: ["Shell 命令和管道", "文件和权限", "Git 提交、分支和合并", "GitHub", "代码编辑器"]
        build: "把你写过的所有程序放到 GitHub 上，每个都配一个简短的 README。"
        ready: "你能不用鼠标在终端里工作，并能解决合并冲突。"
      - title: "数据结构与算法"
        learn: ["大 O 表示法", "数组、链表、栈和队列", "哈希表", "树和图", "排序、搜索和递归"]
        build: "自己实现一个哈希表和一个图搜索（广度优先和深度优先），并写好测试。"
        ready: "你能解释为什么字典查找很快，并能为问题选择合适的数据结构。"
      - title: "计算机和网络如何工作"
        learn: ["从逻辑门到 CPU", "内存和进程", "操作系统", "TCP/IP、DNS 和 HTTP", "并发基础"]
        build: "用原始套接字写一个极小的 Web 服务器，让浏览器能打开它返回的页面。"
        ready: "你能讲清楚从输入网址到看到页面之间发生的一切。"
      - title: "数学和数据库"
        learn: ["逻辑与证明", "集合、计数和概率", "关系型数据库", "SQL 查询和连接", "设计数据表"]
        build: "为一个小图书馆或小商店设计数据库，并用 SQL 回答 20 个相关问题。"
        ready: "你能写出带连接和分组的查询，并能推理简单的概率问题。"

  web:
    title: "Web 开发"
    summary: "构建网站和 Web 应用，从用户看到的页面，到背后的服务器和数据库。"
    who: "适合想做出别人马上就能在浏览器里使用的东西的人。"
    roles: ["前端开发", "后端开发", "全栈开发"]
    stages:
      - title: "HTML、CSS 和 Web 的工作原理"
        learn: ["语义化 HTML", "无障碍", "用 Flexbox 和 Grid 做 CSS 布局", "响应式设计", "浏览器开发者工具"]
        build: "一个在手机上也好用、并能通过无障碍检查的个人主页。"
        ready: "你能从零复刻一个你喜欢的网站的布局。"
      - title: "深入 JavaScript"
        learn: ["DOM 和事件", "函数、闭包和对象", "Promise 和 async/await", "从 API 获取数据", "模块"]
        build: "一个使用公开 API 的应用，例如天气查询或图书搜索。"
        ready: "你能不用框架做出一个交互式页面。"
      - title: "前端框架和 TypeScript"
        learn: ["组件和状态", "表单和校验", "路由", "TypeScript 类型", "组件测试"]
        build: "一个多页面应用，包含表单、保存的状态和一些测试。"
        ready: "你能解释组件在什么时候、为什么会重新渲染。"
      - title: "后端和数据库"
        learn: ["深入理解 HTTP", "构建 REST API", "登录、会话和令牌", "PostgreSQL", "自动化测试"]
        build: "一个带用户账户和数据库、写好测试并被你的前端使用的 API。"
        ready: "你能设计 API、安全地存储数据并为它写测试。"
      - title: "安全地上线"
        learn: ["部署应用", "环境变量和密钥", "HTTPS", "持续集成", "OWASP Top 10"]
        build: "部署你的完整应用，每次推送都自动运行测试，并对照 OWASP Top 10 检查。"
        ready: "陌生人在使用你的应用，而且它出问题时你会知道。"

  cybersecurity:
    title: "网络安全"
    summary: "了解系统是如何被攻击的，从而保护它们：网络、Web 应用、检测与响应。"
    who: "适合喜欢拆解事物、想保护人和系统的好奇的人。"
    note: "只测试属于你自己或已获得书面授权的系统。请使用下面的练习环境；攻击他人的系统几乎在所有地方都是违法的。"
    roles: ["SOC 分析师", "渗透测试工程师", "安全工程师", "AI 安全研究员"]
    stages:
      - title: "面向安全的网络和 Linux"
        learn: ["TCP/IP 模型和常见端口", "网络上的 DNS、HTTP 和 TLS", "用 Wireshark 分析流量", "Linux 用户、权限和日志", "Shell 脚本"]
        build: "用 Wireshark 抓取你自己的上网流量，并简要说明每部分流量是什么。"
        ready: "你能读懂一份抓包并说出发生了什么，并且完成了 OverTheWire Bandit 的大部分关卡。"
      - title: "安全基础"
        learn: ["机密性、完整性和可用性", "身份认证和访问控制", "哈希、加密和证书", "常见攻击和恶意软件", "风险和安全框架"]
        build: "为你做过的一个应用写一页威胁模型：可能出什么问题、可能性多大、先修什么。"
        ready: "你能解释 TLS 如何保护登录，以及为什么密码要哈希而不是加密。"
      - title: "Web 应用安全"
        learn: ["SQL 注入", "跨站脚本", "访问控制失效", "身份认证缺陷", "服务端请求伪造", "使用 Burp Suite"]
        build: "在 OWASP Juice Shop 中找出并记录至少十个漏洞，并写明每个的修复方法。"
        ready: "你能解释 OWASP Top 10 中的每一类，在实验环境中利用它，并修复它。"
      - title: "选一个方向：防守或进攻"
        learn: ["防守：日志、SIEM 和告警分诊", "防守：事件响应", "进攻：侦察和漏洞利用", "进攻：权限提升", "两者：MITRE ATT&CK", "两者：写清楚的报告"]
        build: "防守：搭一个家庭实验室，收集日志并检测三种 ATT&CK 技术。进攻：完成 20 道 picoCTF 题目并发布解题记录。"
        ready: "你能把实验室或解题记录展示给雇主，并讲清楚你的思路。"
      - title: "专精并保持更新"
        learn: ["云安全", "AI 与大语言模型安全", "恶意软件分析", "治理、风险与合规", "跟进安全公告"]
        build: "发布一些别人能用的东西：一篇分析、一条检测规则或一个小工具。"
        ready: "这个阶段永远不会结束。安全每个月都在变化。"

  ai-ml:
    title: "人工智能与机器学习"
    summary: "从学习背后的数学，到训练模型、使用语言模型，再到负责任地投入使用。"
    who: "适合编程熟练、喜欢数学和做实验的人。"
    roles: ["机器学习工程师", "数据科学家", "AI 研究员", "MLOps 工程师"]
    stages:
      - title: "机器学习的数学"
        learn: ["向量和矩阵", "导数和梯度", "概率", "统计", "优化"]
        build: "只用 NumPy 实现带梯度下降的线性回归，并画出损失下降的曲线。"
        ready: "你能在白板上讲清楚梯度下降。"
      - title: "用于数据的 Python"
        learn: ["NumPy 数组", "pandas 数据框", "清洗杂乱的数据", "绘图", "Jupyter 笔记本"]
        build: "清洗并探索一个公开数据集，写下三个发现。"
        ready: "你能加载、清洗并总结一个从没见过的数据集。"
      - title: "经典机器学习"
        learn: ["训练集、验证集和测试集", "过拟合和正则化", "回归和分类", "决策树和集成方法", "选择合适的指标"]
        build: "一个端到端训练、在没见过的数据上测试的模型，并诚实写明它在哪里失败。"
        ready: "你能看出一个好分数其实是数据泄漏造成的。"
      - title: "深度学习"
        learn: ["神经网络和反向传播", "PyTorch", "卷积网络", "Transformer 和注意力机制", "在 GPU 上训练"]
        build: "训练一个图像或文本分类器，并和上一阶段的经典模型比较。"
        ready: "你能自己编写并调试训练循环。"
      - title: "语言模型"
        learn: ["词元和嵌入", "大语言模型如何训练", "微调", "检索增强生成", "评估输出"]
        build: "一个基于你自己笔记的问答应用，并用一个小测试集衡量它答对的比例。"
        ready: "你能解释模型为什么答错，并衡量一次改动是否有帮助。"
      - title: "负责任地投入使用"
        learn: ["通过 API 提供模型服务", "监控和数据漂移", "偏差与公平", "隐私", "针对 AI 系统的攻击"]
        build: "部署你的一个模型并加上监控，再写一份简短的模型卡，说明它不应该被用于什么。"
        ready: "这个阶段永远不会结束。持续发布，持续衡量。"

  ai-security:
    title: "AI 安全"
    summary: "AI 系统如何被攻击、又如何防御：从模型和 LLM 应用面临的威胁，到对抗性机器学习和红队测试，再到 AI 相关的法规。"
    who: "适合已经了解机器学习和安全基础、想在两者交汇处工作的人。"
    note: "只攻击你自己拥有或已获书面授权测试的模型、应用和系统。请使用下面的实验环境和开源工具。"
    roles: ["AI 安全工程师", "AI 红队测试员", "机器学习安全研究员", "AI 治理与风险专家"]
    stages:
      - title: "基础：机器学习与安全入门"
        learn: ["模型如何训练和评估", "训练集、验证集和测试集", "威胁建模", "常见的 Web 和 API 攻击", "AI 在普通系统中的位置"]
        build: "画出一个小型机器学习或 LLM 应用（数据、模型、API、用户）的架构图，标出攻击者可能触及的每个位置。"
        ready: "你能训练一个简单的分类器，并讲清 Web 的 OWASP Top 10 风险。如果还不行，请先完成“AI 与机器学习”和“网络安全”路线的前几个阶段。"
      - title: "AI 系统面临的威胁"
        learn: ["LLM 应用的 OWASP Top 10", "MITRE ATLAS 的战术与技术", "AI 供应链：数据、模型和库", "贯穿机器学习生命周期的攻击", "真实的 AI 安全事件"]
        build: "为第 1 阶段的应用做一份威胁模型，对应到 OWASP LLM 风险和 MITRE ATLAS 技术，并为每一项给出一种缓解措施。"
        ready: "对任何 AI 功能，你都能说出最可能的三种攻击，以及每种攻击从哪里进入。"
      - title: "对抗性机器学习"
        learn: ["规避攻击（对抗样本）", "数据投毒与后门", "模型窃取", "隐私攻击：成员推断与模型反演", "防御方法及如何诚实地评估它们"]
        build: "用 Adversarial Robustness Toolbox 对你自己的图像或文本分类器发起规避攻击，然后加入一种防御，测量它到底能起多大作用。"
        ready: "你能对自己的模型实施规避攻击和投毒攻击，并解释为什么大多数简单防御都会失效。"
      - title: "LLM 安全实战"
        learn: ["直接和间接提示注入", "越狱", "不安全的输出处理与过度授权", "LLM 应用的红队测试", "护栏，输入和输出检查", "文档和网页中的隐藏文本"]
        build: "做一个会读取文档的小型 LLM 应用，用 garak 或 PyRIT 对它做红队测试，然后加上护栏，展示前后的结果对比。"
        ready: "你能在别人写的 LLM 应用里找到提示注入，解释根本原因，并提出不只依赖提示词的修复方案。"
      - title: "治理、风险与法规"
        learn: ["NIST AI 风险管理框架", "生成式 AI 配置文件", "欧盟《人工智能法》基础：风险等级与义务", "ISO/IEC 42001 AI 管理体系", "安全 AI 开发指南"]
        build: "按照 NIST AI RMF 的四项职能（治理、映射、测量、管理）为你的 LLM 应用写一份两页的风险评估，并说明它在欧盟《人工智能法》下属于哪个风险等级。"
        ready: "你能向管理者解释欧盟《人工智能法》对高风险系统有哪些要求，以及 NIST AI RMF 如何帮助满足这些要求。"
      - title: "深入专精并持续跟进"
        learn: ["SOC 中的 AI", "AI 红队测试", "智能体与工具的安全", "阅读最新研究论文", "AI 安全 CTF"]
        build: "发布一些对别人有用的东西：一篇 AI CTF 解题记录、复现一篇最新的攻击论文，或者一个小型开源工具。"
        ready: "这个阶段永远不会结束。针对 AI 的新攻击每个月都会出现。"

  data:
    title: "数据分析与数据工程"
    summary: "把原始数据变成人们可以据此行动的答案，并构建让数据持续流动的管道。"
    who: "适合喜欢提问、并在数字中寻找答案的人。"
    roles: ["数据分析师", "分析工程师", "数据工程师"]
    stages:
      - title: "深入 SQL"
        learn: ["筛选和排序", "连接", "分组和聚合", "子查询", "窗口函数"]
        build: "只用 SQL 回答关于一个公开数据集的 15 个真实问题。"
        ready: "你能用一条写得好的查询回答大多数业务问题。"
      - title: "统计"
        learn: ["平均数、离散程度和分布", "抽样", "置信区间", "假设检验和 A/B 测试", "相关不等于因果"]
        build: "分析一个 A/B 测试数据集，并用通俗的语言给经理写出结论。"
        ready: "你不仅能说出结果是什么，还能说出对它有多大把握。"
      - title: "用 Python 或 R 做分析"
        learn: ["加载和清洗数据", "整洁数据", "重塑和合并表格", "笔记本和报告", "可复现的工作"]
        build: "一份从杂乱原始数据开始、任何人都能重新运行的完整报告。"
        ready: "你能在一个下午内从原始文件得到清晰的答案。"
      - title: "可视化与讲故事"
        learn: ["选择合适的图表", "诚实的坐标轴和刻度", "颜色和无障碍", "仪表盘", "写清晰的总结"]
        build: "一个非技术人员不需要你解释就能看懂的仪表盘或一页报告。"
        ready: "你的图表一眼就能回答一个问题。"
      - title: "数据工程"
        learn: ["ETL 和 ELT 管道", "数据仓库", "调度和编排", "用 dbt 做转换", "用 Spark 处理大数据"]
        build: "一个定时运行的管道：从 API 拉取数据，存入数据仓库，并为你的仪表盘提供数据。"
        ready: "你的管道能自动运行，出错时会通知你。"

  cloud-devops:
    title: "云与 DevOps"
    summary: "可靠地运行软件：服务器、容器、自动化、云平台以及保证服务在线。"
    who: "适合喜欢让系统更快、更安全、更自动化的人。"
    roles: ["DevOps 工程师", "云工程师", "站点可靠性工程师", "平台工程师"]
    stages:
      - title: "面向运维的 Linux 和网络"
        learn: ["进程和服务", "SSH 和密钥", "Shell 脚本", "DNS、负载均衡和防火墙", "阅读日志"]
        build: "搭建一台 Linux 服务器，加固 SSH，并在上面用 HTTPS 托管一个网站。"
        ready: "你能查出服务器为什么变慢或网站为什么打不开。"
      - title: "容器"
        learn: ["镜像和容器", "编写 Dockerfile", "卷和网络", "Docker Compose", "让应用在任何地方都容易运行"]
        build: "用 Docker Compose 打包一个 Web 应用及其数据库，让它一条命令就能启动。"
        ready: "任何人都能一步在自己的电脑上运行你的应用。"
      - title: "自动化：CI/CD 和基础设施即代码"
        learn: ["负责测试和构建的流水线", "自动部署", "Terraform", "管理密钥", "安全回滚"]
        build: "一条在每次推送时测试、构建并部署的流水线，基础设施用 Terraform 编写。"
        ready: "你能用代码重建整个环境。"
      - title: "认真学好一个云平台"
        learn: ["计算和存储", "身份和访问管理（IAM）", "虚拟网络", "托管数据库", "成本和预算"]
        build: "把你的应用部署到一个云平台，使用最小权限，并设置预算提醒。"
        ready: "你能解释你的云账单，以及谁能访问什么。"
