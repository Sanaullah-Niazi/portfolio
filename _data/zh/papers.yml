# 每篇论文的中文概要和关键词，按 _data/publications.yml 中的 bib_key 对应。标题保留英文。
khan2026fraud:
  summary: >-
    对巴基斯坦金融科技公司、数字银行、支付服务商和网络安全公司的 385 名专业人士进行问卷调查，并用 SmartPLS 4
    分析。结果表明：AI 欺诈检测、机器学习、实时监控和异常检测共同作用，能有效防范数字金融诈骗。
  keywords: [欺诈检测, 机器学习, 异常检测, 金融科技, 网络安全]
khan2026safety:
  summary: >-
    探讨 AI 如何让石油和天然气行业的职业风险评估从被动应对转向主动预测。通过对职业安全和 AI
    领域专业人士的问卷调查，并用回归分析和结构方程模型进行分析，结果显示：AI 的应用和预测性风险评估与更好的安全结果密切相关（模型解释了
    69% 的方差）。数据质量、成本和专业人才不足仍是主要障碍。
  keywords: [人工智能, 预测分析, 风险评估, 职业安全]
soomro2026genai:
  summary: >-
    对 412 名学生进行问卷调查，并用结构方程模型分析。在创业教育中使用生成式 AI
    能增强学生创办数字企业的意愿，部分通过学生的态度起作用；支持性的校园环境会放大这一效果（解释了 58% 的方差）。
  keywords: [生成式 AI, 创业教育, 结构方程模型]
