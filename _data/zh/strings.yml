so_prog_title: 每年开放的大型项目
so_prog_lede: 每年都会重新开放的知名奖学金和研究员项目。有些只面向安全方向；其他的面向所有专业，安全方向的学生同样可以申请。日期每年都会变化，请以官方页面为准。
so_security_only: 仅限安全方向
so_official: 官方页面
so_link_checked: 链接检查于
so_about_title: 这个列表是怎么来的
so_about_1: 本网站上的一个小程序每天读取下列招聘网站和奖学金网站的公开订阅源（RSS），只保留与安全相关、且属于博士、硕士、奖学金、研究员项目或博士后的信息，从招聘信息中读取截止日期，并移除已经截止的条目。没有截止日期的条目会在 45 天后移除。
so_about_2: 它只读取这些网站公开提供给所有人订阅的内容，并先检查每个网站对机器人的规定（robots.txt）。不会编造任何内容；每一条都链接到原始招聘信息。括号里的数字是每个来源当前开放的条目数量。
so_limits_title: 它看不到什么
so_limit_1: 只发布在教授个人主页、邮件列表或社交媒体上、从未出现在招聘网站上的职位。
so_limit_2: 不提供订阅源或要求机器人不要读取的网站，例如 EURAXESS、LinkedIn，以及中国、日本和韩国的大多数国家级平台。对于这些，请使用下面的年度项目，并自行搜索这些网站。
so_limit_3: 截止日期是从招聘信息的文字中读取的。如果写法比较特殊，可能会遗漏，所以请务必查看原始页面。
so_limit_4: 方向和国家是根据招聘信息的用词推断的，所以偶尔可能归错类。
so_check_note: 申请前请务必阅读原始招聘信息。资助、申请条件和截止日期由大学或资助方决定，而不是本网站。
so_in_english: 招聘信息以英文显示，与来源发布的一致。
