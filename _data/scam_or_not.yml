# Scam or Not (/games/scam-or-not/): the messages, without their words. Same in every language.
# The words (message text, contact names and the red flags) are in _data/games.yml under scam_msgs, keyed by id,
# and in the translations. Every brand, name, number and link here is made up for the game. Phone and account numbers
# are always partly hidden with dots so none of them can be called, and the links are shown as plain text, never as links.
#
# id: the key in scam_msgs. scam: true for a scam, false for a real message. cc: pk (Pakistan) or in (India).
# ch: sms or wa (WhatsApp). from: what the phone shows as the sender (a number or a sender name).
# tag: unknown (a number not in your contacts), contact (a saved contact, name in scam_msgs), brand (a company's
# sender name) or verified (a WhatsApp business account with a tick). time: the time shown under the message.
# To add a message: a line here and its words in all four games.yml files.

# How many messages one round has, and how many of them are scams (picked at random between the two numbers).
round: 10
scams_min: 5
scams_max: 6

msgs:
  # ----- Scams -----
  - { id: wallet_block,   scam: true,  cc: pk, ch: sms, tag: unknown,  from: "+92 3•• •••4417",  time: "09:12" }
