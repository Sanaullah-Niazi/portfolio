frameworks: [nist-800-61, nist-800-86, iso27037, attack, nist-csf, gdpr, nis2]

career:
  - { title: "SOC analyst or IT administrator", years: "0–2 years" }
  - { title: "Junior DFIR analyst", years: "1–3 years" }
  - { title: "Incident responder or forensic examiner", years: "3–6 years" }
  - { title: "Senior IR consultant or malware analyst", years: "6–9 years" }
  - { title: "Head of incident response", years: "10+ years" }

related:
  - { to: secops, why: "Detection and response go hand in hand." }
  - { to: cloud, why: "More and more incidents start in cloud and SaaS accounts." }
  - { name: "Malware Analysis", why: "Go deep into how malicious code works." }
  - { name: "Threat Intelligence", why: "Turn what you learn in incidents into intelligence for others." }
  - { name: "Ransomware Defense", why: "Prepare organisations for the most common major incident." }
  - { to: ai-secops, why: "Use AI to speed up investigations, and check its work." }
