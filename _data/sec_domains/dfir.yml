  - { name: "CyberDefenders", by: "CyberDefenders", url: "https://cyberdefenders.org/", type: practice, cost: free }
  - { name: "13Cubed (videos)", by: "Richard Davis", url: "https://www.youtube.com/@13Cubed", type: video, cost: free }
  - { name: "The DFIR Report", by: "The DFIR Report", url: "https://thedfirreport.com/", type: docs, cost: free }
  - { name: "Volatility 3 documentation", by: "Volatility Foundation", url: "https://volatility3.readthedocs.io/", type: docs, cost: free }
  - { name: "Velociraptor documentation", by: "Velociraptor", url: "https://docs.velociraptor.app/", type: docs, cost: free }
  - { name: "SANS DFIR posters and cheat sheets", by: "SANS Institute", url: "https://www.sans.org/posters/", type: docs, cost: free }
  - { name: "Blue Team Labs Online", by: "Security Blue Team", url: "https://blueteamlabs.online/", type: practice, cost: paid }
  - { name: "Practical Malware Analysis", by: "Michael Sikorski and Andrew Honig (No Starch Press)", url: "https://nostarch.com/malware", type: book, cost: paid }
  - { name: "Practical Linux Forensics", by: "Bruce Nikkel (No Starch Press)", url: "https://nostarch.com/practical-linux-forensics", type: book, cost: paid }
  - { name: "FOR508: Advanced Incident Response, Threat Hunting and Digital Forensics", by: "SANS Institute", url: "https://www.sans.org/cyber-security-courses/advanced-incident-response-threat-hunting-training/", type: course, cost: paid }

frameworks: [nist-800-61, nist-800-86, iso27037, attack, nist-csf, gdpr, nis2]

career:
