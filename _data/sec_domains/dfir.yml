  - { title: "Junior DFIR analyst", years: "1–3 years" }
  - { title: "Incident responder or forensic examiner", years: "3–6 years" }
  - { title: "Senior IR consultant or malware analyst", years: "6–9 years" }
  - { title: "Head of incident response", years: "10+ years" }

