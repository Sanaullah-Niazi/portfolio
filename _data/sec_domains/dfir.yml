# Security roadmap: Digital Forensics and Incident Response (DFIR). Shown at /roadmaps/security/dfir/.
# Field guide: see the top of secops.yml.

id: dfir
category: core
icon: eye
entry: intermediate
title: "Digital Forensics and Incident Response (DFIR)"
summary: "When an attack happens, work out exactly what the attacker did, stop them, recover, and preserve the evidence properly."
keywords: "forensics incident response memory disk timeline evidence ransomware malware triage Volatility Autopsy Velociraptor"

overview:
  - "Incident response is the process of handling a security incident: preparing for it, detecting and analysing it, containing it, removing the attacker, recovering, and learning from it. Digital forensics is the careful collection and analysis of evidence from computers, phones, memory, networks and cloud services."
  - "Together they answer the questions every organisation asks after a breach: how did they get in, what did they touch, what did they take, are they still here, and what do we have to report? Forensic work done carefully can also stand up in court."
why: "Every serious incident needs DFIR skills, and regulations such as GDPR and NIS2 set short deadlines to report incidents and their impact. A good investigation is the difference between guessing and knowing what happened."
roles:
  - { title: "Junior incident responder / DFIR analyst", level: entry, what: "Collects evidence, runs triage tools and builds timelines under supervision." }
  - { title: "Incident responder", level: mid, what: "Investigates incidents, scopes the compromise and leads containment." }
  - { title: "Digital forensic examiner", level: mid, what: "Analyses disks, phones and memory, often for legal or HR cases." }
  - { title: "Malware analyst", level: senior, what: "Reverse engineers malicious code to find what it does and how to detect it." }
  - { title: "Senior incident response consultant", level: senior, what: "Leads response for clients, often during ransomware attacks." }
  - { title: "DFIR lead / head of incident response", level: lead, what: "Runs the IR team, retainer clients and major incident command." }

prereqs:
  - "Solid Windows and Linux knowledge, including the file system, the registry and services."
  - "Networking basics and the ability to read a packet capture."
  - "Security Operations beginner stage, or equivalent experience triaging alerts."
  - "Scripting in Python or PowerShell for parsing and automating."
prereq_paths: [foundations, cybersecurity]

stages:
  - level: beginner
    title: "Evidence, artefacts and the incident lifecycle"
    months: "3–4"
    topics: ["Incident response lifecycle (NIST SP 800-61)", "Order of volatility", "Chain of custody", "Disk images and hashing", "Windows artefacts (registry, event logs, prefetch, LNK)", "Linux artefacts (logs, shell history, cron)", "Timeline analysis", "Report writing"]
    skills:
      - "Take a forensic image of a disk and verify it with a hash."
      - "Find evidence of program execution, logons and file access on Windows."
      - "Build a simple timeline from several artefacts."
      - "Keep notes and a chain of custody that someone else can follow."
    labs:
      - "Create a disk image of a test VM with FTK Imager or dd, then analyse it in Autopsy."
      - "Use Eric Zimmerman's tools to parse the registry, prefetch and event logs from a Windows VM you used for a day."
      - "Solve beginner forensics challenges on CyberDefenders using the free NIST CFReDS datasets as extra practice."
    done:
      - "Explain the six phases of incident response and what happens in each."
      - "Show, from artefacts alone, which programs ran on a machine and when."
      - "Write a short forensic report with findings, evidence and method."

  - level: intermediate
    title: "Memory, network and endpoint investigations"
    months: "4–6"
    topics: ["Memory forensics", "Live response and triage collection", "Network forensics", "Email and phishing investigations", "Super timelines (Plaso)", "Event log hunting (Sigma, Chainsaw, Hayabusa)", "Containment and eradication", "Ransomware incident handling"]
    skills:
      - "Capture and analyse memory with Volatility 3 to find malicious processes and injected code."
      - "Collect triage data from many machines with Velociraptor."
      - "Scope an incident: every machine and account the attacker touched."
      - "Plan containment that does not tip off the attacker too early."
    labs:
      - "Infect an isolated VM with a known sample from a malware training set (never on your real network), capture memory, and find the malware with Volatility 3."
      - "Deploy Velociraptor to a few lab machines and hunt for a persistence technique across all of them."
      - "Investigate a full scenario on CyberDefenders or Blue Team Labs Online and write it up as a client report."
    done:
      - "Find an attacker's process, network connections and persistence in a memory image."
      - "Lead a lab investigation from first alert to scoped compromise and a timeline."
      - "Write an executive summary that a non-technical manager understands."

  - level: advanced
    title: "Enterprise, cloud and malware analysis"
    months: "6–9"
    topics: ["Enterprise-wide incident response", "Active Directory compromise recovery", "Cloud forensics (AWS, Azure, Microsoft 365)", "Malware analysis (static and dynamic)", "Reverse engineering basics", "YARA rules", "Mobile forensics basics", "Threat intelligence from incidents"]
    skills:
      - "Investigate incidents across hundreds of machines and cloud tenants."
      - "Analyse a malware sample in a safe lab and write YARA rules for it."
      - "Investigate a compromised Microsoft 365 or AWS account from its audit logs."
      - "Turn investigation findings into detections and intelligence."
    labs:
      - "Set up REMnux and FLARE VM in an isolated network and analyse samples from a reputable training source."
      - "Use Ghidra to reverse engineer a crackme or a training sample and describe its behaviour."
      - "Simulate a compromised cloud account in your own tenant and investigate it from the logs alone."
    done:
      - "Write a malware analysis report with indicators, behaviour and detection rules."
      - "Run a complete simulated ransomware response, including recovery decisions."

  - level: expert
    title: "Leading major incidents and advancing the field"
    months: "12–24"
    topics: ["Major incident command", "Legal, regulatory and insurance aspects", "Expert witness work", "Building an IR programme and retainers", "Tool and method research", "AI-assisted analysis"]
    skills:
      - "Command a major incident with executives, lawyers, insurers and regulators involved."
      - "Build an IR plan, playbooks and a team that improves after every incident."
      - "Develop new forensic methods or tools, and validate them."
    labs:
      - "Write and run a full tabletop exercise for executives, including regulatory reporting deadlines under GDPR and NIS2."
      - "Publish a tool, a parser or research on a new artefact."
    done:
      - "Lead a major incident from first call to final report."
      - "Have your methods or tools used by others in the DFIR community."

tools:
  - { name: "Autopsy and The Sleuth Kit", url: "https://www.sleuthkit.org/", kind: oss, what: "Open-source disk forensics platform and libraries." }
  - { name: "Volatility 3", url: "https://github.com/volatilityfoundation/volatility3", kind: oss, what: "The standard framework for memory forensics." }
  - { name: "Velociraptor", url: "https://docs.velociraptor.app/", kind: oss, what: "Endpoint collection and hunting at scale." }
  - { name: "Eric Zimmerman's tools", url: "https://ericzimmerman.github.io/", kind: free, what: "Parsers for Windows artefacts: registry, event logs, prefetch, LNK and more." }
  - { name: "Plaso (log2timeline)", url: "https://github.com/log2timeline/plaso", kind: oss, what: "Builds super timelines from many artefacts." }
  - { name: "Timesketch", url: "https://timesketch.org/", kind: oss, what: "Collaborative timeline analysis." }
  - { name: "Chainsaw", url: "https://github.com/WithSecureLabs/chainsaw", kind: oss, what: "Fast hunting through Windows event logs with Sigma rules." }
  - { name: "Hayabusa", url: "https://github.com/Yamato-Security/hayabusa", kind: oss, what: "Windows event log timeline and threat hunting tool." }
  - { name: "FTK Imager", url: "https://www.exterro.com/digital-forensics-software/ftk-imager", kind: free, what: "Free disk and memory imaging tool." }
  - { name: "YARA", url: "https://virustotal.github.io/yara/", kind: oss, what: "Pattern matching to identify and classify malware." }
  - { name: "Ghidra", url: "https://ghidra-sre.org/", kind: oss, what: "Reverse engineering suite from the NSA." }
  - { name: "REMnux", url: "https://remnux.org/", kind: oss, what: "Linux toolkit for malware analysis." }
  - { name: "SIFT Workstation", url: "https://www.sans.org/tools/sift-workstation/", kind: free, what: "Free forensic workstation from SANS." }
  - { name: "CyberChef", url: "https://gchq.github.io/CyberChef/", kind: oss, what: "Decode and transform data found during investigations." }

certs:
  - { ref: secplus, note: "A common baseline." }
  - { ref: cdsa, note: "Hands-on, includes forensics and incident response." }
  - { ref: gcih, note: "The best-known incident handling certification." }
  - { name: "GIAC Certified Forensic Examiner (GCFE)", by: "GIAC", url: "https://www.giac.org/certifications/certified-forensic-examiner-gcfe/", level: mid, note: "Windows forensics." }
  - { name: "GIAC Certified Forensic Analyst (GCFA)", by: "GIAC", url: "https://www.giac.org/certifications/certified-forensic-analyst-gcfa/", level: advanced, note: "Advanced incident response and memory forensics." }
  - { name: "GIAC Network Forensic Analyst (GNFA)", by: "GIAC", url: "https://www.giac.org/certifications/network-forensic-analyst-gnfa/", level: advanced, note: "Network forensics." }
  - { name: "GIAC Reverse Engineering Malware (GREM)", by: "GIAC", url: "https://www.giac.org/certifications/reverse-engineering-malware-grem/", level: advanced, note: "Malware analysis." }

