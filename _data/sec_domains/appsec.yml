# Security roadmap: Application and Software Security. Shown at /roadmaps/security/appsec/.
# Field guide: see the top of secops.yml.

id: appsec
category: core
icon: code
entry: intermediate
legal: true
title: "Application and Software Security"
summary: "Find and fix security flaws in the software people build, and help developers write code that is secure from the start."
keywords: "AppSec OWASP web API secure code review SAST DAST SCA threat modeling DevSecOps vulnerabilities"

overview:
  - "Application security (AppSec) is about the security of software itself: web and mobile apps, APIs, and the libraries and services they depend on. It covers finding vulnerabilities (testing and code review), preventing them (secure design, safe frameworks, developer training) and managing them across hundreds of applications."
  - "Modern AppSec works inside the development process. Security engineers threat model new features, add automated checks to pipelines, review risky code, and help developers fix issues quickly, rather than testing once just before release."
why: "Applications are what an organisation exposes to the internet, and flaws in them, such as broken access control, injection and vulnerable dependencies, are a leading cause of breaches. Fixing a flaw in design costs far less than fixing it after an attack."
roles:
  - { title: "Junior application security engineer / AppSec analyst", level: entry, what: "Triages scanner findings and helps developers fix them." }
  - { title: "Application security engineer", level: mid, what: "Threat models, reviews code, tests apps and runs AppSec tooling." }
  - { title: "Web application penetration tester", level: mid, what: "Tests web apps and APIs, with permission, and writes reports." }
  - { title: "Product security engineer", level: senior, what: "Owns the security of a product line, working inside engineering teams." }
  - { title: "Application security architect", level: senior, what: "Sets secure design patterns, standards and reference architectures." }
  - { title: "Head of application or product security", level: lead, what: "Runs the AppSec programme across the organisation." }

prereqs:
  - "Programming in at least one language used for web apps, such as Python, JavaScript or Java, well enough to build a small app."
  - "How the web works: HTTP methods, headers, cookies, sessions, same-origin policy."
  - "Basic databases and SQL."
  - "Git and a basic understanding of how software is built and deployed."
prereq_paths: [foundations, web]

stages:
  - level: beginner
    title: "Web vulnerabilities and how to find them"
    months: "3–4"
    topics:
      - id: owasp-top10
        title: "OWASP Top 10"
        text: "The OWASP Top 10 lists the most serious web application risks, from broken access control to vulnerable components. It is the common starting vocabulary for AppSec."
        res:
          - { name: "OWASP Top 10", by: "OWASP Foundation", url: "https://owasp.org/www-project-top-ten/", type: docs, cost: free }
      - id: injection
        title: "Injection"
        text: "SQL and command injection happen when user input is treated as code. Learn to find them, and the real fix: parameterised queries and safe APIs, not filtering."
        res:
          - { name: "SQL injection", by: "PortSwigger", url: "https://portswigger.net/web-security/sql-injection", type: practice, cost: free }
          - { name: "Injection Prevention Cheat Sheet", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html", type: docs, cost: free }
      - id: xss
        title: "Cross-site scripting"
        text: "XSS lets an attacker run script in another user's browser. Learn reflected, stored and DOM-based XSS, and how output encoding and Content Security Policy stop them."
        res:
          - { name: "Cross-site scripting", by: "PortSwigger", url: "https://portswigger.net/web-security/cross-site-scripting", type: practice, cost: free }
          - { name: "Cross Site Scripting Prevention Cheat Sheet", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html", type: docs, cost: free }
      - id: access-control
        title: "Broken access control"
        text: "The number one web risk: users reaching data or actions they should not, often just by changing an ID in a request. Check authorisation on the server for every request."
        res:
          - { name: "Access control vulnerabilities", by: "PortSwigger", url: "https://portswigger.net/web-security/access-control", type: practice, cost: free }
          - { name: "Authorization Cheat Sheet", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html", type: docs, cost: free }
      - id: auth-flaws
        title: "Authentication and session flaws"
        text: "Weak login logic, predictable reset tokens and badly handled sessions let attackers take over accounts. Learn how sessions should be created, protected and ended."
        res:
          - { name: "Authentication vulnerabilities", by: "PortSwigger", url: "https://portswigger.net/web-security/authentication", type: practice, cost: free }
          - { name: "Session Management Cheat Sheet", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html", type: docs, cost: free }
      - id: ssrf
        title: "Server-side request forgery"
        text: "SSRF tricks a server into making requests for the attacker, often to internal services or cloud metadata endpoints. It caused several major cloud breaches."
        res:
          - { name: "Server-side request forgery", by: "PortSwigger", url: "https://portswigger.net/web-security/ssrf", type: practice, cost: free }
      - id: proxies
        title: "Intercepting proxies"
        text: "Burp Suite and ZAP sit between your browser and the app so you can see and change every request. They are the main tools of web testing."
        res:
          - { name: "Burp Suite Community Edition", by: "PortSwigger", url: "https://portswigger.net/burp/communitydownload", type: practice, cost: free }
          - { name: "ZAP", by: "ZAP Dev Team", url: "https://www.zaproxy.org/", type: practice, cost: free }
      - id: headers-cookies
        title: "Security headers and cookies"
        optional: true
        text: "Headers such as Content-Security-Policy and Strict-Transport-Security, and cookie flags such as HttpOnly, Secure and SameSite, add cheap, strong protection."
        res:
          - { name: "HTTP Headers Cheat Sheet", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html", type: docs, cost: free }
          - { name: "MDN Web Docs: HTTP security", by: "Mozilla", url: "https://developer.mozilla.org/en-US/docs/Web/Security", type: docs, cost: free }
    skills:
      - "Use Burp Suite or ZAP to intercept, change and replay requests."
      - "Find and exploit the common OWASP Top 10 flaws in practice apps."
      - "Explain the root cause and the right fix for each flaw, not just the exploit."
    labs:
      - "Work through the Apprentice and Practitioner labs in the PortSwigger Web Security Academy."
      - "Run OWASP Juice Shop and DVWA locally in Docker and solve their challenges."
      - "Build a small web app yourself, then attack it and fix each flaw you find."
    done:
      - "Find and explain SQL injection, XSS and an access control flaw in an app you have not seen before (a practice app)."
      - "Explain the fix for each OWASP Top 10 category in the language you code in."

  - level: intermediate
    title: "Secure code, APIs and automated testing"
    months: "4–6"
    topics:
      - id: code-review
        title: "Secure code review"
        text: "Read code from where untrusted input enters to where it is used. Focus on authentication, authorisation, input handling and crypto, and write comments developers can act on."
        res:
          - { name: "OWASP Code Review Guide", by: "OWASP Foundation", url: "https://owasp.org/www-project-code-review-guide/", type: docs, cost: free }
      - id: api-top10
        title: "OWASP API Security Top 10"
        text: "APIs have their own top risks, led by broken object-level authorisation. Test REST and GraphQL APIs against each one."
        res:
          - { name: "OWASP API Security Top 10", by: "OWASP Foundation", url: "https://owasp.org/API-Security/", type: docs, cost: free }
          - { name: "OWASP crAPI", by: "OWASP Foundation", url: "https://github.com/OWASP/crAPI", type: practice, cost: free }
      - id: sast
        title: "Static analysis (SAST)"
        text: "SAST tools scan source code for risky patterns without running it. The skill is tuning them so developers trust the results."
        res:
          - { name: "Semgrep documentation", by: "Semgrep", url: "https://semgrep.dev/docs/", type: docs, cost: free }
          - { name: "CodeQL documentation", by: "GitHub", url: "https://codeql.github.com/docs/", type: docs, cost: free }
      - id: sca
        title: "Dependency scanning (SCA)"
        text: "Most code in an app comes from open-source packages. SCA tools match your dependencies against known vulnerabilities so you can update the risky ones."
        res:
          - { name: "OSV-Scanner", by: "Google", url: "https://google.github.io/osv-scanner/", type: docs, cost: free }
          - { name: "OWASP Dependency-Check", by: "OWASP Foundation", url: "https://owasp.org/www-project-dependency-check/", type: docs, cost: free }
      - id: dast
        title: "Dynamic scanning (DAST)"
        text: "DAST tools attack a running app from the outside, like a basic tester would. They catch configuration issues and simple flaws, and miss business logic."
        res:
          - { name: "ZAP documentation", by: "ZAP Dev Team", url: "https://www.zaproxy.org/docs/", type: docs, cost: free }
      - id: secrets-scanning
        title: "Secrets scanning"
        text: "Keys and passwords end up in Git history surprisingly often. Scan every commit, and when one leaks, rotate it: deleting the commit is not enough."
        res:
          - { name: "gitleaks", by: "Gitleaks", url: "https://github.com/gitleaks/gitleaks", type: practice, cost: free }
          - { name: "About secret scanning", by: "GitHub Docs", url: "https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning", type: docs, cost: free }
      - id: threat-modeling
        title: "Threat modeling"
        text: "Threat modeling asks four questions: what are we building, what can go wrong, what will we do about it, and did we do a good job? Do it early, on a whiteboard."
        res:
          - { name: "Threat Modeling Manifesto", by: "Threat Modeling Manifesto working group", url: "https://www.threatmodelingmanifesto.org/", type: docs, cost: free }
          - { name: "OWASP Threat Dragon", by: "OWASP Foundation", url: "https://owasp.org/www-project-threat-dragon/", type: practice, cost: free }
      - id: secure-defaults
        title: "Secure defaults in frameworks"
        optional: true
        text: "Modern frameworks escape output, use parameterised queries and protect against CSRF by default. Most vulnerabilities come from turning those defaults off."
        res:
          - { name: "OWASP Cheat Sheet Series", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/", type: docs, cost: free }
    skills:
      - "Review code for security flaws, starting from where user input enters."
      - "Run and tune SAST, SCA and secrets scanning in a CI pipeline, and cut the false positives."
      - "Test REST and GraphQL APIs for broken object-level authorisation and other API risks."
      - "Threat model a feature with STRIDE or a data flow diagram."
    labs:
      - "Add Semgrep, Trivy or OSV-Scanner, and gitleaks to a GitHub Actions pipeline for one of your own projects, and fix what they find."
      - "Run OWASP crAPI and find the API Top 10 issues in it."
      - "Threat model a sample app with OWASP Threat Dragon and turn the threats into tests."
    done:
      - "Review a pull request and write security comments a developer can act on."
      - "Show a pipeline that blocks a build with a known-vulnerable dependency or a committed secret."
      - "Present a threat model for a login and payment flow."

  - level: advanced
    title: "Software supply chain and AppSec at scale"
    months: "6–9"
    topics:
      - id: supply-chain
        title: "Software supply chain security"
        text: "Attackers increasingly target the build: compromised packages, maintainers and CI systems. Learn the attack types and the defences that matter most."
        res:
          - { name: "SLSA", by: "OpenSSF", url: "https://slsa.dev/", type: docs, cost: free }
          - { name: "OpenSSF Scorecard", by: "OpenSSF", url: "https://scorecard.dev/", type: practice, cost: free }
      - id: sbom
        title: "SBOMs"
        text: "A software bill of materials lists every component in a build. It lets you answer 'are we affected?' in minutes when the next big vulnerability lands."
        res:
          - { name: "Software Bill of Materials", by: "CISA", url: "https://www.cisa.gov/sbom", type: docs, cost: free }
          - { name: "CycloneDX", by: "OWASP Foundation", url: "https://cyclonedx.org/", type: docs, cost: free }
      - id: signing-provenance
        title: "Signing and provenance"
        text: "Signing proves who built an artefact, and provenance records how. Sigstore makes signing free and keyless; SLSA defines levels of build integrity."
        res:
          - { name: "Sigstore", by: "OpenSSF", url: "https://www.sigstore.dev/", type: docs, cost: free }
          - { name: "SLSA", by: "OpenSSF", url: "https://slsa.dev/", type: docs, cost: free }
      - id: custom-rules
        title: "Writing custom SAST rules"
        text: "Off-the-shelf rules miss the bugs specific to your codebase. Writing your own Semgrep or CodeQL rules turns one bug you found into a check that prevents it forever."
        res:
          - { name: "Writing Semgrep rules", by: "Semgrep", url: "https://semgrep.dev/docs/writing-rules/overview", type: docs, cost: free }
          - { name: "CodeQL documentation", by: "GitHub", url: "https://codeql.github.com/docs/", type: docs, cost: free }
      - id: champions
        title: "Security champions"
        optional: true
        text: "A security champion is a developer in each team who cares about security and gets extra training. It is the main way AppSec scales beyond a small team."
        res:
          - { name: "OWASP Security Culture project", by: "OWASP Foundation", url: "https://owasp.org/www-project-security-culture/", type: docs, cost: free }
      - id: app-vuln-mgmt
        title: "Vulnerability management for applications"
        text: "Collect findings from every tool in one place, remove duplicates, and prioritise by real exploitability and exposure, not just the CVSS score."
        res:
          - { name: "DefectDojo", by: "DefectDojo", url: "https://github.com/DefectDojo/django-DefectDojo", type: practice, cost: free }
          - { name: "EPSS", by: "FIRST", url: "https://www.first.org/epss/", type: docs, cost: free }
      - id: advanced-web
        title: "Advanced web attacks"
        text: "Insecure deserialisation, HTTP request smuggling and race conditions are harder to find and often critical. Practise them in dedicated labs."
        res:
          - { name: "HTTP request smuggling", by: "PortSwigger", url: "https://portswigger.net/web-security/request-smuggling", type: practice, cost: free }
          - { name: "Race conditions", by: "PortSwigger", url: "https://portswigger.net/web-security/race-conditions", type: practice, cost: free }
      - id: llm-features
        title: "Securing LLM features in apps"
        text: "Adding a chatbot or AI agent to an app brings prompt injection, data leakage and unsafe output handling. Treat model output as untrusted input."
        res:
          - { name: "OWASP Top 10 for LLM Applications", by: "OWASP Foundation", url: "https://genai.owasp.org/llm-top-10/", type: docs, cost: free }
          - { name: "Web LLM attacks", by: "PortSwigger", url: "https://portswigger.net/web-security/llm-attacks", type: practice, cost: free }
    skills:
      - "Write custom rules that catch the bugs your codebase actually has."
      - "Generate SBOMs, sign builds, and verify provenance before deployment."
      - "Prioritise application vulnerabilities by real risk, not just CVSS."
      - "Train and support developers so security scales beyond your team."
    labs:
      - "Write CodeQL or Semgrep rules for a vulnerability class you found earlier, and run them on open-source projects you are allowed to test."
      - "Sign a container image with cosign in your pipeline and reject unsigned images at deploy time."
      - "Do the Expert labs in the Web Security Academy on request smuggling and race conditions."
    done:
      - "Show custom rules that found real issues, with low false positives."
      - "Show a build pipeline that produces a signed artefact with an SBOM and provenance."
      - "Run a security champions session for developers and collect their feedback."

  - level: expert
    title: "Product security leadership and research"
    months: "12–24"
    topics:
      - id: appsec-programme
        title: "AppSec programme design"
        text: "Decide which practices every team must follow, which tools are provided centrally, and how to measure that it is working."
        res:
          - { name: "Secure Software Development Framework (SP 800-218)", by: "NIST", url: "https://csrc.nist.gov/pubs/sp/800/218/final", type: docs, cost: free }
      - id: samm
        title: "Maturity models (OWASP SAMM)"
        text: "SAMM scores an organisation's software security practices and helps plan improvements step by step."
        res:
          - { name: "OWASP SAMM", by: "OWASP Foundation", url: "https://owaspsamm.org/", type: docs, cost: free }
      - id: design-reviews
        title: "Secure design reviews at scale"
        text: "Review architecture before code is written, using lightweight templates so every team can do it without a security engineer in the room."
        res:
          - { name: "Designing Secure Software", by: "Loren Kohnfelder (No Starch Press)", url: "https://nostarch.com/designing-secure-software", type: book, cost: paid }
      - id: appsec-research
        title: "Vulnerability research"
        optional: true
        text: "Look for new classes of bugs in frameworks and libraries, and publish what you find after it is fixed."
        res:
          - { name: "pwn.college", by: "Arizona State University", url: "https://pwn.college/", type: course, cost: free }
      - id: disclosure
        title: "Coordinated disclosure"
        text: "When you find a vulnerability in someone else's software, report it privately, give them time to fix it, then publish. Have a policy for reports about your own products too."
        res:
          - { name: "Vulnerability Disclosure Cheat Sheet", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/cheatsheets/Vulnerability_Disclosure_Cheat_Sheet.html", type: docs, cost: free }
          - { name: "security.txt (RFC 9116)", by: "IETF", url: "https://datatracker.ietf.org/doc/html/rfc9116", type: docs, cost: free }
      - id: cra
        title: "Secure by design and regulation"
        text: "The EU Cyber Resilience Act makes secure design, vulnerability handling and security updates a legal duty for products sold in the EU."
        res:
          - { name: "Cyber Resilience Act", by: "European Union", url: "https://eur-lex.europa.eu/eli/reg/2024/2847/oj", type: docs, cost: free }
          - { name: "Secure by Design", by: "CISA", url: "https://www.cisa.gov/securebydesign", type: docs, cost: free }
      - id: ai-code
        title: "Security of AI-generated code"
        optional: true
        text: "AI coding assistants write code fast, including insecure code and made-up package names. Review and scan it like any other code."
        res:
          - { name: "OWASP GenAI Security Project", by: "OWASP Foundation", url: "https://genai.owasp.org/", type: docs, cost: free }
    skills:
      - "Design and measure an AppSec programme for many teams and products."
      - "Find new classes of vulnerabilities and report them responsibly."
      - "Influence engineering leadership on architecture and priorities."
    labs:
      - "Assess a real or fictional organisation against OWASP SAMM and write a two-year improvement plan."
      - "Report a vulnerability to an open-source project or a bug bounty programme through its official disclosure process."
    done:
      - "Show measurable improvement in an AppSec programme, such as fix times or vulnerabilities per release."
      - "Have a disclosed vulnerability, a published tool or a conference talk to your name."

tools:
  - { name: "Burp Suite Community Edition", url: "https://portswigger.net/burp/communitydownload", kind: community, what: "The standard intercepting proxy for testing web apps. The Professional edition is paid." }
  - { name: "ZAP", url: "https://www.zaproxy.org/", kind: oss, what: "Open-source web app scanner and intercepting proxy." }
  - { name: "Semgrep Community Edition", url: "https://semgrep.dev/", kind: oss, what: "Fast static analysis with rules that look like code." }
  - { name: "CodeQL", url: "https://codeql.github.com/", kind: free, what: "GitHub's code analysis engine; free for open-source projects." }
  - { name: "OSV-Scanner", url: "https://google.github.io/osv-scanner/", kind: oss, what: "Finds known vulnerabilities in your dependencies." }
  - { name: "Trivy", url: "https://trivy.dev/", kind: oss, what: "Scans code, containers and IaC for vulnerabilities and secrets." }
  - { name: "OWASP Dependency-Check", url: "https://owasp.org/www-project-dependency-check/", kind: oss, what: "Software composition analysis for known-vulnerable libraries." }
  - { name: "gitleaks", url: "https://github.com/gitleaks/gitleaks", kind: oss, what: "Finds secrets committed to Git repositories." }
  - { name: "OWASP Threat Dragon", url: "https://owasp.org/www-project-threat-dragon/", kind: oss, what: "Threat modeling diagrams and reports." }
  - { name: "Sigstore (cosign)", url: "https://www.sigstore.dev/", kind: oss, what: "Signs and verifies software artefacts." }
  - { name: "OpenSSF Scorecard", url: "https://scorecard.dev/", kind: oss, what: "Checks the security practices of open-source projects you depend on." }
  - { name: "DefectDojo", url: "https://github.com/DefectDojo/django-DefectDojo", kind: oss, what: "Collects and tracks findings from all your security tools." }
  - { name: "sqlmap", url: "https://sqlmap.org/", kind: oss, what: "Automates finding SQL injection. Only use it on apps you may test." }

certs:
  - { name: "Burp Suite Certified Practitioner", by: "PortSwigger", url: "https://portswigger.net/web-security/certification", level: mid, note: "Cheap, practical and well respected." }
  - { name: "OffSec Web Assessor (OSWA)", by: "OffSec", url: "https://www.offsec.com/courses/web-200/", level: mid, note: "Hands-on web application testing." }
  - { name: "GIAC Web Application Penetration Tester (GWAPT)", by: "GIAC", url: "https://www.giac.org/certifications/web-application-penetration-tester-gwapt/", level: mid, note: "Often employer-funded." }
  - { name: "OffSec Web Expert (OSWE)", by: "OffSec", url: "https://www.offsec.com/courses/web-300/", level: advanced, note: "White-box testing: find bugs by reading source code." }
  - { name: "CSSLP", by: "ISC2", url: "https://www.isc2.org/certifications/csslp", level: advanced, note: "Secure software lifecycle, for senior and architect roles." }

resources:
  - { name: "Web Security Academy", by: "PortSwigger", url: "https://portswigger.net/web-security", type: practice, cost: free }
  - { name: "OWASP Juice Shop", by: "OWASP Foundation", url: "https://owasp.org/www-project-juice-shop/", type: practice, cost: free }
  - { name: "OWASP Cheat Sheet Series", by: "OWASP Foundation", url: "https://cheatsheetseries.owasp.org/", type: docs, cost: free }
  - { name: "OWASP Web Security Testing Guide", by: "OWASP Foundation", url: "https://owasp.org/www-project-web-security-testing-guide/", type: docs, cost: free }
  - { name: "OWASP crAPI (vulnerable API)", by: "OWASP Foundation", url: "https://github.com/OWASP/crAPI", type: practice, cost: free }
  - { name: "DVWA (Damn Vulnerable Web Application)", by: "Robin Wood and contributors", url: "https://github.com/digininja/DVWA", type: practice, cost: free }
  - { name: "Developing Secure Software (LFD121)", by: "OpenSSF and the Linux Foundation", url: "https://openssf.org/training/courses/", type: course, cost: free }
  - { name: "Threat Modeling Manifesto", by: "Threat Modeling Manifesto working group", url: "https://www.threatmodelingmanifesto.org/", type: docs, cost: free }
  - { name: "6.858 Computer Systems Security", by: "MIT OpenCourseWare", url: "https://ocw.mit.edu/courses/6-858-computer-systems-security-fall-2014/", type: course, cost: free }
  - { name: "Designing Secure Software", by: "Loren Kohnfelder (No Starch Press)", url: "https://nostarch.com/designing-secure-software", type: book, cost: paid }
  - { name: "Hacking APIs", by: "Corey Ball (No Starch Press)", url: "https://nostarch.com/hacking-apis", type: book, cost: paid }
  - { name: "API Security in Action", by: "Neil Madden (Manning)", url: "https://www.manning.com/books/api-security-in-action", type: book, cost: paid }

frameworks: [owasp-top10, owasp-api, asvs, samm, ssdf, slsa, cwe, cve, cvss, owasp-genai]

career:
  - { title: "Developer, QA engineer or junior security analyst", years: "0–2 years" }
  - { title: "Application security engineer or web pentester", years: "2–5 years" }
  - { title: "Senior AppSec or product security engineer", years: "5–8 years" }
  - { title: "AppSec architect or AppSec lead", years: "8+ years" }
  - { title: "Head of product security", years: "10+ years" }

related:
  - { to: cloud, why: "Applications now run in the cloud; secure both together." }
  - { to: iam, why: "Authentication and authorisation are the hardest parts of most apps." }
  - { to: devsecops, why: "Automate security in the build and deploy pipeline." }
  - { to: supplychain, why: "Protect the code and packages you depend on." }
  - { name: "Bug Bounty and Coordinated Disclosure", why: "Test real systems, legally, through official programmes." }
  - { to: llmsec, why: "Secure apps that call LLMs and AI agents." }
