  - { name: "Advanced in AI Audit (AAIA)", by: "ISACA", url: "https://www.isaca.org/credentialing/aaia", level: advanced, note: "For auditors who already hold CISA or similar." }
  - { ref: cism, note: "Security management foundation that AI governance builds on." }

