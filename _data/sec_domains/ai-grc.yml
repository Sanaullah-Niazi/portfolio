  - { title: "AI governance analyst", years: "2–4 years" }
  - { title: "AI risk and compliance specialist or AI auditor", years: "4–7 years" }
  - { title: "Responsible AI lead or head of AI governance", years: "7–10 years" }
  - { title: "Chief AI officer", years: "10+ years" }

