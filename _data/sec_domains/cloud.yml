# Security roadmap: Cloud Security. Shown at /roadmaps/security/cloud/.
# Field guide: see the top of secops.yml.

id: cloud
category: core
icon: cloud
entry: intermediate
legal: true
title: "Cloud Security"
summary: "Secure what organisations build and run on AWS, Microsoft Azure and Google Cloud, from accounts and permissions to containers and data."
keywords: "AWS Azure GCP Kubernetes CSPM CNAPP IAM misconfiguration Terraform containers serverless"

overview:
  - "Cloud security protects systems and data that run on cloud platforms. Under the shared responsibility model the provider secures the physical data centres and the platform, and the customer secures how they use it: identities, configuration, networks, data and workloads."
  - "Most cloud incidents come from customer-side mistakes: public storage buckets, leaked access keys, over-privileged roles and unpatched workloads. The job is to prevent those through good design and guardrails, find them quickly when they happen, and respond to attacks in cloud environments."
why: "Most new systems are built in the cloud, and attackers follow. Cloud skills are among the most requested in security job ads, and they combine well with almost every other security domain."
roles:
  - { title: "Cloud security analyst", level: entry, what: "Reviews cloud posture findings and fixes misconfigurations." }
  - { title: "Cloud security engineer", level: mid, what: "Builds guardrails, logging, IAM and detection for cloud accounts." }
  - { title: "DevSecOps / platform security engineer", level: mid, what: "Secures infrastructure as code, pipelines and Kubernetes." }
  - { title: "Cloud incident responder", level: senior, what: "Investigates and contains attacks in cloud environments." }
  - { title: "Cloud security architect", level: senior, what: "Designs secure landing zones and multi-cloud architectures." }
  - { title: "Head of cloud security", level: lead, what: "Owns cloud security strategy across the organisation." }

prereqs:
  - "Linux administration and networking basics (subnets, routing, firewalls, DNS)."
  - "Hands-on use of at least one cloud: creating VMs, storage and networks."
  - "Scripting in Python or Bash, and reading JSON and YAML."
  - "Security basics, ideally the Security Operations or Network Security roadmap's beginner stage."
prereq_paths: [foundations, cloud-devops]

stages:
  - level: beginner
    title: "Cloud fundamentals and the shared responsibility model"
    months: "2–3"
    topics:
      - id: shared-responsibility
        title: "Shared responsibility model"
        text: "The provider secures the data centres and the platform; you secure how you use it. Where the line falls depends on whether you use IaaS, PaaS or SaaS."
        res:
          - { name: "Shared responsibility model", by: "Amazon Web Services", url: "https://aws.amazon.com/compliance/shared-responsibility-model/", type: docs, cost: free }
          - { name: "Shared responsibility in the cloud", by: "Microsoft Learn", url: "https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility", type: docs, cost: free }
      - id: service-models
        title: "Cloud service models"
        text: "IaaS gives you virtual machines, PaaS gives you managed services such as databases, and SaaS gives you finished apps. Each moves more of the security work to the provider."
        res:
          - { name: "The NIST Definition of Cloud Computing (SP 800-145)", by: "NIST", url: "https://csrc.nist.gov/pubs/sp/800/145/final", type: docs, cost: free }
      - id: accounts
        title: "Accounts, subscriptions and projects"
        text: "Cloud resources live in accounts (AWS), subscriptions (Azure) or projects (Google Cloud). Separate accounts are the strongest boundary you have, so use them for each environment."
        res:
          - { name: "Organizing your AWS environment using multiple accounts", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/organizing-your-aws-environment.html", type: docs, cost: free }
      - id: cloud-iam-basics
        title: "Cloud IAM basics"
        text: "Almost every cloud breach involves identity: leaked keys, over-privileged roles, or a missing MFA. Learn users, roles, policies and how to read exactly what a policy allows."
        res:
          - { name: "AWS IAM user guide", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html", type: docs, cost: free }
          - { name: "flAWS challenge", by: "Scott Piper", url: "http://flaws.cloud/", type: practice, cost: free }
      - id: storage-security
        title: "Storage security"
        text: "Public storage buckets have leaked billions of records. Learn block public access settings, bucket policies, encryption and access logging."
        res:
          - { name: "Security best practices for Amazon S3", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-best-practices.html", type: docs, cost: free }
      - id: cloud-networks
        title: "Virtual networks and security groups"
        text: "VPCs, subnets and security groups are the cloud's network controls. Keep databases in private subnets and never open management ports to the whole internet."
        res:
          - { name: "Amazon VPC user guide", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html", type: docs, cost: free }
      - id: kms
        title: "Encryption and key management"
        text: "Cloud key management services encrypt data with keys you control and log every use. Learn the difference between provider-managed and customer-managed keys."
        res:
          - { name: "AWS Key Management Service developer guide", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/kms/latest/developerguide/overview.html", type: docs, cost: free }
      - id: audit-logging
        title: "Audit logging"
        text: "CloudTrail and the Azure Activity Log record every management action. Turn them on in every account and region, and send them somewhere attackers cannot delete them."
        res:
          - { name: "AWS CloudTrail user guide", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html", type: docs, cost: free }
          - { name: "Azure Monitor activity log", by: "Microsoft Learn", url: "https://learn.microsoft.com/en-us/azure/azure-monitor/platform/activity-log", type: docs, cost: free }
    skills:
      - "Set up a cloud account securely: MFA on the root user, no root access keys, budget alerts."
      - "Create users, roles and policies that follow least privilege."
      - "Find a public storage bucket and lock it down."
      - "Turn on audit logging and read the events it records."
    labs:
      - "Open a free-tier AWS or Azure account, secure it with the provider's security checklist, and set a billing alarm before anything else."
      - "Play flAWS and flAWS2, free challenges that teach common AWS mistakes."
      - "Run Prowler or ScoutSuite against your own account and fix every high finding."
    done:
      - "Explain who is responsible for what in IaaS, PaaS and SaaS."
      - "Read an IAM policy and say exactly what it allows."
      - "Show your own cloud account passing a CIS benchmark scan with no critical findings."

  - level: intermediate
    title: "Guardrails, infrastructure as code and detection"
    months: "4–6"
    topics:
      - id: landing-zones
        title: "Landing zones and multi-account design"
        text: "A landing zone is a ready-made, secure set of accounts, networks, logging and guardrails that every new workload starts from."
        res:
          - { name: "AWS Security Reference Architecture", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/security-reference-architecture/welcome.html", type: docs, cost: free }
      - id: org-policies
        title: "Organisation policies"
        text: "Service control policies and Azure Policy block risky actions across every account, such as turning off logging or creating resources in unapproved regions."
        res:
          - { name: "Service control policies", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html", type: docs, cost: free }
          - { name: "Azure Policy overview", by: "Microsoft Learn", url: "https://learn.microsoft.com/en-us/azure/governance/policy/overview", type: docs, cost: free }
      - id: iac
        title: "Infrastructure as code"
        text: "Define cloud resources in Terraform or OpenTofu so every change is reviewed, versioned and repeatable. Click-ops is where most misconfigurations start."
        res:
          - { name: "Terraform documentation", by: "HashiCorp", url: "https://developer.hashicorp.com/terraform", type: docs, cost: free }
          - { name: "OpenTofu documentation", by: "OpenTofu", url: "https://opentofu.org/docs/", type: docs, cost: free }
      - id: iac-scanning
        title: "IaC scanning"
        text: "Scanners such as Checkov and Trivy check infrastructure code for mistakes before it is deployed, right in the pull request."
        res:
          - { name: "Checkov", by: "Prisma Cloud", url: "https://www.checkov.io/", type: docs, cost: free }
          - { name: "Trivy", by: "Aqua Security", url: "https://trivy.dev/", type: docs, cost: free }
      - id: cspm
        title: "Cloud security posture management"
        text: "CSPM tools scan running cloud accounts against benchmarks and flag misconfigurations. Prowler is a free way to see what they do."
        res:
          - { name: "Prowler", by: "Prowler", url: "https://github.com/prowler-cloud/prowler", type: practice, cost: free }
          - { name: "CIS Benchmarks", by: "Center for Internet Security", url: "https://www.cisecurity.org/cis-benchmarks", type: docs, cost: free }
      - id: cloud-secrets
        title: "Secrets management"
        text: "Use the provider's secrets manager or Vault instead of keys in code, and prefer roles and federation over long-lived access keys."
        res:
          - { name: "AWS Secrets Manager user guide", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html", type: docs, cost: free }
      - id: cloud-detection
        title: "Cloud-native threat detection"
        text: "GuardDuty, Defender for Cloud and Google Security Command Center detect threats from cloud logs. Learn what they catch and what you still need to build yourself."
        res:
          - { name: "Amazon GuardDuty user guide", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html", type: docs, cost: free }
          - { name: "Microsoft Defender for Cloud", by: "Microsoft Learn", url: "https://learn.microsoft.com/en-us/azure/defender-for-cloud/", type: docs, cost: free }
      - id: cloud-attacks
        title: "Cloud attack techniques"
        text: "Know how attackers move in the cloud: stealing keys, escalating IAM privileges, abusing metadata services and persisting with new roles. Practise in your own account only."
        res:
          - { name: "Hacking the Cloud", by: "Community project", url: "https://hackingthe.cloud/", type: docs, cost: free }
          - { name: "CloudGoat", by: "Rhino Security Labs", url: "https://github.com/RhinoSecurityLabs/cloudgoat", type: practice, cost: free }
          - { name: "MITRE ATT&CK Cloud Matrix", by: "MITRE", url: "https://attack.mitre.org/matrices/enterprise/cloud/", type: docs, cost: free }
    skills:
      - "Build cloud infrastructure only through code, and scan it for mistakes before deployment."
      - "Write preventive guardrails that block risky actions across all accounts."
      - "Investigate a cloud alert using audit logs."
      - "Understand how attackers escalate privileges in cloud IAM."
    labs:
      - "Write Terraform for a small web app (network, VM or container, database) and scan it with Checkov and Trivy in a GitHub Actions pipeline."
      - "Deploy CloudGoat in your own AWS account and work through its vulnerable-by-design scenarios. Tear it down afterwards."
      - "Use Stratus Red Team to simulate attacks in your account and check what your logging and detection catch."
    done:
      - "Show a repository where every cloud resource is defined in code and checked automatically."
      - "Explain three ways to escalate privileges in AWS or Azure, and how to prevent each."
      - "Write a short incident report from CloudTrail or Azure activity logs."

  - level: advanced
    title: "Containers, Kubernetes and cloud incident response"
    months: "6–9"
    topics:
      - id: image-security
        title: "Container image security"
        text: "Build small images from trusted bases, scan them for vulnerabilities, and sign them so only approved images run."
        res:
          - { name: "Trivy", by: "Aqua Security", url: "https://trivy.dev/", type: practice, cost: free }
          - { name: "Sigstore", by: "OpenSSF", url: "https://www.sigstore.dev/", type: docs, cost: free }
      - id: k8s-security
        title: "Kubernetes security"
        text: "Secure Kubernetes with RBAC, admission policies, network policies and Pod Security Standards. Misconfigured clusters are a common way in."
        res:
          - { name: "Kubernetes security documentation", by: "The Kubernetes Authors", url: "https://kubernetes.io/docs/concepts/security/", type: docs, cost: free }
          - { name: "Kubernetes Goat", by: "Madhu Akula", url: "https://madhuakula.com/kubernetes-goat/", type: practice, cost: free }
          - { name: "Kubernetes Hardening Guide", by: "NSA and CISA", url: "https://media.defense.gov/2022/Aug/29/2003066362/-1/-1/0/CTR_KUBERNETES_HARDENING_GUIDANCE_1.2_20220829.PDF", type: docs, cost: free }
      - id: runtime-security
        title: "Runtime security"
        text: "Runtime tools watch what containers actually do, such as a shell starting in a web server container, and alert or block it."
        res:
          - { name: "Falco", by: "The Falco Authors", url: "https://falco.org/", type: docs, cost: free }
      - id: serverless
        title: "Serverless security"
        optional: true
        text: "With serverless functions there is no server to patch, but permissions, event inputs and dependencies still need care."
        res:
          - { name: "Security in AWS Lambda", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/lambda/latest/dg/lambda-security.html", type: docs, cost: free }
      - id: cloud-workload-identity
        title: "Workload identity"
        text: "Workloads should get short-lived credentials from the platform, not stored keys. Learn instance roles, managed identities and Kubernetes service account federation."
        res:
          - { name: "Managed identities for Azure resources", by: "Microsoft Learn", url: "https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview", type: docs, cost: free }
      - id: dspm
        title: "Data security in the cloud"
        text: "Find where sensitive data lives across cloud services, who can reach it, and whether it is encrypted and logged."
        res:
          - { name: "Amazon Macie user guide", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html", type: docs, cost: free }
      - id: cloud-ir
        title: "Cloud forensics and incident response"
        text: "Cloud incidents need different steps: snapshot disks, preserve logs, revoke sessions and keys, and contain with policies instead of pulling cables."
        res:
          - { name: "AWS Security Incident Response Guide", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/security-ir/latest/userguide/introduction.html", type: docs, cost: free }
          - { name: "Stratus Red Team", by: "Datadog", url: "https://github.com/DataDog/stratus-red-team", type: practice, cost: free }
      - id: multi-cloud
        title: "Multi-cloud security"
        optional: true
        text: "Running on several clouds multiplies the policy languages and logs to master. Standardise controls and tooling where you can."
        res:
          - { name: "Cloud Controls Matrix", by: "Cloud Security Alliance", url: "https://cloudsecurityalliance.org/research/cloud-controls-matrix", type: docs, cost: free }
    skills:
      - "Harden a Kubernetes cluster and check it against the CIS Kubernetes Benchmark."
      - "Enforce policies at admission time with Kyverno or OPA Gatekeeper."
      - "Detect suspicious container behaviour at runtime with Falco."
      - "Respond to a compromised cloud workload: preserve evidence, contain, recover."
    labs:
      - "Build a local Kubernetes cluster with kind or minikube, run Kubernetes Goat, and fix each scenario after exploiting it in your own lab."
      - "Add Kyverno policies that block privileged containers and images without a signature."
      - "Write a cloud incident response playbook for a leaked access key, and test it in your account."
    done:
      - "Show a hardened cluster with admission policies, network policies and runtime alerts."
      - "Run a full response to a simulated cloud compromise and write the post-incident review."

  - level: expert
    title: "Cloud security architecture and leadership"
    months: "12–24"
    topics:
      - id: cloud-arch
        title: "Enterprise cloud security architecture"
        text: "Design secure landing zones, networks, identity and logging for a whole organisation across several clouds."
        res:
          - { name: "AWS Well-Architected Security Pillar", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html", type: docs, cost: free }
          - { name: "Microsoft Cloud Security Benchmark", by: "Microsoft Learn", url: "https://learn.microsoft.com/en-us/security/benchmark/azure/introduction", type: docs, cost: free }
      - id: ai-cloud
        title: "Security for AI services in the cloud"
        text: "Cloud AI services bring new data flows, model endpoints and agent permissions. Apply the same identity, network and logging controls, plus AI-specific ones."
        res:
          - { name: "OWASP GenAI Security Project", by: "OWASP Foundation", url: "https://genai.owasp.org/", type: docs, cost: free }
          - { name: "MITRE ATLAS", by: "MITRE", url: "https://atlas.mitre.org/", type: docs, cost: free }
      - id: cloud-programme
        title: "Cloud security programmes and metrics"
        text: "Run cloud security as a programme: clear ownership, guardrails by default, and metrics such as time to fix critical findings."
        res:
          - { name: "Security Guidance for Critical Areas of Focus in Cloud Computing", by: "Cloud Security Alliance", url: "https://cloudsecurityalliance.org/research/guidance", type: docs, cost: free }
      - id: cloud-compliance
        title: "Compliance in the cloud"
        text: "Map cloud controls to ISO/IEC 27001, SOC 2 and PCI DSS, and collect the evidence automatically from configuration and logs."
        res:
          - { name: "Cloud Controls Matrix", by: "Cloud Security Alliance", url: "https://cloudsecurityalliance.org/research/cloud-controls-matrix", type: docs, cost: free }
      - id: sovereign-cloud
        title: "Sovereign and regulated clouds"
        optional: true
        text: "Some data must stay in a country or under local control. Learn data residency options, sovereign cloud offerings and what they really guarantee."
        res:
          - { name: "General Data Protection Regulation", by: "European Union", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj", type: docs, cost: free }
      - id: cloud-tradeoffs
        title: "Cost and risk trade-offs"
        optional: true
        text: "Security services and logs cost money in the cloud. Decide what to turn on everywhere, what only for critical workloads, and justify it in terms of risk."
        res:
          - { name: "AWS Well-Architected Security Pillar", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html", type: docs, cost: free }
    skills:
      - "Design secure landing zones for a large organisation across several clouds."
      - "Build a cloud security programme with clear ownership, guardrails and metrics."
      - "Map cloud controls to compliance requirements and evidence them automatically."
    labs:
      - "Write a cloud security reference architecture and threat model for a regulated workload, such as payments or health data."
      - "Publish research, tooling or a detailed write-up on a cloud attack or defence technique."
    done:
      - "Defend a cloud architecture to auditors, engineers and leadership."
      - "Show how your design limits the damage of a stolen admin credential."

tools:
  - { name: "Prowler", url: "https://github.com/prowler-cloud/prowler", kind: oss, what: "Security checks and CIS benchmark scans for AWS, Azure, Google Cloud and Kubernetes." }
  - { name: "ScoutSuite", url: "https://github.com/nccgroup/ScoutSuite", kind: oss, what: "Multi-cloud security auditing tool." }
  - { name: "Checkov", url: "https://www.checkov.io/", kind: oss, what: "Scans infrastructure as code for misconfigurations." }
  - { name: "Trivy", url: "https://trivy.dev/", kind: oss, what: "Scans container images, code and IaC for vulnerabilities and misconfigurations." }
  - { name: "Terraform", url: "https://developer.hashicorp.com/terraform", kind: community, what: "The most widely used infrastructure as code tool." }
  - { name: "OpenTofu", url: "https://opentofu.org/", kind: oss, what: "Open-source fork of Terraform." }
  - { name: "Cloud Custodian", url: "https://cloudcustodian.io/", kind: oss, what: "Rules engine to find and fix cloud resources that break policy." }
  - { name: "Falco", url: "https://falco.org/", kind: oss, what: "Runtime threat detection for containers and Kubernetes." }
  - { name: "Kyverno", url: "https://kyverno.io/", kind: oss, what: "Kubernetes policy engine." }
  - { name: "Open Policy Agent", url: "https://www.openpolicyagent.org/", kind: oss, what: "General-purpose policy engine, used with Kubernetes and IaC." }
  - { name: "kube-bench", url: "https://github.com/aquasecurity/kube-bench", kind: oss, what: "Checks a Kubernetes cluster against the CIS benchmark." }
  - { name: "CloudGoat", url: "https://github.com/RhinoSecurityLabs/cloudgoat", kind: oss, what: "Vulnerable-by-design AWS environments to practise in your own account." }
  - { name: "Stratus Red Team", url: "https://github.com/DataDog/stratus-red-team", kind: oss, what: "Simulates cloud attack techniques to test your detections." }
  - { name: "Microsoft Defender for Cloud", url: "https://learn.microsoft.com/en-us/azure/defender-for-cloud/", kind: paid, what: "Microsoft's cloud security posture and workload protection service." }

certs:
  - { ref: aws-ccp, note: "Optional first step on AWS. Pick one cloud and stay with it." }
  - { ref: az900, note: "The same for Azure." }
  - { ref: aws-saa, note: "Proves you can build on AWS, which you need before securing it." }
  - { ref: az104, note: "The Azure equivalent." }
  - { name: "Certificate of Cloud Security Knowledge (CCSK)", by: "Cloud Security Alliance", url: "https://cloudsecurityalliance.org/education/ccsk", level: mid, note: "Vendor-neutral cloud security knowledge." }
  - { ref: aws-sec, note: "For AWS security roles." }
  - { ref: sc500, note: "For Azure security roles." }
  - { name: "Professional Cloud Security Engineer", by: "Google Cloud", url: "https://cloud.google.com/learn/certification/cloud-security-engineer", level: advanced, note: "For Google Cloud security roles." }
  - { name: "Certified Kubernetes Security Specialist (CKS)", by: "The Linux Foundation", url: "https://training.linuxfoundation.org/certification/certified-kubernetes-security-specialist/", level: advanced, note: "Hands-on Kubernetes security; needs CKA first." }
  - { name: "CCSP", by: "ISC2", url: "https://www.isc2.org/certifications/ccsp", level: advanced, note: "For cloud security architects with several years of experience." }

resources:
  - { name: "AWS Skill Builder", by: "Amazon Web Services", url: "https://skillbuilder.aws/", type: course, cost: free }
  - { name: "Microsoft Learn: Azure security training", by: "Microsoft", url: "https://learn.microsoft.com/en-us/training/azure/", type: course, cost: free }
  - { name: "Google Cloud Skills Boost", by: "Google Cloud", url: "https://www.cloudskillsboost.google/", type: course, cost: free }
  - { name: "flAWS challenge", by: "Scott Piper", url: "http://flaws.cloud/", type: practice, cost: free }
  - { name: "flAWS2 challenge", by: "Scott Piper", url: "http://flaws2.cloud/", type: practice, cost: free }
  - { name: "Hacking the Cloud", by: "Community project", url: "https://hackingthe.cloud/", type: docs, cost: free }
  - { name: "Kubernetes Goat", by: "Madhu Akula", url: "https://madhuakula.com/kubernetes-goat/", type: practice, cost: free }
  - { name: "Kubernetes security documentation", by: "The Kubernetes Authors", url: "https://kubernetes.io/docs/concepts/security/", type: docs, cost: free }
  - { name: "Security Guidance for Critical Areas of Focus in Cloud Computing", by: "Cloud Security Alliance", url: "https://cloudsecurityalliance.org/research/guidance", type: docs, cost: free }
  - { name: "AWS Security Reference Architecture", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/security-reference-architecture/welcome.html", type: docs, cost: free }
  - { name: "Pwned Labs", by: "Pwned Labs", url: "https://pwnedlabs.io/", type: practice, cost: paid }

frameworks: [csa-ccm, aws-wa-sec, cis-benchmarks, nist-csf, iso27001, soc2, attack, zero-trust]

career:
  - { title: "Cloud or systems engineer, or SOC analyst", years: "0–3 years" }
  - { title: "Cloud security engineer", years: "2–5 years" }
  - { title: "Senior cloud security engineer or cloud incident responder", years: "5–8 years" }
  - { title: "Cloud security architect", years: "8+ years" }
  - { title: "Head of cloud security or CISO", years: "10+ years" }

related:
  - { to: iam, why: "Cloud IAM is the heart of cloud security." }
  - { to: appsec, why: "Secure the applications that run in the cloud." }
  - { name: "Container Security", why: "Go deeper into images, runtimes and Kubernetes." }
  - { to: devsecops, why: "Build security into the pipelines that deploy to the cloud." }
  - { name: "Cloud Security Assessment", why: "Test cloud environments as an authorised assessor." }
  - { to: ai-supply, why: "Secure the cloud platforms AI models are trained and served on." }
