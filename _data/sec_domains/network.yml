# Security roadmap: Network Security. Shown at /roadmaps/security/network/.
# Field guide: see the top of secops.yml.

id: network
category: core
icon: globe
entry: beginner
legal: true
title: "Network Security"
summary: "Design, build and watch the networks everything else runs on, so attackers cannot get in easily or move around once they do."
keywords: "firewall VPN IDS IPS segmentation zero trust packet capture Wireshark routing switching"

overview:
  - "Network security protects the connections between systems: the routers, switches, firewalls, VPNs, wireless access points and the traffic that flows through them."
  - "It covers prevention (segmentation, firewall rules, secure remote access), detection (intrusion detection and network security monitoring) and design (zero trust architectures where no network location is trusted by default)."
why: "Almost every attack crosses a network at some point: to get in, to move between machines, and to send stolen data out. Good network design limits how far an attacker can go, and network logs often show an intrusion that endpoints missed."
roles:
  - { title: "Network administrator / junior network security engineer", level: entry, what: "Configures switches, firewalls and VPNs and keeps them patched." }
  - { title: "Network security engineer", level: mid, what: "Designs and runs firewalls, segmentation, remote access and IDS." }
  - { title: "Network security monitoring analyst", level: mid, what: "Watches network traffic and investigates suspicious connections." }
  - { title: "Senior network security engineer / firewall architect", level: senior, what: "Owns the network security design across sites and clouds." }
  - { title: "Network security architect / zero trust lead", level: lead, what: "Sets the long-term architecture, standards and vendor choices." }

prereqs:
  - "The OSI and TCP/IP models, and what happens at each layer."
  - "IP addressing and subnetting (IPv4 and the basics of IPv6)."
  - "Common protocols: DNS, DHCP, HTTP and HTTPS, SSH, SMTP."
  - "The Linux command line, enough to run and read the output of networking tools."
prereq_paths: [foundations, cybersecurity]

stages:
  - level: beginner
    title: "How networks work, and how to see the traffic"
    months: "3–4"
    topics:
      - id: tcp-ip
        title: "TCP/IP and subnetting"
        text: "Everything in network security builds on how IP addressing, TCP and UDP work. Learn the layers, the TCP handshake, and how to split an address range into subnets by hand."
        res:
          - { name: "Computer Networks: A Systems Approach", by: "Larry Peterson and Bruce Davie", url: "https://book.systemsapproach.org/", type: book, cost: free }
          - { name: "Network+ video course", by: "Professor Messer", url: "https://www.professormesser.com/", type: video, cost: free }
      - id: switching-vlans
        title: "Switching and VLANs"
        text: "Switches connect devices inside a network, and VLANs split one physical network into separate ones. VLANs are the first tool for keeping guests, staff and servers apart."
        res:
          - { name: "Cisco Networking Academy courses", by: "Cisco", url: "https://www.netacad.com/", type: course, cost: free }
          - { name: "Cisco Packet Tracer", by: "Cisco", url: "https://www.netacad.com/cisco-packet-tracer", type: practice, cost: free }
      - id: routing
        title: "Routing basics"
        text: "Routers move traffic between networks using routing tables and protocols such as OSPF and BGP. Understand how a packet finds its way, and why a wrong route can be a security problem."
        res:
          - { name: "Computer Networks: A Systems Approach", by: "Larry Peterson and Bruce Davie", url: "https://book.systemsapproach.org/", type: book, cost: free }
          - { name: "GNS3", by: "GNS3", url: "https://www.gns3.com/", type: practice, cost: free }
      - id: dns-dhcp
        title: "DNS and DHCP"
        text: "DHCP hands out addresses and DNS turns names into addresses. Both are abused by attackers, for spoofing, tunnelling and command-and-control, so know what normal looks like."
        res:
          - { name: "Computer Networks: A Systems Approach", by: "Larry Peterson and Bruce Davie", url: "https://book.systemsapproach.org/", type: book, cost: free }
      - id: packet-capture
        title: "Packet capture"
        text: "Capturing traffic lets you see exactly what crossed the wire. Learn Wireshark display filters, following streams, and capturing on the command line with tcpdump."
        res:
          - { name: "Wireshark documentation", by: "Wireshark Foundation", url: "https://www.wireshark.org/docs/", type: docs, cost: free }
          - { name: "tcpdump", by: "The Tcpdump Group", url: "https://www.tcpdump.org/", type: docs, cost: free }
          - { name: "Practical Packet Analysis, 3rd edition", by: "Chris Sanders (No Starch Press)", url: "https://nostarch.com/packetanalysis3", type: book, cost: paid }
      - id: ports-services
        title: "Common ports and services"
        text: "Know the usual ports for SSH, RDP, SMB, HTTP, DNS and mail, what each service does, and which ones should never face the internet."
        res:
          - { name: "Nmap Network Scanning (online book)", by: "Gordon Lyon", url: "https://nmap.org/book/", type: book, cost: free }
      - id: firewall-rules
        title: "Basic firewall rules"
        text: "Firewall rules decide which traffic is allowed. Learn default deny, rule order, and how to write rules that allow only what a service really needs."
        res:
          - { name: "OPNsense documentation", by: "Deciso", url: "https://docs.opnsense.org/", type: docs, cost: free }
          - { name: "pfSense CE", by: "Netgate", url: "https://www.pfsense.org/", type: practice, cost: free }
      - id: scanning
        title: "Network scanning"
        text: "Scanning finds which hosts are up and which services they run. Defenders scan their own networks to find what they did not know about. Scan only networks you own or may test."
        res:
          - { name: "Nmap", by: "Gordon Lyon", url: "https://nmap.org/", type: practice, cost: free }
          - { name: "Nmap Network Scanning (online book)", by: "Gordon Lyon", url: "https://nmap.org/book/", type: book, cost: free }
    skills:
      - "Subnet a network and plan addresses for a small office."
      - "Capture traffic with Wireshark or tcpdump and follow a TCP conversation."
      - "Scan your own network with Nmap and explain each open port."
      - "Write simple allow and deny firewall rules."
    labs:
      - "Build a virtual network in GNS3 or Cisco Packet Tracer with two VLANs and a router between them."
      - "Capture your own browsing with Wireshark and find the DNS lookup, the TLS handshake and the HTTP request."
      - "Scan your home lab with Nmap and write a short inventory of every device and service."
    done:
      - "Draw your home network with every device, address and connection."
      - "Explain what happens, packet by packet, when you open a website."
      - "Read a packet capture and point out the protocols and any plain-text passwords."

  - level: intermediate
    title: "Firewalls, segmentation, VPNs and detection"
    months: "4–6"
    topics:
      - id: stateful-firewalls
        title: "Stateful firewalls"
        text: "A stateful firewall tracks connections, so replies are allowed back in without opening the door to everything. Learn NAT, zones and logging on a real open-source firewall."
        res:
          - { name: "OPNsense documentation", by: "Deciso", url: "https://docs.opnsense.org/", type: docs, cost: free }
      - id: segmentation
        title: "Network segmentation and DMZs"
        text: "Segmentation splits a network into zones so one compromised machine cannot reach everything. Public-facing servers go in a DMZ, away from internal systems."
        res:
          - { name: "CIS Critical Security Controls", by: "Center for Internet Security", url: "https://www.cisecurity.org/controls", type: docs, cost: free }
      - id: vpns
        title: "VPNs"
        text: "VPNs encrypt traffic between sites or between a remote user and the office. Learn how IPsec, WireGuard and TLS VPNs differ, and why VPN gateways are a favourite target."
        res:
          - { name: "WireGuard", by: "Jason A. Donenfeld", url: "https://www.wireguard.com/", type: docs, cost: free }
          - { name: "CISA Known Exploited Vulnerabilities catalog", by: "CISA", url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog", type: docs, cost: free }
      - id: ids-ips
        title: "IDS and IPS"
        text: "Intrusion detection systems alert on suspicious traffic; prevention systems also block it. Learn how signatures work, how to tune them, and how to avoid blocking real users."
        res:
          - { name: "Suricata documentation", by: "OISF", url: "https://docs.suricata.io/", type: docs, cost: free }
          - { name: "Snort", by: "Cisco", url: "https://www.snort.org/", type: docs, cost: free }
      - id: net-nsm
        title: "Network security monitoring"
        text: "Monitoring means collecting connection logs, alerts and some full packets, then using them to spot and investigate attacks. Zeek is the standard open-source tool for the logs."
        res:
          - { name: "Zeek documentation", by: "Zeek Project", url: "https://docs.zeek.org/", type: docs, cost: free }
          - { name: "The Practice of Network Security Monitoring", by: "Richard Bejtlich (No Starch Press)", url: "https://nostarch.com/nsm", type: book, cost: paid }
      - id: wireless
        title: "Wireless security"
        optional: true
        text: "Wi-Fi needs strong encryption (WPA3) and, in companies, per-user sign-in with 802.1X. Learn the common wireless attacks and how to stop rogue access points."
        res:
          - { name: "Wi-Fi security", by: "Wi-Fi Alliance", url: "https://www.wi-fi.org/discover-wi-fi/security", type: docs, cost: free }
      - id: dns-filtering
        title: "Proxy and DNS filtering"
        text: "Web proxies and DNS filtering block known-bad sites and log where users go. Know their limits: encrypted DNS and direct IP connections can get around them."
        res:
          - { name: "Protective DNS", by: "CISA", url: "https://www.cisa.gov/resources-tools/services/protective-domain-name-system-resolver", type: docs, cost: free }
      - id: net-attacks
        title: "Common network attacks"
        text: "ARP spoofing, DNS poisoning, rogue DHCP and man-in-the-middle attacks all abuse trust inside a network. Try them in your own lab and learn the switch features that stop them."
        res:
          - { name: "MITRE ATT&CK: Adversary-in-the-Middle", by: "MITRE", url: "https://attack.mitre.org/techniques/T1557/", type: docs, cost: free }
    skills:
      - "Design and configure a segmented network with a firewall between zones."
      - "Set up a site-to-site and a remote-access VPN."
      - "Deploy Suricata and Zeek and investigate their alerts and logs."
      - "Recognise scanning, brute force, beaconing and data exfiltration in traffic."
    labs:
      - "Build a pfSense or OPNsense firewall in a VM with LAN, DMZ and guest zones, and a WireGuard VPN for remote access."
      - "Add Suricata with community rules and Zeek, then generate test traffic from an attacker VM inside your own lab."
      - "Work through the packet capture exercises on Malware-Traffic-Analysis.net and write up each one."
    done:
      - "Explain why each firewall rule in your lab exists, and remove the ones that do not need to."
      - "Find the infected host and its command-and-control server in a packet capture."
      - "Show that a guest device in your lab cannot reach your servers."

  - level: advanced
    title: "Secure architecture and zero trust"
    months: "6–9"
    topics:
      - id: zero-trust
        title: "Zero trust architecture"
        text: "Zero trust drops the idea of a trusted internal network. Every request is checked for identity, device health and context, wherever it comes from."
        res:
          - { name: "Zero Trust Architecture (SP 800-207)", by: "NIST", url: "https://csrc.nist.gov/pubs/sp/800/207/final", type: docs, cost: free }
          - { name: "Zero Trust Maturity Model", by: "CISA", url: "https://www.cisa.gov/zero-trust-maturity-model", type: docs, cost: free }
      - id: nac
        title: "Network access control"
        text: "802.1X and NAC check a device and its user before it joins the network, and can put unknown devices in a quarantine VLAN."
        res:
          - { name: "FreeRADIUS documentation", by: "FreeRADIUS", url: "https://www.freeradius.org/documentation/", type: docs, cost: free }
      - id: microsegmentation
        title: "Microsegmentation"
        text: "Microsegmentation applies rules to individual workloads instead of whole subnets, so even two servers in the same zone only talk if they need to."
        res:
          - { name: "Zero Trust Architecture (SP 800-207)", by: "NIST", url: "https://csrc.nist.gov/pubs/sp/800/207/final", type: docs, cost: free }
      - id: sase
        title: "Secure web gateways and SASE"
        optional: true
        text: "SASE moves firewalling, web filtering and secure access into a cloud service close to users. Know what it replaces and where it fits next to existing networks."
        res:
          - { name: "Zero Trust Maturity Model", by: "CISA", url: "https://www.cisa.gov/zero-trust-maturity-model", type: docs, cost: free }
      - id: cloud-networking
        title: "Cloud networking"
        text: "Cloud networks use VPCs, subnets, security groups and route tables. The ideas are familiar, but mistakes such as an open security group are made in seconds and at scale."
        res:
          - { name: "Amazon VPC user guide", by: "Amazon Web Services", url: "https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html", type: docs, cost: free }
          - { name: "Azure network security groups", by: "Microsoft Learn", url: "https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview", type: docs, cost: free }
      - id: net-automation
        title: "Network automation"
        text: "Writing network configuration as code, reviewed and versioned in Git, stops drift and mistakes. Ansible is the usual starting point."
        res:
          - { name: "Ansible documentation", by: "Red Hat", url: "https://docs.ansible.com/", type: docs, cost: free }
      - id: ddos
        title: "DDoS protection"
        optional: true
        text: "Distributed denial-of-service attacks flood a service until it falls over. Learn the attack types, what can be absorbed on your side, and when you need a provider's help."
        res:
          - { name: "Understanding and Responding to DDoS Attacks", by: "CISA", url: "https://www.cisa.gov/resources-tools/resources/understanding-and-responding-distributed-denial-service-attacks", type: docs, cost: free }
      - id: encrypted-traffic
        title: "Encrypted traffic analysis"
        text: "Most traffic is encrypted, but its metadata still tells a lot. TLS fingerprints such as JA4, certificates and connection timing can reveal malware without decrypting anything."
        res:
          - { name: "JA4+ network fingerprinting", by: "FoxIO", url: "https://github.com/FoxIO-LLC/ja4", type: docs, cost: free }
          - { name: "Zeek documentation", by: "Zeek Project", url: "https://docs.zeek.org/", type: docs, cost: free }
    skills:
      - "Design a zero trust access model that checks identity and device health, not network location."
      - "Automate firewall and network configuration with code and version control."
      - "Secure cloud networks and connect them safely to on-premises networks."
      - "Hunt for threats in network data, including encrypted traffic metadata (JA4, certificates, SNI)."
    labs:
      - "Replace a VPN in your lab with identity-aware access using an open-source zero trust tool or a free tier of a commercial one."
      - "Write Ansible or Terraform code that builds your firewall rules, and review every change through a pull request."
      - "Build a small AWS or Azure network with public and private subnets, and test that only the intended paths work."
    done:
      - "Present a segmentation design for a 500-person company with on-premises and cloud systems."
      - "Show your network as code, with a change history and reviews."
      - "Explain how an attacker would move laterally in your design, and how you would detect it."

  - level: expert
    title: "Architecture leadership and research"
    months: "12–24"
    topics:
      - id: enterprise-net-arch
        title: "Enterprise network security architecture"
        text: "Design the network for a whole organisation: sites, clouds, remote users and partners, with clear zones, controls and monitoring points."
        res:
          - { name: "NIST Cybersecurity Framework 2.0", by: "NIST", url: "https://www.nist.gov/cyberframework", type: docs, cost: free }
      - id: monitoring-design
        title: "Large-scale monitoring design"
        text: "Decide where to place sensors, how much traffic to keep, and how to process it at 10 or 100 gigabits per second without losing what matters."
        res:
          - { name: "Arkime", by: "Arkime", url: "https://arkime.com/", type: docs, cost: free }
          - { name: "Security Onion documentation", by: "Security Onion Solutions", url: "https://docs.securityonion.net/", type: docs, cost: free }
      - id: protocol-research
        title: "Protocol security research"
        optional: true
        text: "Study how network protocols fail, test implementations in a lab, and report weaknesses responsibly to vendors and standards bodies."
        res:
          - { name: "Attacking Network Protocols", by: "James Forshaw (No Starch Press)", url: "https://nostarch.com/networkprotocols", type: book, cost: paid }
      - id: vendor-strategy
        title: "Standards and vendor strategy"
        text: "Set standards every team follows, and choose vendors on evidence: tests, references and how well they fit your architecture."
        res:
          - { name: "CIS Benchmarks", by: "Center for Internet Security", url: "https://www.cisecurity.org/cis-benchmarks", type: docs, cost: free }
      - id: ot-iot-segmentation
        title: "OT and IoT network segmentation"
        optional: true
        text: "Industrial and IoT devices are hard to patch, so separating them from the rest of the network is often the main defence. The Purdue model is the usual starting point."
        res:
          - { name: "Industrial control systems", by: "CISA", url: "https://www.cisa.gov/topics/industrial-control-systems", type: docs, cost: free }
      - id: pq-network
        title: "Post-quantum readiness in network protocols"
        optional: true
        text: "TLS, VPNs and SSH are moving to post-quantum key exchange. Learn what is changing, which devices will need upgrades, and how to plan the move."
        res:
          - { name: "Post-quantum cryptography", by: "NIST", url: "https://csrc.nist.gov/projects/post-quantum-cryptography", type: docs, cost: free }
    skills:
      - "Set network security standards for a large organisation and get teams to adopt them."
      - "Evaluate vendors and architectures on evidence, not marketing."
      - "Research protocol weaknesses and publish or report them responsibly."
    labs:
      - "Write a reference architecture for a multi-site organisation, including OT or IoT networks, and get it reviewed by peers."
      - "Contribute rules to Suricata or scripts to Zeek, or publish an analysis of a protocol."
    done:
      - "Defend a network security architecture to engineers, auditors and leadership."
      - "Plan a multi-year migration, for example from a flat network to zero trust, with milestones and risks."

tools:
  - { name: "Wireshark", url: "https://www.wireshark.org/", kind: oss, what: "The standard tool for capturing and analysing network traffic." }
  - { name: "tcpdump", url: "https://www.tcpdump.org/", kind: oss, what: "Command-line packet capture, available on almost every Unix system." }
  - { name: "Nmap", url: "https://nmap.org/", kind: oss, what: "Network discovery and port scanning." }
  - { name: "Zeek", url: "https://zeek.org/", kind: oss, what: "Network security monitoring that produces detailed connection logs." }
  - { name: "Suricata", url: "https://suricata.io/", kind: oss, what: "Intrusion detection and prevention engine." }
  - { name: "Snort", url: "https://www.snort.org/", kind: oss, what: "The original open-source intrusion detection system, now maintained by Cisco." }
  - { name: "pfSense CE", url: "https://www.pfsense.org/", kind: oss, what: "Open-source firewall and router." }
  - { name: "OPNsense", url: "https://opnsense.org/", kind: oss, what: "Open-source firewall and router, a fork of pfSense." }
  - { name: "WireGuard", url: "https://www.wireguard.com/", kind: oss, what: "A modern, simple and fast VPN." }
  - { name: "Arkime", url: "https://arkime.com/", kind: oss, what: "Full packet capture and search at scale." }
  - { name: "GNS3", url: "https://www.gns3.com/", kind: oss, what: "Network emulator for building virtual labs." }
  - { name: "Cisco Packet Tracer", url: "https://www.netacad.com/cisco-packet-tracer", kind: free, what: "Free network simulator from Cisco Networking Academy." }
  - { name: "Ansible", url: "https://docs.ansible.com/", kind: oss, what: "Automation for configuring network devices and servers as code." }

certs:
  - { name: "CompTIA Network+", by: "CompTIA", url: "https://www.comptia.org/en-us/certifications/network/", level: entry, note: "Vendor-neutral networking basics." }
  - { ref: ccna, note: "The best-known networking certification." }
  - { ref: secplus, note: "Adds the security side." }
  - { name: "GIAC Certified Intrusion Analyst (GCIA)", by: "GIAC", url: "https://www.giac.org/certifications/certified-intrusion-analyst-gcia/", level: mid, note: "Network traffic analysis and intrusion detection." }
  - { name: "CCNP Security", by: "Cisco", url: "https://www.cisco.com/site/us/en/learn/training-certifications/certifications/security/ccnp-security/index.html", level: advanced, note: "For engineers working with Cisco security products." }
  - { ref: cissp, note: "For architects and leads." }

resources:
  - { name: "Computer Networks: A Systems Approach", by: "Larry Peterson and Bruce Davie", url: "https://book.systemsapproach.org/", type: book, cost: free }
  - { name: "Network+ and Security+ video courses", by: "Professor Messer", url: "https://www.professormesser.com/", type: video, cost: free }
  - { name: "Cisco Networking Academy courses", by: "Cisco", url: "https://www.netacad.com/", type: course, cost: free }
  - { name: "Wireshark documentation", by: "Wireshark Foundation", url: "https://www.wireshark.org/docs/", type: docs, cost: free }
  - { name: "Zeek documentation", by: "Zeek Project", url: "https://docs.zeek.org/", type: docs, cost: free }
  - { name: "Suricata documentation", by: "OISF", url: "https://docs.suricata.io/", type: docs, cost: free }
  - { name: "Nmap Network Scanning (online book)", by: "Gordon Lyon", url: "https://nmap.org/book/", type: book, cost: free }
  - { name: "Malware-Traffic-Analysis.net exercises", by: "Brad Duncan", url: "https://www.malware-traffic-analysis.net/", type: practice, cost: free }
  - { name: "Zero Trust Architecture (SP 800-207)", by: "NIST", url: "https://csrc.nist.gov/pubs/sp/800/207/final", type: docs, cost: free }
  - { name: "Practical Packet Analysis, 3rd edition", by: "Chris Sanders (No Starch Press)", url: "https://nostarch.com/packetanalysis3", type: book, cost: paid }
  - { name: "The Practice of Network Security Monitoring", by: "Richard Bejtlich (No Starch Press)", url: "https://nostarch.com/nsm", type: book, cost: paid }
  - { name: "SEC503: Network Monitoring and Threat Detection", by: "SANS Institute", url: "https://www.sans.org/cyber-security-courses/network-monitoring-threat-detection/", type: course, cost: paid }

frameworks: [cis-controls, zero-trust, nist-csf, attack, d3fend, cis-benchmarks, iso27001]

career:
  - { title: "IT support or network technician", years: "0–2 years" }
  - { title: "Network administrator or junior network security engineer", years: "1–3 years" }
  - { title: "Network security engineer", years: "3–6 years" }
  - { title: "Senior engineer or network security architect", years: "6–10 years" }
  - { title: "Enterprise security architect", years: "10+ years" }

related:
  - { to: cloud, why: "Cloud networks need the same skills with different tools." }
  - { to: secops, why: "Use your traffic analysis skills to detect attacks." }
  - { to: iam, why: "Zero trust moves the security boundary from the network to identity." }
  - { name: "Wireless Security", why: "A specialism of its own, from Wi-Fi to Bluetooth." }
  - { name: "OT Security", why: "Industrial networks need careful segmentation and monitoring." }
