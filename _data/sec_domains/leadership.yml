  - { name: "10 Steps to Cyber Security", by: "UK NCSC", url: "https://www.ncsc.gov.uk/collection/10-steps", type: docs, cost: free }
  - { name: "Board Toolkit", by: "UK NCSC", url: "https://www.ncsc.gov.uk/collection/board-toolkit", type: docs, cost: free }
  - { name: "NIST Cybersecurity Framework 2.0", by: "NIST", url: "https://www.nist.gov/cyberframework", type: docs, cost: free }
  - { name: "Cybersecurity Capability Maturity Model (C2M2)", by: "US Department of Energy", url: "https://www.energy.gov/ceser/cybersecurity-capability-maturity-model-c2m2", type: docs, cost: free }
  - { name: "Cybersecurity Workforce Framework (NICE)", by: "NIST", url: "https://www.nist.gov/itl/applied-cybersecurity/nice/nice-framework-resource-center", type: docs, cost: free }

frameworks: [nist-csf, iso27001, cobit, nist-rmf, fair, nis2, dora]

career:
  - { title: "Senior practitioner in a security domain", years: "4–7 years" }
  - { title: "Security team lead or manager", years: "6–10 years" }
  - { title: "Director of security", years: "10–15 years" }
  - { title: "CISO", years: "12+ years" }

