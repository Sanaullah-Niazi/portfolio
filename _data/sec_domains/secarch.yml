  - { name: "SABSA Chartered Architect", by: "The SABSA Institute", url: "https://sabsa.org/certification/", level: senior, note: "Risk-driven security architecture." }
  - { name: "TOGAF Certification", by: "The Open Group", url: "https://www.opengroup.org/certifications/togaf-certification-portfolio", level: mid, note: "Enterprise architecture method." }

