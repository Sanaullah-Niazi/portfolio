# YouTube creator tools (/tools/youtube/). Their code is assets/js/youtube.js, their server worker/src/yt.js.
group_youtube: "Tools für YouTube-Creator"
yt_hub_eyebrow: "Kostenlose YouTube-Tools"
yt_hub_title: "Kostenlose Tools für YouTube-Creator"
yt_hub_lede: "Sehen Sie die Tags jedes Videos, bewerten Sie sein SEO, finden Sie die Ausreißer-Videos eines Kanals, vergleichen Sie zwei Kanäle, kopieren Sie Transkripte, schlagen Sie Kanal-Keywords nach, finden Sie Keyword-Ideen, nach denen Menschen suchen, und laden Sie Thumbnails herunter. Kostenlos und ohne Anmeldung."
yt_private: "Nur öffentliche YouTube-Daten. Nichts wird gespeichert"
yt_more: "Weitere YouTube-Tools"
yt_all_tools: "Alle kostenlosen Tools"
yt_about_title: "Über die YouTube-Tools"
yt_about_points:
  - "Sie nutzen die offizielle YouTube Data API und andere öffentliche YouTube-Daten, über meinen eigenen Server. Sie müssen sich nicht anmelden, und nichts, was Sie nachschlagen, wird gespeichert."
  - "Sie zeigen nur, was YouTube ohnehin öffentlich zeigt: Tags, Untertitel, Kanalzahlen und Suchvorschläge. Private Videos oder die Statistiken eines Kanals sehen sie nicht."
  - "Einen Video-Downloader gibt es bewusst nicht. Videos herunterzuladen verstößt gegen die Nutzungsbedingungen von YouTube und das Urheberrecht der Creator. Der Thumbnail-Downloader ist der einzige Download hier."
  - "Diese Website stammt nicht von YouTube oder Google und ist nicht mit ihnen verbunden. YouTube ist eine Marke der Google LLC."
  - "Die <a href=\"{privacy}\">Datenschutzerklärung</a> erklärt, was wohin gesendet wird. Weitere Tools für Sicherheit und Entwicklung finden Sie auf der <a href=\"{all}\">Tools-Seite</a>."
yt_note: "Nutzt öffentliche Daten von YouTube. Nicht von YouTube oder Google und nicht mit ihnen verbunden."
