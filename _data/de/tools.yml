# {privacy}, {contact} and {code} are replaced with the right links.
about_points:
  - "Sie sind kostenlos und ohne Anmeldung nutzbar."
  - "Sie laufen in Ihrem Browser. Eingaben und ausgewählte Dateien bleiben auf Ihrem Gerät. Ausnahmen sind nur der Check auf geleakte Passwörter, der nur die ersten 5 Zeichen eines Hashs sendet, der Website-Check, der einen Server braucht, um die Seite aufzurufen, das Prompt-Injection-Labor, das Ihre Angriffe an seine KI sendet, und die YouTube-Tools, die öffentliche YouTube-Daten abfragen. Die <a href=\"{privacy}\">Datenschutzerklärung</a> erklärt alle vier."
  - "Sie dienen zum Lernen und zum Prüfen eigener Dinge. Prüfen Sie nur Websites, Tokens und Dateien, die Ihnen gehören oder für die Sie eine Erlaubnis haben."
  - "Es gibt keine Garantie. Ein unauffälliges Ergebnis beweist nicht, dass etwas sicher ist. Nutzen Sie die Tools zusammen mit Ihrem eigenen Urteil."
  - "Einen Fehler gefunden? Schreiben Sie mir über das <a href=\"{contact}\">Kontaktformular</a>."
  - "Der Code ist offen auf GitHub: <a href=\"{code}\">free-security-tools</a>."
support: "Diese kostenlosen Tools unterstützen"
support_note: "Wenn sie Ihnen helfen, können Sie die Arbeit unterstützen."

