  w_pdf_about: "Über diesen Bericht"
  w_pdf_method: "Jede Kategorie beginnt mit 100 Punkten und verliert für jedes gefundene Problem Punkte: 30 für kritisch, 15 für hoch, 7 für mittel und 3 für niedrig. Leistung, Barrierefreiheit und SEO berücksichtigen zusätzlich die Werte von Google Lighthouse. In die Gesamtpunktzahl fließen Sicherheit zu 30 %, Leistung zu 20 %, SEO zu 15 %, Barrierefreiheit zu 15 %, Design zu 10 % und Technologie zu 10 % ein. Noten: A ab 90, B 80 bis 89, C 70 bis 79, D 60 bis 69 und F unter 60."
  w_pdf_online: "Online-Version dieses Berichts:"
  w_pdf_page: "Seite {n} von {t}"
  w_pdf_sum_A: "{host} ist in sehr gutem Zustand. Der Scan hat {n} Probleme gefunden, keines davon ist ernst. Halten Sie die Website und ihre Software aktuell und beheben Sie die übrigen Punkte bei Gelegenheit."
  w_pdf_sum_B: "{host} ist insgesamt in gutem Zustand. Der Scan hat {n} Probleme gefunden. Wenn Sie die Punkte unter „Diese 5 Punkte zuerst beheben“ beheben, steigt die Punktzahl und die wichtigsten Lücken sind geschlossen."
  w_pdf_sum_C: "{host} funktioniert, hat aber deutlich Luft nach oben. Der Scan hat {n} Probleme gefunden. Beginnen Sie mit der Liste „Diese 5 Punkte zuerst beheben“ und arbeiten Sie sich dann vom schwersten zum leichtesten Problem vor."
  w_pdf_sum_D: "{host} hat mehrere Probleme, die Sie bald beheben sollten. Der Scan hat {n} Probleme gefunden. Die Liste „Diese 5 Punkte zuerst beheben“ zeigt, wo Sie anfangen; die schweren betreffen Sicherheit, Geschwindigkeit oder die Darstellung in Suchmaschinen."
  w_pdf_sum_F: "{host} braucht Aufmerksamkeit. Der Scan hat {n} Probleme gefunden, einige davon ernst. Beheben Sie zuerst die kritischen und hohen Punkte, beginnend mit der Liste „Diese 5 Punkte zuerst beheben“."
  w_pdf_sum_na: "Einige Prüfungen für {host} konnten nicht laufen, daher gibt es keine Gesamtnote. Die Ergebnisse unten umfassen die abgeschlossenen Prüfungen."
