json_indent: "Einrückung"
json_sort: "Schlüssel sortieren"
json_format: "Formatieren"
json_minify: "Minifizieren"
b64_title: "Base64 kodieren und dekodieren"
b64_lede: "Text in Base64 kodieren oder Base64 zurück in Text dekodieren, mit voller UTF-8-Unterstützung (Umlaute, Urdu, Chinesisch und Emojis funktionieren). Dekodierte Dateien werden erkannt und können heruntergeladen werden."
