  wi_no_https: "Die Website nutzt kein HTTPS"
  wi_no_https_w: "Alles, was Besucher senden oder empfangen, auch Passwörter und Formulardaten, wird unverschlüsselt übertragen und kann unterwegs gelesen oder verändert werden. Browser zeigen „Nicht sicher“ an."
  wi_no_https_f: "Holen Sie sich ein kostenloses Zertifikat von Let's Encrypt (die meisten Hoster bieten das per Klick an), liefern Sie die Seite über https:// aus und leiten Sie allen http://-Verkehr dorthin um."
  wi_http_no_redirect: "http:// leitet nicht auf https:// weiter"
  wi_http_no_redirect_w: "Wer die Adresse eintippt oder alten Links folgt, landet auf der unverschlüsselten Version, wo der Verkehr mitgelesen oder manipuliert werden kann."
  wi_http_no_redirect_f: "Richten Sie in den Einstellungen von Server, Hoster oder CDN eine dauerhafte Weiterleitung (301) von jeder http://-Adresse auf dieselbe https://-Adresse ein."
  wi_no_hsts: "Kein HSTS-Header (Strict-Transport-Security)"
  wi_no_hsts_w: "Ohne HSTS versucht ein Browser eventuell zuerst die unverschlüsselte http://-Version, die ein Angreifer im selben Netzwerk abfangen kann."
  wi_no_hsts_f: "Senden Sie den Header Strict-Transport-Security: max-age=31536000; includeSubDomains, sobald jede Seite über HTTPS funktioniert."
  wi_hsts_short: "HSTS gilt nur {days} Tage"
  wi_hsts_short_w: "Bei kurzer HSTS-Dauer vergessen Browser schnell, dass sie HTTPS erzwingen sollen. Das lässt Lücken für Angreifer."
  wi_hsts_short_f: "Erhöhen Sie max-age auf mindestens 15552000 (180 Tage), besser 31536000 (ein Jahr)."
  wi_no_csp: "Keine Content Security Policy"
  wi_no_csp_w: "Eine Content Security Policy legt fest, welche Skripte und Ressourcen geladen werden dürfen. Ohne sie kann ein eingeschleustes Skript (XSS) ungehindert laufen und Daten stehlen."
  wi_no_csp_f: "Beginnen Sie mit einer Richtlinie wie default-src 'self' und ergänzen Sie die fremden Domains, die Sie wirklich nutzen. Testen Sie zuerst mit Content-Security-Policy-Report-Only und setzen Sie sie dann durch."
  wi_csp_weak: "Die Content Security Policy erlaubt {what}"
  wi_csp_weak_w: "Diese Einstellungen lassen eingebettete oder fremde Skripte zu und nehmen der Richtlinie den größten Teil ihres Schutzes gegen eingeschleuste Skripte."
  wi_csp_weak_f: "Ersetzen Sie 'unsafe-inline' durch Nonces oder Hashes, entfernen Sie 'unsafe-eval' und nennen Sie genaue Domains statt Platzhaltern."
  wi_no_clickjack: "Andere Websites können die Seite einbetten (Clickjacking)"
  wi_no_clickjack_w: "Eine fremde Website könnte Ihre Seiten in einem unsichtbaren Rahmen laden und Besucher dazu bringen, auf Schaltflächen zu klicken, die sie nicht sehen."
  wi_no_clickjack_f: "Senden Sie Content-Security-Policy: frame-ancestors 'self' (oder X-Frame-Options: SAMEORIGIN für ältere Browser)."
  wi_no_nosniff: "Kein X-Content-Type-Options-Header"
  wi_no_nosniff_w: "Browser raten eventuell den Dateityp und führen eine hochgeladene Datei als Skript aus."
  wi_no_nosniff_f: "Senden Sie bei jeder Antwort X-Content-Type-Options: nosniff."
  wi_no_referrer: "Keine Referrer-Policy"
  wi_no_referrer_w: "Vollständige Seitenadressen, die private Details enthalten können, gehen eventuell an jede fremde Website, auf die Ihre Seiten verlinken oder von der sie laden."
  wi_no_referrer_f: "Senden Sie Referrer-Policy: strict-origin-when-cross-origin (oder setzen Sie sie per Meta-Tag)."
  wi_no_permissions: "Keine Permissions-Policy"
  wi_no_permissions_w: "Ohne sie kann jedes Skript oder eingebettete Fenster auf der Seite mächtige Funktionen wie Kamera, Mikrofon oder Standort anfragen."
  wi_no_permissions_f: "Senden Sie eine Permissions-Policy, die abschaltet, was Sie nicht nutzen, zum Beispiel camera=(), microphone=(), geolocation=()."
  wi_cookie_secure: "Cookies ohne Secure-Attribut: {names}"
  wi_cookie_secure_w: "Diese Cookies können auch über unverschlüsseltes http:// gesendet und dabei gestohlen werden."
  wi_cookie_secure_f: "Setzen Sie beim Erzeugen dieser Cookies das Attribut Secure."
  wi_cookie_httponly: "Anmelde- oder Sitzungs-Cookies sind für Skripte lesbar: {names}"
  wi_cookie_httponly_w: "Gelingt es einem Angreifer, ein Skript einzuschleusen, kann es diese Cookies lesen und Sitzungen von Besuchern übernehmen."
  wi_cookie_httponly_f: "Setzen Sie bei Sitzungs- und Anmelde-Cookies das Attribut HttpOnly."
  wi_cookie_samesite: "Cookies ohne sichere SameSite-Einstellung: {names}"
  wi_cookie_samesite_w: "Diese Cookies werden eventuell auch bei Anfragen mitgeschickt, die von anderen Websites ausgehen. Das begünstigt Cross-Site Request Forgery (CSRF)."
  wi_cookie_samesite_f: "Setzen Sie SameSite=Lax (oder Strict). Nutzen Sie SameSite=None nur zusammen mit Secure und nur, wenn es wirklich nötig ist."
  wi_mixed_active: "{n} Skripte, Stylesheets oder Frames laden über unsicheres http://"
  wi_mixed_active_w: "Browser blockieren diese auf HTTPS-Seiten, was die Seite kaputt machen kann, und jeder im Netzwerk könnte sie austauschen. Beispiel: {example}"
  wi_mixed_active_f: "Ändern Sie diese Adressen auf https:// (oder entfernen Sie sie). Content-Security-Policy: upgrade-insecure-requests hilft zusätzlich."
  wi_mixed_passive: "{n} Bilder oder Medien laden über unsicheres http://"
  wi_mixed_passive_w: "Der Browser zeigt die Seite als nicht ganz sicher an, und die Dateien können unterwegs ausgetauscht werden. Beispiel: {example}"
  wi_mixed_passive_f: "Laden Sie diese Dateien über https://."
  wi_insecure_form: "Ein Formular sendet Daten über unsicheres http://"
  wi_insecure_form_w: "Alles, was Besucher in dieses Formular eingeben, wird unverschlüsselt gesendet."
  wi_insecure_form_f: "Ändern Sie die action-Adresse des Formulars auf https://."
  wi_server_version: "Der Server verrät seine Softwareversion ({value})"
  wi_server_version_w: "Angreifer suchen mit genauen Versionen nach bekannten Schwachstellen Ihres Servers."
  wi_server_version_f: "Verstecken Sie die Version, zum Beispiel mit server_tokens off in nginx oder ServerTokens Prod in Apache, und halten Sie die Software aktuell."
  wi_powered_by: "Ein Header verrät die Technik hinter der Website ({value})"
  wi_powered_by_w: "Header wie X-Powered-By verraten Angreifern, welche Sprache oder welches Framework sie angreifen können."
  wi_powered_by_f: "Entfernen Sie den Header, zum Beispiel mit expose_php = Off in PHP oder app.disable('x-powered-by') in Express."
  wi_no_sri: "{n} fremde Skripte oder Stylesheets ohne Integritätsprüfung"
  wi_no_sri_w: "Wird die andere Website gehackt, liefe die veränderte Datei unbemerkt auf Ihren Seiten."
  wi_no_sri_f: "Ergänzen Sie bei Dateien von CDNs die Attribute integrity und crossorigin (Subresource Integrity) oder hosten Sie sie selbst."
  wi_no_securitytxt: "Keine security.txt-Datei"
  wi_no_securitytxt_w: "Sicherheitsforscher, die ein Problem auf Ihrer Website finden, wissen nicht, wie sie es Ihnen melden können."
  wi_no_securitytxt_f: "Veröffentlichen Sie /.well-known/security.txt mit einer Contact- und einer Expires-Zeile (siehe securitytxt.org)."
  wi_securitytxt_expired: "security.txt ist abgelaufen"
  wi_securitytxt_expired_w: "Das Expires-Datum in Ihrer security.txt ist vorbei, daher halten Forscher die Kontaktdaten eventuell für veraltet."
  wi_securitytxt_expired_f: "Setzen Sie die Expires-Zeile auf ein Datum innerhalb des nächsten Jahres."
  wi_no_spf: "Kein SPF-Eintrag für {domain}"
  wi_no_spf_w: "Jeder kann E-Mails versenden, die angeblich von Ihrer Domain kommen, und Ihre echten E-Mails landen eher im Spam."
  wi_no_spf_f: "Legen Sie einen TXT-Eintrag an, der festlegt, wer Ihre E-Mails senden darf, zum Beispiel v=spf1 include:_spf.google.com -all für Google Workspace. Den genauen Wert nennt Ihr E-Mail-Anbieter."
  wi_no_spf_nomail: "Kein SPF-Eintrag für {domain}"
  wi_no_spf_nomail_w: "Diese Domain scheint keine E-Mails zu senden, aber ohne SPF können Kriminelle trotzdem gefälschte E-Mails in ihrem Namen verschicken."
  wi_no_spf_nomail_f: "Wenn Sie von dieser Domain nie E-Mails senden, legen Sie den TXT-Eintrag v=spf1 -all an."
  wi_spf_multiple: "Mehr als ein SPF-Eintrag"
  wi_spf_multiple_w: "Eine Domain darf nur einen SPF-Eintrag haben. Bei zweien gilt SPF bei Empfängern als fehlerhaft."
  wi_spf_multiple_f: "Fassen Sie sie zu einem TXT-Eintrag zusammen, der mit v=spf1 beginnt."
  wi_spf_pass_all: "SPF erlaubt jedem, E-Mails als {domain} zu senden"
  wi_spf_pass_all_w: "Der Eintrag endet auf +all. Damit darf laut SPF jeder Server der Welt Ihre E-Mails senden."
  wi_spf_pass_all_f: "Ändern Sie +all in -all (oder ~all während des Testens)."
  wi_spf_neutral: "SPF weist gefälschte Absender nicht ab"
  wi_spf_neutral_w: "Der Eintrag endet auf ?all oder hat kein Ende, daher gilt Post von fremden Servern nicht als verdächtig."
  wi_spf_neutral_f: "Beenden Sie den Eintrag mit -all (oder ~all), sobald alle echten Absender aufgeführt sind."
  wi_no_dmarc: "Kein DMARC-Eintrag für {domain}"
  wi_no_dmarc_w: "DMARC sagt Mail-Anbietern, was mit E-Mails passieren soll, die SPF oder DKIM nicht bestehen. Ohne DMARC landen gefälschte E-Mails in Ihrem Namen eher im Posteingang."
  wi_no_dmarc_f: "Legen Sie bei _dmarc.{domain} einen TXT-Eintrag an, zuerst v=DMARC1; p=none; rua=mailto:sie@{domain}, und wechseln Sie später zu p=quarantine oder p=reject."
  wi_dmarc_none: "DMARC beobachtet nur (p=none)"
  wi_dmarc_none_w: "Gefälschte E-Mails, die die Prüfungen nicht bestehen, werden trotzdem zugestellt; die Richtlinie erzeugt nur Berichte."
  wi_dmarc_none_f: "Stellen Sie die Richtlinie nach Auswertung der Berichte auf p=quarantine und später auf p=reject."
  wi_no_dkim: "Kein DKIM-Schlüssel unter gängigen Selektoren gefunden"
  wi_no_dkim_w: "DKIM signiert Ihre E-Mails, damit Empfänger erkennen, dass sie wirklich von Ihnen stammen. Unter den üblichen Namen wurde keiner gefunden; eventuell nutzen Sie einen eigenen."
  wi_no_dkim_f: "Schalten Sie bei Ihrem E-Mail-Anbieter die DKIM-Signatur ein und veröffentlichen Sie den angegebenen TXT-Eintrag."
  wi_bad_status: "Die Seite antwortet mit einem Fehler (HTTP {status})"
  wi_bad_status_w: "Besucher und Suchmaschinen erhalten statt der Seite eine Fehlermeldung."
  wi_bad_status_f: "Prüfen Sie, ob die Adresse stimmt und ob Server oder Anwendung fehlerfrei laufen."
  wi_noindex: "Die Seite bittet Suchmaschinen, sie nicht aufzunehmen (noindex)"
  wi_noindex_w: "Google und andere Suchmaschinen lassen diese Seite aus den Suchergebnissen weg."
  wi_noindex_f: "Entfernen Sie noindex aus dem robots-Meta-Tag oder dem X-Robots-Tag-Header, außer die Seite soll absichtlich versteckt sein."
  wi_robots_block_all: "robots.txt sperrt alle Suchmaschinen aus"
  wi_robots_block_all_w: "Die Regel Disallow: / verbietet jedem Crawler die ganze Website."
  wi_robots_block_all_f: "Entfernen Sie Disallow: / für User-agent: * und sperren Sie nur private Ordner."
  wi_no_title: "Die Seite hat keinen Titel"
  wi_no_title_w: "Der Titel ist die anklickbare Überschrift in Suchergebnissen und der Name im Browser-Tab."
  wi_no_title_f: "Fügen Sie einen eindeutigen <title> mit etwa 50 bis 60 Zeichen hinzu, der die Seite beschreibt."
  wi_title_long: "Der Titel ist lang ({n} Zeichen)"
  wi_title_long_w: "Suchergebnisse schneiden Titel nach etwa 60 Zeichen ab."
  wi_title_long_f: "Kürzen Sie ihn und stellen Sie die wichtigsten Wörter an den Anfang."
  wi_title_short: "Der Titel ist sehr kurz ({n} Zeichen)"
  wi_title_short_w: "Ein sehr kurzer Titel sagt Suchenden wenig über die Seite."
  wi_title_short_f: "Beschreiben Sie die Seite in 30 bis 60 Zeichen mit Ihrem wichtigsten Suchbegriff."
  wi_no_description: "Keine Meta-Beschreibung"
  wi_no_description_w: "Suchmaschinen zeigen diesen Text unter dem Titel. Fehlt er, nehmen sie beliebigen Text von der Seite."
  wi_no_description_f: "Fügen Sie eine <meta name=\"description\"> mit 120 bis 160 Zeichen hinzu, die die Seite zusammenfasst."
  wi_desc_length: "Die Meta-Beschreibung hat {n} Zeichen"
  wi_desc_length_w: "Unter 50 Zeichen sagt sie zu wenig, über 160 wird sie in den Ergebnissen abgeschnitten."
  wi_desc_length_f: "Zielen Sie auf 120 bis 160 Zeichen."
  wi_no_h1: "Keine Hauptüberschrift (H1)"
  wi_no_h1_w: "Die H1 sagt Besuchern und Suchmaschinen, worum es auf der Seite geht."
  wi_no_h1_f: "Fügen Sie eine <h1> mit dem Hauptthema der Seite hinzu."
  wi_multi_h1: "{n} Hauptüberschriften (H1)"
  wi_multi_h1_w: "Mehrere H1 machen das Hauptthema der Seite unklarer."
  wi_multi_h1_f: "Behalten Sie eine H1 und machen Sie aus den anderen H2 oder H3."
  wi_heading_skip: "Überschriften überspringen eine Ebene ({what})"
  wi_heading_skip_w: "Übersprungene Ebenen machen die Gliederung für Screenreader und Suchmaschinen verwirrend."
  wi_heading_skip_f: "Nutzen Sie Überschriften der Reihe nach: H1, dann H2, dann H3."
  wi_no_canonical: "Keine kanonische URL"
  wi_no_canonical_w: "Ist die Seite unter mehreren Adressen erreichbar, teilen Suchmaschinen ihr Ranking eventuell auf."
  wi_no_canonical_f: "Fügen Sie <link rel=\"canonical\" href=\"…\"> mit der bevorzugten Adresse der Seite hinzu."
  wi_no_og: "Fehlende Link-Vorschau-Tags: {missing}"
  wi_no_og_w: "Wird die Seite in sozialen Netzwerken oder Chats geteilt, fehlt der Vorschau eventuell ein Bild oder eine gute Beschreibung."
  wi_no_og_f: "Fügen Sie Open-Graph-Meta-Tags für Titel, Beschreibung und ein Bild mit 1200×630 Pixeln hinzu."
  wi_no_jsonld: "Keine strukturierten Daten"
  wi_no_jsonld_w: "Strukturierte Daten (schema.org) helfen Suchmaschinen, die Seite zu verstehen, und können zu Rich Results führen."
  wi_no_jsonld_f: "Ergänzen Sie JSON-LD für Organisation, Person, Produkt oder Artikel und testen Sie es mit dem Rich-Results-Test von Google."
  wi_jsonld_invalid: "{n} Blöcke mit strukturierten Daten enthalten Fehler"
  wi_jsonld_invalid_w: "Suchmaschinen ignorieren JSON-LD, das sie nicht lesen können."
  wi_jsonld_invalid_f: "Korrigieren Sie das JSON (der JSON-Formatierer auf dieser Website zeigt den genauen Fehler) und testen Sie es mit dem Rich-Results-Test von Google."
  wi_img_alt: "{n} von {total} Bildern haben keinen Alt-Text"
  wi_img_alt_w: "Screenreader können diese Bilder nicht beschreiben, und Suchmaschinen verstehen sie nicht."
  wi_img_alt_f: "Geben Sie jedem Bild ein beschreibendes alt-Attribut. Nutzen Sie alt=\"\" für rein dekorative Bilder."
  wi_no_robots: "Keine robots.txt-Datei"
  wi_no_robots_w: "Kein Fehler, aber in der robots.txt verweisen Sie Suchmaschinen auf Ihre Sitemap und halten sie von privaten Bereichen fern."
  wi_no_robots_f: "Legen Sie /robots.txt mit mindestens User-agent: * und einer Sitemap:-Zeile an."
  wi_no_sitemap: "Keine Sitemap gefunden"
  wi_no_sitemap_w: "Eine Sitemap hilft Suchmaschinen, alle Seiten zu finden, besonders neue."
  wi_no_sitemap_f: "Veröffentlichen Sie /sitemap.xml (die meisten CMS und Generatoren erstellen eine) und tragen Sie sie in robots.txt und der Google Search Console ein."
  wi_no_lang: "Die Seitensprache ist nicht angegeben"
  wi_no_lang_w: "Screenreader lesen die Seite eventuell mit falscher Aussprache vor, und Browser bieten die falsche Übersetzung an."
  wi_no_lang_f: "Ergänzen Sie ein lang-Attribut im <html>-Tag, zum Beispiel <html lang=\"de\">."
  wi_zoom_disabled: "Zoomen ist abgeschaltet"
  wi_zoom_disabled_w: "Menschen mit Sehschwäche können die Seite auf dem Handy nicht vergrößern."
  wi_zoom_disabled_f: "Entfernen Sie user-scalable=no und maximum-scale=1 aus dem Viewport-Meta-Tag."
  wi_no_viewport: "Kein mobiler Viewport"
  wi_no_viewport_w: "Handys zeigen die Seite als winzige Desktop-Seite, in die man hineinzoomen und seitwärts scrollen muss."
  wi_no_viewport_f: "Fügen Sie <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> hinzu und nutzen Sie ein responsives Layout."
  wi_viewport_bad: "Der Viewport nutzt nicht die Gerätebreite"
  wi_viewport_bad_w: "Die Seite passt sich nicht an die Breite von Handys und Tablets an."
  wi_viewport_bad_f: "Nutzen Sie content=\"width=device-width, initial-scale=1\"."
  wi_no_favicon: "Kein Favicon"
  wi_no_favicon_w: "Browser-Tabs, Lesezeichen und manche Suchergebnisse zeigen ein leeres Symbol statt Ihres Logos."
  wi_no_favicon_f: "Fügen Sie <link rel=\"icon\"> hinzu, das auf ein SVG- oder PNG-Symbol zeigt."
  wi_slow_server: "Der Server brauchte {ms} ms für die Antwort"
  wi_slow_server_w: "Eine langsame erste Antwort verzögert alles andere auf der Seite."
  wi_slow_server_f: "Nutzen Sie Seiten-Caching oder ein CDN und prüfen Sie langsame Datenbankabfragen oder Plugins."
  wi_no_compression: "Die Seite ist nicht komprimiert ({kb} KB)"
  wi_no_compression_w: "Unkomprimiertes HTML lädt länger, besonders über mobile Daten."
  wi_no_compression_f: "Schalten Sie gzip- oder Brotli-Komprimierung in Server oder CDN ein."
  wi_vuln_lib: "{name} {version} hat {n} bekannte Schwachstellen"
  wi_vuln_lib_w: "Für diese Version der Bibliothek sind Sicherheitslücken veröffentlicht ({cves}), zum Beispiel: {summary}"
  wi_vuln_lib_f: "Aktualisieren Sie {name} auf die neueste Version. Lädt ein Plugin oder Theme sie, aktualisieren oder ersetzen Sie dieses."
  wi_wp_outdated: "WordPress {version} ist veraltet (aktuell {latest})"
  wi_wp_outdated_w: "Alte WordPress-Versionen haben bekannte Sicherheitslücken, nach denen automatisierte Bots suchen."
  wi_wp_outdated_f: "Sichern Sie die Website und aktualisieren Sie dann WordPress, Themes und Plugins im Dashboard. Schalten Sie automatische Neben-Updates ein."
  wi_generator_version: "Die Seite verrät ihre Softwareversion ({value})"
  wi_generator_version_w: "Der Generator-Tag sagt Angreifern genau, welche Version sie angreifen können."
  wi_generator_version_f: "Entfernen Sie den Generator-Meta-Tag (viele CMS haben dafür eine Einstellung oder ein Plugin) und halten Sie die Software aktuell."
  wi_broken_links: "{n} defekte Links (von {checked} geprüften)"
  wi_broken_links_w: "Links, die auf Fehler führen, ärgern Besucher und verschwenden die Zeit von Suchmaschinen. Beispiel: {example}"
  wi_broken_links_f: "Korrigieren oder entfernen Sie diese Links oder leiten Sie die alten Adressen auf die richtigen Seiten um."
  wi_ssl_grade: "SSL-Labs-Note {grade}"
  wi_ssl_grade_w: "Die HTTPS-Einrichtung hat Schwächen, etwa alte Protokolle, schwache Verschlüsselung oder Zertifikatsprobleme."
  wi_ssl_grade_f: "Schalten Sie alte Protokolle und schwache Cipher ab (der SSL Configuration Generator von Mozilla liefert fertige Einstellungen) und beheben Sie Probleme mit der Zertifikatskette."
  wi_cert_expired: "Das Zertifikat ist seit {days} Tagen abgelaufen"
  wi_cert_expired_w: "Browser zeigen eine ganzseitige Sicherheitswarnung, und die meisten Besucher gehen."
  wi_cert_expired_f: "Erneuern Sie das Zertifikat sofort und richten Sie die automatische Verlängerung ein (Let's Encrypt macht das kostenlos)."
  wi_cert_expiring: "Das Zertifikat läuft in {days} Tagen ab"
  wi_cert_expiring_w: "Läuft es ab, sperren Browser die Website mit einer Sicherheitswarnung."
  wi_cert_expiring_f: "Erneuern Sie es jetzt und prüfen Sie, ob die automatische Verlängerung funktioniert."
  wi_old_tls: "Alte TLS-Versionen sind aktiv ({list})"
  wi_old_tls_w: "TLS 1.0 und 1.1 haben bekannte Schwächen und werden von modernen Browsern nicht mehr unterstützt."
  wi_old_tls_f: "Erlauben Sie in den Einstellungen von Server oder CDN nur TLS 1.2 und TLS 1.3."
  wi_no_tls13: "TLS 1.3 wird nicht unterstützt"
  wi_no_tls13_w: "TLS 1.3 ist schneller und sicherer als ältere Versionen."
  wi_no_tls13_f: "Schalten Sie TLS 1.3 in Server oder CDN ein (die meisten unterstützen es)."
  wi_ssl_vuln: "Anfällig für {name}"
  wi_ssl_vuln_w: "Das ist eine schwere, bekannte TLS-Lücke, die verschlüsselten Verkehr offenlegen kann."
  wi_ssl_vuln_f: "Aktualisieren Sie sofort die TLS-Bibliothek des Servers (etwa OpenSSL) und schalten Sie SSL 3.0 ab."
  wi_perf_score: "Geschwindigkeitswert {score} auf {device}"
  wi_perf_score_w: "Langsame Seiten verlieren Besucher und ranken schlechter. Google Lighthouse fand, dass die Seite langsam lädt oder reagiert."
  wi_perf_score_f: "Beginnen Sie mit den größten Punkten im Bereich Geschwindigkeit: Bilder komprimieren und verkleinern, unwichtige Skripte später laden und Caching nutzen."
  wi_lcp: "Der Hauptinhalt erscheint erst nach {s} s (LCP)"
  wi_lcp_w: "Largest Contentful Paint sollte unter 2,5 Sekunden liegen. Bis dahin sehen Besucher eine unfertige Seite."
  wi_lcp_f: "Lassen Sie das Hauptbild oder die Überschrift zuerst laden: komprimieren, moderne Formate (WebP, AVIF) nutzen, vorladen und blockierendes CSS und JavaScript reduzieren."
  wi_cls: "Das Layout verschiebt sich beim Laden (CLS {v})"
  wi_cls_w: "Inhalte springen beim Laden herum, sodass man das Falsche anklickt. Gut ist ein Wert unter 0,1."
  wi_cls_f: "Geben Sie Bildern, Anzeigen und Einbettungen feste Breite und Höhe und fügen Sie keine Inhalte über bereits sichtbaren ein."
  wi_inp: "Die Seite reagiert langsam auf Tippen und Klicken ({ms} ms)"
  wi_inp_w: "Interaction to Next Paint sollte unter 200 ms liegen. Darüber wirkt die Seite träge."
  wi_inp_f: "Teilen Sie lange JavaScript-Aufgaben auf, entfernen Sie unbenutzte Skripte und laden Sie Drittanbieter-Code später."
  wi_tbt: "JavaScript blockiert die Seite für {ms} ms"
  wi_tbt_w: "Während Skripte laufen, reagiert die Seite nicht auf Tippen oder Klicken."
  wi_tbt_f: "Entfernen Sie schwere Skripte oder laden Sie sie später, teilen Sie große Bundles auf und laden Sie Widgets von Drittanbietern verzögert."
  wi_a11y_score: "Barrierefreiheitswert {score}"
  wi_a11y_score_w: "Manche Menschen, etwa mit Screenreader oder Tastatur, kommen mit der Seite schlecht zurecht."
  wi_a11y_score_f: "Beheben Sie die Lighthouse-Probleme in diesem Bereich, beginnend mit denen der Stufe Mittel."
