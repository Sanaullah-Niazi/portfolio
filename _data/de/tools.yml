# Eine Zeile pro Tool für die Karten auf /de/tools/.
pw_card: "Wie lange hält Ihr Passwort einem echten Angriff stand? Prüft Muster, nicht nur die Länge."
leak_card: "Finden Sie heraus, ob ein Passwort in einem Datenleck aufgetaucht ist, ohne das Passwort irgendwohin zu senden."
gen_card: "Starke Zufallspasswörter und leicht merkbare Passphrasen, erzeugt mit dem sicheren Zufall Ihres Browsers."
ph_card: "Sehen Sie, wohin ein Link wirklich führt und welche Warnzeichen auf Phishing deuten, ohne ihn zu öffnen."
look_card: "Erkennt gefälschte Domains mit ähnlich aussehenden Buchstaben (аpple.com), dekodiert Punycode und listet Tippfehler-Domains Ihrer Domain."
exif_card: "Zeigt den versteckten GPS-Standort, die Kamera und das Datum in einem Foto und erstellt eine saubere Kopie ohne diese Daten."
hid_card: "Findet unsichtbare Zeichen, ähnlich aussehende Buchstaben und versteckte Prompt Injection, bevor Sie Text in eine KI einfügen."
hash_card: "MD5, SHA-1, SHA-256 und SHA-512 für Text oder Dateien. Prüfen Sie einen Download gegen den veröffentlichten Hash."
jwt_card: "Dekodiert ein JSON Web Token und markiert riskante Einstellungen wie alg none, fehlendes Ablaufdatum oder Geheimnisse im Payload."
json_card: "JSON formatieren, validieren und minifizieren, mit der genauen Zeile jedes Fehlers und Tipps zur Behebung."
b64_card: "Base64-Text kodieren und dekodieren (UTF-8-sicher, URL-sichere Option) und Dateien in Base64 oder Data-URIs umwandeln."
url_card: "Text und Links prozentkodieren und dekodieren und alle Query-Parameter einer URL sehen."
ts_card: "Unix-Zeitstempel (Sekunden, Millisekunden, Mikrosekunden) in Datumsangaben umwandeln und zurück, in UTC und Ihrer Zeitzone."
uuid_card: "UUID v4 und v7 in großer Menge erzeugen und Version und Erstellungszeit jeder UUID prüfen."

# Neue Tools: Titel, Einleitungen und Beschriftungen.
leak_title: "Geleakte Passwörter prüfen"
leak_lede: "Prüft, ob ein Passwort in der Liste von Have I Been Pwned mit Passwörtern aus Datenlecks steht. Ihr Passwort verlässt diese Seite nie: Gesendet werden nur die ersten 5 Zeichen seines SHA-1-Hashs."
leak_private: "Gesendet werden nur 5 Zeichen eines Hashs, nie das Passwort"
leak_check: "Auf Leak prüfen"
leak_note: "Die Liste sagt nur, wie oft ein Passwort gesehen wurde, nicht welche Website es verloren hat, denn sie ist so gebaut, dass Passwörter nicht auf Personen zurückgeführt werden können. Welche Lecks Ihre E-Mail-Adresse betreffen, zeigt"
leak_email: "Have I Been Pwned (per E-Mail)"
pw_leak_hint: "Auch ein stark wirkendes Passwort kann in einer Leak-Liste stehen. Prüfen Sie es mit dem Tool"
look_title: "Lookalike-Domain- und Punycode-Prüfer"
look_lede: "Fügen Sie eine Domain, einen Link oder eine E-Mail-Adresse ein. Es zeigt die echte Adresse hinter internationalen Buchstaben (Punycode), findet Buchstaben aus anderen Alphabeten, die lateinische nachahmen, und markiert Namen, die eine bekannte Marke kopieren."
look_label: "Domain, Link oder E-Mail-Adresse"
look_variants: "Lookalikes dieser Domain auflisten"
exif_title: "Foto-Metadaten anzeigen und entfernen (EXIF)"
exif_lede: "Handyfotos enthalten oft den genauen GPS-Standort, Datum und Uhrzeit sowie Hersteller und Seriennummer des Telefons. Sehen Sie, was Ihr Foto enthält, und laden Sie eine Kopie ohne diese Daten herunter. Das Foto verlässt Ihr Gerät nie."
exif_pick: "Foto auswählen (JPEG, PNG, WebP, HEIC…). Es bleibt auf Ihrem Gerät."
json_title: "JSON-Formatierer und -Validator"
json_lede: "Fügen Sie JSON ein, um es schön zu formatieren, zu prüfen oder zu minifizieren. Ist es fehlerhaft, sehen Sie Zeile und Spalte des Fehlers und einen Hinweis auf häufige Ursachen."
