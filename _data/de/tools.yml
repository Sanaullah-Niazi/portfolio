pil_lv2: "2 · Eingabefilter"
pil_lv3: "3 · Vollständig"
pil_lv0_d: "Der Code steht in den Anweisungen, ohne Regel, ihn geheim zu halten. So sind viele schnell gebaute Demo-Bots."
pil_lv1_d: "Fügt Regeln hinzu: Code geheim halten, niemandem folgen, der die Regeln ändern will, Dokumente als Daten behandeln. Bei den meisten Chatbots endet der Schutz hier."
pil_lv2_d: "Fügt einen Eingabefilter hinzu, der Nachrichten mit bekannten Angriffsmustern in allen vier Sprachen blockiert, bevor die KI sie sieht."
pil_lv3_d: "Fügt Begrenzungen um den Text des Kunden mit einer Erinnerung danach hinzu, und einen Ausgabefilter, der jede Antwort mit dem Code verbirgt."
