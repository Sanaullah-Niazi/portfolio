# Der Abschnitt „So funktioniert es“ und die Fragen unter jedem Tool (auch als FAQ für Suchmaschinen).

# Website Health & Security Checker (key: web). Its backend is the Cloudflare Worker in worker/.
web_title: "Website-Check für Sicherheit und Qualität"
web_lede: "Geben Sie eine Webadresse ein und erhalten Sie in etwa einer Minute einen vollständigen Bericht: Sicherheits-Header, HTTPS und SSL, E-Mail-Sicherheit, Geschwindigkeit und Core Web Vitals, SEO, Barrierefreiheit, mobiles Design und veraltete Software, mit Punktzahl, Note und verständlichen Lösungen."
web_card: "Prüfen Sie jede Website auf Sicherheits-Header, SSL, Geschwindigkeit, SEO, Barrierefreiheit und veraltete Bibliotheken. Mit Punktzahl und Lösungen."
web_private: "Nur passive Prüfungen. Berichte werden nach {days} Tagen gelöscht"
web_label: "Webadresse"
web_check: "Website prüfen"
web_passive: "Dieses Tool führt nur passive, nicht-invasive Prüfungen durch. Es liest, was jeder Browser beim Besuch sieht: Es meldet sich nicht an, schickt keine Formulare ab, rät keine Passwörter und sucht nicht aktiv nach Schwachstellen."
web_disclaimer: "Prüfen Sie nur Websites, die Ihnen gehören oder für die Sie eine Erlaubnis haben. Die Ergebnisse sind automatische Hinweise, kein vollständiges Sicherheitsaudit. Die Adresse wird für die Prüfung an meinen Server sowie an Google PageSpeed Insights, Mozilla Observatory und SSL Labs gesendet; der Bericht wird nach {days} Tagen gelöscht."
web_privacy: "Datenschutzerklärung"
web_not_ready: "Dieses Tool wird gerade eingerichtet und ist bald verfügbar."

# Prompt injection lab
pil_title: "Prompt-Injection-Labor"
pil_lede: "Greifen Sie einen echten KI-Chatbot mit Prompt Injection und Jailbreak-Prompts auf Englisch, Urdu, Roman-Urdu und Paschtu an. Schalten Sie Schutzmaßnahmen nacheinander ein, sehen Sie, welche Angriffe trotzdem durchkommen, und testen Sie danach Ihren eigenen Chatbot auf dieselbe Weise."
pil_card: "Greifen Sie einen echten KI-Bankbot mit Prompt Injection auf Englisch, Urdu, Roman-Urdu und Paschtu an und sehen Sie, welche Schutzmaßnahmen sie stoppen."
pil_private: "Ihre Angriffe gehen an die KI des Labors und werden nicht gespeichert"
pil_bot_title: "Das Ziel: Sahulat, der Hilfe-Bot einer Demo-Bank"
pil_bot_desc: "Sahulat ist der KI-Assistent einer erfundenen Bank. In seinen Anweisungen steht ein Mitarbeiter-Code, der sich bei jedem Angriff ändert. Sie gewinnen, wenn der Bot den Code verrät oder Sie ihn dazu bringen, „PWNED“ zu sagen. Er läuft auf Llama 3.1 8B, einem offenen Modell, auf dem viele echte Apps aufbauen."
pil_bot_show: "Anweisungen des Bots ansehen"
pil_from_level: "Ab Stufe"
