# Website Health & Security Checker (key: web). Its backend is the Cloudflare Worker in worker/.
web_title: "Website-Check für Sicherheit und Qualität"
web_lede: "Geben Sie eine Webadresse ein und erhalten Sie in etwa einer Minute einen vollständigen Bericht: Sicherheits-Header, HTTPS und SSL, E-Mail-Sicherheit, Geschwindigkeit und Core Web Vitals, SEO, Barrierefreiheit, mobiles Design und veraltete Software, mit Punktzahl, Note und verständlichen Lösungen."
web_card: "Prüfen Sie jede Website auf Sicherheits-Header, SSL, Geschwindigkeit, SEO, Barrierefreiheit und veraltete Bibliotheken. Mit Punktzahl und Lösungen."
web_private: "Nur passive Prüfungen. Berichte werden nach {days} Tagen gelöscht"
web_label: "Webadresse"
web_check: "Website prüfen"
web_passive: "Dieses Tool führt nur passive, nicht-invasive Prüfungen durch. Es liest, was jeder Browser beim Besuch sieht: Es meldet sich nicht an, schickt keine Formulare ab, rät keine Passwörter und sucht nicht aktiv nach Schwachstellen."
web_disclaimer: "Prüfen Sie nur Websites, die Ihnen gehören oder für die Sie eine Erlaubnis haben. Die Ergebnisse sind automatische Hinweise, kein vollständiges Sicherheitsaudit. Die Adresse wird für die Prüfung an meinen Server sowie an Google PageSpeed Insights, Mozilla Observatory und SSL Labs gesendet; der Bericht wird nach {days} Tagen gelöscht."
web_privacy: "Datenschutzerklärung"
web_not_ready: "Dieses Tool wird gerade eingerichtet und ist bald verfügbar."

info:
  pw:
    about:
      - "Die meisten Stärkeanzeigen zählen nur Länge und Zeichenarten, daher wirkt „Passwort1!“ stark. Dieser Prüfer arbeitet eher wie ein echtes Knackprogramm: Er sucht nach häufigen Passwörtern, Wörtern und Namen mit angehängten Zahlen, Ersetzungen wie p@ssw0rd, Tastaturmustern wie qwertz, Wiederholungen und Jahreszahlen und zählt nur den Rest als zufällig."
      - "Dann schätzt er, wie lange das Passwort in drei Lagen durchhält: beim Raten online gegen eine Website, die Versuche begrenzt, und offline gegen eine gestohlene Passwortdatenbank, die gut (bcrypt) oder schlecht (schneller Hash, mit GPUs geknackt) gespeichert ist."
    faq:
      - q: "Ist es sicher, hier mein echtes Passwort einzugeben?"
        a: "Ja. Die Prüfung läuft komplett in Ihrem Browser, und die Sicherheitsrichtlinie der Seite verhindert, dass etwas gesendet wird. Am sichersten ist es trotzdem, ein ähnliches Passwort statt des echten zu testen."
      - q: "Was macht ein Passwort stark?"
        a: "Länge und Unvorhersehbarkeit. Eine Passphrase aus fünf oder mehr zufälligen Wörtern oder 16 und mehr Zufallszeichen aus einem Passwortmanager schlägt ein kurzes Passwort voller Sonderzeichen."
      - q: "Warum schneidet mein Passwort mit Sonderzeichen und Zahlen trotzdem schlecht ab?"
        a: "Weil Angreifer zuerst häufige Wörter mit angehängten Zahlen und Zeichen ausprobieren. „Sommer2024!“ folgt einem Muster, das fast alle nutzen, und fällt deshalb früh."
  leak:
    about:
      - "Ihr Passwort wird in Ihrem Browser mit SHA-1 gehasht. Nur die ersten 5 Zeichen dieses Hashs gehen an den Dienst Pwned Passwords von Have I Been Pwned. Er antwortet mit allen geleakten Hashes, die mit diesen 5 Zeichen beginnen (Hunderte), und diese Seite sucht Ihren darunter. Das Verfahren heißt k-Anonymität: Der Dienst erfährt nie Ihr Passwort oder auch nur seinen vollständigen Hash."
      - "Die Liste enthält Hunderte Millionen echter Passwörter aus öffentlichen Datenlecks. Steht Ihres darin, haben Angreifer es in den Wortlisten, die sie zuerst ausprobieren, auch wenn es stark aussieht."
    faq:
      - q: "Kann es mir sagen, welche Website mein Passwort verloren hat?"
        a: "Nein. Die Passwortliste wird bewusst von den Namen der Lecks getrennt, damit Passwörter nicht mit Personen verknüpft werden können. Welche Lecks Ihre E-Mail-Adresse betreffen, finden Sie auf haveibeenpwned.com."
      - q: "Mein Passwort wurde gefunden. Was soll ich tun?"
        a: "Ändern Sie es überall, wo Sie es benutzt haben, zuerst bei E-Mail und Bank, und schalten Sie die Zwei-Faktor-Authentifizierung ein. Nutzen Sie für jede Website ein eigenes Passwort, am besten aus einem Passwortmanager."
      - q: "Mein Passwort wurde nicht gefunden. Ist es sicher?"
        a: "Es ist in keinem bekannten Leck aufgetaucht, das ist gut, kann aber trotzdem schwach sein. Prüfen Sie es auch mit dem Passwortstärke-Prüfer."
  gen:
    about:
      - "Jedes Passwort wird mit crypto.getRandomValues erzeugt, dem kryptografisch sicheren Zufallsgenerator Ihres Browsers, ohne Modulo-Verzerrung. Nichts wird gespeichert oder gesendet."
      - "Passphrasen nutzen die kurze Wortliste der EFF (1.296 Wörter). Jedes Wort bringt etwa 10,3 Bit Zufall, sechs Wörter also etwa 62 Bit: leicht zu tippen und zu merken, sehr schwer zu erraten."
    faq:
      - q: "Passphrase oder Zufallszeichen?"
        a: "Nehmen Sie eine Passphrase für alles, was Sie sich merken oder tippen müssen, etwa die Computeranmeldung oder das Master-Passwort des Passwortmanagers. Lange Zufallszeichen für alles, was der Passwortmanager für Sie ausfüllt."
      - q: "Wie lang sollte ein Passwort sein?"
        a: "Mindestens 12 Zeichen für alltägliche Konten und 16 oder mehr für wichtige. Bei Passphrasen fünf oder sechs zufällige Wörter."
      - q: "Werden diese Passwörter irgendwo gespeichert?"
        a: "Nein. Sie existieren nur auf dieser Seite, bis Sie sie schließen."
  ph:
    about:
      - "Fügen Sie einen Link oder eine ganze Nachricht ein. Der Prüfer zieht jeden Link heraus, ermittelt die echte Domain (auch bei Tricks wie Text vor einem @, verschleierten IP-Adressen und Weiterleitungen im Link) und prüft sie auf die Zeichen, die ich in meiner Forschung zur Phishing-Erkennung nutze: Markennamen auf der falschen Domain, ähnliche Schreibweisen, riskante Domain-Endungen, kostenloses Hosting, Linkverkürzer und Druckwörter."
      - "Der Link wird nie geöffnet, verdächtige Nachrichten lassen sich also gefahrlos prüfen. Sie bekommen auch eine entschärfte Kopie (hxxp, [.]), die Sie der IT schicken können, ohne dass jemand versehentlich klickt."
    faq:
      - q: "Woran erkenne ich einen Phishing-Link?"
        a: "Schauen Sie auf die echte Domain, den Teil direkt vor dem ersten einfachen Schrägstrich. Gibt sich eine Nachricht als Ihre Bank aus, die Domain gehört aber nicht der Bank, ist sie gefälscht. Dieses Tool findet die Domain für Sie, auch wenn sie versteckt ist."
      - q: "Der Prüfer hat keine Warnzeichen gefunden. Ist der Link sicher?"
        a: "Nicht unbedingt. Das sind Faustregeln, und neue Phishing-Seiten können unauffällig aussehen. Drängt Sie eine Nachricht zum Anmelden oder Bezahlen, öffnen Sie die App oder tippen Sie die Adresse selbst ein."
      - q: "Prüft es Links gegen eine Sperrliste?"
        a: "Nein. Der Link wird nirgendwohin gesendet, also kann er nicht in Online-Sperrlisten nachgeschlagen werden. Bewertet wird nur, was die Adresse selbst zeigt."
  look:
    about:
      - "Domainnamen dürfen Buchstaben aus jedem Alphabet enthalten. Das kyrillische „а“ sieht genau wie das lateinische „a“ aus, also ist аpple.com (mit kyrillischem а) eine andere Website als apple.com. Intern werden solche Namen als Punycode gespeichert, beginnend mit xn--, und genau das zeigt Ihnen dieses Tool."
      - "Es liest den Namen außerdem so, wie ein Mensch ihn liest, indem es ähnliche Buchstaben auf lateinische zurückführt, und prüft, ob das Ergebnis eine bekannte Marke nachahmt. Die Lookalike-Liste macht das Umgekehrte: Sie zeigt Tippfehler und Zeichentausch Ihrer eigenen Domain, damit Sie prüfen können, welche schon jemand registriert hat."
    faq:
      - q: "Was ist Punycode?"
        a: "Punycode ist die Schreibweise internationaler Domainnamen in reinem ASCII. So wird münchen.de zu xn--mnchen-3ya.de. Browser zeigen meist die lesbare Form, deshalb können Angreifer das ausnutzen."
      - q: "Was ist ein Homograph-Angriff?"
        a: "Eine gefälschte Domain aus Buchstaben, die genauso aussehen wie die echten, oft aus dem kyrillischen oder griechischen Alphabet, sodass die Adressleiste die echte Website zu zeigen scheint."
      - q: "Was ist Typosquatting?"
        a: "Das Registrieren von Tippfehlern einer bekannten Domain, etwa gooogle.com oder paypa1.com, um Menschen abzufangen, die sich vertippen oder nicht genau hinsehen."
  exif:
    about:
      - "Fotos enthalten Metadaten namens EXIF. Handyfotos speichern meist die GPS-Koordinaten des Aufnahmeorts, Datum und Uhrzeit, das Handymodell und manchmal eine Seriennummer oder den Namen des Besitzers. Viele Messenger entfernen das, E-Mail, Cloud-Links und manche Websites aber nicht."
      - "Dieses Tool liest diese Daten in Ihrem Browser und erstellt eine saubere Kopie. Bei JPEG, PNG und WebP schneidet es die Metadaten heraus, ohne das Bild neu zu komprimieren, die Qualität bleibt also gleich, und es behält nur die Drehung, damit das Foto nicht seitlich angezeigt wird. Andere Formate werden in ein neues Bild neu gezeichnet."
    faq:
      - q: "Wie entferne ich den Standort aus einem Foto?"
        a: "Wählen Sie oben das Foto aus und laden Sie die saubere Kopie herunter. Damit es künftig nicht passiert, schalten Sie in den Handy-Einstellungen den Standort für die Kamera-App aus."
      - q: "Verschlechtert es die Qualität meines Fotos?"
        a: "Bei JPEG, PNG und WebP nicht: Die Bilddaten werden unverändert übernommen. Andere Formate wie HEIC werden neu gezeichnet und neu gespeichert, was die Datei leicht verändern kann."
      - q: "Wird mein Foto hochgeladen?"
        a: "Nein. Das Foto wird auf Ihrem eigenen Gerät gelesen und bereinigt. Nichts wird hochgeladen, und die Sicherheitsrichtlinie der Seite verhindert jedes Senden."
  hid:
    about:
      - "Text kann Zeichen enthalten, die man nicht sieht: Leerzeichen ohne Breite, Richtungsumkehrungen, die Text umordnen, Buchstaben aus anderen Alphabeten, die lateinisch aussehen, und Unicode-„Tag“-Zeichen. Menschen sehen Tag-Zeichen nicht, viele KI-Modelle lesen sie aber als normalen Text. So lassen sich Anweisungen verstecken, bekannt als Prompt Injection."
      - "Der Finder zeigt jedes versteckte Zeichen, dekodiert versteckte Botschaften, listet Sätze, die sich an KI-Assistenten richten, und liefert eine bereinigte Kopie. Verbindungszeichen, die Urdu, Persisch und Emojis brauchen, bleiben erhalten."
    faq:
      - q: "Was ist Prompt Injection?"
        a: "Anweisungen, versteckt in Inhalten, die ein KI-Assistent liest, etwa einer Webseite oder E-Mail, die ihn dazu bringen sollen, seinen Nutzer zu ignorieren und etwas anderes zu tun, zum Beispiel Daten preiszugeben."
      - q: "Wie entferne ich Zeichen ohne Breite?"
        a: "Fügen Sie den Text oben ein, scannen Sie ihn und nutzen Sie „Bereinigten Text kopieren“. Unsichtbare Zeichen werden entfernt und ähnlich aussehende Buchstaben durch normale ersetzt."
      - q: "Warum enthält Text unsichtbare Zeichen?"
        a: "Manche sind harmlos und stammen aus kopierten PDFs oder Webseiten. Andere dienen als Wasserzeichen, zum Umgehen von Filtern oder um Anweisungen für KI-Modelle zu verstecken."
  hash:
    about:
      - "Ein Hash ist ein kurzer Fingerabdruck von Daten: Ändert sich ein Byte, ändert sich der ganze Hash. Software-Anbieter veröffentlichen den SHA-256-Hash ihrer Downloads, damit Sie prüfen können, dass Ihre Datei genau die veröffentlichte ist."
      - "SHA-Hashes berechnet die eingebaute Krypto-Bibliothek Ihres Browsers, MD5 diese Seite. Dateien werden auf Ihrem Gerät gelesen und nie hochgeladen, Sie können also auch große oder private Dateien hashen."
    faq:
      - q: "Wie prüfe ich den SHA-256 einer Datei?"
        a: "Wählen Sie „Datei“, nehmen Sie den Download und fügen Sie den Hash von der Website des Anbieters ins Vergleichsfeld ein. Stimmen sie überein, ist die Datei genau die veröffentlichte."
      - q: "Ist MD5 noch sicher?"
        a: "Nicht für Sicherheitszwecke: Man kann zwei verschiedene Dateien mit gleichem MD5 erzeugen. Um versehentliche Beschädigung zu erkennen, reicht es noch. Für alles Wichtige nehmen Sie SHA-256."
      - q: "Kann man einen Hash umkehren und den Text zurückbekommen?"
        a: "Nein, aber kurze oder häufige Eingaben wie Passwörter lassen sich durch Raten und Vergleichen finden. Deshalb sollten Passwörter mit langsamen Hashes wie bcrypt oder Argon2 gespeichert werden."
  jwt:
    about:
      - "Ein JSON Web Token besteht aus drei durch Punkte getrennten Teilen: Header, Payload und Signatur. Die ersten beiden sind nur Base64url-kodiert, nicht verschlüsselt, jeder mit dem Token kann sie lesen. Dieser Decoder zeigt beide und wandelt die Datumsangaben (exp, iat, nbf) in lesbare Zeiten um."
      - "Er markiert auch Einstellungen, die oft zu Schwachstellen führen: den Algorithmus „none“, fehlendes Ablaufdatum, sehr lange Gültigkeit, im Header genannte Schlüssel und Geheimnisse oder persönliche Daten im Payload."
    faq:
      - q: "Ist es sicher, hier ein Token einzufügen?"
        a: "Das Token wird nur in Ihrem Browser dekodiert und nie gesendet. Behandeln Sie echte Tokens trotzdem wie Passwörter und nehmen Sie lieber Test-Tokens."
      - q: "Warum wird die Signatur nicht geprüft?"
        a: "Dafür braucht man den geheimen oder öffentlichen Schlüssel des Servers. Ohne ihn kann kein Tool sagen, ob ein Token echt ist."
      - q: "Sind JWTs verschlüsselt?"
        a: "Normale signierte JWTs (JWS) nicht. Nur JWE-Tokens sind verschlüsselt, und bei ihnen ist nur der Header lesbar."
  json:
    about:
      - "Fügen Sie JSON ein oder tippen Sie es, es wird laufend geprüft. Gültiges JSON wird mit der gewählten Einrückung formatiert oder auf eine Zeile minifiziert, und Sie können Schlüssel sortieren, um zwei Dokumente leichter zu vergleichen."
      - "Ist das JSON fehlerhaft, zeigt das Tool Zeile und Spalte des Fehlers mit einem Zeiger und nennt die üblichen Ursachen: einfache Anführungszeichen, Komma am Ende, Schlüssel ohne Anführungszeichen und Kommentare, die JSON alle nicht erlaubt."
    faq:
      - q: "Wie validiere ich JSON?"
        a: "Fügen Sie es oben ein. Eine grüne Meldung heißt gültig, eine rote zeigt genau, wo der erste Fehler liegt."
      - q: "Warum ist mein JSON ungültig?"
        a: "Meist wegen einfacher statt doppelter Anführungszeichen, eines Kommas nach dem letzten Element, Schlüsseln ohne Anführungszeichen oder Kommentaren. JSON ist strenger als JavaScript."
      - q: "Werden meine Daten an einen Server gesendet?"
        a: "Nein. Alles wird in Ihrem Browser verarbeitet, Sie können also auch API-Antworten oder Konfigurationsdateien mit privaten Daten formatieren."
  b64:
    about:
      - "Base64 schreibt beliebige Daten, Text oder Dateien, mit nur 64 sicheren Zeichen, damit sie durch E-Mail, JSON oder URLs reisen können. Es ist eine Kodierung, keine Verschlüsselung: Jeder kann es dekodieren."
      - "Text wird zuerst in UTF-8 umgewandelt, so überstehen Umlaute, andere Schriften und Emojis den Hin- und Rückweg. Ist das Dekodierte kein Text, erkennt das Tool gängige Dateitypen (PNG, JPEG, PDF, ZIP) an den ersten Bytes, und Sie können die Datei herunterladen."
    faq:
      - q: "Ist Base64 eine Verschlüsselung?"
        a: "Nein. Es versteckt nichts, es ändert nur die Schreibweise der Daten. Nutzen Sie es nie zum Schutz von Passwörtern oder Geheimnissen."
      - q: "Was ist URL-sicheres Base64?"
        a: "Eine Variante mit - und _ statt + und /, meist ohne das =-Auffüllen, damit das Ergebnis in eine URL oder einen Dateinamen passt. JWTs nutzen sie."
      - q: "Wie wandle ich ein Bild in Base64 um?"
        a: "Wählen Sie „Datei“, nehmen Sie das Bild und kopieren Sie Base64 oder die ganze Data-URI, die Sie direkt in HTML oder CSS einfügen können."
  url:
    about:
      - "URLs dürfen nur bestimmte Zeichen enthalten. Leerzeichen, Umlaute und Zeichen wie & oder # müssen prozentkodiert werden (ein Leerzeichen wird zu %20), sonst bricht der Link oder ändert seine Bedeutung."
      - "Kodieren macht Text zu einem sicheren Linkteil. Ganze URL kodieren lässt die Zeichen stehen, die einer URL ihre Struktur geben (: / ? & =). Dekodieren macht %-Codes wieder lesbar, und die Teilansicht zeigt Host, Pfad und jeden Query-Parameter dekodiert."
    faq:
      - q: "Was ist der Unterschied zwischen Kodieren und Ganze URL kodieren?"
        a: "Kodieren (encodeURIComponent) maskiert alles außer Buchstaben, Ziffern und wenigen Zeichen, für einen einzelnen Parameterwert. Ganze URL kodieren (encodeURI) lässt die Strukturzeichen in Ruhe, für eine ganze Adresse."
      - q: "Warum bedeutet ein + manchmal ein Leerzeichen?"
        a: "HTML-Formulare kodieren Leerzeichen als +. Schalten Sie „Leerzeichen als +“ ein, wenn Sie Formulardaten oder Such-URLs dekodieren."
      - q: "Warum einen Link vor dem Klicken dekodieren?"
        a: "Phishing-Links verstecken das echte Ziel oft in kodiertem Text oder einem Weiterleitungsparameter. Dekodieren zeigt, wohin er wirklich führt."
  ts:
    about:
      - "Ein Unix-Zeitstempel zählt die Sekunden seit dem 1. Januar 1970, Mitternacht UTC. Viele Systeme nutzen stattdessen Millisekunden (JavaScript, Java), manche Mikro- oder Nanosekunden, daher errät der Umrechner die Einheit aus der Länge der Zahl."
      - "Ergebnisse erscheinen in UTC, in Ihrer eigenen Zeitzone, als ISO 8601 und relativ zu jetzt. Sie können auch ein Datum mit Uhrzeit wählen, um seinen Zeitstempel zu bekommen."
    faq:
      - q: "Wie wandle ich einen Unix-Zeitstempel in ein Datum um?"
        a: "Fügen Sie ihn oben ein. 10 Ziffern sind meist Sekunden, 13 Ziffern Millisekunden."
      - q: "Was ist das Jahr-2038-Problem?"
        a: "Systeme, die Unix-Zeit als vorzeichenbehaftete 32-Bit-Zahl speichern, laufen am 19. Januar 2038 um 03:14:07 UTC über (Zeitstempel 2147483647). Die meisten modernen Systeme nutzen 64 Bit."
      - q: "Hat ein Unix-Zeitstempel eine Zeitzone?"
        a: "Nein. Er steht überall für denselben Moment; nur die Anzeige hängt von der Zeitzone ab."
  uuid:
    about:
      - "Eine UUID ist eine 128-Bit-Kennung. Version 4 ist komplett zufällig (122 Zufallsbits) und verrät nichts. Version 7, 2024 in RFC 9562 standardisiert, beginnt mit der Zeit in Millisekunden, neue IDs sortieren sich also der Reihe nach, was Datenbankindizes schnell hält."
      - "Alle IDs entstehen mit dem sicheren Zufallsgenerator Ihres Browsers. Der Prüfer liest Version und Variante jeder UUID und zeigt bei zeitbasierten (v1, v6, v7), wann sie erzeugt wurden."
    faq:
      - q: "UUID v4 oder v7?"
        a: "Nehmen Sie v7 für Datenbankschlüssel und alles, was nach Erstellungszeit sortiert sein soll. Nehmen Sie v4, wenn die ID nicht verraten soll, wann sie entstand."
      - q: "Können zwei UUIDs gleich sein?"
        a: "Praktisch nein. Bei v4 müssten Sie viele Jahre lang Milliarden pro Sekunde erzeugen, bevor eine Kollision wahrscheinlich wird."
      - q: "Eignen sich UUIDs als geheime Tokens?"
        a: "Zufällige v4-UUIDs sind schwer zu erraten, sind aber nicht als Geheimnis gedacht. Zeitbasierte Versionen sind teilweise vorhersagbar, und v1 kann die MAC-Adresse einer Netzwerkkarte enthalten. Nehmen Sie für Geheimnisse ein eigenes Zufallstoken."

  web:
    about:
      - "Der Check lädt Ihre Seite einmal, so wie ein Browser, und liest Sicherheits-Header, Cookies, HTML und die kleinen öffentlichen Dateien drumherum (robots.txt, sitemap.xml, security.txt). Er fragt die SPF-, DMARC- und DKIM-Einträge Ihrer Domain ab, lässt Google PageSpeed Insights Lighthouse für Mobil und Desktop ausführen, holt eine Header-Note vom HTTP Observatory von Mozilla und, wenn eingeschaltet, eine TLS-Note von Qualys SSL Labs. Außerdem prüft er bis zu 50 Links der Seite auf Fehler und vergleicht die gefundenen JavaScript-Bibliotheken mit der Retire.js-Liste bekannter Schwachstellen."
      - "Jedes Problem bekommt einen Schweregrad von Kritisch bis Niedrig, eine verständliche Erklärung und die Lösung. Aus den Bereichsnoten ergibt sich eine Gesamtpunktzahl von 100 und eine Note von A bis F. Ergebnisse für dieselbe Adresse werden ein paar Stunden wiederverwendet, um in den kostenlosen API-Grenzen zu bleiben, und jeder Bericht wird samt Adresse nach einer Woche automatisch gelöscht."
    faq:
      - q: "Ist es sicher und erlaubt, eine Website mit diesem Tool zu prüfen?"
        a: "Die Prüfungen sind passiv: Das Tool liest dieselbe öffentliche Seite, dieselben Header und DNS-Einträge wie jeder Browser, dazu einige Links. Es greift nichts an und meldet sich nirgends an. Prüfen Sie trotzdem nur Websites, die Ihnen gehören oder die Sie testen dürfen."
      - q: "Warum ist meine Punktzahl niedriger als bei anderen Tools?"
        a: "Dieser Bericht verbindet Sicherheit, Geschwindigkeit, SEO, Barrierefreiheit, Design und Technik. Ein schwacher Bereich zieht die Gesamtnote nach unten. In jedem Bereich sehen Sie genau, was Punkte gekostet hat, angefangen bei den Top 5."
      - q: "Was bedeuten die Noten?"
        a: "A ist 90 oder mehr, B 80 bis 89, C 70 bis 79, D 60 bis 69 und F unter 60. Ein kritisches Sicherheitsproblem begrenzt die Sicherheitsnote auf unter 50."
      - q: "Wie teile oder speichere ich den Bericht?"
        a: "Mit „Link zum Teilen kopieren“ schicken Sie ihn weiter, mit „Als PDF herunterladen“ speichern Sie ihn. Geteilte Links funktionieren, bis der Bericht eine Woche nach der Prüfung gelöscht wird."
      - q: "Warum kann ich meine lokale oder interne Website nicht prüfen?"
        a: "Private und interne Adressen (wie 192.168.x.x, 10.x.x.x oder localhost) sind absichtlich gesperrt, damit niemand über das Tool Netzwerke hinter einer Firewall erreicht."
