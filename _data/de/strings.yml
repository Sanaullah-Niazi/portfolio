so_prog_title: Große Programme, die jedes Jahr öffnen
so_prog_lede: Bekannte Stipendien und Fellowships, die jedes Jahr wiederkommen. Manche gibt es nur für Sicherheit; die anderen stehen allen Fächern offen, also auch Studierenden der IT-Sicherheit. Die Termine ändern sich jedes Jahr, daher bitte die offizielle Seite prüfen.
so_security_only: Nur Sicherheit
so_official: Offizielle Seite
so_link_checked: Link geprüft am
so_about_title: So entsteht diese Liste
so_about_1: Jeden Tag liest ein kleines Programm dieser Website die öffentlichen Feeds der unten genannten Stellenbörsen und Stipendienseiten. Es behält nur Ausschreibungen zur Sicherheit, die eine PhD-, Master-, Stipendien-, Fellowship- oder Postdoc-Stelle sind, liest die Frist aus der Ausschreibung und entfernt alles, was abgelaufen ist. Ausschreibungen ohne Frist werden nach 45 Tagen entfernt.
so_about_2: Es liest nur, was diese Seiten für alle zum Abonnieren veröffentlichen, und prüft vorher die Regeln jeder Seite für Bots (robots.txt). Nichts wird erfunden; jeder Eintrag verlinkt seine Originalausschreibung. Die Zahl in Klammern zeigt, wie viele offene Ausschreibungen aus jeder Quelle stammen.
so_limits_title: Was sie nicht sieht
so_limit_1: Ausschreibungen, die nur auf der Seite eines Professors, in einer Mailingliste oder in sozialen Medien stehen und nie eine Stellenbörse erreichen.
so_limit_2: Seiten ohne Feed oder die Bots das Lesen untersagen, etwa EURAXESS, LinkedIn und die meisten nationalen Portale in China, Japan und Korea. Dafür die jährlichen Programme unten nutzen und selbst dort suchen.
so_limit_3: Die Frist wird aus dem Text der Ausschreibung gelesen. Ist sie ungewöhnlich geschrieben, kann sie fehlen, daher immer die Originalseite prüfen.
so_limit_4: Gebiet und Land werden aus den Worten der Ausschreibung abgeleitet, daher kann gelegentlich etwas falsch einsortiert sein.
so_check_note: Vor der Bewerbung immer die Originalausschreibung lesen. Finanzierung, Voraussetzungen und Fristen legt die Universität oder der Geldgeber fest, nicht diese Website.
so_in_english: Die Ausschreibungen werden auf Englisch angezeigt, wie ihre Quellen sie veröffentlichen.
