hack_questions:
  - q: "Wie viele Ihrer Konten haben dasselbe Passwort?"
    a: ["Keins, jedes Konto hat sein eigenes", "Ein paar", "Die meisten", "Ein Passwort für alles"]
    fix: "Geben Sie jedem Konto ein eigenes Passwort. Ein Passwort-Manager merkt sie sich für Sie, Sie brauchen dann nur noch ein starkes Master-Passwort."
  - q: "Nutzen Sie die Zwei-Faktor-Anmeldung (Code per SMS oder Authenticator-App) für E-Mail und WhatsApp?"
    a: ["Ja, bei allen wichtigen Konten", "Bei manchen", "Was ist das?"]
    fix: "Schalten Sie die Zwei-Faktor-Anmeldung für E-Mail, WhatsApp und Bank ein. Selbst mit Ihrem gestohlenen Passwort kommt dann niemand hinein."
  - q: "Ihr wichtigstes Passwort sieht am ehesten so aus:"
    a: ["Ein langer Satz wie mango-fluss-tiger-wolke", "So etwas wie P@ssw0rt!", "Name und Geburtsjahr, wie Anna1998", "123456 oder passwort"]
    fix: "Nutzen Sie eine lange Passphrase aus vier oder mehr zufälligen Wörtern. Namen, Geburtsjahre und Sonderzeichen statt Buchstaben probieren Angreifer zuerst."
  - q: "Eine SMS sagt: „Ihr Paket wird zurückgehalten, zahlen Sie hier 1,99 €“ und enthält einen Link. Sie..."
    a: ["Ignorieren sie und schauen in der App des Paketdienstes nach", "Öffnen den Link, nur um zu sehen", "Zahlen, sind ja nur 1,99 €"]
    fix: "Zahlen oder melden Sie sich nie über einen Link in einer unerwarteten Nachricht an. Öffnen Sie die offizielle App oder tippen Sie die Adresse selbst ein."
  - q: "Jemand ruft „von Ihrer Bank“ an und fragt nach dem Code, den Sie gerade per SMS bekommen haben."
    a: ["Auflegen, Banken fragen nie danach", "Erst einen Beweis verlangen, wer dran ist", "Vorlesen, klingt ja offiziell"]
    fix: "Geben Sie einen Einmal-Code nie weiter, auch nicht an jemanden, der Ihren Namen und Ihre Kontodaten kennt. Dieser Code ist der Schlüssel zu Ihrem Konto."
  - q: "Im kostenlosen WLAN im Café oder am Flughafen..."
    a: ["Nutze ich für alles Private mobile Daten oder ein VPN", "Surfe ich, aber ohne Online-Banking", "Mache ich alles, auch Banking"]
    fix: "Nutzen Sie im öffentlichen WLAN für Banking und Anmeldungen mobile Daten, und installieren Sie nichts, wenn ein Hotspot Sie dazu auffordert."
  - q: "Ihr Handy meldet „Update verfügbar“. Sie..."
    a: ["Installieren es am selben Tag", "Tippen ein paar Wochen lang auf Später", "Tippen für immer auf Später"]
    fix: "Installieren Sie Updates so bald wie möglich. Die meisten schließen Sicherheitslücken, die Angreifer schon kennen."
  - q: "Woher installieren Sie Apps?"
    a: ["Nur aus dem offiziellen Play Store oder App Store", "Meist aus dem Store, manchmal eine APK, die mir jemand schickt", "Von da, wo es die kostenlose oder gemoddete Version gibt"]
    fix: "Installieren Sie Apps nur aus dem offiziellen Store. Gemoddete Apps und APKs aus Chats sind einer der einfachsten Wege zu Spyware."
  - q: "Ihr Social-Media-Profil zeigt..."
    a: ["Sehr wenig, und es ist privat", "Ein paar Fotos, nur für Freunde", "Geburtstag, Schule, Name des Haustiers und Telefonnummer, alles öffentlich"]
    fix: "Stellen Sie Ihr Profil auf privat und verbergen Sie Geburtstag, Schule und Haustiernamen: Das sind typische Sicherheitsfragen. Entfernen Sie vor dem Posten den versteckten Standort aus Fotos."
  - q: "Wenn Ihr Handy heute gestohlen würde..."
    a: ["Es ist mit PIN oder Fingerabdruck gesperrt und gesichert", "Es ist gesperrt, aber nichts ist gesichert", "Es hat gar keine Bildschirmsperre"]
    fix: "Richten Sie eine Bildschirmsperre ein (eine PIN mit mindestens sechs Ziffern) und schalten Sie Backups ein, dann ist ein verlorenes Handy nur ein verlorenes Handy."
  - q: "Haben Sie schon einmal geprüft, ob Ihr Passwort bei einem Datenleck veröffentlicht wurde?"
    a: ["Ja, und ich habe die betroffenen geändert", "Nein, würde ich aber gern", "Noch nie davon gehört"]
    fix: "Prüfen Sie, ob Ihre Passwörter schon in einer Leak-Liste stehen, und ändern Sie diese. Geleakte Passwörter werden innerhalb von Tagen auf allen Seiten ausprobiert."
