scam_rules_title: "5 Regeln, die fast jeden Betrug stoppen"
scam_rules:
  - "Keine echte Bank, Wallet oder Firma fragt nach Ihrem Einmalcode, Ihrer PIN oder Ihrem Passwort. Niemals."
  - "Prüfen Sie den Absender. Eine Bank, Wallet oder ein Kurier, der von einer normalen Handynummer schreibt, ist ein Warnsignal."
  - "Zahlen Sie nie eine Gebühr, um einen Gewinn, eine Erstattung, einen Job oder staatliche Hilfe zu bekommen."
  - "Nutzen Sie nie den Link in einer Nachricht. Öffnen Sie die offizielle App oder tippen Sie die Adresse selbst ein."
  - "Eine „neue Nummer“ will Geld? Rufen Sie die alte Nummer an, bevor Sie etwas schicken."
