hack_info:
  about:
    - "Dieses Quiz prüft die Alltagsgewohnheiten, die über die meisten echten Hacks entscheiden: wiederverwendete und schwache Passwörter, fehlende Zwei-Faktor-Anmeldung, Betrugslinks und -anrufe, veraltete Software, inoffizielle Apps und zu viel Preisgegebenes. Jede Antwort bringt Punkte, und Ihr Wert zeigt, wie viele Risikopunkte Sie vom Maximum gesammelt haben."
    - "Angreifer brechen selten mit cleverem Code ein. Die meisten Konten werden mit einem geleakten Passwort, einem falschen Link oder einem Anruf übernommen, der nach einem Code fragt. Deshalb zählen kleine Gewohnheiten mehr als teure Tools."
    - "Ihre Antworten werden nur auf dieser Seite in Ihrem Browser verwendet. Nichts wird gesendet oder gespeichert, außer Ihrem besten Ergebnis, das auf Ihrem eigenen Gerät bleibt."
  faq:
    - q: "Werden meine Daten irgendwohin gesendet?"
      a: "Nein. Das Quiz läuft vollständig in Ihrem Browser. Ihre Antworten werden nie gesendet, nur Ihr bestes Ergebnis bleibt auf Ihrem Gerät, damit Sie es später schlagen können."
    - q: "Wie wird der Wert berechnet?"
      a: "Jede Antwort bringt 0 bis 3 Risikopunkte, je nachdem, wie oft diese Gewohnheit zu echten Kontoübernahmen führt. Ihr Wert ist Ihre Punktzahl in Prozent des Maximums: 0 % ist perfekt, 100 % das größtmögliche Risiko."
    - q: "Wie senke ich meinen Wert schnell?"
      a: "Schalten Sie die Zwei-Faktor-Anmeldung für E-Mail und WhatsApp ein, verwenden Sie Passwörter nicht mehrfach und geben Sie nie Einmal-Codes weiter. Diese drei Schritte verhindern die meisten Kontoübernahmen."
