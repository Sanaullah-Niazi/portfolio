daily_info:
  about:
    - "Jeden Tag gibt es ein neues Rätsel, und alle, die an diesem Tag spielen, bekommen dasselbe. So können Sie Ihr Ergebnis mit Freunden vergleichen. Jedes Rätsel ist eine von fünf Arten: den falschen Link finden, den falschen E-Mail-Absender finden, ein Passwort aus einem Profil knacken, eine verschleierte Nachricht entschlüsseln oder das stärkste Passwort wählen."
    - "Sie haben drei Versuche. Nach jedem falschen Versuch gibt es einen Tipp. Am Ende sehen Sie, warum jede Antwort richtig oder falsch war, und eine kurze Lektion, die Sie sofort anwenden können."
    - "Ihre Ergebnisse und Ihre Serie werden nur in Ihrem eigenen Browser gespeichert. Nichts wird irgendwohin gesendet, und Sie brauchen kein Konto."
  faq:
    - q: "Wann kommt das nächste Rätsel?"
      a: "Jeden Tag um Mitternacht in Ihrer eigenen Zeitzone startet ein neues Rätsel. Der Countdown unter Ihrem Ergebnis zeigt, wie lange es noch dauert."
    - q: "Warum hat ein Freund ein anderes Rätsel als ich?"
      a: "Alle am selben Datum bekommen dasselbe Rätsel. Ist Ihr Freund in einer Zeitzone, in der schon der nächste Tag begonnen hat, sieht er das nächste Rätsel zuerst. Geteilte Links öffnen genau das Rätsel, das Ihr Freund gespielt hat."
    - q: "Kann ich alte Rätsel spielen?"
      a: "Ja. Wenn Sie fertig sind, spielen Sie mit dem Button das Rätsel davor. Alte Rätsel sind gutes Training, zählen aber nicht für Ihre Serie."
    - q: "Wie halte ich meine Serie?"
      a: "Knacken Sie jeden Tag das Rätsel. Ein verpasster Tag oder ein nicht geknacktes Rätsel setzt die Serie auf null zurück. Die Serie wird in diesem Browser gespeichert, spielen Sie also auf demselben Handy oder Computer."

