tagline: "تحقیق کا ابتدائی مرحلہ · ایم ایس مصنوعی ذہانت"
headline: "مصنوعی ذہانت × سائبر سیکیورٹی: ایسے ذہین نظام بنانا جو خطرات، فراڈ اور مصنوعی ذہانت سے لکھے گئے مواد کی نشاندہی کریں۔"
intro: "میں مصنوعی ذہانت میں ایم ایس کے بعد تحقیق کے ابتدائی مرحلے میں ہوں۔ میرا کام مشین لرننگ اور این ایل پی کے ایسے ماڈل بنانا ہے جو اصل اور نقل میں فرق کریں: مصنوعی ذہانت کی لکھی تحریر اور انسانی تحریر، فراڈ اور عام لین دین، دھوکے کے پیغامات اور اصل پیغامات۔ آگے میرا ہدف خود مصنوعی ذہانت کے نظاموں کو محفوظ بنانا ہے۔"
