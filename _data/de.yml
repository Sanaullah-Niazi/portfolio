tool_hid_lede: "Text kann Zeichen enthalten, die man nicht sieht: Leerzeichen ohne Breite, Richtungsumkehr, ähnlich aussehende Buchstaben und unsichtbare „Tag“-Zeichen, die KI-Modelle trotzdem lesen. Fügen Sie Text aus einer E-Mail, Webseite oder einem Dokument ein, bevor Sie ihn einem KI-Assistenten geben."
