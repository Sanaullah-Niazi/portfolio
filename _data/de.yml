tagline: "Am Anfang der Forschungslaufbahn · MS Künstliche Intelligenz"
headline: "KI × Cybersicherheit: intelligente Systeme, die Bedrohungen, Betrug und KI-generierte Inhalte erkennen."
intro: "Ich habe einen MS in Künstlicher Intelligenz und stehe am Anfang meiner Forschungslaufbahn. Ich entwickle Machine-Learning- und NLP-Modelle, die Echtes von Gefälschtem unterscheiden: KI-generierten von menschlichem Text, Betrug von normalen Transaktionen, Scam-Nachrichten von echten. Als Nächstes möchte ich KI-Systeme selbst sicher machen."
