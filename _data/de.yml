tool_ph_lede: "Fügen Sie einen Link oder eine ganze Nachricht mit Links ein. Es zeigt, wohin jeder Link wirklich führt, und die Warnzeichen, auf die ich in meiner Phishing-Forschung achte. Der Link wird nie geöffnet."
