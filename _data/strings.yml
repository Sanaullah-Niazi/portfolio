so_terms_title: "Words to search for"
so_terms_text: "Funded positions are called many things. Search for these together with \"security\", \"cyber\", \"privacy\" or \"cryptography\":"
so_verify_title: "Before you apply: is it real?"
so_verify_1: "Find the same opening on the university's, lab's or funder's own website. A LinkedIn post or a listing site is not the source."
so_verify_2: "Apply only through the university's own admissions or job portal."
so_verify_3: "Check what is paid: tuition, a monthly stipend or salary, insurance, travel. A place without funding is not a scholarship."
so_verify_4: "Check that your nationality and degree are accepted. Some awards are only for citizens."
so_verify_5: "Check the deadline on the original page, not on a copy."
so_verify_6: "Never pay anyone to \"guarantee\" a scholarship, admission or selection. Real funders don't ask for that."
so_about_title: How this list works
so_about_1: Every day a small program on this site reads the public feeds of the job boards and scholarship sites below. It keeps only postings that are about security and are a PhD, master's, scholarship, fellowship or postdoc, reads the deadline from the posting, and removes anything that has closed. Postings with no deadline are removed after 45 days.
so_about_2: It only reads what these sites publish for anyone to subscribe to, and it checks each site's rules for bots (robots.txt) first. Nothing is invented; every entry links to its original posting. Numbers in brackets are how many open postings came from each source.
so_about_3: Each posting shows the last day its source still listed it, and the button takes you straight to the original posting to read the details and apply. When a source lists every open position (like IACR), a posting it takes down is removed here the next day.
so_limits_title: What it can't see
so_limit_1: Postings that are only on a professor's own page, a mailing list or social media, and never reach a job board.
so_limit_2: Sites that don't offer a feed or that ask bots not to read them, such as EURAXESS, LinkedIn and most national portals in China, Japan and Korea. For those, use the yearly programmes below and search the sites yourself.
so_limit_3: The deadline is read from the posting's text. If a posting writes it in an unusual way it may be missing, so always check the original page.
so_limit_4: The area and country are worked out from the posting's words, so now and then one may be filed in the wrong place.
so_check_note: Always read the original posting before you apply. Funding, eligibility and deadlines are decided by the university or funder, not by this site.
so_in_english: Postings are shown in English, as their sources publish them.
