daily_info:
  about:
    - "Every day there's one new puzzle, and everyone who plays that day gets the same one, so you can compare results with friends. Each puzzle is one of five kinds: spot the fake link, spot the fake email sender, crack a password from someone's profile, decode a scrambled message, or pick the strongest password."
    - "You get three tries. Every wrong try shows a hint. When you're done, you see why each answer was right or wrong, and a one-line lesson you can use straight away."
    - "Your results and streak are saved only in your own browser. Nothing is sent anywhere, and there's no account to make."
  faq:
    - q: "When does the next puzzle come out?"
      a: "A new puzzle starts every day at midnight, in your own time zone. The countdown under your result shows how long is left."
    - q: "Why is a friend's puzzle different from mine?"
      a: "Everyone on the same date gets the same puzzle. If your friend is in a time zone that's already on the next day, they'll see the next puzzle first. Shared links open the exact puzzle your friend played."
    - q: "Can I play old puzzles?"
      a: "Yes. After you finish, use the button to play the puzzle before it. Old puzzles are fun practice but don't count toward your streak."
    - q: "How do I keep my streak?"
      a: "Crack the puzzle every day. A missed day or a puzzle you couldn't crack starts the streak again from zero. The streak lives in this browser, so play on the same phone or computer."
