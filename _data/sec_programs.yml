# Big scholarship, fellowship and PhD programmes that open again every year, shown on /scholarships/ under the
# daily list. Each link goes to the programme's own official page. scripts/security_opportunities.py opens every
# link once a day; a link that fails three days running is hidden until it works again (check it and fix the url).
# Dates change every year, so none are written here: the page sends people to the official page for this year's.
#
#   id:       unique, lowercase
#   url:      the official page (keep it the first key after id; the daily check reads it)
#   name:     the programme's own name
#   by:       who runs or funds it
#   where:    region id (uk, europe, usa, canada, china, asia, middleeast, oceania, africa, latam, global)
#   country:  two-letter country code (ISO 3166), when the programme is in one country
#   levels:   any of masters, phd, postdoc, fellowship, scholarship
#   security: true if it is only for security; false if it is open to all fields (security students can apply)
#   note:     one plain sentence on who it is for (English)

# --- Security only ---
- id: sfs
  url: https://sfs.opm.gov/
  name: CyberCorps Scholarship for Service (SFS)
  by: US National Science Foundation and Office of Personnel Management
  where: usa
  country: US
  levels: [masters, phd, scholarship]
  security: true
  note: Pays tuition and a stipend for cybersecurity degrees at partner US universities, in return for working in US government cybersecurity after graduating. For US citizens.

