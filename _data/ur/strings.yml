so_about_title: یہ فہرست کیسے بنتی ہے
so_about_1: ہر روز اس سائٹ کا ایک چھوٹا پروگرام نیچے دیے گئے جاب بورڈز اور اسکالرشپ سائٹس کی پبلک فیڈز پڑھتا ہے۔ یہ صرف وہ اشتہار رکھتا ہے جو سکیورٹی کے بارے میں ہوں اور پی ایچ ڈی، ماسٹرز، اسکالرشپ، فیلوشپ یا پوسٹ ڈاک ہوں، اشتہار سے آخری تاریخ پڑھتا ہے، اور بند ہو جانے والے ہٹا دیتا ہے۔ بغیر آخری تاریخ والے اشتہار 45 دن بعد ہٹ جاتے ہیں۔
so_about_2: یہ صرف وہی پڑھتا ہے جو یہ سائٹس سب کے لیے شائع کرتی ہیں، اور پہلے ہر سائٹ کے بوٹس کے اصول (robots.txt) چیک کرتا ہے۔ کچھ بھی گھڑا نہیں جاتا؛ ہر اندراج اپنے اصل اشتہار سے جڑا ہے۔ قوسین میں نمبر بتاتا ہے کہ ہر ذریعے سے کتنے کھلے اشتہار آئے۔
so_about_3: ہر اشتہار پر وہ آخری دن لکھا ہے جب اس کا ذریعہ اسے دکھا رہا تھا، اور بٹن آپ کو سیدھا اصل اشتہار پر لے جاتا ہے جہاں آپ تفصیل پڑھ کر درخواست دے سکتے ہیں۔ جو ذریعہ تمام کھلی پوزیشنیں دکھاتا ہے (جیسے IACR)، وہاں سے ہٹایا گیا اشتہار یہاں سے بھی اگلے دن ہٹ جاتا ہے۔
so_limits_title: یہ کیا نہیں دیکھ سکتا
so_limit_1: وہ اشتہار جو صرف کسی پروفیسر کے اپنے صفحے، میلنگ لسٹ یا سوشل میڈیا پر ہوں اور کسی جاب بورڈ تک نہ پہنچیں۔
so_limit_2: وہ سائٹس جو فیڈ نہیں دیتیں یا بوٹس کو پڑھنے سے منع کرتی ہیں، جیسے EURAXESS، LinkedIn اور چین، جاپان اور کوریا کے زیادہ تر قومی پورٹل۔ ان کے لیے نیچے سالانہ پروگرام استعمال کریں اور خود بھی تلاش کریں۔
so_limit_3: آخری تاریخ اشتہار کے متن سے پڑھی جاتی ہے۔ اگر کسی اشتہار میں یہ عجیب طریقے سے لکھی ہو تو رہ سکتی ہے، اس لیے ہمیشہ اصل صفحہ دیکھیں۔
so_limit_4: شعبہ اور ملک اشتہار کے الفاظ سے اندازہ لگا کر طے ہوتے ہیں، اس لیے کبھی کبھار کوئی غلط جگہ لگ سکتا ہے۔
so_check_note: اپلائی کرنے سے پہلے ہمیشہ اصل اشتہار پڑھیں۔ فنڈنگ، اہلیت اور آخری تاریخ یونیورسٹی یا فنڈ دینے والا طے کرتا ہے، یہ سائٹ نہیں۔
so_in_english: اشتہارات انگریزی میں دکھائے گئے ہیں، جیسے ان کے ذرائع شائع کرتے ہیں۔
