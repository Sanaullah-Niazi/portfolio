foot: "کسی فیس میں تبدیلی یا بند ہونے والا امتحان دیکھا؟"
back: "سب کیریئرز پر واپس جائیں"

tracks:
  soc:
    title: "سائبر سیکیورٹی اینالسٹ (بلیو ٹیم، SOC)"
    summary: "حملوں پر نظر رکھنا، الرٹس کی تحقیق کرنا اور واقعات پر ردِعمل دینا۔"
    steps:
      - note: "یہاں سے شروع کریں۔ اگر صرف ایک کا خرچ اٹھا سکتے ہیں تو Security+‎ کریں۔"
      - note: "ثابت کرتا ہے کہ آپ اینالسٹ کا کام کر سکتے ہیں۔ اگر مقامی کمپنیاں Microsoft کے ٹولز استعمال کرتی ہیں تو SC-200 چنیں۔"
      - note: "اختیاری، لیکن عملی امتحان آپ کی سی وی کو نمایاں کرتا ہے۔"
      - note: "تجربے کے بعد، بہتر ہے آجر خرچ اٹھائے۔"
      - note: "تقریباً پانچ سال بعد سینئر اور لیڈ عہدوں کے لیے۔"
  pentest:
    title: "ایتھیکل ہیکر (پینیٹریشن ٹیسٹر)"
    summary: "اجازت کے ساتھ سسٹمز میں داخل ہو کر مجرموں سے پہلے کمزوریاں ڈھونڈنا۔"
    steps:
      - note: "اختیاری، لیکن بنیادی باتیں سکھاتا ہے اور HR فلٹرز سے گزار دیتا ہے۔"
      - note: "آپ کا پہلا عملی ہیکنگ سرٹیفکیشن۔"
      - note: "حقیقی کام جیسے امتحان، مکمل رپورٹ کے ساتھ۔ دونوں OSCP کی اچھی تیاری کرواتے ہیں۔"
      - note: "وہ سرٹیفکیشن جو زیادہ تر پین ٹیسٹ نوکریوں کے اشتہار میں نام لے کر مانگا جاتا ہے۔"
      - note: "صرف تب کریں جب آپ کی مطلوبہ نوکریاں اسے مانگیں؛ کئی سرکاری نوکریاں مانگتی ہیں۔"
  grc:
    title: "سیکیورٹی مینیجر اور گورننس (GRC)"
    summary: "سیکیورٹی ٹیموں کی قیادت، رسک کا انتظام، پالیسی لکھنا اور آڈٹ سنبھالنا۔"
    steps:
      - note: "مشترکہ بنیاد۔"
      - note: "امتحان جلدی پاس کریں اور تجربہ حاصل کرنے کے دوران Associate of ISC2 بنیں۔"
      - note: "مینجمنٹ عہدوں کے لیے۔"
      - note: "نیا: AI سسٹمز کی گورننس اور سیکیورٹی۔"
  cloud:
    title: "کلاؤڈ انجینئر اور کلاؤڈ سیکیورٹی"
    summary: "AWS یا Microsoft Azure پر سسٹمز بنانا اور محفوظ کرنا۔ ایک کلاؤڈ چنیں اور اسی پر رہیں۔"
    steps:
      - note: "اختیاری پہلا قدم۔"
      - note: "وہ سرٹیفکیشن جو کلاؤڈ کمپنیاں دیکھتی ہیں۔"
      - note: "کلاؤڈ سیکیورٹی کی نوکریوں کے لیے یہ بھی کریں۔"
  ai:
    title: "AI اور مشین لرننگ انجینئر"
    summary: "AI سسٹمز بنانا، چلانا اور محفوظ کرنا۔ AI میں مضبوط پروجیکٹ پورٹ فولیو کسی بھی سرٹیفکیشن سے زیادہ اہم ہے۔"
    steps:
      - note: "اختیاری بنیادی باتیں۔"
      - note: "ثابت کرتا ہے کہ آپ ماڈلز اور AI ایپس کو پروڈکشن میں لا سکتے ہیں۔"
      - note: "ایک معتبر اعلیٰ سرٹیفکیشن۔"
      - note: "AI سیکیورٹی اور گورننس کی نوکریوں کے لیے، CISSP یا CISM کے بعد۔"
  data:
    title: "ڈیٹا اینالسٹ اور ڈیٹا انجینئر"
    summary: "ڈیٹا کو جوابات میں بدلنا، اور ان کے پیچھے پائپ لائنز بنانا۔"
    steps:
      - note: "ڈیٹا اینالسٹ کے لیے سب سے مفید پہلا سرٹیفکیشن۔"
      - note: "ڈیٹا انجینئرنگ کی طرف جانے کے لیے۔"
      - note: "اعلیٰ سطح کا، اور جہاں کمپنیاں Google Cloud استعمال کرتی ہیں وہاں معروف۔"
  devops:
    title: "نیٹ ورکنگ اور ڈیو اوپس"
    summary: "نیٹ ورکس چلانا، انفراسٹرکچر خودکار بنانا اور سروسز کو چالو رکھنا۔"
    steps:
      - note: "نیٹ ورکنگ کا علم ہر IT کیریئر میں کام آتا ہے۔"
      - note: "سستا اور عملی۔"
      - note: "Kubernetes کی عملی مہارت۔"

certs:
  cc:
    cost: "$199 (One Million Certified کے غیر استعمال شدہ کوڈ کے ساتھ مفت، 31 دسمبر 2026 تک)"
    exam: "کثیر انتخابی سوالات، تقریباً 2 گھنٹے، ٹیسٹ سینٹر میں"
    valid: "3 سال، $50 سالانہ"
    needs: "کچھ نہیں"
    why: "ایک سستا پہلا قدم جو بنیادی علم ثابت کرتا ہے۔ اگر سیدھا Security+‎ کر رہے ہیں تو چھوڑ سکتے ہیں۔"
  secplus:
    exam: "زیادہ سے زیادہ 90 سوالات، کثیر انتخابی اور عملی، 90 منٹ"
    valid: "3 سال، ٹریننگ کریڈٹس اور $50 سالانہ سے تجدید"
    needs: "کوئی شرط نہیں؛ نیٹ ورکنگ کی بنیاد مدد دیتی ہے"
    why: "نوکری کے اشتہاروں میں سب سے زیادہ مانگا جانے والا ابتدائی سیکیورٹی سرٹیفکیشن، اور کئی سرکاری نوکریوں کے لیے قابلِ قبول۔"
  cysa:
    exam: "کثیر انتخابی اور عملی سوالات"
    valid: "3 سال، اس سے آپ کا Security+‎ بھی تجدید ہو جاتا ہے"
    needs: "Security+‎ کی سطح کا علم"
    why: "ثابت کرتا ہے کہ آپ لاگز پڑھ سکتے ہیں، الرٹس چھانٹ سکتے ہیں اور واقعات پر ردِعمل دے سکتے ہیں: SOC اینالسٹ کا روز کا کام۔"
  sc200:
    exam: "تقریباً 100 منٹ، مختلف قسم کے سوالات"
    valid: "1 سال، مفت آن لائن تجدید"
    needs: "کوئی شرط نہیں؛ Microsoft Sentinel اور Defender کا تجربہ مدد دیتا ہے"
    why: "اگر آپ کے آس پاس کی کمپنیاں Microsoft کے سیکیورٹی ٹولز استعمال کرتی ہیں، جو کئی کرتی ہیں، تو بہت فائدہ مند۔"
  cdsa:
    cost: "امتحان تقریباً $210، اور Academy سبسکرپشن الگ"
    exam: "7 دن کی عملی تحقیقات اور تحریری رپورٹ"
    needs: "HTB Academy پر SOC Analyst پاتھ مکمل کریں"
    why: "مکمل عملی، اس لیے اصل مہارت ثابت کرتا ہے۔ HR میں CySA+‎ جتنا معروف نہیں۔"
  gcih:
    cost: "صرف امتحان $999؛ SANS ٹریننگ کے ساتھ کہیں زیادہ"
    exam: "نگرانی میں، کثیر انتخابی اور عملی CyberLive سوالات"
    valid: "4 سال، تجدید $499"
    needs: "سیکیورٹی آپریشنز کا تجربہ"
    why: "انسیڈنٹ رسپانس میں بہت معتبر۔ عموماً تبھی فائدہ مند جب آجر خرچ اٹھائے۔"
  cissp:
    exam: "100 سے 150 ایڈاپٹو سوالات، زیادہ سے زیادہ 3 گھنٹے"
    valid: "3 سالہ دور، 120 ٹریننگ کریڈٹس اور $135 سالانہ"
    needs: "5 سال کا باقاعدہ سیکیورٹی تجربہ (پہلے امتحان پاس کر کے Associate of ISC2 بن سکتے ہیں اور بعد میں تجربہ پورا کر سکتے ہیں)"
    why: "سینئر سیکیورٹی اور مینجمنٹ عہدوں کا معیاری سرٹیفکیشن۔"
  ejpt:
    cost: "$249، ایک مفت دوبارہ کوشش سمیت"
    exam: "48 گھنٹے کی عملی لیب، 35 سوالات، کتاب کھول کر"
    valid: "3 سال"
    needs: "کچھ نہیں؛ نیٹ ورکنگ اور Linux کی بنیاد مدد دیتی ہے"
    why: "سب سے اچھا پہلا ہیکنگ سرٹیفکیشن: مناسب فیس اور مکمل عملی۔"
  pnpt:
    cost: "$499، ٹریننگ اور ایک مفت دوبارہ کوشش سمیت"
    exam: "5 دن نیٹ ورک پر حملہ، 2 دن رپورٹ لکھنا، پھر براہِ راست انٹرویو"
    valid: "کبھی ختم نہیں ہوتا"
    needs: "کوئی شرط نہیں؛ Windows اور Active Directory کی بنیاد"
    why: "اصل نوکری جیسا لگتا ہے: آپ Active Directory نیٹ ورک ہیک کرتے ہیں اور اپنی رپورٹ ممتحن کے سامنے بیان کرتے ہیں۔"
  cpts:
    cost: "امتحان تقریباً $210 (دو کوششیں)، اور Academy سبسکرپشن الگ"
    exam: "10 دن: کمپنی جیسے نیٹ ورک میں 14 میں سے 12 فلیگز حاصل کریں اور پیشہ ورانہ رپورٹ لکھیں"
    needs: "HTB Academy پر 28 ماڈیولز والا Penetration Tester پاتھ مکمل کریں"
    why: "درمیانی سطح کے سب سے مشکل اور عملی امتحانوں میں سے ایک۔ OSCP کی بہترین تیاری۔"
  oscp:
    cost: "$1,749 سے شروع (کورس اور امتحان کا پیکج)"
    exam: "تقریباً 24 گھنٹے عملی ہیکنگ، پھر رپورٹ لکھنے کے لیے 24 گھنٹے"
    valid: "OSCP عمر بھر کے لیے؛ \"+\" 3 سال کے لیے"
    needs: "پین ٹیسٹنگ کی پختہ مشق (PNPT یا CPTS کی سطح)"
    why: "سب سے مشہور پینیٹریشن ٹیسٹنگ سرٹیفکیشن۔ کئی پین ٹیسٹ اشتہار اسے نام لے کر مانگتے ہیں۔"
  ceh:
    cost: "$950 (آن لائن) یا $1,199 (ٹیسٹ سینٹر)، سرکاری ٹریننگ کے بغیر $100 مزید"
    exam: "125 کثیر انتخابی سوالات، 4 گھنٹے"
    valid: "3 سال، 120 ٹریننگ کریڈٹس اور $80 سالانہ"
    needs: "سرکاری ٹریننگ یا 2 سال کا سیکیورٹی تجربہ"
    why: "سرکاری اور خلیجی ملکوں کی نوکریوں میں اکثر مانگا جاتا ہے، لیکن یہ ہیکنگ کی مہارت نہیں، نظریہ جانچتا ہے۔ صرف تب کریں جب آپ کی مطلوبہ نوکریاں مانگیں۔"
  cism:
    cost: "ISACA ممبرز کے لیے $575، دوسروں کے لیے $760"
    exam: "150 کثیر انتخابی سوالات، 4 گھنٹے"
    valid: "3 سالہ دور، 120 ٹریننگ گھنٹے اور سالانہ فیس"
    needs: "سیکیورٹی میں 5 سال، جن میں 3 سال سیکیورٹی مینجمنٹ"
    why: "ان کے لیے جو سیکیورٹی پروگرامز کی قیادت کرتے ہیں، پالیسی لکھتے ہیں اور رسک سنبھالتے ہیں۔"
  aaism:
    cost: "ISACA ممبرز کے لیے $459، دوسروں کے لیے $599"
    exam: "کثیر انتخابی سوالات"
    needs: "فعال CISM یا CISSP"
    why: "2025 میں نیا: ثابت کرتا ہے کہ آپ AI سسٹمز کی گورننس اور سیکیورٹی کر سکتے ہیں۔ کم لوگوں کے پاس ہے، اس لیے نمایاں ہے۔"
  aws-ccp:
    exam: "65 کثیر انتخابی سوالات، 90 منٹ"
    valid: "3 سال"
    needs: "کچھ نہیں"
    why: "آسان آغاز جو کلاؤڈ کی اصطلاحات اور سروسز سکھاتا ہے۔ اگر آپ پہلے سے AWS پر کام کرتے ہیں تو چھوڑ دیں۔"
  az900:
    exam: "مختلف قسم کے سوالات، تقریباً 45 منٹ"
    valid: "کبھی ختم نہیں ہوتا"
    needs: "کچھ نہیں"
    why: "پہلے کلاؤڈ سرٹیفکیشن کا Azure ورژن۔ Microsoft اپنے Virtual Training Days میں اکثر مفت واؤچر دیتا ہے۔"
  aws-saa:
    exam: "65 کثیر انتخابی سوالات، 130 منٹ"
    valid: "3 سال"
    needs: "AWS پر کچھ عملی مشق"
    why: "زیادہ تر لوگوں کے لیے سب سے قیمتی کلاؤڈ سرٹیفکیشن۔ ہر جگہ آجر اسے جانتے ہیں۔"
  az104:
    exam: "مختلف قسم کے سوالات، کیس اسٹڈیز سمیت"
    valid: "1 سال، مفت آن لائن تجدید"
    needs: "Azure پر عملی مشق"
    why: "اصل سسٹمز چلانے کے لیے Azure کا بنیادی سرٹیفکیشن۔"
  aws-sec:
    exam: "کثیر انتخابی سوالات، تقریباً 3 گھنٹے"
    valid: "3 سال"
    needs: "AWS کا اصل تجربہ؛ پہلے کوئی Associate سرٹیفکیشن بہتر ہے"
    why: "ثابت کرتا ہے کہ آپ کلاؤڈ سسٹمز محفوظ کر سکتے ہیں، جو سب سے زیادہ مانگی جانے والی مہارتوں میں سے ہے۔"
  sc500:
    exam: "مختلف قسم کے سوالات"
    valid: "1 سال، مفت آن لائن تجدید"
    needs: "Azure ایڈمنسٹریشن کا تجربہ"
