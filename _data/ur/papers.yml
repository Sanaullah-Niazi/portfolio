# ہر مقالے کا اردو خلاصہ اور کلیدی الفاظ، _data/publications.yml کی bib_key کے مطابق۔ عنوانات انگریزی میں رہتے ہیں۔
khan2026fraud:
  summary: >-
    پاکستان میں فن ٹیک کمپنیوں، ڈیجیٹل بینکوں، ادائیگی کی خدمات اور سائبر سیکیورٹی فرموں کے 385 ماہرین کا سروے،
    جس کا تجزیہ SmartPLS 4 سے کیا گیا۔ نتیجہ یہ نکلا کہ مصنوعی ذہانت پر مبنی فراڈ کی پہچان، مشین لرننگ، فوری نگرانی
    اور غیر معمولی سرگرمی کی پہچان مل کر ڈیجیٹل مالی فراڈ سے مؤثر تحفظ دیتے ہیں۔
  keywords: [فراڈ کی پہچان, مشین لرننگ, غیر معمولی سرگرمی کی پہچان, فن ٹیک, سائبر سیکیورٹی]
khan2026safety:
  summary: >-
    مصنوعی ذہانت تیل اور گیس کی صنعت میں کام کی جگہ کے خطرات کے جائزے کو ردعمل کے بجائے پیشگی کیسے بنا سکتی ہے۔
    پیشہ ورانہ تحفظ اور مصنوعی ذہانت کے ماہرین کے سروے کا ریگریشن اور اسٹرکچرل ایکویشن ماڈلنگ سے تجزیہ کیا گیا، جس سے
    ظاہر ہوا کہ مصنوعی ذہانت کا استعمال اور پیشگی خطرات کا جائزہ بہتر حفاظتی نتائج سے گہرا تعلق رکھتے ہیں (ماڈل 69% فرق
    کی وضاحت کرتا ہے)۔ ڈیٹا کا معیار، لاگت اور ماہرین کی کمی اب بھی رکاوٹیں ہیں۔
  keywords: [مصنوعی ذہانت, پیشگوئی پر مبنی تجزیہ, خطرات کا جائزہ, پیشہ ورانہ تحفظ]
soomro2026genai:
  summary: >-
    412 طلبہ کا سروے، جس کا تجزیہ اسٹرکچرل ایکویشن ماڈلنگ سے کیا گیا۔ کاروباری تعلیم میں جنریٹو مصنوعی ذہانت کا
    استعمال ڈیجیٹل کاروبار شروع کرنے کے ارادے کو مضبوط کرتا ہے، جزوی طور پر طلبہ کے رویے کے ذریعے؛ یونیورسٹی کا معاون
