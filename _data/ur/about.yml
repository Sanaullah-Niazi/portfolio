journey:
  - title: پیشہ ورانہ تحفظ، صحت اور ماحولیات میں ڈپلوما
    note: خطرات، نقصانات اور بچاؤ
  - title: بی ایس انفارمیشن ٹیکنالوجی
    note: سیکیورٹی اور نیٹ ورکنگ کے پہلے کورس
  - title: ایم ایس مصنوعی ذہانت
    note: CGPA 3.66 · 3 مقالے · تحقیقی مقالہ
  - title: مصنوعی ذہانت × سائبر سیکیورٹی
    note: میری اگلی منزل
story:
  - میں بلوچستان کے شہر چمن میں پلا بڑھا۔ میرا راستہ سیدھا نہیں تھا۔ اسکول کے بعد میں نے پیشہ ورانہ تحفظ، صحت اور ماحولیاتی ٹیکنالوجی میں تین سالہ ڈپلوما کیا۔ وہاں میں نے خطرات، نقصانات اور بچاؤ کے انداز میں سوچنا سیکھا۔ آج میں یہی سوچ ڈیجیٹل نظاموں پر لاگو کرتا ہوں۔
  - "اس کے بعد میں نے کوئٹہ کی BUITEMS سے انفارمیشن ٹیکنالوجی پڑھی، جہاں میں نے سیکیورٹی اور نیٹ ورکنگ کے پہلے کورس کیے۔ میرے بی ایس کے نمبر میرے بہترین کام کی عکاسی نہیں کرتے: اُس وقت بہت سا وقت کرکٹ، فٹبال اور فری لانس کام میں جاتا تھا۔ ڈگری کے آخری حصے میں میں نے اپنا وقت سنبھالنا اور پڑھائی کو سنجیدگی سے لینا سیکھا۔"
  - اسلامیہ یونیورسٹی بہاولپور سے مصنوعی ذہانت میں ایم ایس میری زندگی کا اہم موڑ تھا۔ میں نے 3.66 CGPA کے ساتھ ڈگری مکمل کی، مختلف ٹیموں کے ساتھ تین ہم مرتبہ جائزہ شدہ مقالے شائع کیے، اور مصنوعی ذہانت سے لکھے گئے متن کی پہچان پر تحقیقی مقالہ لکھا۔ اسی دوران میں نے وزیٹنگ لیکچرر کے طور پر بی ایس کے طلبہ کو آئی ٹی کے کورس پڑھائے۔
  - "میری یونیورسٹی میں سائبر سیکیورٹی کا شعبہ نہیں تھا، اس لیے یہ مہارتیں میں نے خود سیکھیں: Cisco کے Junior Cybersecurity Analyst اور Ethical Hacker پروگرام، اور NAVTTC کا ڈیجیٹل فرانزک کورس۔ اس کی وجہ ذاتی بھی ہے: میں خود آن لائن فراڈ اور رینسم ویئر حملے کا شکار ہو چکا ہوں، اور دیکھتا ہوں کہ پاکستان میں سائبر حملوں سے بچاؤ ابھی کتنا کمزور ہے۔ مصنوعی ذہانت حملوں کو تیز اور زیادہ قائل کرنے والا بنا رہی ہے، اور میں دفاع کرنے والوں کی صف میں کام کرنا چاہتا ہوں۔"
