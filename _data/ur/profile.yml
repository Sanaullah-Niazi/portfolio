headline: "مصنوعی ذہانت × سائبر سیکیورٹی: ایسے ذہین نظام جو خطرات، فراڈ اور مصنوعی ذہانت سے بنے مواد کو پہچانتے ہیں۔"
intro: >-
  میں اپنے تحقیقی کیریئر کے آغاز میں ہوں اور مصنوعی ذہانت میں ایم ایس کر چکا ہوں۔ میں مشین لرننگ اور این ایل پی
  کے ایسے ماڈل بناتا ہوں جو اصلی اور جعلی میں فرق کرتے ہیں: مصنوعی ذہانت کے لکھے اور انسان کے لکھے متن میں، فراڈ
  اور عام لین دین میں، اور دھوکہ دہی والے اور اصلی پیغامات میں۔ اب میں خود مصنوعی ذہانت کے نظاموں کو محفوظ بنانا چاہتا ہوں۔
