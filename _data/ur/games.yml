  - q: "اگر آج آپ کا فون چوری ہو جائے تو..."
    a: ["PIN یا فنگر پرنٹ سے لاک ہے اور بیک اپ بھی ہے", "لاک ہے، مگر بیک اپ نہیں", "اس پر کوئی اسکرین لاک ہی نہیں"]
    fix: "اسکرین لاک لگائیں (کم از کم چھ ہندسوں کا PIN) اور بیک اپ آن کریں، تاکہ گم شدہ فون بس ایک گم شدہ فون ہو۔"
  - q: "کیا آپ نے کبھی چیک کیا ہے کہ آپ کا پاس ورڈ کسی ڈیٹا لیک میں تو نہیں آیا؟"
    a: ["ہاں، اور لیک ہونے والے بدل دیے", "نہیں، ابھی تک نہیں", "اس بارے میں کبھی سنا ہی نہیں"]
    fix: "چیک کریں کہ آپ کے پاس ورڈ کسی لیک لسٹ میں تو نہیں، اور اگر ہیں تو بدل دیں۔ لیک شدہ پاس ورڈ چند دنوں میں ہر سائٹ پر آزمائے جاتے ہیں۔"
