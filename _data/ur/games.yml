  - { min: 4, emoji: "🎣", title: "آسان شکار", text: "کچھ فراڈ آپ کی نظر سے بچ کر نکل گئے۔ نیچے دیے گئے پانچ اصول ان میں سے ہر ایک کو روک دیتے۔" }
  - { min: 6, emoji: "🧐", title: "شک کرنا سیکھ رہے ہیں", text: "واضح فراڈ آپ پکڑ لیتے ہیں، مگر چالاک والے ابھی بھی نکل جاتے ہیں۔ چند راؤنڈ اور، پھر نہیں نکلیں گے۔" }
  - { min: 8, emoji: "🦉", title: "دھوکا دینا مشکل", text: "تقریباً کچھ بھی آپ سے بچ کر نہیں نکلتا۔ اب یقینی بنائیں کہ آپ کے امی ابو بھی یہی کہہ سکیں۔" }
