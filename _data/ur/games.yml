daily_info:
  about:
    - "ہر روز ایک نئی پہیلی آتی ہے، اور اس دن کھیلنے والے سب لوگوں کو ایک ہی پہیلی ملتی ہے، اس لیے آپ دوستوں سے اپنا نتیجہ ملا سکتے ہیں۔ ہر پہیلی پانچ قسموں میں سے ایک ہوتی ہے: جعلی لنک پہچانیں، جعلی ای میل بھیجنے والا پہچانیں، کسی کی پروفائل سے پاس ورڈ توڑیں، الجھا ہوا پیغام پڑھیں، یا سب سے مضبوط پاس ورڈ چنیں۔"
    - "آپ کے پاس تین کوششیں ہیں۔ ہر غلط کوشش پر ایک اشارہ ملتا ہے۔ آخر میں آپ دیکھتے ہیں کہ ہر جواب کیوں صحیح یا غلط تھا، اور ایک چھوٹا سا سبق جو آپ فوراً استعمال کر سکتے ہیں۔"
    - "آپ کے نتائج اور سلسلہ صرف آپ کے اپنے براؤزر میں محفوظ ہوتے ہیں۔ کچھ بھی کہیں نہیں بھیجا جاتا، اور کوئی اکاؤنٹ نہیں بنانا پڑتا۔"
  faq:
    - q: "اگلی پہیلی کب آتی ہے؟"
      a: "ہر روز آپ کے اپنے ٹائم زون میں رات 12 بجے نئی پہیلی شروع ہوتی ہے۔ آپ کے نتیجے کے نیچے الٹی گنتی بتاتی ہے کہ کتنا وقت باقی ہے۔"
    - q: "میرے دوست کی پہیلی مجھ سے مختلف کیوں ہے؟"
      a: "ایک ہی تاریخ پر سب کو ایک ہی پہیلی ملتی ہے۔ اگر آپ کا دوست ایسے ٹائم زون میں ہے جہاں اگلا دن شروع ہو چکا ہے تو اسے اگلی پہیلی پہلے نظر آئے گی۔ شیئر کیا گیا لنک بالکل وہی پہیلی کھولتا ہے جو دوست نے کھیلی۔"
    - q: "کیا میں پرانی پہیلیاں کھیل سکتا ہوں؟"
      a: "جی ہاں۔ پہیلی ختم کرنے کے بعد بٹن سے اس سے پہلے والی پہیلی کھیلیں۔ پرانی پہیلیاں اچھی مشق ہیں لیکن سلسلے میں نہیں گنی جاتیں۔"
    - q: "اپنا سلسلہ کیسے جاری رکھوں؟"
      a: "ہر روز پہیلی توڑیں۔ ایک دن چھوٹ جائے یا پہیلی نہ ٹوٹے تو سلسلہ صفر سے شروع ہوتا ہے۔ سلسلہ اسی براؤزر میں محفوظ ہوتا ہے، اس لیے اسی فون یا کمپیوٹر پر کھیلیں۔"

