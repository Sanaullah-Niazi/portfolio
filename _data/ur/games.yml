  - q: "کیفے یا ایئرپورٹ کے مفت وائی فائی پر آپ..."
    a: ["ہر نجی کام کے لیے موبائل ڈیٹا یا VPN استعمال کرتے ہیں", "براؤز کرتے ہیں، مگر بینکنگ نہیں", "سب کچھ کرتے ہیں، بینکنگ بھی"]
