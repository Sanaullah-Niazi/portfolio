    fix: "کسی غیر متوقع میسج کے لنک سے کبھی ادائیگی یا لاگ اِن نہ کریں۔ کمپنی کی آفیشل ایپ کھولیں یا اس کا ایڈریس خود لکھیں۔"
  - q: "کوئی \"آپ کے بینک\" سے کال کرتا ہے اور وہ کوڈ مانگتا ہے جو ابھی آپ کو SMS میں آیا ہے۔"
