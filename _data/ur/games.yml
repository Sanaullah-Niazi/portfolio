hack_info:
  about:
    - "یہ کوئز ان روزمرہ عادتوں کو دیکھتا ہے جن سے زیادہ تر اصل ہیکس ہوتے ہیں: ایک ہی اور کمزور پاس ورڈ، ٹو اسٹیپ ویریفکیشن کا نہ ہونا، فراڈ لنکس اور کالز، پرانا سافٹ ویئر، غیر آفیشل ایپس اور ضرورت سے زیادہ معلومات شیئر کرنا۔ ہر جواب کے پوائنٹس ہیں، اور آپ کا اسکور بتاتا ہے کہ آپ نے زیادہ سے زیادہ میں سے کتنے رسک پوائنٹس جمع کیے۔"
    - "حملہ آور شاذ و نادر ہی کسی ہوشیار کوڈ سے اندر آتے ہیں۔ زیادہ تر اکاؤنٹس لیک شدہ پاس ورڈ، جعلی لنک یا کوڈ مانگنے والی کال سے ہیک ہوتے ہیں۔ اسی لیے چھوٹی عادتیں مہنگے ٹولز سے زیادہ اہم ہیں۔"
    - "آپ کے جواب صرف اس صفحے پر، آپ کے براؤزر میں استعمال ہوتے ہیں۔ کچھ بھی کہیں نہیں بھیجا جاتا، سوائے آپ کے بہترین اسکور کے جو آپ کے اپنے ڈیوائس پر رہتا ہے۔"
  faq:
    - q: "کیا میرا ڈیٹا کہیں بھیجا جاتا ہے؟"
      a: "نہیں۔ کوئز مکمل طور پر آپ کے براؤزر میں چلتا ہے۔ آپ کے جواب کبھی نہیں بھیجے جاتے، صرف آپ کا بہترین اسکور آپ کے ڈیوائس پر رہتا ہے تاکہ آپ بعد میں اسے بہتر کر سکیں۔"
    - q: "اسکور کیسے نکالا جاتا ہے؟"
      a: "ہر جواب کے 0 سے 3 رسک پوائنٹس ہیں، اس حساب سے کہ وہ عادت کتنی بار اصل اکاؤنٹ ہیک کا سبب بنتی ہے۔ آپ کا اسکور زیادہ سے زیادہ پوائنٹس کے مقابلے میں آپ کے پوائنٹس کا فیصد ہے: 0% بہترین ہے اور 100% سب سے زیادہ خطرہ۔"
    - q: "میں اپنا اسکور جلدی کیسے کم کروں؟"
      a: "اپنی ای میل اور واٹس ایپ پر ٹو اسٹیپ ویریفکیشن آن کریں، ایک پاس ورڈ کئی جگہ استعمال نہ کریں، اور ون ٹائم کوڈ کبھی کسی کو نہ بتائیں۔ یہ تین تبدیلیاں زیادہ تر اکاؤنٹ ہیکس روک دیتی ہیں۔"
