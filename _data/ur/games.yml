scam_msgs:
  wallet_block:
    t: "محترم صارف، آپ کی بائیومیٹرک تصدیق نامکمل ہونے کی وجہ سے آپ کا TezPay اکاؤنٹ آج بلاک کر دیا جائے گا۔ اکاؤنٹ فعال رکھنے کے لیے ابھی اپڈیٹ کریں: tezpay-verify.top/kyc نظر انداز کیا تو مستقل بلاک۔"
    why:
      - "یہ ایک عام موبائل نمبر سے آیا ہے۔ اصلی TezPay میسجز میں بھیجنے والے کا نام TezPay ہوتا ہے، کوئی نمبر نہیں۔"
      - "یہ ڈیڈ لائن سے ڈراتا ہے (\"آج بلاک\") تاکہ آپ سوچنے سے پہلے قدم اٹھا لیں۔"
      - "یہ لنک TezPay کی ویب سائٹ نہیں ہے۔ tezpay-verify.top جیسا نام کوئی بھی خرید سکتا ہے۔"
      - "والیٹ بائیومیٹرک تصدیق اپنی ایپ میں یا دکان پر کرتے ہیں، SMS کے لنک سے کبھی نہیں۔"
  lucky_draw:
    name: "TezPay لکی ڈرا 🎁"
    t: "مبارک ہو! 🎉 آپ کے نمبر نے TezPay کی دسویں سالگرہ کے لکی ڈرا میں 2,50,000 روپے اور ایک موٹر سائیکل جیتی ہے۔ انعام وصول کرنے کے لیے 3,500 روپے پروسیسنگ فیس 03••-•••8120 پر بھیجیں اور اپنے شناختی کارڈ (CNIC) کی آگے پیچھے کی تصویر واٹس ایپ کریں۔"
    why:
      - "آپ نے کسی قرعہ اندازی میں حصہ ہی نہیں لیا، تو انعام کیسے جیت سکتے ہیں۔"
      - "اصلی انعام کبھی پہلے فیس نہیں مانگتے۔ یہی فیس اصل فراڈ ہے۔"
      - "یہ آپ کے شناختی کارڈ کی تصویر مانگتا ہے، جس سے آپ کے نام پر سم اور اکاؤنٹ بنوائے جا سکتے ہیں۔"
      - "فیس کسی کمپنی کو نہیں، ایک ذاتی نمبر پر جا رہی ہے۔"
  bank_code:
    name: "چاندنی بینک ہیلپ لائن"
    t: "السلام علیکم۔ چاندنی بینک ہیڈ آفس سے بات ہو رہی ہے۔ آپ کے اکاؤنٹ سے غلطی سے 48,000 روپے کی ٹرانزیکشن ہو گئی ہے۔ اسے واپس کرنے کے لیے براہ کرم وہ 6 ہندسوں کا کوڈ بھیجیں جو ابھی آپ کو SMS پر ملا ہے۔"
    why:
      - "بینک کبھی OTP نہیں مانگتے۔ جس کے پاس یہ کوڈ ہو، وہ آپ کا اکاؤنٹ خالی کر سکتا ہے۔"
      - "واٹس ایپ پر کوئی بھی کوئی بھی نام لکھ سکتا ہے۔ نام لکھ دینے سے کوئی بینک نہیں بن جاتا۔"
      - "ڈراؤنی ٹرانزیکشن اور ساتھ میں آسان حل، آپ کو جلدی میں ڈالنے کی پرانی چال ہے۔"
      - "اگر فکر ہو تو اپنے کارڈ کے پیچھے لکھے نمبر پر خود کال کریں۔"
  wrong_transfer:
    t:
      - "TezPay: آپ کو ASIF ALI کی طرف سے 15,000 روپے موصول ہوئے ہیں۔ Trx ID: 4471902385۔ آپ کا نیا بیلنس 15,312 روپے ہے۔"
      - "بھائی، غلطی سے آپ کے نمبر پر 15,000 چلے گئے ہیں 🙏 یہ میرے بچوں کی اسکول فیس ہے۔ پلیز اسی نمبر پر واپس بھیج دیں۔"
    why:
      - "یہ \"رسید\" ایک عام موبائل نمبر سے آئی ہے۔ اصلی TezPay الرٹ بھیجنے والے کے نام TezPay سے آتے ہیں۔"
      - "TezPay ایپ کھول کر بیلنس دیکھیں: پیسے کبھی آئے ہی نہیں۔"
      - "فوراً بعد کی دکھ بھری کہانی اس لیے ہے کہ آپ نقلی پیسوں کے بدلے اصلی پیسے بھیج دیں۔"
      - "اگر کسی نے واقعی غلطی سے پیسے بھیجے ہوں تو والیٹ کی ہیلپ لائن انہیں واپس کر سکتی ہے۔ آپ کو خود کچھ نہیں بھیجنا۔"
  relief_fund:
    t: "خوشحالی امدادی پروگرام: آپ کا شناختی کارڈ 25,000 روپے کی مالی امداد کے لیے منتخب ہو گیا ہے۔ رقم وصول کرنے کے لیے اپنا نام اور شناختی کارڈ نمبر 500 روپے رجسٹریشن فیس کے ساتھ اسی نمبر پر بھیجیں۔ یہ پیشکش صرف 24 گھنٹے کے لیے ہے۔"
    why:
      - "سرکاری امداد کبھی رجسٹریشن فیس نہیں لیتی۔"
      - "سرکاری پروگرام اپنے شارٹ کوڈ سے میسج کرتے ہیں، کسی ذاتی موبائل نمبر سے نہیں۔"
      - "\"صرف 24 گھنٹے\" دباؤ ڈالنے کا طریقہ ہے، کوئی پالیسی نہیں۔"
      - "شناختی کارڈ کی معلومات دینے سے پہلے پروگرام کی آفیشل ویب سائٹ یا دفتر سے خود تصدیق کریں۔"
  parcel_fee:
    t: "SwiftPost: نامکمل ایڈریس کی وجہ سے آپ کا پارسل ہمارے گودام میں روک لیا گیا ہے۔ 12 گھنٹے کے اندر 150 روپے دوبارہ ڈیلیوری فیس ادا کریں ورنہ پارسل واپس کر دیا جائے گا: swiftpost.redelivery-help.com"
    why:
      - "یہاں اصل ویب سائٹ redelivery-help.com ہے۔ شروع میں لکھا \"swiftpost\" صرف دکھاوا ہے۔"
      - "کیا آپ کسی پارسل کا انتظار بھی کر رہے تھے؟ فراڈیے یہ سب کو بھیجتے ہیں اور اتفاقاً لگ جانے کا انتظار کرتے ہیں۔"
      - "چھوٹی سی فیس صرف چارا ہے۔ اصل میں انہیں جعلی پیج پر آپ کا کارڈ نمبر اور OTP چاہیے۔"
      - "یہ ایک عام نمبر سے آیا، SwiftPost کے نام سے نہیں۔"
  like_job:
    name: "Priya HR"
    t: "ہیلو، میں ایک ڈیجیٹل مارکیٹنگ ایجنسی سے پریا ہوں 😊 ہم پارٹ ٹائم جاب دے رہے ہیں: بس YouTube ویڈیوز لائک کریں اور گھر بیٹھے روزانہ ₹3,000 سے ₹8,000 کمائیں۔ کسی تجربے کی ضرورت نہیں۔ اپنا پہلا ٹاسک لینے کے لیے ہمارے Telegram گروپ میں شامل ہوں!"
    why:
      - "اصلی نوکریاں صرف لائک کرنے کے روزانہ ہزاروں نہیں دیتیں۔"
      - "پہلے ٹاسک بھروسا جیتنے کے لیے تھوڑے پیسے دیتے ہیں، پھر بڑے ٹاسکس میں \"انویسٹ\" کرنے کو کہا جاتا ہے اور پیسے غائب ہو جاتے ہیں۔"
      - "آپ نے اس نوکری کے لیے کبھی اپلائی ہی نہیں کیا۔ نوکری نے خود آپ کو ڈھونڈ لیا۔"
      - "Telegram پر لے جانے کا مقصد آپ کو ان لوگوں سے دور کرنا ہے جو آپ کو خبردار کر سکتے ہیں۔"
  power_cut:
    t: "محترم صارف، آپ کا پچھلے مہینے کا بل اپڈیٹ نہ ہونے کی وجہ سے آج رات 9:30 بجے آپ کی بجلی کاٹ دی جائے گی۔ براہ کرم فوراً ہمارے بجلی آفیسر سے رابطہ کریں 7•••• ••213۔ شکریہ"
    why:
      - "بجلی کمپنیاں ذاتی نمبروں سے بجلی کٹنے کی وارننگ نہیں بھیجتیں۔"
      - "نہ کنزیومر نمبر ہے نہ رقم: یہ میسج کسی کو بھی بھیجا جا سکتا ہے۔"
      - "\"آج رات 9:30 بجے\" جلدی ڈالنے کے لیے ہے، تاکہ آپ تصدیق کیے بغیر کال کر دیں۔"
      - "\"آفیسر\" آپ سے کوئی ایپ انسٹال کروائے گا یا لنک سے ادائیگی کروائے گا۔ اپنا بل آفیشل ایپ میں خود دیکھیں۔"
  kyc_expired:
    t: "محترم Sitara Bank صارف، آپ کے اکاؤنٹ کا KYC ختم ہو چکا ہے اور 24 گھنٹے میں آپ کا اکاؤنٹ معطل کر دیا جائے گا۔ ابھی اپنی PAN تفصیلات اپڈیٹ کریں: sitarabank-kyc.in/update"
    why:
      - "بینک SMS کے لنک سے اکاؤنٹ معطل نہیں کرتے۔ وہ KYC اپنی ایپ میں یا برانچ میں اپڈیٹ کرنے کو کہتے ہیں۔"
      - "sitarabank-kyc.in بینک کی ویب سائٹ نہیں، بس اس جیسا دکھنے والا نام ہے۔"
      - "یہ ایک موبائل نمبر سے آیا، بینک کے نام سے نہیں۔"
      - "24 گھنٹے کی ڈیڈ لائن اسی لیے ہے کہ آپ تصدیق نہ کر سکیں۔"
  new_number:
    t: "امی، یہ میرا نیا نمبر ہے، میرا فون پانی میں گر گیا 😔 مجھے فوراً 20,000 روپے چاہئیں، پلیز اس TezPay اکاؤنٹ پر بھیج دیں: 03••-•••7712۔ بعد میں بتاتا ہوں، ابھی بات نہیں کر سکتا، کلاس میں ہوں۔"
    why:
