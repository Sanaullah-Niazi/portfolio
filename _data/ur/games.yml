scam_lede: "دس میسج، بالکل ویسے جیسے آپ کے فون پر آتے ہیں: والیٹ الرٹ، بینک کوڈ، پارسل فیس، لکی ڈرا اور \"یہ میرا نیا نمبر ہے\" والے واٹس ایپ۔ ہر ایک کے بارے میں فیصلہ کریں کہ فراڈ ہے یا اصلی، خطرے کی نشانیاں دیکھیں، اور گھر والوں کو اپنا اسکور ہرانے کا چیلنج دیں۔"
scam_private: "فرضی برانڈ اور نمبر · کچھ بھی آپ کے براؤزر سے باہر نہیں جاتا"
scam_intro: "یہاں ہر فراڈ میسج کسی ایسی چال کی نقل ہے جو پاکستان اور انڈیا میں فراڈیے واقعی استعمال کرتے ہیں، اور کچھ میسج بالکل عام اور اصلی ہیں۔ دیکھیں کہ میسج کس نے بھیجا، آپ سے کیا کرنے کو کہہ رہا ہے اور آپ کو کیسا محسوس کروانا چاہتا ہے۔ پھر فیصلہ کریں: فراڈ یا اصلی؟"
scam_note: "اس گیم کے تمام برانڈ، نام، نمبر اور لنک فرضی ہیں۔ انہیں کھولنے یا ان پر کال کرنے کی کوشش نہ کریں۔"
