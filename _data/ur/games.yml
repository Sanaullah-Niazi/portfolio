    a: ["اسی دن انسٹال کر لیتے ہیں", "چند ہفتے بعد میں پر ٹیپ کرتے ہیں", "ہمیشہ بعد میں پر ٹیپ کرتے ہیں"]
    fix: "اپ ڈیٹس جتنی جلدی ہو سکے انسٹال کریں۔ زیادہ تر اپ ڈیٹس وہ سیکیورٹی خامیاں ٹھیک کرتی ہیں جو حملہ آوروں کو پہلے سے معلوم ہیں۔"
