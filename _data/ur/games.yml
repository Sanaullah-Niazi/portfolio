hack_questions:
  - q: "آپ کے کتنے اکاؤنٹس کا پاس ورڈ ایک ہی ہے؟"
    a: ["کسی کا نہیں، ہر اکاؤنٹ کا اپنا ہے", "چند ایک کا", "زیادہ تر کا", "ایک ہی پاس ورڈ سب پر چلتا ہے"]
