scam_info:
  about:
    - "ہر راؤنڈ میں ایک بڑے مجموعے سے 10 میسج اتفاقیہ طور پر چنے جاتے ہیں: موبائل والیٹ الرٹ، بینک کوڈ، پارسل اور کورئیر میسج، لکی ڈرا، سرکاری امداد، نوکری کی پیشکش اور \"نیا نمبر\" والے گھر والے۔ کچھ فراڈ ہیں اور کچھ بالکل عام میسج۔ فیصلہ کریں کون سا کیا ہے۔"
    - "ہر جواب کے بعد آپ خطرے کی نشانیاں دیکھتے ہیں، یا وہ وجوہات جن سے اصلی میسج اصلی ہے۔ پاکستان اور انڈیا کے زیادہ تر فراڈ چند ہی چالوں پر چلتے ہیں: بھیجنے والا وہ نہیں جو ہونے کا دعویٰ کرتا ہے، ڈیڈ لائن، پیسے نکلوانے کے لیے فیس، جعلی ویب سائٹ کا لنک، یا آپ کا OTP مانگنا۔"
    - "اس گیم کے تمام برانڈ، نام، نمبر اور لنک فرضی ہیں، اور نمبر جزوی طور پر چھپائے گئے ہیں تاکہ ان پر کال نہ ہو سکے۔ آپ کے جواب کہیں نہیں بھیجے جاتے۔ صرف آپ کا بہترین اسکور آپ کے اپنے ڈیوائس پر رکھا جاتا ہے۔"
  faq:
    - q: "کیا یہ اصلی فراڈ میسج ہیں؟"
      a: "یہ اس گیم کے لیے لکھے گئے ہیں، لیکن ہر ایک کسی ایسی چال کی نقل ہے جو پاکستان اور انڈیا میں واقعی استعمال ہوتی ہے: جعلی والیٹ بلاک، پروسیسنگ فیس والے لکی ڈرا، \"غلطی سے بھیجے\" پیسے، OTP مانگنا، پارسل فیس، KYC اپڈیٹ، اور گھر والوں کے \"نئے نمبر\" والے میسج۔"
    - q: "دوست کو چیلنج کیسے کام کرتا ہے؟"
      a: "آپ کے شیئر لنک میں آپ کا اسکور اور آپ کے 10 میسج شامل ہوتے ہیں۔ جو بھی اسے کھولے گا وہ بالکل یہی 10 میسج کھیلے گا اور دیکھے گا کہ وہ آپ کو ہرا پایا یا نہیں۔"
    - q: "مجھے بھی ایسا میسج آیا ہے۔ کیا کروں؟"
      a: "لنک پر ٹیپ نہ کریں، جواب نہ دیں اور کبھی کوئی کوڈ شیئر نہ کریں۔ آفیشل ایپ خود کھولیں یا اپنے کارڈ پر لکھے نمبر پر کال کر کے تصدیق کریں۔ پھر اپنی میسجنگ ایپ میں اس نمبر کو بلاک اور رپورٹ کریں۔"
