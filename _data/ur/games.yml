scam_rules:
  - "کوئی اصلی بینک، والیٹ یا کمپنی آپ سے OTP، PIN یا پاس ورڈ نہیں مانگتی۔ کبھی نہیں۔"
  - "بھیجنے والے کو دیکھیں۔ بینک، والیٹ یا کورئیر کا عام موبائل نمبر سے میسج آنا خطرے کی نشانی ہے۔"
  - "انعام، ریفنڈ، نوکری یا سرکاری امداد لینے کے لیے کبھی کوئی فیس نہ دیں۔"
  - "میسج میں دیا گیا لنک استعمال نہ کریں۔ آفیشل ایپ خود کھولیں یا ایڈریس خود لکھیں۔"
  - "\"نیا نمبر\" پیسے مانگ رہا ہے؟ کچھ بھیجنے سے پہلے پرانے نمبر پر کال کریں۔"
