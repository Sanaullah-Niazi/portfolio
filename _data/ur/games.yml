    fix: "چار یا زیادہ بے ترتیب الفاظ کا لمبا پاس فریز استعمال کریں۔ نام، پیدائش کا سال اور حروف کی جگہ نشانات، حملہ آور سب سے پہلے یہی آزماتے ہیں۔"
  - q: "ایک SMS آتا ہے: \"آپ کا پارسل روک لیا گیا ہے، یہاں 150 روپے ادا کریں\" ساتھ ایک لنک۔ آپ..."
