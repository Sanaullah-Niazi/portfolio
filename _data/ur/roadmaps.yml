trust_title: "آپ ان لنکس پر کیوں بھروسہ کر سکتے ہیں"
trust: "میں صرف وہ وسائل شامل کرتا ہوں جو مفت استعمال ہو سکیں اور جنہیں یونیورسٹیوں، اس ٹول کے بنانے والوں یا پرانے غیر منافع بخش اداروں نے لکھا ہو۔ کوئی افیلی ایٹ لنک نہیں اور کوئی پیڈ بوٹ کیمپ نہیں۔ کچھ یونیورسٹی کورس مفت دیکھے جا سکتے ہیں لیکن سرٹیفکیٹ کی فیس ہوتی ہے، ان پر نشان لگا ہے۔ ایک اسکرپٹ ہر ہفتے ہر لنک چیک کرتا ہے۔"
reviewed_label: "آخری جائزہ"
foot: "کوئی خراب لنک ملا، یا کوئی نیا راستہ چاہیے؟"
back: "سب راستوں پر واپس جائیں"

paths:
  foundations:
    title: "کمپیوٹر سائنس کی بنیادی باتیں"
    summary: "پروگرامنگ، وہ ٹولز جو ہر ڈیولپر استعمال کرتا ہے، ڈیٹا اسٹرکچرز، اور کمپیوٹر اور نیٹ ورک اصل میں کیسے کام کرتے ہیں۔"
    who: "ہر نیا سیکھنے والا، یا وہ جس نے ٹیوٹوریلز سے کوڈنگ سیکھی ہو اور جس کے علم میں خلا ہوں۔"
    roles: ["باقی تمام راستے"]
    stages:
      - title: "پروگرامنگ سیکھیں"
        learn: ["ویری ایبلز، شرطیں اور لوپس", "فنکشنز", "لسٹس اور ڈکشنریز", "ایرر میسجز پڑھنا", "ڈی بگنگ"]
        build: "اپنی سوچ سے بنایا ہوا ایک چھوٹا کمانڈ لائن پروگرام، مثلاً خرچ کا حساب رکھنے والا پروگرام جو فائل میں محفوظ کرے۔"
        ready: "آپ ٹیوٹوریل کے بغیر 100 لائنوں کا پروگرام لکھ سکیں۔"
      - title: "ٹرمینل، Git اور Linux"
        learn: ["شیل کمانڈز اور پائپس", "فائلیں اور اجازتیں", "Git کمٹس، برانچز اور مرج", "GitHub", "کوڈ ایڈیٹر"]
        build: "اپنے سب پروگرام GitHub پر رکھیں، ہر ایک کے ساتھ مختصر README۔"
        ready: "آپ ماؤس کے بغیر ٹرمینل میں کام کر سکیں اور مرج کنفلکٹ حل کر سکیں۔"
      - title: "ڈیٹا اسٹرکچرز اور الگورتھمز"
        learn: ["Big-O نوٹیشن", "ایرے، لنکڈ لسٹ، اسٹیک اور کیو", "ہیش ٹیبلز", "ٹری اور گراف", "سارٹنگ، سرچنگ اور ریکرشن"]
        build: "اپنی ہیش ٹیبل اور گراف سرچ (BFS اور DFS) خود لکھیں، ٹیسٹس کے ساتھ۔"
        ready: "آپ سمجھا سکیں کہ ڈکشنری میں تلاش تیز کیوں ہوتی ہے، اور کسی مسئلے کے لیے صحیح اسٹرکچر چن سکیں۔"
      - title: "کمپیوٹر اور نیٹ ورک کیسے کام کرتے ہیں"
        learn: ["لاجک گیٹس سے CPU تک", "میموری اور پروسیس", "آپریٹنگ سسٹمز", "TCP/IP، DNS اور HTTP", "کنکرنسی کی بنیادی باتیں"]
        build: "سیدھے سوکٹس سے ایک بہت چھوٹا ویب سرور جو آپ کے براؤزر کو ایک صفحہ بھیجے۔"
        ready: "آپ بتا سکیں کہ ویب ایڈریس لکھنے سے صفحہ دکھنے تک کیا کیا ہوتا ہے۔"
      - title: "ریاضی اور ڈیٹا بیس"
        learn: ["منطق اور ثبوت", "سیٹس، گنتی اور احتمال", "ریلیشنل ڈیٹا بیس", "SQL کوئریز اور جوائنز", "ٹیبلز ڈیزائن کرنا"]
        build: "کسی چھوٹی لائبریری یا دکان کا ڈیٹا بیس ڈیزائن کریں اور SQL سے اس کے 20 سوالوں کے جواب دیں۔"
        ready: "آپ جوائن اور گروپنگ والی کوئری لکھ سکیں اور سادہ احتمال کا حساب سمجھا سکیں۔"

  web:
    title: "ویب ڈیولپمنٹ"
    summary: "ویب سائٹس اور ویب ایپس بنانا، اس صفحے سے جو لوگ دیکھتے ہیں، اس کے پیچھے سرور اور ڈیٹا بیس تک۔"
    who: "ان کے لیے جو ایسی چیزیں بنانا چاہتے ہیں جو دوسرے فوراً براؤزر میں استعمال کر سکیں۔"
    roles: ["فرنٹ اینڈ ڈیولپر", "بیک اینڈ ڈیولپر", "فل اسٹیک ڈیولپر"]
    stages:
      - title: "HTML، CSS اور ویب کیسے کام کرتا ہے"
        learn: ["سیمینٹک HTML", "رسائی (ایکسیسبلٹی)", "Flexbox اور Grid سے CSS لے آؤٹ", "ریسپانسو ڈیزائن", "براؤزر کے ڈیولپر ٹولز"]
        build: "ایک ذاتی صفحہ جو فون پر ٹھیک چلے اور ایکسیسبلٹی چیک پاس کرے۔"
        ready: "آپ اپنی پسند کی کسی ویب سائٹ کا لے آؤٹ شروع سے دوبارہ بنا سکیں۔"
      - title: "JavaScript گہرائی سے"
        learn: ["DOM اور ایونٹس", "فنکشنز، کلوژرز اور آبجیکٹس", "Promises اور async/await", "APIs سے ڈیٹا لانا", "ماڈیولز"]
        build: "ایک ایپ جو کوئی پبلک API استعمال کرے، جیسے موسم یا کتابیں تلاش کرنے والی ایپ۔"
        ready: "آپ فریم ورک کے بغیر ایک انٹرایکٹو صفحہ بنا سکیں۔"
      - title: "ایک فرنٹ اینڈ فریم ورک اور TypeScript"
        learn: ["کمپونینٹس اور اسٹیٹ", "فارمز اور ویلیڈیشن", "روٹنگ", "TypeScript ٹائپس", "کمپونینٹس کی ٹیسٹنگ"]
        build: "کئی صفحوں والی ایپ جس میں فارمز، محفوظ اسٹیٹ اور کچھ ٹیسٹس ہوں۔"
        ready: "آپ سمجھا سکیں کہ کمپونینٹ کب اور کیوں دوبارہ رینڈر ہوتا ہے۔"
      - title: "بیک اینڈ اور ڈیٹا بیس"
        learn: ["HTTP تفصیل سے", "REST APIs بنانا", "لاگ ان، سیشنز اور ٹوکنز", "PostgreSQL", "خودکار ٹیسٹس"]
        build: "یوزر اکاؤنٹس اور ڈیٹا بیس والی ایک API، ٹیسٹس کے ساتھ، جسے آپ کا فرنٹ اینڈ استعمال کرے۔"
        ready: "آپ API ڈیزائن کر سکیں، ڈیٹا محفوظ طریقے سے رکھ سکیں اور اس کے ٹیسٹ لکھ سکیں۔"
      - title: "محفوظ طریقے سے لائیو کریں"
        learn: ["ایپ ڈیپلائے کرنا", "انوائرنمنٹ ویری ایبلز اور سیکرٹس", "HTTPS", "کنٹینیوس انٹیگریشن", "OWASP Top 10"]
        build: "اپنی پوری ایپ لائیو کریں، ہر پُش پر خودکار ٹیسٹ چلیں، اور اسے OWASP Top 10 کے مطابق جانچیں۔"
        ready: "اجنبی لوگ آپ کی ایپ استعمال کریں اور خراب ہونے پر آپ کو پتا چل جائے۔"

  networking:
    title: "کمپیوٹر نیٹ ورکنگ"
    summary: "ڈیٹا کمپیوٹروں کے درمیان اصل میں کیسے سفر کرتا ہے: ایڈریس، پروٹوکول، روٹنگ، اور وہ ٹریفک جس کا ہر سیکیورٹی جاب میں آپ دفاع یا جانچ کریں گے۔"
    who: "ہر وہ شخص جو سیکیورٹی، کلاؤڈ یا آئی ٹی سپورٹ میں جانا چاہتا ہے۔ ہر سیکیورٹی کام میں نیٹ ورک ٹریفک پڑھنا آنا چاہیے۔"
    roles: ["نیٹ ورک ایڈمنسٹریٹر", "نیٹ ورک سیکیورٹی انجینئر", "SOC اینالسٹ", "کلاؤڈ انجینئر"]
    stages:
      - title: "نیٹ ورک کیسے کام کرتے ہیں"
        learn: ["OSI اور TCP/IP ماڈل", "IP ایڈریس اور سب نیٹنگ", "ایتھرنیٹ، MAC ایڈریس اور ARP", "سوئچ اور راؤٹر", "پورٹس اور ساکٹس"]
        build: "اپنے گھر کا نیٹ ورک بنا کر دکھائیں: ہر ڈیوائس، اس کا IP اور MAC ایڈریس، آپ کا راؤٹر، اور پیکٹ انٹرنیٹ تک کیسے پہنچتا ہے۔"
        ready: "آپ ہاتھ سے /24 کی سب نیٹنگ کر سکیں اور بتا سکیں کہ ویب ایڈریس لکھنے اور صفحہ دیکھنے کے درمیان کیا ہوتا ہے۔"
      - title: "وہ پروٹوکول جو آپ روز دیکھیں گے"
        learn: ["TCP اور UDP", "DNS", "DHCP اور NAT", "HTTP، HTTPS اور TLS", "ICMP، ping اور traceroute"]
        build: "ویب سائٹ کھولتے وقت Wireshark میں اپنی ٹریفک ریکارڈ کریں اور DNS لُک اپ، TCP ہینڈ شیک اور TLS ہینڈ شیک کی نشاندہی کریں۔"
        ready: "آپ پیکٹ کیپچر کھول کر بتا سکیں کہ کس ڈیوائس نے کس سے، کس پروٹوکول پر اور کیوں بات کی۔"
      - title: "سوئچنگ، روٹنگ اور IPv6"
        learn: ["VLAN اور ٹرنکنگ", "اسٹیٹک اور ڈائنامک روٹنگ (OSPF)", "BGP انٹرنیٹ کو کیسے جوڑتا ہے", "وائی فائی کے معیار اور سیکیورٹی", "IPv6 ایڈریسنگ"]
        build: "Packet Tracer میں ایک چھوٹے دفتر کا نیٹ ورک بنائیں: دو VLAN، ان کے درمیان راؤٹر، DHCP، اور مہمانوں کا وائی فائی جو دفتر تک نہ پہنچ سکے۔"
        ready: "آپ حصوں میں بٹا نیٹ ورک ڈیزائن کر سکیں اور پتا لگا سکیں کہ دو مشینیں آپس میں بات کیوں نہیں کر پا رہیں۔"
      - title: "نیٹ ورک سیکیورٹی"
        learn: ["فائر وال اور سیگمنٹیشن", "VPN", "Nmap سے اپنے نیٹ ورک کی اسکیننگ", "IDS اور نیٹ ورک مانیٹرنگ", "پیکٹ کیپچر میں حملے پہچاننا"]
        build: "Nmap سے اپنی ہوم لیب اسکین کریں، جو کھلا نہیں ہونا چاہیے اسے بند کریں، پھر میل ویئر ٹریفک کی ایک مشق کا تجزیہ کر کے لکھیں کہ کیا ہوا۔"
        ready: "آپ اپنے نیٹ ورک پر کھلی سروسز ڈھونڈ سکیں اور کسی حملے کو اس کی ٹریفک سے سمجھا سکیں۔"
  linux:
    title: "لینکس اور آپریٹنگ سسٹمز"
    summary: "لینکس اور ونڈوز کو ماہر کی طرح استعمال کریں: کمانڈ لائن، آپریٹنگ سسٹم اندر سے کیسے کام کرتا ہے، سرور چلانا، اور انہیں محفوظ بنانا۔"
    who: "ہر وہ شخص جو سیکیورٹی، ڈیو اوپس یا کلاؤڈ میں جانا چاہتا ہے۔ زیادہ تر سرور، سیکیورٹی ٹولز اور حملے انہی سسٹمز پر ہوتے ہیں۔"
    roles: ["لینکس سسٹم ایڈمنسٹریٹر", "سیکیورٹی انجینئر", "ڈیو اوپس انجینئر", "SOC اینالسٹ"]
    stages:
      - title: "لینکس کمانڈ لائن"
        learn: ["فائل سسٹم میں گھومنا", "فائلیں، یوزرز اور اجازتیں", "پائپس اور ری ڈائریکشن", "grep، find، sed اور awk", "پیکیج مینیجر سے سافٹ ویئر انسٹال کرنا"]
        build: "OverTheWire Bandit کے پہلے 20 لیول مکمل کریں اور ہر نئی کمانڈ کے نوٹس بنائیں۔"
        ready: "آپ روزمرہ کا کام ماؤس کے بغیر ٹرمینل میں کر سکیں اور نئی کمانڈ man پیج پڑھ کر سیکھ سکیں۔"
      - title: "آپریٹنگ سسٹم کیسے کام کرتے ہیں"
        learn: ["پروسیس اور تھریڈز", "میموری اور ورچوئل میموری", "فائل سسٹمز", "سسٹم کالز", "کمپیوٹر کیسے بوٹ ہوتا ہے"]
        build: "C یا Python میں ایک چھوٹا شیل لکھیں جو کمانڈز چلائے، پائپس سپورٹ کرے اور Ctrl+C سنبھالے۔"
        ready: "آپ قدم بہ قدم بتا سکیں کہ پروگرام چلانے پر کیا ہوتا ہے۔"
      - title: "لینکس سرور چلانا"
        learn: ["یوزرز، گروپس اور sudo", "systemd کے ساتھ سروسز", "لاگز اور journalctl", "SSH کیز", "شیڈول کام اور بیک اپ"]
        build: "ورچوئل مشین میں ایک لینکس سرور بنائیں جو ویب صفحہ دکھائے، صرف SSH کیز سے لاگ اِن ہو، اور ہر رات اپنا بیک اپ لے۔"
        ready: "آپ لاگز سے پتا لگا سکیں کہ کوئی سروس کیوں رکی اور اسے ٹھیک کر سکیں۔"
      - title: "ونڈوز اور PowerShell"
        learn: ["PowerShell کی بنیادی باتیں", "ونڈوز سروسز اور رجسٹری", "ایونٹ لاگز", "ایکٹو ڈائریکٹری: یوزرز، گروپس اور ڈومین", "گروپ پالیسی"]
        build: "ایک ڈومین کنٹرولر اور ایک کلائنٹ والی چھوٹی ونڈوز لیب بنائیں، اور PowerShell اسکرپٹ لکھیں جو ہر یوزر اور اس کا آخری سائن اِن دکھائے۔"
        ready: "آپ بتا سکیں کہ ونڈوز ڈومین میں سائن اِن کیسے ہوتا ہے اور یہ کہاں لاگ ہوتا ہے۔"
      - title: "اسکرپٹنگ اور ہارڈننگ"
