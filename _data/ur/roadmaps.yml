eyebrow: "روڈ میپ"
title: "کمپیوٹر سائنس سیکھنے کے روڈ میپ"
lede: "کمپیوٹر سائنس میں آنے کے قدم بہ قدم راستے، اسی ترتیب میں جس میں میں آج دوبارہ سیکھتا۔ ہر وسیلہ مفت ہے اور کسی یونیورسٹی، سرکاری پروجیکٹ یا معتبر غیر منافع بخش ادارے کا ہے۔"
pill: "صرف مفت وسائل، لنکس ہر ہفتے چیک ہوتے ہیں"
how_title: "یہ روڈ میپ کیسے استعمال کریں"
how:
  - "پروگرامنگ میں نئے ہیں؟ بنیادی باتوں سے شروع کریں۔ باقی ہر راستہ اسی پر بنا ہے۔"
  - "ایک راستہ چنیں اور اس کے مرحلے ترتیب سے مکمل کریں۔ ایک راستے سے دوسرے پر کودتے رہنا الجھن کی سب سے عام وجہ ہے۔"
  - "ہر مرحلے کے آخر میں پروجیکٹ ضرور بنائیں۔ کورس دیکھنا ترقی جیسا لگتا ہے، لیکن اصل ثبوت پروجیکٹ ہی ہے۔"
  - "وقت کا اندازہ ہفتے میں تقریباً 10 گھنٹے کے حساب سے ہے۔ آہستہ چلنا ٹھیک ہے، پروجیکٹ چھوڑنا نہیں۔"
  - "زیادہ تر وسائل انگریزی میں ہیں۔"
paths_label: "ایک راستہ چنیں"
