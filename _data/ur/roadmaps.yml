        build: "ایک A/B ٹیسٹ ڈیٹا سیٹ کا تجزیہ کریں اور نتیجہ کسی مینیجر کے لیے سادہ زبان میں لکھیں۔"
        ready: "آپ صرف نتیجہ نہیں، یہ بھی بتا سکیں کہ آپ کو اس پر کتنا یقین ہے۔"
      - title: "Python یا R سے تجزیہ"
        learn: ["ڈیٹا لوڈ اور صاف کرنا", "ٹائیڈی ڈیٹا", "ٹیبلز کی شکل بدلنا اور جوڑنا", "نوٹ بکس اور رپورٹس", "دوبارہ چلائے جا سکنے والا کام"]
        build: "ایک مکمل رپورٹ جو بے ترتیب خام ڈیٹا سے شروع ہو اور جسے کوئی بھی دوبارہ چلا سکے۔"
        ready: "آپ ایک دوپہر میں خام فائل سے واضح جواب تک پہنچ سکیں۔"
      - title: "ویژولائزیشن اور کہانی سنانا"
        learn: ["صحیح چارٹ چننا", "ایماندار ایکسز اور اسکیل", "رنگ اور رسائی", "ڈیش بورڈز", "واضح خلاصہ لکھنا"]
        build: "ایک ڈیش بورڈ یا ایک صفحے کی رپورٹ جو غیر تکنیکی شخص آپ کی مدد کے بغیر سمجھ لے۔"
        ready: "آپ کے چارٹ ایک نظر میں سوال کا جواب دے دیں۔"
      - title: "ڈیٹا انجینئرنگ"
        learn: ["ETL اور ELT پائپ لائنز", "ڈیٹا ویئر ہاؤسز", "شیڈولنگ اور آرکیسٹریشن", "dbt سے ٹرانسفارمیشن", "Spark سے بگ ڈیٹا"]
        build: "ایک شیڈول شدہ پائپ لائن جو API سے ڈیٹا لائے، ویئر ہاؤس میں رکھے اور آپ کے ڈیش بورڈ کو دے۔"
        ready: "آپ کی پائپ لائن خود چلے اور ناکام ہونے پر آپ کو بتائے۔"

  cloud-devops:
    title: "کلاؤڈ اور ڈیو اوپس"
    summary: "سافٹ ویئر کو قابلِ اعتماد طریقے سے چلانا: سرورز، کنٹینرز، آٹومیشن، کلاؤڈ پلیٹ فارمز اور سروس کو چالو رکھنا۔"
    who: "ان کے لیے جو سسٹمز کو تیز، محفوظ اور خودکار بنانا پسند کرتے ہیں۔"
    roles: ["ڈیو اوپس انجینئر", "کلاؤڈ انجینئر", "سائٹ ریلائیبلٹی انجینئر", "پلیٹ فارم انجینئر"]
    stages:
      - title: "آپریشنز کے لیے Linux اور نیٹ ورکنگ"
        learn: ["پروسیسز اور سروسز", "SSH اور کیز", "شیل اسکرپٹنگ", "DNS، لوڈ بیلنسرز اور فائر والز", "لاگز پڑھنا"]
        build: "ایک Linux سرور سیٹ اپ کریں، SSH محفوظ کریں، اور اس پر HTTPS کے ساتھ ویب سائٹ چلائیں۔"
        ready: "آپ معلوم کر سکیں کہ سرور سست کیوں ہے یا سائٹ بند کیوں ہے۔"
      - title: "کنٹینرز"
        learn: ["امیجز اور کنٹینرز", "Dockerfile لکھنا", "والیومز اور نیٹ ورکس", "Docker Compose", "ایسی ایپس جو ہر جگہ آسانی سے چلیں"]
        build: "ایک ویب ایپ اور اس کا ڈیٹا بیس Docker Compose میں پیک کریں تاکہ ایک کمانڈ سے چل جائے۔"
        ready: "کوئی بھی ایک قدم میں آپ کی ایپ اپنی مشین پر چلا سکے۔"
      - title: "آٹومیشن: CI/CD اور انفراسٹرکچر بطور کوڈ"
        learn: ["ٹیسٹ اور بلڈ کرنے والی پائپ لائنز", "خودکار ڈیپلائے", "Terraform", "سیکرٹس کا انتظام", "محفوظ طریقے سے واپس جانا"]
        build: "ایک پائپ لائن جو ہر پُش پر ٹیسٹ، بلڈ اور ڈیپلائے کرے، اور انفراسٹرکچر Terraform میں لکھا ہو۔"
        ready: "آپ اپنا پورا سیٹ اپ کوڈ سے دوبارہ بنا سکیں۔"
      - title: "ایک کلاؤڈ پلیٹ فارم، اچھی طرح"
        learn: ["کمپیوٹ اور اسٹوریج", "شناخت اور رسائی (IAM)", "ورچوئل نیٹ ورکس", "مینیجڈ ڈیٹا بیس", "لاگت اور بجٹ"]
        build: "اپنی ایپ کسی ایک کلاؤڈ پر کم سے کم اجازتوں اور بجٹ الرٹ کے ساتھ لائیو کریں۔"
        ready: "آپ اپنا کلاؤڈ بل سمجھا سکیں اور بتا سکیں کہ کس کو کس چیز تک رسائی ہے۔"
      - title: "Kubernetes اور ریلائیبلٹی"
        learn: ["پوڈز، ڈیپلائمنٹس اور سروسز", "مانیٹرنگ اور الرٹس", "سروس لیول آبجیکٹوز", "انسیڈنٹ رسپانس", "پوسٹ مارٹمز"]
        build: "اپنی ایپ مقامی Kubernetes کلسٹر پر مانیٹرنگ اور سروس لیول آبجیکٹو کے ڈیش بورڈ کے ساتھ چلائیں۔"
        ready: "صارفین سے پہلے آپ کو پتا چل جائے کہ سروس ٹھیک نہیں ہے۔"
