info:
  pw:
    about:
      - "زیادہ تر میٹر صرف لمبائی اور حروف کی قسمیں گنتے ہیں، اس لیے “Password1!” مضبوط لگتا ہے۔ یہ چیکر اصل کریکنگ ٹول کی طرح کام کرتا ہے: یہ عام پاس ورڈ، نمبر جڑے الفاظ اور نام، حروف کی جگہ علامتیں (p@ssw0rd)، qwerty جیسے کی بورڈ پیٹرن، دہرائے گئے حروف اور سال تلاش کرتا ہے، اور صرف باقی حصے کو رینڈم مانتا ہے۔"
      - "پھر یہ اندازہ لگاتا ہے کہ پاس ورڈ تین صورتوں میں کتنی دیر ٹکے گا: ایسی سائٹ پر آن لائن اندازے جو کوششیں محدود کرتی ہے، اور چوری شدہ پاس ورڈ ڈیٹا بیس پر آف لائن حملہ، جو اچھی طرح (bcrypt) یا بری طرح (تیز ہیش، GPU سے کریک) محفوظ ہو۔"
    faq:
      - q: "کیا یہاں اپنا اصل پاس ورڈ لکھنا محفوظ ہے؟"
        a: "جی ہاں۔ جانچ مکمل طور پر آپ کے براؤزر میں ہوتی ہے اور صفحے کی سیکیورٹی پالیسی کچھ بھی بھیجنے سے روکتی ہے۔ پھر بھی بہتر عادت یہ ہے کہ اصل کے بجائے اس سے ملتا جلتا پاس ورڈ جانچیں۔"
      - q: "پاس ورڈ کو مضبوط کیا بناتا ہے؟"
        a: "لمبائی اور غیر متوقع ہونا۔ پانچ یا زیادہ رینڈم الفاظ کا پاس فریز، یا پاس ورڈ مینیجر کے 16 یا زیادہ رینڈم حروف، علامتوں سے بھرے چھوٹے پاس ورڈ سے بہتر ہیں۔"
      - q: "علامتوں اور نمبروں کے باوجود میرا پاس ورڈ کمزور کیوں آتا ہے؟"
        a: "کیونکہ حملہ آور سب سے پہلے عام الفاظ کے ساتھ نمبر اور علامتیں جوڑ کر آزماتے ہیں۔ “Pakistan2024!” ایسا پیٹرن ہے جو تقریباً سب استعمال کرتے ہیں، اس لیے یہ جلد ٹوٹ جاتا ہے۔"
  leak:
    about:
      - "آپ کا پاس ورڈ آپ کے براؤزر میں SHA-1 سے ہیش کیا جاتا ہے۔ اس ہیش کے صرف پہلے 5 حروف Have I Been Pwned کی Pwned Passwords سروس کو بھیجے جاتے ہیں۔ وہ ان 5 حروف سے شروع ہونے والے تمام لیک شدہ ہیش (سینکڑوں) واپس بھیجتی ہے، اور یہ صفحہ ان میں آپ کا ہیش تلاش کرتا ہے۔ اس طریقے کو k-anonymity کہتے ہیں: سروس کو نہ آپ کا پاس ورڈ پتا چلتا ہے نہ اس کا پورا ہیش۔"
      - "اس فہرست میں عوامی ڈیٹا لیکس سے جمع کیے گئے کروڑوں اصل پاس ورڈ ہیں۔ اگر آپ کا پاس ورڈ اس میں ہے تو حملہ آوروں کی ان فہرستوں میں ہے جو وہ سب سے پہلے آزماتے ہیں، چاہے وہ کتنا ہی مضبوط لگے۔"
    faq:
      - q: "کیا یہ بتا سکتا ہے کہ کس ویب سائٹ سے میرا پاس ورڈ لیک ہوا؟"
        a: "نہیں۔ پاس ورڈ کی فہرست جان بوجھ کر لیکس کے ناموں سے الگ رکھی جاتی ہے تاکہ پاس ورڈ کسی شخص سے نہ جوڑے جا سکیں۔ آپ کا ای میل کن لیکس میں آیا، یہ haveibeenpwned.com پر تلاش کریں۔"
      - q: "میرا پاس ورڈ مل گیا۔ اب کیا کروں؟"
        a: "اسے ہر اس جگہ بدلیں جہاں استعمال کیا، ای میل اور بینک سے شروع کریں، اور two-factor authentication آن کریں۔ ہر سائٹ کے لیے الگ پاس ورڈ رکھیں، بہتر ہے پاس ورڈ مینیجر سے۔"
      - q: "میرا پاس ورڈ نہیں ملا۔ کیا یہ محفوظ ہے؟"
        a: "یہ کسی معلوم لیک میں نہیں آیا، یہ اچھی بات ہے، لیکن پھر بھی کمزور ہو سکتا ہے۔ اسے پاس ورڈ کی مضبوطی والے چیکر سے بھی جانچیں۔"
  gen:
    about:
      - "ہر پاس ورڈ crypto.getRandomValues سے بنتا ہے، جو آپ کے براؤزر کا cryptographically محفوظ رینڈم نمبر جنریٹر ہے، بغیر modulo bias کے۔ کچھ بھی محفوظ یا کہیں بھیجا نہیں جاتا۔"
      - "پاس فریز EFF کی مختصر الفاظ کی فہرست (1,296 الفاظ) استعمال کرتے ہیں۔ ہر لفظ تقریباً 10.3 bits رینڈمنس دیتا ہے، یعنی چھ الفاظ تقریباً 62 bits: لکھنے اور یاد رکھنے میں آسان، اندازہ لگانا بہت مشکل۔"
    faq:
      - q: "پاس فریز یا رینڈم حروف؟"
        a: "جو چیز آپ کو یاد رکھنی یا ٹائپ کرنی ہو، جیسے کمپیوٹر لاگ ان یا پاس ورڈ مینیجر کا ماسٹر پاس ورڈ، اس کے لیے پاس فریز۔ جو کچھ پاس ورڈ مینیجر خود بھرتا ہے، اس کے لیے لمبے رینڈم حروف۔"
      - q: "پاس ورڈ کتنا لمبا ہونا چاہیے؟"
        a: "عام اکاؤنٹس کے لیے کم از کم 12 حروف اور اہم اکاؤنٹس کے لیے 16 یا زیادہ۔ پاس فریز کے لیے پانچ یا چھ رینڈم الفاظ۔"
      - q: "کیا یہ پاس ورڈ کہیں محفوظ ہوتے ہیں؟"
        a: "نہیں۔ یہ صرف اس صفحے پر ہوتے ہیں جب تک آپ اسے بند نہ کریں۔"
  ph:
    about:
      - "کوئی لنک یا پورا پیغام پیسٹ کریں۔ چیکر ہر لنک نکالتا ہے، اصل ڈومین معلوم کرتا ہے (@ سے پہلے لکھا ٹیکسٹ، چھپائے گئے IP ایڈریس اور لنک کے اندر redirect جیسی چالوں سمیت)، اور اسے ان نشانیوں پر جانچتا ہے جو میں اپنی فشنگ ڈیٹیکشن ریسرچ میں استعمال کرتا ہوں: غلط ڈومین پر برانڈ کا نام، ملتی جلتی ہجے، خطرناک ڈومین اینڈنگ، مفت ہوسٹنگ، لنک شارٹنر اور دباؤ والے الفاظ۔"
      - "یہ لنک کبھی نہیں کھولتا، اس لیے مشکوک پیغامات جانچنا محفوظ ہے۔ یہ ایک بے ضرر کاپی (hxxp، [.]) بھی دیتا ہے جو آپ IT کو بھیج سکتے ہیں بغیر اس ڈر کے کہ کوئی غلطی سے کلک کر دے۔"
    faq:
      - q: "کیسے پتا چلے کہ لنک فشنگ ہے؟"
        a: "اصل ڈومین دیکھیں، یعنی پہلے اکیلے سلیش سے بالکل پہلے والا حصہ۔ اگر پیغام آپ کے بینک کی طرف سے ہونے کا دعویٰ کرے مگر ڈومین بینک کا نہ ہو تو وہ جعلی ہے۔ یہ ٹول وہ ڈومین آپ کے لیے ڈھونڈ دیتا ہے، چاہے وہ چھپا ہوا ہو۔"
      - q: "چیکر کو کوئی خطرے کی نشانی نہیں ملی۔ کیا لنک محفوظ ہے؟"
        a: "ضروری نہیں۔ یہ اندازے کے اصول ہیں، اور نئی فشنگ سائٹس صاف نظر آ سکتی ہیں۔ اگر پیغام آپ کو لاگ ان یا ادائیگی پر مجبور کرے تو ایپ کھولیں یا ایڈریس خود لکھیں۔"
      - q: "کیا یہ لنک کو بلاک لسٹ سے ملاتا ہے؟"
        a: "نہیں۔ لنک کہیں نہیں بھیجا جاتا، اس لیے آن لائن بلاک لسٹ میں تلاش نہیں ہو سکتا۔ یہ صرف ایڈریس سے ظاہر ہونے والی باتیں دیکھتا ہے۔"
  look:
    about:
      - "ڈومین ناموں میں کسی بھی زبان کے حروف آ سکتے ہیں۔ روسی (Cyrillic) “а” بالکل انگریزی “a” جیسا لگتا ہے، اس لیے аpple.com (روسی а کے ساتھ) apple.com سے الگ ویب سائٹ ہے۔ ایسے نام اندر سے punycode میں محفوظ ہوتے ہیں جو xn-- سے شروع ہوتا ہے، اور یہی یہ ٹول آپ کو دکھاتا ہے۔"
      - "یہ نام کو ویسے بھی پڑھتا ہے جیسے کوئی انسان پڑھے گا، یعنی ملتے جلتے حروف کو انگریزی حروف میں بدل کر، اور دیکھتا ہے کہ نتیجہ کسی مشہور برانڈ کی نقل تو نہیں۔ ملتے جلتے ناموں کی فہرست اس کا الٹ کرتی ہے: آپ کے اپنے ڈومین کی غلط ہجے اور بدلے ہوئے حروف دکھاتی ہے تاکہ آپ دیکھ سکیں کہ کسی نے کون سے رجسٹر کر لیے ہیں۔"
    faq:
      - q: "punycode کیا ہے؟"
        a: "punycode بین الاقوامی ڈومین ناموں کو سادہ ASCII میں لکھنے کا طریقہ ہے۔ مثلاً münchen.de بن جاتا ہے xn--mnchen-3ya.de۔ براؤزر عموماً پڑھنے کے قابل شکل دکھاتے ہیں، اسی لیے حملہ آور اس کا غلط استعمال کر سکتے ہیں۔"
      - q: "homograph حملہ کیا ہے؟"
        a: "ایسے حروف سے بنا جعلی ڈومین جو اصل حروف جیسے ہی لگتے ہیں، اکثر روسی یا یونانی حروف تہجی سے، تاکہ ایڈریس بار میں اصل سائٹ نظر آئے۔"
      - q: "typosquatting کیا ہے؟"
        a: "کسی مشہور ڈومین کی غلط ہجے رجسٹر کرنا، جیسے gooogle.com یا paypa1.com، تاکہ غلط ٹائپ کرنے والے یا غور سے نہ دیکھنے والے لوگ پھنس جائیں۔"
  exif:
    about:
      - "تصویروں میں EXIF نامی میٹا ڈیٹا ہوتا ہے۔ فون کی تصویروں میں عموماً تصویر لینے کی جگہ کے GPS کوآرڈینیٹس، تاریخ اور وقت، فون کا ماڈل، اور کبھی سیریل نمبر یا مالک کا نام بھی ہوتا ہے۔ کئی میسجنگ ایپس اسے ہٹا دیتی ہیں، مگر ای میل، کلاؤڈ لنکس اور کچھ ویب سائٹس نہیں ہٹاتیں۔"
      - "یہ ٹول وہ ڈیٹا آپ کے براؤزر میں پڑھتا ہے اور صاف کاپی بناتا ہے۔ JPEG، PNG اور WebP میں یہ تصویر کو دوبارہ کمپریس کیے بغیر میٹا ڈیٹا کاٹ دیتا ہے، اس لیے کوالٹی وہی رہتی ہے، اور صرف گھماؤ (rotation) رکھتا ہے تاکہ تصویر ٹیڑھی نہ دکھے۔ باقی فارمیٹس کو نئی تصویر میں دوبارہ بنایا جاتا ہے۔"
    faq:
      - q: "تصویر سے لوکیشن کیسے ہٹاؤں؟"
        a: "اوپر تصویر منتخب کریں اور صاف کاپی ڈاؤن لوڈ کریں۔ آئندہ کے لیے فون کی سیٹنگز میں کیمرا ایپ کی لوکیشن بند کر دیں۔"
      - q: "کیا اس سے تصویر کی کوالٹی کم ہوتی ہے؟"
        a: "JPEG، PNG اور WebP میں نہیں: تصویر کا ڈیٹا بغیر تبدیلی کے کاپی ہوتا ہے۔ HEIC جیسے دوسرے فارمیٹس دوبارہ بنا کر محفوظ کیے جاتے ہیں، جس سے فائل میں معمولی فرق آ سکتا ہے۔"
      - q: "کیا میری تصویر اپ لوڈ ہوتی ہے؟"
        a: "نہیں۔ تصویر آپ کے اپنے ڈیوائس پر پڑھی اور صاف کی جاتی ہے۔ کچھ اپ لوڈ نہیں ہوتا، اور صفحے کی سیکیورٹی پالیسی کچھ بھی بھیجنے سے روکتی ہے۔"
  hid:
    about:
      - "ٹیکسٹ میں ایسے حروف ہو سکتے ہیں جو نظر نہیں آتے: zero-width spaces، ٹیکسٹ کی ترتیب الٹنے والے bidi overrides، دوسری زبانوں کے انگریزی جیسے حروف، اور Unicode “tag” حروف۔ لوگ tag حروف نہیں دیکھ سکتے مگر بہت سے AI ماڈل انہیں عام ٹیکسٹ کی طرح پڑھتے ہیں، اس لیے ان سے ہدایات چھپائی جا سکتی ہیں، جسے پرامپٹ انجیکشن کہتے ہیں۔"
      - "یہ ہر چھپا ہوا حرف دکھاتا ہے، چھپے پیغامات ڈیکوڈ کرتا ہے، AI اسسٹنٹس کو دی گئی ہدایات جیسے جملے بتاتا ہے، اور صاف کاپی دیتا ہے۔ اردو، فارسی اور ایموجی کے لیے ضروری joiners برقرار رہتے ہیں۔"
    faq:
      - q: "پرامپٹ انجیکشن کیا ہے؟"
        a: "ایسے مواد میں چھپی ہدایات جو AI اسسٹنٹ پڑھتا ہے، جیسے ویب پیج یا ای میل، جو اسے اپنے صارف کو نظر انداز کر کے کچھ اور کرنے پر اکساتی ہیں، مثلاً ڈیٹا لیک کرنا۔"
      - q: "zero-width حروف کیسے ہٹاؤں؟"
        a: "ٹیکسٹ اوپر پیسٹ کریں، اسکین کریں، اور “صاف ٹیکسٹ کاپی کریں” استعمال کریں۔ یہ نظر نہ آنے والے حروف ہٹاتا ہے اور ملتے جلتے حروف کو عام حروف سے بدل دیتا ہے۔"
      - q: "ٹیکسٹ میں نظر نہ آنے والے حروف کیوں ہوتے ہیں؟"
        a: "کچھ بے ضرر ہوتے ہیں، PDF یا ویب پیج سے کاپی کرنے سے آتے ہیں۔ کچھ ٹیکسٹ پر واٹر مارک لگانے، فلٹرز سے بچنے یا AI ماڈلز کے لیے ہدایات چھپانے کے لیے استعمال ہوتے ہیں۔"
  pil:
    about:
      - "پرامپٹ انجیکشن LLM ایپلیکیشنز کے لیے OWASP Top 10 میں سب سے بڑا خطرہ ہے: ایسا ٹیکسٹ جو AI ماڈل سے اس کی ہدایات نظر انداز کروا کر کچھ اور کروا دے، جیسے ڈیٹا لیک کرنا۔ لیب آپ کو ایک حقیقی ہدف دیتی ہے، ایک بینک بوٹ جس کی ہدایات میں خفیہ کوڈ ہے، اور دس عام قسم کے حملے، ہر ایک انگریزی، اردو، رومن اردو اور پشتو میں۔ حفاظتی تربیت اور فلٹر زیادہ تر انگریزی میں بنتے اور جانچے جاتے ہیں، اس لیے دوسری زبانوں اور رسم الخط میں حملے اکثر زیادہ کامیاب ہوتے ہیں۔"
      - "ہر حملے کا فیصلہ خود بخود ہوتا ہے: ہر حملے کے لیے نیا کوڈ بنتا ہے، اور اگر جواب میں کوڈ کے ہندسے کسی بھی شکل میں ہوں (الٹے، فاصلے کے ساتھ، اردو ہندسوں میں یا Base64 میں) تو اسے لیک مانا جاتا ہے۔ ہر دفاعی لیول پر پوری لائبریری چلائیں اور دیکھیں ہر تہہ کتنی مدد کرتی ہے اور کون سے حملے سب سے بچ نکلتے ہیں۔"
    faq:
      - q: "پرامپٹ انجیکشن کیا ہے؟"
        a: "AI ماڈل جو کچھ پڑھتا ہے اس میں چھپی ہدایات، جو صارف لکھے یا کسی دستاویز، ویب پیج یا ای میل میں چھپی ہوں، اور جو ایپ بنانے والے کی ہدایات کو بدلنے کی کوشش کریں۔ براہِ راست انجیکشن صارف کی طرف سے آتا ہے؛ بالواسطہ انجیکشن اس مواد سے آتا ہے جو AI کو پڑھنے کے لیے دیا جائے، اسی لیے یہ RAG ایپس اور AI ایجنٹس کے لیے اہم ہے۔"
      - q: "اردو، رومن اردو اور پشتو میں کیوں جانچیں؟"
        a: "AI کی حفاظت کا زیادہ تر کام انگریزی میں ہوتا ہے۔ کم وسائل والی زبانوں پر تحقیق بتاتی ہے کہ ترجمہ کرنے پر وہی حملہ اکثر زیادہ کامیاب ہوتا ہے، اور انگریزی کے لیے لکھے گئے فلٹر اسے بالکل نہیں پکڑتے۔ پاکستان میں زیادہ تر لوگ رومن اردو، یعنی انگریزی حروف میں اردو، لکھتے ہیں۔"
      - q: "کون سا دفاع سب سے بہتر ہے؟"
        a: "کوئی اکیلا نہیں۔ پرامپٹ کے قواعد مدد کرتے ہیں مگر باتوں سے توڑے جا سکتے ہیں، فلٹر صرف معلوم نمونے پکڑتے ہیں، اور آؤٹ پٹ کی جانچ صرف پہچانے جانے والے لیک پکڑتی ہے۔ سب تہیں مل کر بہترین کام کرتی ہیں، اور بغیر حملے کے الفاظ والی سوشل انجینئرنگ کو روکنا سب سے مشکل ہے۔ ہر لیول پر لائبریری چلا کر خود دیکھیں۔"
      - q: "کیا میرا حملہ محفوظ کیا جاتا ہے؟"
        a: "نہیں۔ یہ Cloudflare پر لیب کے سرور کو جاتا ہے، جو اسے Cloudflare Workers AI کے ماڈل کو دیتا ہے اور جواب واپس کرتا ہے۔ ٹیکسٹ اور جواب محفوظ نہیں ہوتے۔ غلط استعمال روکنے کے لیے صرف یہ گنتی ایک گھنٹے کے لیے رکھی جاتی ہے کہ ایک سیشن نے کتنے حملے کیے۔"
  hash:
    about:
      - "ہیش ڈیٹا کا مختصر فنگر پرنٹ ہے: ایک بائٹ بدلیں تو پورا ہیش بدل جاتا ہے۔ سافٹ ویئر بنانے والے اپنے ڈاؤن لوڈز کا SHA-256 ہیش شائع کرتے ہیں تاکہ آپ جانچ سکیں کہ آپ کی فائل بالکل وہی ہے جو انہوں نے جاری کی۔"
      - "SHA ہیش آپ کے براؤزر کی اپنی crypto لائبریری بناتی ہے، MD5 یہ صفحہ۔ فائلیں آپ کے ڈیوائس پر پڑھی جاتی ہیں اور کبھی اپ لوڈ نہیں ہوتیں، اس لیے بڑی یا نجی فائلوں کا ہیش بھی نکالا جا سکتا ہے۔"
    faq:
      - q: "فائل کا SHA-256 کیسے جانچوں؟"
        a: "“فائل” منتخب کریں، ڈاؤن لوڈ چنیں، اور بنانے والے کی ویب سائٹ سے ہیش موازنے کے خانے میں پیسٹ کریں۔ میچ ہونے کا مطلب ہے فائل بالکل وہی ہے جو شائع کی گئی تھی۔"
      - q: "کیا MD5 اب بھی محفوظ ہے؟"
        a: "سیکیورٹی کے لیے نہیں: ایک ہی MD5 والی دو مختلف فائلیں بنائی جا سکتی ہیں۔ غلطی سے خراب ہونے والی فائل پکڑنے کے لیے یہ اب بھی ٹھیک ہے۔ اہم کاموں کے لیے SHA-256 استعمال کریں۔"
      - q: "کیا ہیش کو الٹ کر ٹیکسٹ واپس لیا جا سکتا ہے؟"
        a: "نہیں، مگر چھوٹے یا عام ان پٹ، جیسے پاس ورڈ، اندازے لگا کر اور ہیش ملا کر ڈھونڈے جا سکتے ہیں۔ اسی لیے پاس ورڈ bcrypt یا Argon2 جیسے سست ہیش سے محفوظ کیے جانے چاہئیں۔"
  jwt:
    about:
      - "JSON Web Token کے تین حصے ہوتے ہیں جو نقطوں سے الگ ہوتے ہیں: header، payload اور signature۔ پہلے دو صرف Base64url میں انکوڈ ہوتے ہیں، انکرپٹ نہیں، اس لیے ٹوکن رکھنے والا کوئی بھی انہیں پڑھ سکتا ہے۔ یہ ڈیکوڈر دونوں دکھاتا ہے اور تاریخ والے claims (exp، iat، nbf) کو پڑھنے کے قابل وقت میں بدلتا ہے۔"
      - "یہ ان سیٹنگز کی نشاندہی بھی کرتا ہے جو اکثر کمزوریوں کا باعث بنتی ہیں: “none” الگورتھم، ایکسپائری نہ ہونا، بہت لمبی مدت، header میں بتائی گئی keys، اور payload میں راز یا ذاتی ڈیٹا۔"
    faq:
      - q: "کیا یہاں ٹوکن پیسٹ کرنا محفوظ ہے؟"
        a: "ٹوکن صرف آپ کے براؤزر میں ڈیکوڈ ہوتا ہے اور کہیں نہیں بھیجا جاتا۔ پھر بھی اصل ٹوکنز کو پاس ورڈ کی طرح سمجھیں اور ٹیسٹ ٹوکن استعمال کریں۔"
      - q: "یہ signature کیوں نہیں جانچتا؟"
        a: "signature جانچنے کے لیے سرور کی خفیہ یا پبلک key چاہیے۔ اس کے بغیر کوئی ٹول نہیں بتا سکتا کہ ٹوکن اصلی ہے یا نہیں۔"
      - q: "کیا JWT انکرپٹڈ ہوتے ہیں؟"
        a: "عام دستخط شدہ JWT (JWS) نہیں۔ صرف JWE ٹوکن انکرپٹڈ ہوتے ہیں، اور ان کا صرف header پڑھا جا سکتا ہے۔"
  json:
    about:
      - "JSON پیسٹ یا ٹائپ کریں، یہ ساتھ ساتھ جانچا جاتا ہے۔ درست JSON آپ کے منتخب انڈینٹ کے ساتھ ترتیب دیا جاتا ہے یا ایک لائن میں منیفائی کیا جاتا ہے، اور دو دستاویزات کا موازنہ آسان بنانے کے لیے keys ترتیب دی جا سکتی ہیں۔"
      - "JSON غلط ہو تو یہ غلطی کی لائن اور کالم ایک نشان کے ساتھ دکھاتا ہے اور عام وجوہات بتاتا ہے: سنگل quotes، آخر میں فالتو کوما، بغیر quotes کی keys، اور کمنٹس، جن میں سے کسی کی JSON اجازت نہیں دیتا۔"
    faq:
      - q: "JSON کیسے ویلیڈیٹ کروں؟"
        a: "اوپر پیسٹ کریں۔ سبز پیغام کا مطلب ہے درست؛ سرخ پیغام بالکل بتاتا ہے کہ پہلی غلطی کہاں ہے۔"
      - q: "میرا JSON غلط کیوں ہے؟"
        a: "سب سے عام وجوہات: ڈبل کے بجائے سنگل quotes، آخری آئٹم کے بعد کوما، بغیر quotes کی keys، اور کمنٹس۔ JSON جاوا اسکرپٹ سے زیادہ سخت ہے۔"
      - q: "کیا میرا ڈیٹا سرور پر جاتا ہے؟"
        a: "نہیں۔ سب کچھ آپ کے براؤزر میں ہوتا ہے، اس لیے نجی ڈیٹا والے API جوابات یا کنفگ فائلیں فارمیٹ کرنا محفوظ ہے۔"
  b64:
    about:
      - "Base64 کسی بھی ڈیٹا، ٹیکسٹ یا فائل، کو صرف 64 محفوظ حروف میں لکھتا ہے تاکہ وہ ای میل، JSON یا URL میں جا سکے۔ یہ انکوڈنگ ہے، انکرپشن نہیں: کوئی بھی اسے ڈیکوڈ کر سکتا ہے۔"
      - "ٹیکسٹ پہلے UTF-8 میں بدلا جاتا ہے، اس لیے اردو اور ایموجی آنے جانے میں خراب نہیں ہوتے۔ اگر ڈیکوڈ شدہ ڈیٹا ٹیکسٹ نہ ہو تو ٹول پہلے بائٹس سے عام فائل کی قسمیں (PNG، JPEG، PDF، ZIP) پہچانتا ہے اور فائل ڈاؤن لوڈ کرنے دیتا ہے۔"
    faq:
      - q: "کیا Base64 انکرپشن ہے؟"
        a: "نہیں۔ یہ کچھ نہیں چھپاتا، صرف ڈیٹا لکھنے کا طریقہ بدلتا ہے۔ اسے پاس ورڈ یا راز چھپانے کے لیے کبھی استعمال نہ کریں۔"
      - q: "URL-safe Base64 کیا ہے؟"
        a: "ایک قسم جو + اور / کے بجائے - اور _ استعمال کرتی ہے اور عموماً = چھوڑ دیتی ہے، تاکہ نتیجہ URL یا فائل کے نام میں آ سکے۔ JWT یہی استعمال کرتے ہیں۔"
      - q: "تصویر کو Base64 میں کیسے بدلوں؟"
        a: "“فائل” منتخب کریں، تصویر چنیں، اور Base64 یا پورا data URI کاپی کریں، جو سیدھا HTML یا CSS میں پیسٹ ہو سکتا ہے۔"
  url:
    about:
      - "URL میں صرف کچھ خاص حروف آ سکتے ہیں۔ خالی جگہ، اردو یا لہجے والے حروف اور & یا # جیسی علامتیں percent-encode کرنی پڑتی ہیں (خالی جگہ %20 بن جاتی ہے) ورنہ لنک ٹوٹ جاتا ہے یا اس کا مطلب بدل جاتا ہے۔"
      - "انکوڈ ٹیکسٹ کو لنک کا محفوظ حصہ بناتا ہے۔ پورا URL انکوڈ کریں وہ حروف رہنے دیتا ہے جو URL کو ڈھانچہ دیتے ہیں (: / ? & =)۔ ڈیکوڈ %-codes کو واپس پڑھنے کے قابل بناتا ہے، اور حصوں والا منظر host، path اور ہر query parameter ڈیکوڈ کر کے دکھاتا ہے۔"
    faq:
      - q: "انکوڈ اور پورا URL انکوڈ کرنے میں کیا فرق ہے؟"
        a: "انکوڈ (encodeURIComponent) حروف، ہندسوں اور چند علامتوں کے علاوہ سب کچھ escape کرتا ہے، ایک parameter value کے لیے۔ پورا URL انکوڈ (encodeURI) ڈھانچے والے حروف کو نہیں چھیڑتا، پورے ایڈریس کے لیے۔"
      - q: "کبھی + کا مطلب خالی جگہ کیوں ہوتا ہے؟"
        a: "HTML فارم خالی جگہ کو + لکھتے ہیں۔ فارم ڈیٹا یا سرچ URL ڈیکوڈ کرتے وقت “خالی جگہ بطور +” آن کریں۔"
      - q: "کلک کرنے سے پہلے لنک ڈیکوڈ کیوں کریں؟"
        a: "فشنگ لنکس اکثر اصل منزل کو انکوڈ شدہ ٹیکسٹ یا redirect parameter میں چھپاتے ہیں۔ ڈیکوڈ کرنے سے پتا چلتا ہے کہ وہ اصل میں کہاں جاتا ہے۔"
  ts:
    about:
      - "Unix ٹائم اسٹیمپ 1 جنوری 1970 کی آدھی رات (UTC) سے گزرے سیکنڈ گنتا ہے۔ بہت سے سسٹم اس کے بجائے ملی سیکنڈ (JavaScript، Java) اور کچھ مائیکرو یا نینو سیکنڈ استعمال کرتے ہیں، اس لیے کنورٹر نمبر کی لمبائی سے یونٹ کا اندازہ لگاتا ہے۔"
      - "نتائج UTC میں، آپ کے اپنے ٹائم زون میں، ISO 8601 میں اور ابھی کے لحاظ سے دکھائے جاتے ہیں۔ آپ کوئی تاریخ اور وقت چن کر اس کا ٹائم اسٹیمپ بھی لے سکتے ہیں۔"
    faq:
      - q: "Unix ٹائم اسٹیمپ کو تاریخ میں کیسے بدلوں؟"
        a: "اسے اوپر پیسٹ کریں۔ 10 ہندسے عموماً سیکنڈ ہوتے ہیں، 13 ہندسے ملی سیکنڈ۔"
      - q: "سال 2038 کا مسئلہ کیا ہے؟"
        a: "جو سسٹم Unix وقت کو signed 32-bit نمبر میں رکھتے ہیں، وہ 19 جنوری 2038 کو 03:14:07 UTC (ٹائم اسٹیمپ 2147483647) پر ختم ہو جاتے ہیں۔ زیادہ تر جدید سسٹم 64 bits استعمال کرتے ہیں۔"
      - q: "کیا Unix ٹائم اسٹیمپ کا کوئی ٹائم زون ہوتا ہے؟"
        a: "نہیں۔ یہ ہر جگہ ایک ہی لمحہ ہے؛ صرف دکھانے کا انداز ٹائم زون پر منحصر ہے۔"
  uuid:
    about:
      - "UUID ایک 128-bit شناخت ہے۔ ورژن 4 مکمل طور پر رینڈم ہے (122 رینڈم bits) اور کچھ ظاہر نہیں کرتا۔ ورژن 7، جو 2024 میں RFC 9562 میں معیاری بنا، ملی سیکنڈ میں وقت سے شروع ہوتا ہے، اس لیے نئی IDs ترتیب سے آتی ہیں اور ڈیٹا بیس انڈیکس تیز رہتے ہیں۔"
      - "تمام IDs آپ کے براؤزر کے محفوظ رینڈم جنریٹر سے بنتی ہیں۔ چیکر کسی بھی UUID کا ورژن اور variant پڑھتا ہے اور وقت پر مبنی UUIDs (v1، v6، v7) کے بننے کا وقت دکھاتا ہے۔"
    faq:
      - q: "UUID v4 یا v7؟"
        a: "ڈیٹا بیس keys اور جو چیز بننے کے وقت سے ترتیب چاہیے، اس کے لیے v7۔ جب ID سے بننے کا وقت ظاہر نہیں ہونا چاہیے تو v4۔"
      - q: "کیا دو UUID ایک جیسے ہو سکتے ہیں؟"
        a: "عملی طور پر نہیں۔ v4 کے ساتھ ٹکراؤ کا امکان بننے کے لیے آپ کو کئی سال تک ہر سیکنڈ اربوں بنانے ہوں گے۔"
      - q: "کیا UUID خفیہ ٹوکن کے طور پر محفوظ ہیں؟"
        a: "رینڈم v4 UUID کا اندازہ لگانا مشکل ہے، مگر یہ راز کے طور پر نہیں بنائے گئے۔ وقت پر مبنی ورژن جزوی طور پر قابلِ پیشگوئی ہیں اور v1 میں نیٹ ورک کارڈ کا MAC ایڈریس ہو سکتا ہے۔ رازوں کے لیے الگ رینڈم ٹوکن استعمال کریں۔"

  web:
    about:
      - "چیکر آپ کا صفحہ ایک بار براؤزر کی طرح کھولتا ہے اور اس کے سیکیورٹی ہیڈرز، کوکیز، HTML اور آس پاس کی چھوٹی عوامی فائلیں (robots.txt، sitemap.xml، security.txt) پڑھتا ہے۔ یہ آپ کے ڈومین کے SPF، DMARC اور DKIM ریکارڈ دیکھتا ہے، Google PageSpeed Insights سے موبائل اور ڈیسک ٹاپ پر Lighthouse چلواتا ہے، Mozilla کی HTTP Observatory سے ہیڈرز کا گریڈ لیتا ہے اور، اگر آن ہو، Qualys SSL Labs سے TLS کا گریڈ لیتا ہے۔ یہ صفحے کے 50 تک لنکس کھول کر ٹوٹے ہوئے لنکس ڈھونڈتا ہے اور ملنے والی JavaScript لائبریریوں کو Retire.js کی معلوم کمزوریوں کی فہرست سے ملاتا ہے۔"
      - "ہر مسئلے کی سنگینی (Critical سے Low تک)، آسان زبان میں وضاحت اور حل دیا جاتا ہے۔ ہر شعبے کے اسکور مل کر 100 میں سے مجموعی اسکور اور A سے F تک گریڈ بناتے ہیں۔ مفت API حدود میں رہنے کے لیے ایک ہی پتے کے نتائج چند گھنٹے دوبارہ استعمال ہوتے ہیں، اور ہر رپورٹ، پتے سمیت، ایک ہفتے بعد خود بخود حذف ہو جاتی ہے۔"
    faq:
      - q: "کیا اس ٹول سے ویب سائٹ چیک کرنا محفوظ اور جائز ہے؟"
        a: "جانچ غیر فعال ہے: ٹول وہی عوامی صفحہ، ہیڈرز اور DNS ریکارڈ پڑھتا ہے جو ہر وزیٹر کے براؤزر کو ملتے ہیں، اور کچھ لنکس کھولتا ہے۔ یہ نہ حملہ کرتا ہے نہ لاگ اِن۔ پھر بھی صرف وہی سائٹس چیک کریں جو آپ کی ہیں یا جن کی اجازت ہے۔"
      - q: "میرا اسکور دوسرے ٹولز سے کم کیوں ہے؟"
        a: "یہ رپورٹ سیکیورٹی، رفتار، SEO، رسائی، ڈیزائن اور ٹیکنالوجی سب کو ملا کر دیکھتی ہے، اس لیے ایک کمزور شعبہ مجموعی اسکور کم کر دیتا ہے۔ ہر شعبہ کھول کر دیکھیں کہ نمبر کہاں کٹے، اور سب سے پہلے پانچ اہم حل سے شروع کریں۔"
      - q: "ہر گریڈ کا کیا مطلب ہے؟"
        a: "A کا مطلب 90 یا زیادہ، B کا 80 سے 89، C کا 70 سے 79، D کا 60 سے 69 اور F کا 60 سے کم۔ کوئی بھی Critical سیکیورٹی مسئلہ سیکیورٹی اسکور کو 50 سے نیچے رکھتا ہے۔"
      - q: "رپورٹ کیسے شیئر یا محفوظ کروں؟"
        a: "“شیئر لنک کاپی کریں” سے کسی کو بھیجیں، یا “PDF ڈاؤن لوڈ کریں” سے محفوظ کریں۔ شیئر لنک اس وقت تک چلتا ہے جب تک رپورٹ حذف نہ ہو، یعنی جانچ کے ایک ہفتے بعد تک۔"
      - q: "میں اپنی لوکل یا اندرونی سائٹ کیوں چیک نہیں کر سکتا؟"
        a: "پرائیویٹ اور اندرونی پتے (جیسے 192.168.x.x، 10.x.x.x یا localhost) جان بوجھ کر بند ہیں، تاکہ کوئی اس ٹول کے ذریعے فائر وال کے پیچھے کے نیٹ ورکس تک نہ پہنچ سکے۔"
  yttag:
    about:
      - "کریئیٹرز ویڈیو اپ لوڈ کرتے وقت اس پر ٹیگز لگا سکتے ہیں۔ یوٹیوب انہیں ویڈیو کے صفحے پر نہیں دکھاتا، لیکن یہ ویڈیو کے عوامی ڈیٹا کا حصہ ہیں۔ یہ ٹول آفیشل YouTube Data API سے ویڈیو کی معلومات لیتا ہے اور اس کے ٹیگز اسی ترتیب میں دکھاتا ہے جس میں کریئیٹر نے لگائے تھے۔"
      - "یہ ڈسکرپشن کے #ہیش ٹیگز، ویڈیو کی کیٹیگری، دورانیہ، ویوز، لائکس اور کمنٹس بھی دکھاتا ہے، اور یہ بھی کہ ٹیگز کے لیے یوٹیوب کے 500 حروف میں سے کتنے استعمال ہوئے۔"
    faq:
      - q: "کیا یوٹیوب پر ٹیگز اب بھی اہم ہیں؟"
        a: "تھوڑے سے۔ یوٹیوب کے مطابق ٹائٹل، تھمب نیل اور ڈسکرپشن کہیں زیادہ اہم ہیں، اور ٹیگز زیادہ تر عام غلط ہجوں میں مدد کرتے ہیں۔ پھر بھی کامیاب ویڈیوز کے ٹیگز دیکھ کر پتہ چلتا ہے کہ ان کے کریئیٹرز کن الفاظ کو نشانہ بناتے ہیں۔"
      - q: "کسی ویڈیو کے ٹیگز کیوں نہیں آتے؟"
        a: "بہت سے کریئیٹرز ٹیگز خالی چھوڑ دیتے ہیں۔ کچھ چینل ٹیگز لگاتے ہیں اور کچھ نہیں، اس لیے خالی فہرست عام بات ہے۔"
      - q: "کیا میں کسی دوسرے کریئیٹر کے ٹیگز کاپی کر سکتا ہوں؟"
        a: "ٹیگز پرائیویٹ نہیں، لیکن سب کاپی کرنے سے کم ہی فائدہ ہوتا ہے۔ وہی ٹیگز لیں جو واقعی آپ کی ویڈیو کو بیان کرتے ہیں، اور اس زبان کے الفاظ شامل کریں جس میں آپ کے ناظرین سرچ کرتے ہیں، جیسے رومن اردو۔"
  ytscript:
    about:
      - "زیادہ تر یوٹیوب ویڈیوز کے کیپشنز ہوتے ہیں، جو یا تو کریئیٹر نے لکھے ہوتے ہیں یا یوٹیوب کی اسپیچ ریکگنیشن نے خود بنائے ہوتے ہیں۔ یہ ٹول وہی کیپشن ٹریک پڑھتا ہے جو یوٹیوب پلیئر دکھاتا ہے اور اسے اسکرپٹ بنا دیتا ہے: وقفوں پر لائنیں جوڑ کر پیراگراف بنتے ہیں، یا ہر لائن اپنے ٹائم اسٹیمپ کے ساتھ آتی ہے۔"
      - "اگر ویڈیو کے کیپشنز کئی زبانوں میں ہوں تو آپ ایک چن سکتے ہیں۔ نتیجہ ‎.txt‎ فائل کے طور پر، یا اصل اوقات کے ساتھ ‎.srt‎ سب ٹائٹل فائل کے طور پر ڈاؤن لوڈ کریں۔"
    faq:
      - q: "کچھ ویڈیوز کا ٹرانسکرپٹ کیوں نہیں آتا؟"
        a: "کچھ ویڈیوز کے کیپشنز ہی نہیں ہوتے، اور کبھی کبھی یوٹیوب خودکار درخواستیں رد کر دیتا ہے۔ ایسے میں یوٹیوب پر “ٹرانسکرپٹ دکھائیں” کھولیں اور ٹیکسٹ ٹول کے نیچے والے خانے میں پیسٹ کریں: ٹائم اسٹیمپس یہ خود ہٹا دے گا۔"
      - q: "کیا خودکار کیپشنز درست ہوتے ہیں؟"
        a: "صاف آواز اور عام زبانوں میں زیادہ تر۔ ان میں اوقاف نہیں ہوتے، اور نام، تکنیکی الفاظ اور ملی جلی زبان (جیسے اردو کے ساتھ انگریزی) غلط ہو سکتی ہے، اس لیے استعمال سے پہلے اسکرپٹ ایک بار پڑھ لیں۔"
      - q: "کیا میں کسی اور کا ٹرانسکرپٹ استعمال کر سکتا ہوں؟"
        a: "نوٹس، پڑھائی، حوالے کے ساتھ اقتباس یا رسائی (accessibility) کے لیے ہاں۔ کسی دوسرے کریئیٹر کا اسکرپٹ اپنے مواد کے طور پر شائع کرنا اس کے کاپی رائٹ کی خلاف ورزی ہو سکتی ہے۔"
  ytchan:
    about:
      - "ہر چینل YouTube Studio میں اپنے کی ورڈز رکھ سکتا ہے۔ یہ چینل کے صفحے پر نظر نہیں آتے، لیکن عوامی ڈیٹا ہیں۔ یہ ٹول انہیں آفیشل YouTube Data API سے لیتا ہے، ساتھ میں چینل کے سبسکرائبرز، کل ویوز، ویڈیوز کی تعداد، شروع ہونے کی تاریخ، ملک اور وہ موضوعات جن سے یوٹیوب چینل کو جوڑتا ہے۔"
      - "یہ چینل کی آخری 50 ویڈیوز بھی پڑھتا ہے تاکہ دکھا سکے کہ وہ کون سے ٹیگز سب سے زیادہ استعمال کرتا ہے، ایک ویڈیو کو اوسطاً کتنے ویوز ملتے ہیں، وہ کتنی بار ویڈیو لگاتا ہے اور کون سی حالیہ ویڈیوز سب سے زیادہ چلیں۔"
    faq:
      - q: "میں کیا لکھ سکتا ہوں؟"
        a: "چینل کا لنک (‎youtube.com/@name‎ یا ‎youtube.com/channel/UC…‎)، ‎@handle‎، چینل ID، یا اس چینل کی کسی بھی ویڈیو کا لنک۔"
      - q: "سبسکرائبرز کیوں چھپے ہوئے ہیں؟"
        a: "چینل کے مالک نے انہیں چھپا رکھا ہے۔ یوٹیوب عوامی سبسکرائبر تعداد کو گول بھی کرتا ہے، اس لیے یہ اندازاً ہوتی ہے۔"
      - q: "کسی چینل کے کی ورڈز کیوں نہیں ہوتے؟"
        a: "چینل کی ورڈز اختیاری ہیں اور بہت سے چینل کبھی نہیں رکھتے۔ ان کے نیچے دی گئی اس کی ویڈیوز کے ٹیگز عموماً زیادہ کام کے ہوتے ہیں۔"
  ytkw:
    about:
      - "“کی ورڈ سے” یوٹیوب کی سرچ تجاویز سے پوچھتا ہے کہ لوگ آپ کے موضوع کے بعد کیا لکھتے ہیں: صرف موضوع، پھر اس کے بعد A سے Z تک ہر حرف، پھر “کیسے” جیسے سوالیہ الفاظ کے ساتھ۔ اس طرح آپ کو چند سو تک اصل سرچ جملے ملتے ہیں۔ کسی بھی آئیڈیا پر کلک کر کے اسے مزید کھولیں۔"
      - "“کیٹیگری میں ٹرینڈنگ” کسی ملک اور کیٹیگری کے لیے یوٹیوب کی آفیشل سب سے مقبول ویڈیوز کی فہرست لیتا ہے، مثلاً پاکستان میں گیمنگ، اور ان کے ٹیگز گنتا ہے، سب سے زیادہ استعمال ہونے والے پہلے۔"
    faq:
      - q: "کیا یہ سرچ والیوم دکھاتا ہے؟"
        a: "نہیں۔ یوٹیوب سرچ کے اعداد شائع نہیں کرتا۔ تجاویز کی ترتیب یوٹیوب خود طے کرتا ہے اور وہ زیادہ سرچ ہونے والی چیزوں کی طرف جھکتی ہے، اس لیے پہلی تجاویز عموماً سب سے مقبول ہوتی ہیں۔"
      - q: "زبان اور ملک کیوں چنیں؟"
        a: "تجاویز دونوں کے ساتھ بدلتی ہیں۔ اردو اور پاکستان، یا انگریزی اور پاکستان آزما کر دیکھیں کہ وہاں کے ناظرین کیا لکھتے ہیں، جو اکثر رومن اردو میں ہوتا ہے۔"
      - q: "کچھ کیٹیگریز خالی کیوں ہیں؟"
        a: "یوٹیوب ہر ملک میں ہر کیٹیگری کی ٹرینڈنگ فہرست نہیں رکھتا۔ “تمام کیٹیگریز” یا کوئی اور ملک آزمائیں۔"
  ytthumb:
    about:
      - "یوٹیوب ہر ویڈیو کے تھمب نیل کی کئی کاپیاں بناتا ہے: زیادہ سے زیادہ ریزولوشن (‏1280 × 720، صرف تب جب ویڈیو HD میں اپ لوڈ ہوئی ہو)، اسٹینڈرڈ (‏640 × 480)، ہائی (‏480 × 360)، میڈیم (‏320 × 180) اور چھوٹا (‏120 × 90)۔ یہ ٹول سب یوٹیوب کے اپنے امیج سرور سے دکھاتا ہے، اور “ڈاؤن لوڈ” آپ کی چنی ہوئی کاپی JPG فائل کے طور پر محفوظ کرتا ہے۔"
      - "اگر کوئی سائز نہیں ہے تو یوٹیوب نے اس ویڈیو کے لیے وہ بنایا ہی نہیں۔ ہائی کوالٹی والا ہمیشہ موجود ہوتا ہے۔"
    faq:
      - q: "ویڈیو ڈاؤن لوڈر کیوں نہیں ہے؟"
        a: "یوٹیوب ویڈیوز ڈاؤن لوڈ کرنا یوٹیوب کی سروس کی شرائط اور عموماً کریئیٹر کے کاپی رائٹ کی خلاف ورزی ہے۔ جو سائٹس یہ سہولت دیتی ہیں وہ بند کر دی جاتی ہیں اور ان کے اشتہارات ختم ہو جاتے ہیں، اس لیے یہ سائٹ صرف وہی دیتی ہے جس کی اجازت ہے: تھمب نیل، ٹیگز، کیپشنز اور عوامی اعداد۔ آف لائن دیکھنے کے لیے YouTube Premium کا ڈاؤن لوڈ بٹن استعمال کریں۔"
      - q: "کیا میں ڈاؤن لوڈ کیا ہوا تھمب نیل استعمال کر سکتا ہوں؟"
        a: "یہ کریئیٹر کی ملکیت ہے۔ ڈیزائن سیکھنے، ریویو میں یا اپنے تھمب نیل کے حوالے کے طور پر استعمال عام ہے؛ اسے اپنا بنا کر دوبارہ لگانا کریئیٹر کے ساتھ انصاف نہیں۔"
      - q: "کیا یہ Shorts کے لیے چلتا ہے؟"
        a: "ہاں۔ Shorts کا لنک پیسٹ کریں۔ Shorts کے تھمب نیل اکثر صرف چھوٹے سائزز میں ملتے ہیں۔"
