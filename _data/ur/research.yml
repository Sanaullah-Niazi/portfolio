thesis:
  degree: ایم ایس مصنوعی ذہانت، اسلامیہ یونیورسٹی بہاولپور
  supervisor: پروفیسر ڈاکٹر Najia Saher (سربراہ شعبہ مصنوعی ذہانت)
  summary: >-
    میں نے ڈیپ لرننگ کے ایسے ماڈل بنائے اور ان کا موازنہ کیا جو مصنوعی ذہانت کے لکھے اور انسان کے لکھے متن میں فرق کرتے ہیں،
    تقریباً 5 لاکھ متن پر مشتمل متوازن ڈیٹا سیٹ پر۔ اس مقالے پر مبنی تحقیقی مضمون تیاری کے مراحل میں ہے۔
  models:
    - LSTM
    - فائن ٹیونڈ BERT
    - TF-IDF + BERT + LightGBM
    - ہائبرڈ BERT + LSTM
  results:
    - value: "99.65%"
      label: درستگی (BERT + LSTM)
    - value: "0.995"
      label: F1 اسکور
    - value: "~5 لاکھ"
      label: متن
interests:
  - name: مصنوعی ذہانت سے لکھے متن کی پہچان
    stage: now
    note: میرے ایم ایس مقالے کا موضوع۔
  - name: فشنگ اور دھوکہ دہی کی پہچان
    stage: now
    note: میرا موجودہ منصوبہ، انگریزی، اردو اور رومن اردو پیغامات کے لیے۔
  - name: فراڈ کی پہچان
    stage: now
    note: فن ٹیک میں مصنوعی ذہانت پر مبنی فراڈ کی پہچان پر پہلے مصنف کے طور پر مقالہ۔
  - name: ایڈورسیریل مشین لرننگ
    stage: next
    note: حملہ آور ML ماڈلز کو کیسے دھوکہ دیتے ہیں اور انہیں مضبوط کیسے بنایا جائے۔
  - name: LLM سیکیورٹی
    stage: next
    note: پرامپٹ انجیکشن، غلط استعمال، اور لینگویج ماڈلز کا محفوظ استعمال۔
  - name: SOC کے لیے مصنوعی ذہانت
    stage: next
    note: سیکیورٹی آپریشنز سینٹر میں الرٹس اور لاگز کی ابتدائی چھانٹی کے لیے ML کا استعمال۔
