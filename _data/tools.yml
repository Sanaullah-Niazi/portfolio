  wi_no_https: "The site doesn't use HTTPS"
  wi_no_https_w: "Everything visitors send or receive, including passwords and form data, travels unencrypted and can be read or changed on the way. Browsers mark the site “Not secure”."
  wi_no_https_f: "Get a free certificate from Let's Encrypt (most hosts have a one-click option), serve the site on https:// and redirect all http:// traffic to it."
  wi_http_no_redirect: "http:// doesn't redirect to https://"
  wi_http_no_redirect_w: "People who type the address or follow old links land on the unencrypted version, where traffic can be read or tampered with."
  wi_http_no_redirect_f: "Add a permanent (301) redirect from every http:// address to the same https:// address in your server, host or CDN settings."
  wi_no_hsts: "No HSTS header (Strict-Transport-Security)"
  wi_no_hsts_w: "Without HSTS, a browser may still try the unencrypted http:// version first, which an attacker on the same network can intercept."
  wi_no_hsts_f: "Send the header Strict-Transport-Security: max-age=31536000; includeSubDomains once every page works over HTTPS."
  wi_hsts_short: "HSTS is set for only {days} days"
  wi_hsts_short_w: "A short HSTS lifetime means browsers forget to insist on HTTPS quickly, leaving gaps an attacker can use."
  wi_hsts_short_f: "Raise max-age to at least 15552000 (180 days), ideally 31536000 (one year)."
  wi_no_csp: "No Content Security Policy"
  wi_no_csp_w: "A Content Security Policy tells the browser which scripts and resources may load. Without one, an injected script (XSS) can run freely and steal data."
  wi_no_csp_f: "Start with a policy like default-src 'self' and add the outside domains you really use. Test with Content-Security-Policy-Report-Only first, then enforce it."
  wi_csp_weak: "The Content Security Policy allows {what}"
  wi_csp_weak_w: "These settings let inline or outside scripts run, which removes most of the protection a policy gives against script injection."
  wi_csp_weak_f: "Replace 'unsafe-inline' with nonces or hashes, remove 'unsafe-eval', and list exact domains instead of wildcards."
  wi_no_clickjack: "The site can be framed by other sites (clickjacking)"
  wi_no_clickjack_w: "Another website could load your pages in an invisible frame and trick visitors into clicking buttons they can't see."
  wi_no_clickjack_f: "Send Content-Security-Policy: frame-ancestors 'self' (or X-Frame-Options: SAMEORIGIN for older browsers)."
  wi_no_nosniff: "No X-Content-Type-Options header"
  wi_no_nosniff_w: "Browsers may guess a file's type and run an uploaded file as a script."
  wi_no_nosniff_f: "Send X-Content-Type-Options: nosniff on every response."
  wi_no_referrer: "No Referrer-Policy"
  wi_no_referrer_w: "Full page addresses, which can contain private details, may be sent to every outside site your pages link to or load from."
  wi_no_referrer_f: "Send Referrer-Policy: strict-origin-when-cross-origin (or set it with a meta tag)."
  wi_no_permissions: "No Permissions-Policy"
  wi_no_permissions_w: "Without it, any script or embedded frame on the page can ask for powerful features like the camera, microphone or location."
  wi_no_permissions_f: "Send a Permissions-Policy that turns off what you don't use, for example camera=(), microphone=(), geolocation=()."
  wi_cookie_secure: "Cookies without the Secure flag: {names}"
  wi_cookie_secure_w: "These cookies can also be sent over unencrypted http://, where they can be stolen."
  wi_cookie_secure_f: "Add the Secure attribute when setting these cookies."
  wi_cookie_httponly: "Login or session cookies readable by scripts: {names}"
  wi_cookie_httponly_w: "If an attacker manages to inject a script, it can read these cookies and take over visitors' sessions."
  wi_cookie_httponly_f: "Add the HttpOnly attribute to session and login cookies."
  wi_cookie_samesite: "Cookies without a safe SameSite setting: {names}"
  wi_cookie_samesite_w: "These cookies may be sent along with requests started by other websites, which helps cross-site request forgery (CSRF)."
  wi_cookie_samesite_f: "Set SameSite=Lax (or Strict) on these cookies. Use SameSite=None only together with Secure, and only when really needed."
  wi_mixed_active: "{n} scripts, styles or frames load over insecure http://"
  wi_mixed_active_w: "Browsers block these on HTTPS pages, which can break the page, and anyone on the network could replace them. Example: {example}"
  wi_mixed_active_f: "Change these addresses to https:// (or remove them). Adding Content-Security-Policy: upgrade-insecure-requests also helps."
  wi_mixed_passive: "{n} images or media load over insecure http://"
  wi_mixed_passive_w: "The browser shows the page as not fully secure, and the files can be swapped on the way. Example: {example}"
  wi_mixed_passive_f: "Load these files over https://."
  wi_insecure_form: "A form sends data over insecure http://"
  wi_insecure_form_w: "Whatever visitors type into this form is sent unencrypted."
  wi_insecure_form_f: "Change the form's action address to https://."
  wi_server_version: "The server reveals its software version ({value})"
  wi_server_version_w: "Attackers use exact versions to look up known vulnerabilities for your server."
  wi_server_version_f: "Hide the version, for example server_tokens off in nginx or ServerTokens Prod in Apache, and keep the software updated."
  wi_powered_by: "A header reveals the technology behind the site ({value})"
  wi_powered_by_w: "Headers like X-Powered-By tell attackers which language or framework to target."
  wi_powered_by_f: "Remove the header, for example expose_php = Off in PHP or app.disable('x-powered-by') in Express."
  wi_no_sri: "{n} outside scripts or styles have no integrity check"
  wi_no_sri_w: "If the other site is hacked, the changed file would run on your pages unnoticed."
  wi_no_sri_f: "Add integrity and crossorigin attributes (Subresource Integrity) to files loaded from CDNs, or host them yourself."
  wi_no_securitytxt: "No security.txt file"
  wi_no_securitytxt_w: "Security researchers who find a problem on your site have no clear way to report it to you."
  wi_no_securitytxt_f: "Publish /.well-known/security.txt with a Contact and an Expires line (see securitytxt.org)."
  wi_securitytxt_expired: "security.txt has expired"
  wi_securitytxt_expired_w: "The Expires date in your security.txt has passed, so researchers may think the contact details are out of date."
  wi_securitytxt_expired_f: "Update the Expires line to a date within the next year."
  wi_no_spf: "No SPF record for {domain}"
  wi_no_spf_w: "Anyone can send email that claims to come from your domain, and your real email is more likely to land in spam."
  wi_no_spf_f: "Add a TXT record that lists who may send your email, for example v=spf1 include:_spf.google.com -all for Google Workspace. Your email provider gives the exact value."
  wi_no_spf_nomail: "No SPF record for {domain}"
  wi_no_spf_nomail_w: "This domain doesn't seem to send email, but without SPF criminals can still send fake emails in its name."
  wi_no_spf_nomail_f: "If you never send email from this domain, add the TXT record v=spf1 -all to say so."
  wi_spf_multiple: "More than one SPF record"
  wi_spf_multiple_w: "A domain may have only one SPF record. With two, receiving servers treat SPF as broken."
  wi_spf_multiple_f: "Merge them into one TXT record that starts with v=spf1."
  wi_spf_pass_all: "SPF allows anyone to send email as {domain}"
  wi_spf_pass_all_w: "The record ends in +all, which tells mail servers that every server in the world may send your email."
  wi_spf_pass_all_f: "Change +all to -all (or ~all while testing)."
  wi_spf_neutral: "SPF doesn't reject fake senders"
  wi_spf_neutral_w: "The record ends in ?all or has no ending, so mail from other servers isn't treated as suspicious."
  wi_spf_neutral_f: "End the record with -all (or ~all) once all your real senders are listed."
  wi_no_dmarc: "No DMARC record for {domain}"
  wi_no_dmarc_w: "DMARC tells mail providers what to do with email that fails SPF or DKIM. Without it, fake emails in your name are more likely to reach inboxes."
  wi_no_dmarc_f: "Add a TXT record at _dmarc.{domain}, starting with v=DMARC1; p=none; rua=mailto:you@{domain}, then move to p=quarantine or p=reject."
  wi_dmarc_none: "DMARC only monitors (p=none)"
  wi_dmarc_none_w: "Fake emails that fail the checks are still delivered; the policy only produces reports."
  wi_dmarc_none_f: "After checking the reports, change the policy to p=quarantine and later p=reject."
  wi_no_dkim: "No DKIM key found on common selectors"
  wi_no_dkim_w: "DKIM signs your email so receivers can tell it really came from you. None was found under the usual names, though it may use a custom one."
  wi_no_dkim_f: "Turn on DKIM signing in your email provider and publish the TXT record it gives you."
  wi_bad_status: "The page answers with an error (HTTP {status})"
  wi_bad_status_w: "Visitors and search engines get an error instead of the page."
  wi_bad_status_f: "Check that the address is right and that the server or application isn't failing."
  wi_noindex: "The page asks search engines not to list it (noindex)"
  wi_noindex_w: "Google and other search engines will leave this page out of search results."
  wi_noindex_f: "Remove noindex from the robots meta tag or X-Robots-Tag header, unless hiding the page is intended."
  wi_robots_block_all: "robots.txt blocks all search engines"
  wi_robots_block_all_w: "The rule Disallow: / tells every crawler to stay away from the whole site."
  wi_robots_block_all_f: "Remove Disallow: / for User-agent: *, and block only private folders."
  wi_no_title: "The page has no title"
  wi_no_title_w: "The title is the clickable headline in search results and the name in browser tabs."
  wi_no_title_f: "Add a unique <title> of about 50 to 60 characters that describes the page."
  wi_title_long: "The title is long ({n} characters)"
  wi_title_long_w: "Search results cut off titles after about 60 characters."
  wi_title_long_f: "Shorten it and put the most important words first."
  wi_title_short: "The title is very short ({n} characters)"
  wi_title_short_w: "A very short title says little about the page to searchers."
  wi_title_short_f: "Describe the page in 30 to 60 characters, with your main keyword."
  wi_no_description: "No meta description"
  wi_no_description_w: "Search engines show this text under your title. Without it they pick random text from the page."
  wi_no_description_f: "Add a <meta name=\"description\"> of 120 to 160 characters that summarises the page."
  wi_desc_length: "The meta description is {n} characters"
  wi_desc_length_w: "Descriptions under 50 characters say too little; over 160 get cut off in results."
  wi_desc_length_f: "Aim for 120 to 160 characters."
  wi_no_h1: "No main heading (H1)"
  wi_no_h1_w: "The H1 tells visitors and search engines what the page is about."
  wi_no_h1_f: "Add one <h1> with the page's main topic."
  wi_multi_h1: "{n} main headings (H1)"
  wi_multi_h1_w: "Several H1s make the page's main topic less clear."
  wi_multi_h1_f: "Keep one H1 and turn the others into H2 or H3."
  wi_heading_skip: "Headings skip a level ({what})"
  wi_heading_skip_w: "Skipping levels makes the structure confusing for screen reader users and search engines."
  wi_heading_skip_f: "Use headings in order: H1, then H2, then H3."
  wi_no_canonical: "No canonical URL"
  wi_no_canonical_w: "If the page can be reached at several addresses, search engines may split its ranking between them."
  wi_no_canonical_f: "Add <link rel=\"canonical\" href=\"…\"> with the page's preferred address."
  wi_no_og: "Missing link preview tags: {missing}"
  wi_no_og_w: "When the page is shared on social media or chat apps, the preview may have no image or a poor description."
  wi_no_og_f: "Add Open Graph meta tags for the title, description and a 1200×630 image."
  wi_no_jsonld: "No structured data"
  wi_no_jsonld_w: "Structured data (schema.org) helps search engines understand the page and can earn rich results."
  wi_no_jsonld_f: "Add JSON-LD for your organisation, person, product or article, and test it with Google's Rich Results Test."
  wi_jsonld_invalid: "{n} structured data blocks have errors"
  wi_jsonld_invalid_w: "Search engines ignore JSON-LD they can't read."
  wi_jsonld_invalid_f: "Fix the JSON (the JSON formatter on this site shows the exact error) and test it with Google's Rich Results Test."
  wi_img_alt: "{n} of {total} images have no alt text"
  wi_img_alt_w: "Screen readers can't describe these images, and search engines can't understand them."
  wi_img_alt_f: "Add an alt attribute describing each image. Use alt=\"\" for purely decorative images."
  wi_no_robots: "No robots.txt file"
  wi_no_robots_w: "Not an error, but robots.txt is where you point search engines to your sitemap and keep them out of private areas."
  wi_no_robots_f: "Add /robots.txt with at least User-agent: * and a Sitemap: line."
  wi_no_sitemap: "No sitemap found"
  wi_no_sitemap_w: "A sitemap helps search engines find all your pages, especially new ones."
  wi_no_sitemap_f: "Publish /sitemap.xml (most CMSs and site generators can make one) and list it in robots.txt and Google Search Console."
  wi_no_lang: "The page language isn't set"
  wi_no_lang_w: "Screen readers may read the page with the wrong pronunciation, and browsers may offer the wrong translation."
  wi_no_lang_f: "Add a lang attribute to the <html> tag, for example <html lang=\"en\">."
  wi_zoom_disabled: "Zooming is turned off"
  wi_zoom_disabled_w: "People with low vision can't enlarge the page on their phone."
  wi_zoom_disabled_f: "Remove user-scalable=no and maximum-scale=1 from the viewport meta tag."
  wi_no_viewport: "No mobile viewport"
  wi_no_viewport_w: "Phones show the page as a tiny desktop page that people have to zoom and scroll sideways."
  wi_no_viewport_f: "Add <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> and use a responsive layout."
  wi_viewport_bad: "The viewport doesn't use the device width"
  wi_viewport_bad_w: "The page won't adapt to the width of phones and tablets."
  wi_viewport_bad_f: "Use content=\"width=device-width, initial-scale=1\"."
  wi_no_favicon: "No favicon"
  wi_no_favicon_w: "Browser tabs, bookmarks and some search results show a blank icon instead of your logo."
  wi_no_favicon_f: "Add <link rel=\"icon\"> pointing to an SVG or PNG icon."
  wi_slow_server: "The server took {ms} ms to answer"
  wi_slow_server_w: "A slow first response delays everything else on the page."
  wi_slow_server_f: "Use page caching or a CDN, and check slow database queries or plugins."
  wi_no_compression: "The page isn't compressed ({kb} KB)"
  wi_no_compression_w: "Uncompressed HTML takes longer to download, especially on mobile data."
  wi_no_compression_f: "Turn on gzip or Brotli compression in your server or CDN."
  wi_vuln_lib: "{name} {version} has {n} known vulnerabilities"
  wi_vuln_lib_w: "This version of the library has published security flaws ({cves}), for example: {summary}"
  wi_vuln_lib_f: "Update {name} to the latest version. If a plugin or theme loads it, update that, or replace it."
  wi_wp_outdated: "WordPress {version} is out of date (latest {latest})"
  wi_wp_outdated_w: "Old WordPress versions have known security holes that automated bots look for."
  wi_wp_outdated_f: "Back up the site, then update WordPress, themes and plugins from the dashboard. Turn on automatic minor updates."
  wi_generator_version: "The page reveals its software version ({value})"
  wi_generator_version_w: "The generator tag tells attackers exactly which version to target."
  wi_generator_version_f: "Remove the generator meta tag (many CMSs have a setting or plugin for this) and keep the software updated."
  wi_broken_links: "{n} broken links (of {checked} checked)"
  wi_broken_links_w: "Links that lead to errors frustrate visitors and waste search engines' time. Example: {example}"
  wi_broken_links_f: "Fix or remove these links, or redirect the old addresses to the right pages."
  wi_ssl_grade: "SSL Labs grade {grade}"
  wi_ssl_grade_w: "The HTTPS setup has weaknesses, such as old protocols, weak ciphers or certificate problems."
  wi_ssl_grade_f: "Turn off old protocols and weak ciphers (Mozilla's SSL Configuration Generator gives ready settings) and fix any certificate chain problems."
  wi_cert_expired: "The certificate expired {days} days ago"
  wi_cert_expired_w: "Browsers show a full-page security warning and most visitors will leave."
  wi_cert_expired_f: "Renew the certificate now, and set up automatic renewal (Let's Encrypt does this for free)."
  wi_cert_expiring: "The certificate expires in {days} days"
  wi_cert_expiring_w: "When it expires, browsers will block the site with a security warning."
  wi_cert_expiring_f: "Renew it now and check that automatic renewal works."
  wi_old_tls: "Old TLS versions are enabled ({list})"
  wi_old_tls_w: "TLS 1.0 and 1.1 have known weaknesses and are no longer supported by modern browsers."
  wi_old_tls_f: "Allow only TLS 1.2 and TLS 1.3 in your server or CDN settings."
  wi_no_tls13: "TLS 1.3 isn't supported"
  wi_no_tls13_w: "TLS 1.3 is faster and more secure than older versions."
  wi_no_tls13_f: "Turn on TLS 1.3 in your server or CDN settings (most support it)."
  wi_ssl_vuln: "Vulnerable to {name}"
  wi_ssl_vuln_w: "This is a serious, well-known TLS flaw that can expose encrypted traffic."
  wi_ssl_vuln_f: "Update the server's TLS library (such as OpenSSL) and turn off SSL 3.0 right away."
  wi_perf_score: "Performance score {score} on {device}"
  wi_perf_score_w: "Slow pages lose visitors and rank lower. Google's Lighthouse found the page slow to load or respond."
  wi_perf_score_f: "Start with the biggest items in the performance section: compress and resize images, delay non-essential scripts, and use caching."
  wi_lcp: "Main content takes {s} s to appear (LCP)"
  wi_lcp_w: "Largest Contentful Paint should be under 2.5 seconds. Until then, visitors look at an unfinished page."
  wi_lcp_f: "Make the main image or heading load first: compress it, use modern formats (WebP, AVIF), preload it, and reduce render-blocking CSS and JavaScript."
