# Text of the Tools page (/tools/) in English. The same keys are in _data/ur/tools.yml, de/tools.yml and zh/tools.yml.
# Only change the text after the colon, never the key before it.

eyebrow: "Tools"
title: "Security tools"
lede: "Small tools I use in my own security work, free for anyone. They run in your browser, so you can try them with real data."
private: "Nothing you type leaves this page"
pw_title: "Password strength checker"
gen_title: "Password and passphrase generator"
ph_title: "Phishing link checker"
hash_title: "Hash generator"
hid_title: "Hidden text and prompt injection finder"
jwt_title: "JWT decoder"
nojs: "These tools need JavaScript. Turn it on to use them."
pw_lede: "Estimates how long a password would survive a real attack. It looks for common passwords, names with numbers added, keyboard patterns, repeats and dates, not only length."
pw_label: "Password"
show: "Show"
gen_lede: "Uses your browser's secure random number generator. A passphrase of random words is easier to remember and just as hard to guess."
gen_phrase: "Passphrase"
gen_chars: "Random characters"
gen_words: "Words"
gen_sep: "Separator"
gen_cap: "Capitalise words"
gen_num: "Add a number"
gen_len: "Length"
gen_similar: "Leave out look-alikes (l, 1, O, 0)"
gen_new: "New one"
copy: "Copy"
ph_lede: "Paste a link, or a whole message with links in it. It shows where each link really goes and the warning signs I look for in my phishing research. It never opens the link."
ph_label: "Link or message"
ph_check: "Check"
try_sample: "Try an example"
ph_note: "These are rules of thumb, not a verdict. A clean result doesn't prove a link is safe. When in doubt, type the address yourself or open the app instead."
hash_lede: "Get the MD5, SHA-1, SHA-256, SHA-384 and SHA-512 hash of text or a file, for example to check a download against the hash its publisher lists."
hash_text: "Text"
hash_file: "File"
hash_pick: "Choose a file (it stays on your device)"
hash_expect: "Compare with an expected hash (optional)"
hid_lede: "Text can carry characters you can't see: zero-width spaces, direction overrides, look-alike letters, and invisible \"tag\" characters that AI models still read. Paste text from an email, web page or document before you give it to an AI assistant."
hid_label: "Text to scan"
hid_scan: "Scan"
jwt_lede: "Reads a JSON Web Token and points out risky settings, such as no signature algorithm, no expiry or secrets in the payload. It doesn't check the signature, because that needs the server's key."
jwt_label: "Token"
foot: "Found a bug or want another tool?"

# Text the tools write themselves (results, warnings). Keep the {words} in curly brackets as they are.
js:
  very_weak: "Very weak"
  weak: "Weak"
  fair: "Fair"
  strong: "Strong"
  very_strong: "Very strong"
  pw_bits: "About {n} bits of guessing work"
  pw_time_online: "Online attack on a site that limits tries (100 per hour)"
  pw_time_slow: "Offline attack on a well-stored password (bcrypt, 10,000 per second)"
  pw_time_fast: "Offline attack on a badly stored password (fast hash on GPUs, 100 billion per second)"
  pw_common: "This is one of the most common passwords. It would be guessed almost at once."
  pw_word: "Contains a common word or name: “{w}”. Attackers try these first, with numbers and symbols added."
  pw_leet: "Swapping letters for look-alike symbols (@ for a, 0 for o) barely helps. Cracking tools try that automatically."
  pw_year: "Contains a year. Birth years and recent years are guessed early."
  pw_seq: "Contains a sequence or keyboard pattern, like abc, 123 or qwerty."
  pw_repeat: "Contains repeated characters."
  pw_short: "Use at least 12 characters, more for important accounts."
  pw_classes: "Make it longer or mix in other kinds of characters."
  pw_good: "Looks good. Use it for one account only and keep it in a password manager."
  pw_tip: "Easiest strong option: a passphrase of 5 or more random words, from the generator below."
