info:
  pw:
    about:
      - "Most strength meters only count length and character types, so “Password1!” looks strong. This checker works more like a real cracking tool: it looks for common passwords, dictionary words and names with numbers added, letter-for-symbol swaps (p@ssw0rd), keyboard patterns like qwerty, repeats and years, and only counts the rest as random."
      - "It then estimates how long the password would last in three situations: guessing online against a site that limits attempts, and offline against a stolen password database that is stored well (bcrypt) or badly (a fast hash cracked on GPUs)."
    faq:
      - q: "Is it safe to type my real password here?"
        a: "Yes. The check runs entirely in your browser and the page's security policy blocks it from sending anything. Still, the safest habit is to test a password that is similar to yours rather than the real one."
      - q: "What makes a password strong?"
        a: "Length and unpredictability. A passphrase of five or more random words, or 16 or more random characters from a password manager, beats a short password full of symbols."
      - q: "Why does my password with symbols and numbers still score low?"
        a: "Because attackers try common words with numbers and symbols added first. “Summer2024!” follows a pattern almost everyone uses, so it falls early."
  leak:
    about:
      - "Your password is hashed with SHA-1 in your browser. Only the first 5 characters of that hash are sent to the Pwned Passwords service run by Have I Been Pwned. It replies with every leaked hash that starts with those 5 characters (hundreds of them), and this page looks for yours among them. This method is called k-anonymity: the service never learns your password or even its full hash."
      - "The list holds hundreds of millions of real passwords collected from public data breaches. If yours is in it, attackers have it in the word lists they try first, even if it looks strong."
    faq:
      - q: "Can it tell me which website leaked my password?"
        a: "No. The password list is deliberately kept separate from breach names, so passwords can't be linked back to people. To see which breaches your email address appeared in, search it on haveibeenpwned.com."
      - q: "My password was found. What should I do?"
        a: "Change it everywhere you used it, starting with email and banking, and turn on two-factor authentication. Use a different password for every site, ideally from a password manager."
      - q: "My password wasn't found. Is it safe?"
        a: "It hasn't appeared in a known breach, which is good, but it can still be weak. Check it with the password strength checker too."
  gen:
    about:
      - "Every password is made with crypto.getRandomValues, your browser's cryptographically secure random number generator, without modulo bias. Nothing is stored or sent."
      - "Passphrases use the EFF short word list (1,296 words). Each word adds about 10.3 bits of randomness, so six words give about 62 bits: easy to type and remember, very hard to guess."
    faq:
      - q: "Passphrase or random characters?"
        a: "Use a passphrase for anything you have to remember or type, like a computer login or a password manager's master password. Use long random characters for everything a password manager fills in for you."
      - q: "How long should a password be?"
        a: "At least 12 characters for everyday accounts and 16 or more for important ones. For passphrases, five or six random words."
      - q: "Are these passwords saved anywhere?"
        a: "No. They exist only on this page until you close it."
  ph:
    about:
      - "Paste a link or a whole message. The checker pulls out every link, works out the real domain (including tricks like text before an @ sign, disguised IP addresses and redirects inside the link), and checks it against the signs I use in my phishing detection research: brand names on the wrong domain, look-alike spellings, risky domain endings, free hosting, link shorteners and pressure words."
      - "It never opens the link, so it's safe to check suspicious messages. It also gives you a defanged copy (hxxp, [.]) that you can share with IT without anyone clicking it by accident."
    faq:
      - q: "How can I tell if a link is phishing?"
        a: "Look at the real domain, the part just before the first single slash. If a message claims to be from your bank but the domain isn't your bank's, it's a fake. This tool finds that domain for you, even when it's hidden."
      - q: "The checker found no warning signs. Is the link safe?"
        a: "Not necessarily. These are rules of thumb, and new phishing sites can look clean. If a message pushes you to log in or pay, open the app or type the address yourself."
      - q: "Does it check links against a blocklist?"
        a: "No. It doesn't send the link anywhere, so it can't look it up in online blocklists. It judges only what the address itself shows."
  look:
    about:
      - "Domain names can use letters from any alphabet. The Cyrillic “а” looks exactly like the Latin “a”, so аpple.com (with a Cyrillic а) is a different website from apple.com. Behind the scenes such names are stored as punycode, starting with xn--, and that's what this tool shows you."
      - "It also reads the name the way a person would, by mapping look-alike letters back to Latin, and checks whether the result imitates a known brand. The lookalike list does the reverse: it lists typos and character swaps of your own domain, so you can check which ones someone has registered."
    faq:
      - q: "What is punycode?"
        a: "Punycode is the way international domain names are written in plain ASCII. For example, münchen.de becomes xn--mnchen-3ya.de. Browsers usually show the readable form, which is why attackers can abuse it."
      - q: "What is a homograph attack?"
        a: "A fake domain built from letters that look identical to the real ones, often from the Cyrillic or Greek alphabet, so the address bar seems to show the real site."
      - q: "What is typosquatting?"
        a: "Registering misspellings of a popular domain, such as gooogle.com or paypa1.com, to catch people who mistype it or don't look closely."
  exif:
    about:
      - "Photos carry metadata called EXIF. Phone pictures usually include the GPS coordinates where they were taken, the date and time, the phone model, and sometimes a serial number or the owner's name. Many messaging apps strip it, but email, cloud links and some websites don't."
      - "This tool reads that data in your browser and makes a clean copy. For JPEG, PNG and WebP it cuts the metadata out without re-compressing the picture, so quality stays the same, and it keeps only the rotation so the photo isn't shown sideways. Other formats are redrawn into a new image."
    faq:
      - q: "How do I remove location from a photo?"
        a: "Choose the photo above and download the clean copy. To stop it happening in future, turn off location for the camera app in your phone's settings."
      - q: "Does it lower the quality of my photo?"
        a: "Not for JPEG, PNG or WebP: the image data is copied unchanged. Other formats, such as HEIC, are redrawn and saved again, which can change the file slightly."
      - q: "Is my photo uploaded?"
        a: "No. The photo is read and cleaned on your own device. Nothing is uploaded, and the page's security policy blocks it from sending anything."
  hid:
    about:
      - "Text can contain characters you can't see: zero-width spaces, bidirectional overrides that reorder text, letters from other alphabets that look like Latin ones, and Unicode “tag” characters. People can't see tag characters, but many AI models read them as normal text, which makes them a way to hide instructions, known as prompt injection."
      - "The finder shows every hidden character, decodes hidden messages, lists phrases aimed at AI assistants, and gives you a cleaned copy. It keeps the joiners that Urdu, Persian and emoji need."
    faq:
      - q: "What is prompt injection?"
        a: "Instructions hidden in content that an AI assistant reads, such as a web page or email, that try to make it ignore its user and do something else, like leak data."
      - q: "How do I remove zero-width characters?"
        a: "Paste the text above, scan it, and use “Copy cleaned text”. It removes invisible characters and replaces look-alike letters with normal ones."
      - q: "Why would text contain invisible characters?"
        a: "Some are harmless, from copying out of PDFs or web pages. Others are used to watermark text, get past filters, or hide instructions for AI models."
  pil:
    about:
      - "Prompt injection is the top risk in the OWASP Top 10 for LLM applications: text that makes an AI model ignore its instructions and do something else, like leak data. The lab gives you a real target, a bank help bot whose instructions hold a secret code, and ten common attack types, each written in English, Urdu, Roman Urdu and Pashto. Safety training and filters are mostly built and tested in English, so attacks in other languages and scripts often get further."
      - "Every attack is judged automatically: the code is new for each attack, and the reply counts as a leak if it contains the code's digits in any form (backwards, spaced out, in Urdu digits or Base64). Run the whole library at each defence level to see how much each layer helps and which attack types slip past all of them."
    faq:
      - q: "What is prompt injection?"
        a: "Instructions hidden in what an AI model reads, typed by a user or tucked into a document, web page or email, that try to override what the app's developer told it to do. Direct injection comes from the user; indirect injection comes from content the AI is asked to read, which is why it matters for RAG apps and AI agents."
      - q: "Why test in Urdu, Roman Urdu and Pashto?"
        a: "Most AI safety work is done in English. Research on low-resource languages shows that the same attack often works better when it's translated, and keyword filters written for English miss it completely. Roman Urdu, Urdu written in Latin letters, is how most people in Pakistan actually type."
      - q: "Which defence works best?"
        a: "No single one. Rules in the prompt help but can be talked around, filters only catch patterns they know, and output checks only catch leaks they can recognise. Layers together do best, and social engineering with no attack keywords is the hardest to stop. Run the library at each level to see it for yourself."
      - q: "Is my attack stored?"
        a: "No. It's sent to the lab's server on Cloudflare, which passes it to the AI model on Cloudflare Workers AI and returns the reply. The text and reply aren't saved. Only a counter of how many attacks a session has run is kept, for an hour, to stop abuse."
  hash:
    about:
      - "A hash is a short fingerprint of data: change one byte and the hash changes completely. Software publishers list the SHA-256 hash of their downloads so you can check that the file you got is exactly the one they released."
      - "SHA hashes are worked out by your browser's built-in crypto library, MD5 by this page. Files are read on your device and never uploaded, so you can hash large or private files."
    faq:
      - q: "How do I check a file's SHA-256?"
        a: "Choose “File”, pick the download, and paste the hash from the publisher's website into the compare box. A match means the file is exactly the one they published."
      - q: "Is MD5 still safe?"
        a: "Not for security: it's possible to make two different files with the same MD5. It's still fine for spotting accidental corruption. Use SHA-256 for anything that matters."
      - q: "Can a hash be reversed to get the text back?"
        a: "No, but short or common inputs, such as passwords, can be found by guessing and comparing hashes. That's why passwords should be stored with slow hashes like bcrypt or Argon2."
  jwt:
    about:
      - "A JSON Web Token has three parts separated by dots: a header, a payload and a signature. The first two are only Base64url-encoded, not encrypted, so anyone holding the token can read them. This decoder shows both and turns the date claims (exp, iat, nbf) into readable times."
      - "It also flags settings that often lead to vulnerabilities: the “none” algorithm, missing expiry, very long lifetimes, keys named in the header, and secrets or personal data in the payload."
    faq:
      - q: "Is it safe to paste a token here?"
        a: "The token is decoded only in your browser and never sent anywhere. Still, treat live tokens like passwords and prefer test tokens."
      - q: "Why doesn't it verify the signature?"
        a: "Checking the signature needs the server's secret or public key. Without it no tool can tell whether a token is genuine."
      - q: "Are JWTs encrypted?"
        a: "Normal signed JWTs (JWS) are not. Only JWE tokens are encrypted, and for those only the header can be read."
  json:
    about:
      - "Paste or type JSON and it is checked as you go. Valid JSON is pretty-printed with the indent you choose, or minified to one line, and you can sort keys to compare two documents more easily."
      - "When JSON is broken, it shows the line and column of the error with a pointer, and hints at the usual causes: single quotes, trailing commas, keys without quotes, and comments, none of which JSON allows."
    faq:
      - q: "How do I validate JSON?"
        a: "Paste it above. A green message means it's valid; a red one shows exactly where the first error is."
      - q: "Why is my JSON invalid?"
        a: "The most common reasons are single quotes instead of double quotes, a comma after the last item, keys without quotes, and comments. JSON is stricter than JavaScript."
      - q: "Is my data sent to a server?"
        a: "No. Everything is parsed in your browser, so it's safe to format API responses or config files that contain private data."
  b64:
    about:
      - "Base64 writes any data, text or files, using only 64 safe characters, so it can travel through email, JSON or URLs. It is an encoding, not encryption: anyone can decode it."
      - "Text is converted to UTF-8 first, so non-English text and emoji survive the round trip. When decoded data isn't text, the tool recognises common file types (PNG, JPEG, PDF, ZIP) from their first bytes and lets you download the file."
    faq:
      - q: "Is Base64 encryption?"
        a: "No. It hides nothing: it only changes how data is written. Never use it to protect passwords or secrets."
      - q: "What is URL-safe Base64?"
        a: "A variant that uses - and _ instead of + and /, and usually drops the = padding, so the result can go in a URL or file name. JWTs use it."
      - q: "How do I convert an image to Base64?"
        a: "Choose “File”, pick the image, and copy the Base64 or the full data URI, which you can paste straight into HTML or CSS."
  url:
    about:
      - "URLs can only contain certain characters. Spaces, accented letters and symbols like & or # must be percent-encoded (a space becomes %20) or they break the link or change its meaning."
      - "Encode turns text into a safe link part. Encode full URL keeps the characters that give a URL its structure (: / ? & =). Decode turns %-codes back into readable text, and the parts view lists the host, path and every query parameter, decoded."
    faq:
      - q: "What's the difference between Encode and Encode full URL?"
        a: "Encode (encodeURIComponent) escapes everything except letters, digits and a few symbols, for a single parameter value. Encode full URL (encodeURI) leaves the structure characters alone, for a whole address."
      - q: "Why does a + sometimes mean a space?"
        a: "HTML forms encode spaces as +. Turn on “Spaces as +” when you decode form data or search URLs."
      - q: "Why decode a link before clicking it?"
        a: "Phishing links often hide the real destination in encoded text or in a redirect parameter. Decoding shows where it really goes."
  ts:
    about:
      - "A Unix timestamp counts the seconds since 1 January 1970 at midnight UTC. Many systems use milliseconds instead (JavaScript, Java), and some use microseconds or nanoseconds, so the converter guesses the unit from the number's length."
      - "Results are shown in UTC, in your own time zone, as ISO 8601 and relative to now. You can also pick a date and time to get its timestamp."
    faq:
      - q: "How do I convert a Unix timestamp to a date?"
        a: "Paste it above. 10 digits is usually seconds, 13 digits milliseconds."
      - q: "What is the Year 2038 problem?"
        a: "Systems that store Unix time as a signed 32-bit number run out on 19 January 2038 at 03:14:07 UTC (timestamp 2147483647). Most modern systems use 64 bits."
      - q: "Does a Unix timestamp have a time zone?"
        a: "No. It is the same moment everywhere; only how it's displayed depends on the time zone."
  uuid:
    about:
      - "A UUID is a 128-bit identifier. Version 4 is completely random (122 random bits), so it reveals nothing. Version 7, standardised in RFC 9562 in 2024, starts with the time in milliseconds, so new IDs sort in order, which keeps database indexes fast."
      - "All IDs are made with your browser's secure random generator. The checker reads any UUID's version and variant, and shows when time-based ones (v1, v6, v7) were made."
    faq:
      - q: "UUID v4 or v7?"
        a: "Use v7 for database keys and anything you want sorted by creation time. Use v4 when the ID shouldn't reveal when it was made."
      - q: "Can two UUIDs be the same?"
        a: "In practice, no. With v4 you'd need to generate billions per second for many years before a collision becomes likely."
      - q: "Are UUIDs safe to use as secret tokens?"
        a: "Random v4 UUIDs are hard to guess, but they aren't designed as secrets. Time-based versions are partly predictable and v1 can contain a network card's MAC address. Use a dedicated random token for secrets."

  web:
    about:
      - "The checker loads your page once, the way a browser does, and reads its security headers, cookies, HTML and the small public files around it (robots.txt, sitemap.xml, security.txt). It looks up your domain's SPF, DMARC and DKIM records, asks Google PageSpeed Insights to run Lighthouse on mobile and desktop, gets a header grade from Mozilla's HTTP Observatory and, when it's switched on, a TLS grade from Qualys SSL Labs. It also follows up to 50 links on the page to find broken ones and compares the JavaScript libraries it sees with the Retire.js list of known vulnerabilities."
      - "Each problem gets a severity, from Critical to Low, an explanation in plain English and the fix. Category scores combine into an overall score out of 100 and a grade from A to F. Results for the same address are reused for a few hours to stay inside the free API limits, and every report, including the address, is deleted automatically after a week."
    faq:
      - q: "Is it safe and legal to scan a website with this tool?"
        a: "The checks are passive: the tool reads the same public page, headers and DNS records any visitor's browser gets, plus a few links. It doesn't attack, fuzz or log in. Still, only scan sites you own or are allowed to test."
      - q: "Why is my score lower than in other tools?"
        a: "This report combines security, speed, SEO, accessibility, design and technology, so one weak area pulls the overall score down. Open each category to see exactly what cost points, starting with the Top 5 fixes."
      - q: "What does each grade mean?"
        a: "A is 90 or more, B 80 to 89, C 70 to 79, D 60 to 69 and F below 60. Any critical security problem caps the security score below 50."
      - q: "How do I share or save the report?"
        a: "Use “Copy share link” to send it to someone, or “Download PDF” to save it. Shared links work until the report is deleted, a week after the scan."
      - q: "Why can't it scan my local or internal site?"
        a: "Private and internal addresses (like 192.168.x.x, 10.x.x.x or localhost) are blocked on purpose, so the tool can't be used to reach networks behind a firewall."
  yttag:
    about:
      - "Creators can add tags to a video when they upload it. YouTube doesn't show them on the video page, but they're part of the video's public data. This tool asks the official YouTube Data API for the video and lists its tags in the order the creator added them."
      - "It also lists the #hashtags in the description, the video's category, length, views, likes and comments, and how many of the 500 characters YouTube allows for tags are used."
    faq:
      - q: "Do tags still matter on YouTube?"
        a: "A little. YouTube says the title, thumbnail and description matter much more, and tags mostly help with common misspellings. Looking at the tags of videos that do well still shows you the words their creators aim for."
      - q: "Why does a video show no tags?"
        a: "Many creators leave tags empty. Some channels add them and others don't, so an empty list is normal."
      - q: "Can I copy another creator's tags?"
        a: "Tags aren't private, but copying them all rarely helps. Use the ones that really describe your video, and add words in the language your viewers search in."
  ytscript:
    about:
      - "Most YouTube videos have captions, either written by the creator or made automatically by YouTube's speech recognition. This tool reads the same caption track the YouTube player shows and turns it into a script: lines are joined into paragraphs at pauses, or listed with their timestamps."
      - "If a video has captions in several languages, you can pick one. Download the result as a .txt file, or as an .srt subtitle file with the original times."
    faq:
      - q: "Why can't it get the transcript of some videos?"
        a: "Some videos have no captions, and YouTube sometimes refuses automated requests. When that happens, open “Show transcript” on YouTube and paste the text into the box under the tool: it removes the timestamps for you."
      - q: "Are automatic captions accurate?"
        a: "Mostly, for clear speech in common languages. They miss punctuation and can get names, technical words and mixed languages (like Urdu with English) wrong, so read the script through before you use it."
      - q: "Can I use someone else's transcript?"
        a: "For notes, study, quotes with credit or accessibility, yes. Publishing another creator's script as your own content can break their copyright."
  ytchan:
    about:
      - "Every channel can set its own keywords in YouTube Studio. They aren't shown on the channel page, but they are public data. This tool asks the official YouTube Data API for them, along with the channel's subscribers, total views, number of videos, start date, country and the topics YouTube links it to."
      - "It also reads the channel's latest 50 uploads to show which tags it uses most, how many views a video gets on average, how often it posts and which recent videos did best."
    faq:
      - q: "What can I type in?"
        a: "A channel link (youtube.com/@name or youtube.com/channel/UC…), an @handle, a channel ID, or the link of any video from that channel."
      - q: "Why are the subscribers hidden?"
        a: "The channel owner chose to hide them. YouTube also rounds public subscriber counts, so they're approximate."
      - q: "Why does a channel have no keywords?"
        a: "Channel keywords are optional and many channels never set them. The tags of its videos, below them, are usually more useful anyway."
  ytkw:
    about:
      - "“From a keyword” asks YouTube's search suggestions what people type after your topic: the topic on its own, then followed by each letter from A to Z, then with question words like “how to”. You get up to a few hundred real search phrases. Click any idea to dig deeper into it."
      - "“Trending in a category” takes the videos on YouTube's official most popular list for a country and category, for example Gaming in Pakistan, and counts the tags they use, most used first."
    faq:
      - q: "Does it show search volume?"
        a: "No. YouTube doesn't publish search numbers. Suggestions are ordered by YouTube itself and lean towards what many people search, so the first ones are usually the most popular."
      - q: "Why pick a language and country?"
        a: "Suggestions change with both. Try Urdu and Pakistan, or English and Pakistan, to see what viewers there type, which is often in Roman Urdu."
      - q: "Why are some categories empty?"
        a: "YouTube doesn't keep a trending list for every category in every country. Try “All categories” or another country."
  ytthumb:
    about:
      - "YouTube makes several copies of every video's thumbnail: max resolution (1280 × 720, only when the video was uploaded in HD), standard (640 × 480), high (480 × 360), medium (320 × 180) and small (120 × 90). This tool shows them all from YouTube's own image server, and Download saves the one you pick as a JPG file."
      - "If a size is missing, YouTube didn't make it for that video. The high quality one always exists."
    faq:
      - q: "Why is there no video downloader?"
        a: "Downloading YouTube videos breaks YouTube's Terms of Service, and usually the creator's copyright. Sites that offer it get taken down and lose their advertising, so this site only offers what's allowed: the thumbnail, tags, captions and public numbers. To watch offline, use YouTube Premium's download button."
      - q: "Can I use a downloaded thumbnail?"
        a: "The creator owns it. Using it to study design, in a review or as a reference for your own thumbnail is common; reposting it as yours isn't fair to the creator."
      - q: "Does it work for Shorts?"
        a: "Yes. Paste the Shorts link. Shorts thumbnails are often only available in the smaller sizes."
