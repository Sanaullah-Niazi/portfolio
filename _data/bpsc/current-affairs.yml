  question: Who will be the next UN Secretary-General?
  answer: António Guterres's term ends on 31 December 2026. The Security Council has held at least seven straw polls since July. Rebeca Grynspan of Costa Rica is leading, with Rafael Grossi of Argentina, the IAEA chief, second. No one has been chosen yet. A winner needs at least 9 of 15 votes and no veto from the five permanent members. The new Secretary-General takes office on 1 January 2027. (Stimson Center)
