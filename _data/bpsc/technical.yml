  question: What is ChatGPT? (the one-minute answer)
  answer: 'ChatGPT is an AI chatbot made by OpenAI, an American company led by Sam Altman. It was released on 30 November 2022 and reached 100 million users in about two months, faster than any app before it. GPT stands for **Generative Pre-trained Transformer**: *generative* because it creates new text, *pre-trained* because it first learned from a huge amount of text from books and the internet, and *Transformer* because that is the type of neural network it uses. It works by predicting the next word again and again, which lets it answer questions, write, translate, summarise and write code. It can also make mistakes confidently, which we call hallucination, so its answers must be checked.'
