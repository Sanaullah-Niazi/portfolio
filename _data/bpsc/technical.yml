  category: Research and evaluation terms
  question: Which model was best?
  answer: 'The simplest one: TF-IDF with logistic regression, 99.67% F1 with only 0.14% false positives. McNemar''s test showed it was significantly better than the BiLSTM, the hybrid and the fusion model, and equal to BERT.'
