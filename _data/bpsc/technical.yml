  category: Research and evaluation terms
  question: What is shortcut learning?
  answer: When a model learns an easy cue that happens to separate the classes in one dataset, instead of the real concept. My models learned topic words like "car" and "Venus" for human essays and phrases like "additionally" and "in conclusion" for AI ones.
