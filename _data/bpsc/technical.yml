- id: tec-041
  bank: technical
  category: Research and evaluation terms
  question: Why remove duplicates? What is "data leakage"?
  answer: If the same or almost the same essay is in both training and test data, the model just remembers it and the score looks better than it really is. That is leakage. Removing it gives an honest score.
  personal: false
  frequency: 1
