- id: tec-043
  bank: technical
  category: Research and evaluation terms
  question: What is F1 score?
  answer: The balance of precision (of the texts the model called AI, how many really were) and recall (of all AI texts, how many it caught). It is better than accuracy when mistakes on one class matter.
  personal: false
  frequency: 1
