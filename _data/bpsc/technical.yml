- id: tec-048
  bank: technical
  category: Research and evaluation terms
  question: What is ROC-AUC?
  answer: The area under the ROC curve, which plots the true-positive rate against the false-positive rate at every threshold. 1.0 is perfect and 0.5 is guessing. It measures ranking, independent of the threshold.
