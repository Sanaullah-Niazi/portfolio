  question: How would you keep children safe on the school lab computers?
  answer: I would use filters at three levels. On the network, I would set the router to use a family-safe DNS like CleanBrowsing Family or OpenDNS FamilyShield, so adult and harmful sites are blocked for every device. On each computer, I would make a standard (non-admin) student account and turn on Microsoft Family Safety and SafeSearch in Google and YouTube. In the lab, I would keep screens facing the teacher and supervise. Parents can do the same at home, so I know it works and it costs nothing.
