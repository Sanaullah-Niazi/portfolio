- id: tec-042
  bank: technical
  category: Research and evaluation terms
  question: If a simple model is as good, why use deep learning?
  answer: That was one of my findings. On this kind of data, the difference between AI and human style is easy to spot, so simple models are enough. Deep models cost more computing power and do not help much here. Choosing the simplest model that works is good engineering.
