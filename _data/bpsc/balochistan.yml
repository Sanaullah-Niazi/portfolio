  bank: balochistan
  category: Balochistan's history
  question: Why did the British kill Mir Mehrab Khan?
  answer: During the First Anglo-Afghan War, the British army passed through Bolan to Afghanistan. They blamed the Khan, partly on false reports from his own officials, for not helping with supplies and for attacks on their troops. They stormed Kalat on **13 November 1839**, and Mehrab Khan died fighting. He is remembered as a hero.
