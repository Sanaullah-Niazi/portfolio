- id: bal-050
  bank: balochistan
  category: Balochistan's history
  question: How did the British take control?
  answer: Sir Robert Sandeman's treaty with Kalat in **1876** (Treaty of Mastung/Jacobabad) brought Kalat under British influence. Quetta, Bolan and other areas were leased. **British Balochistan** became a Chief Commissioner's province in **1887**. Sandeman's "tribal system" ruled through sardars and the jirga.
