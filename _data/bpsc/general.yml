- id: gen-060
  bank: general
  category: 'Sensitive questions: Afghanistan, law and order, BLA, TTP, PTM'
  question: What is the TTP? How should Pakistan deal with it?
  answer: '*Facts:* Tehreek-e-Taliban Pakistan was formed in 2007 under Baitullah Mehsud and is banned. It carried out the Army Public School Peshawar massacre (16 December 2014; about 150 killed, mostly children), which led to the National Action Plan and Operation Zarb-e-Azb (2014). The government now calls the TTP "Fitna al-Khawarij". Its attacks rose again after 2021, mostly in Khyber Pakhtunkhwa and parts of Balochistan; Operation Azm-e-Istehkam was announced in 2024. *Version A:* The TTP are khawarij who misuse the name of Islam to kill Muslims, children and soldiers. Islam forbids killing innocents (Surah Al-Ma''idah 5:32). The state is right to follow zero tolerance, through military operations, the National Action Plan and pressure on Afghanistan to deny them sanctuary. *Version B:* Force is necessary against those who kill, but lasting peace also needs ulema to answer their false ideology, schools and jobs in the former tribal areas, and justice for people displaced by operations,
    so young men are not recruited. The 2014-2017 period showed that firm action with public support works.'
