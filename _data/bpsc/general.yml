- id: gen-017
  bank: general
  category: Opinion and scenario questions
  question: A colleague asks you to help pass students who failed. What will you do?
  answer: 'I will not pass a student who has clearly failed. I will tell my colleague respectfully: "Brother, if these children don''t know this year''s basics, how will they manage in the next class? We pass them this year, and then what next year, pass them again? It will damage their future, not help it." Passing them only hides the problem, and it is unfair to the students who worked hard. But I understand some students go through hard times. So I will suggest we give them extra classes and a fair re-test, and talk to their parents. If they still need help, we follow the school''s official rules, not a personal favour. *Why this answer:* panels use this question to test integrity. Saying "I would pass them" can cost you the job, even if your intention is kindness. Show the kindness through remedial help instead.'
