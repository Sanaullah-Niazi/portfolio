  category: The school system and daily teaching
  question: What does a normal school day look like?
  answer: 'It starts with the morning assembly: recitation, the national anthem and a short talk on cleanliness or discipline. Then attendance, and classes of about 35 to 40 minutes, with a break in the middle. A teacher teaches several periods, checks copies and homework, and keeps the attendance and result registers. At the end of the day I would note what each class finished and plan the next day.'
