- id: gen-057
  bank: general
  category: 'Sensitive questions: Afghanistan, law and order, BLA, TTP, PTM'
  question: What is the solution to the Pakistan-Afghanistan problem?
  answer: '*Background:* After the Taliban returned to power in August 2021, attacks in Pakistan by the TTP rose sharply. Pakistan says TTP fighters operate from Afghan soil. In October 2025 there were heavy border clashes; Qatar and Turkey mediated a ceasefire and talks in Doha and Istanbul, but they did not settle the issue. Crossings including Chaman-Spin Boldak have been closed for long periods since. Pakistan has also been sending back undocumented Afghans since 2023. *Version A:* Pakistan wants peaceful, brotherly relations with Afghanistan; we share faith, culture and a long border. But no country can accept terrorists using a neighbour''s soil to attack it. The solution is that the Afghan interim government acts verifiably against the TTP and other groups, under the Doha understanding, while Pakistan keeps its border managed and fenced. Once security is assured, trade, transit and people-to-people links can grow again. *Version B:* Both countries need each other. For people in Chaman
    the border is not a line on a map; families, trade and livelihoods are on both sides, and the closure has hurt ordinary people on both sides most. Security concerns are real and must be addressed through continuous dialogue, with regional friends like Qatar, Turkey and China helping. Alongside that, the border should reopen for trade and families under proper documentation, refugees should be returned with dignity, and youth on both sides need education and jobs so that extremist groups cannot recruit them.'
  personal: false
  frequency: 1
  tags: []
  sources: []
  verified_on: '2026-11-24'
  check_again: false
  status: draft  # held back: see the PR (privacy rules, SRS 3.4)
  added: '2026-11-25'
- id: gen-058
  bank: general
  category: 'Sensitive questions: Afghanistan, law and order, BLA, TTP, PTM'
  question: What is the BLA? Why is there an insurgency in Balochistan?
  answer: '*Facts:* The Balochistan Liberation Army is a separatist armed group, banned in Pakistan since 2006 and designated a terrorist organisation by the US in 2025 and by the UK. It has carried out attacks on civilians, workers from other provinces, the security forces and Chinese nationals, including the hijacking of the Jaffar Express in March 2025. The government calls these groups "Fitna al-Hindustan" because it says they are backed by India. *Version A:* The BLA is a terrorist group that kills innocent people, including teachers, labourers and travellers, and it is supported by hostile foreign agencies who do not want CPEC and development in Balochistan to succeed. The Baloch people are patriotic Pakistanis and reject these groups. The state must deal firmly with terrorism while continuing development, jobs and education, as it is doing through the Balochistan development packages and quota jobs. *Version B:* Nothing justifies killing innocent people, and the BLA''s violence has
    hurt the Baloch people most of all. But we should also understand why some young people get angry: poverty, unemployment, poor schools and hospitals in a province rich in gas and minerals, and the painful issue of missing persons. The answer is to separate the violent few from the many with real grievances: fair share of resources, local jobs, rule of law and courts for every case, and dialogue with elected and peaceful Baloch leaders. Education is the strongest weapon against extremism.'
  personal: false
  frequency: 1
  tags: []
  sources: []
  verified_on: '2026-11-24'
  check_again: false
