  question: "What is a ghazal?"
  answer: "A poetic form of rhyming couplets (sher), each complete in meaning, usually on love, beauty, loss or mysticism. All couplets share the same rhyme (qafia) and repeated ending (radeef), and the poet's pen name often comes in the last couplet."
