- id: gen-063
  bank: general
  category: Thinking and values questions
  question: 'What is more important for a nation: education or the economy?'
  answer: 'Both go together, but I believe education comes first, because it builds the economy. Japan after 1945 and South Korea after its war had few natural resources, but they invested in education and became economic powers. Countries like the USA grew through business and trade, but their universities and skilled people are what keep them ahead. Islam also started with education: the first word revealed was "Iqra", read. A nation needs money to run schools, yes, but without educated people the money is wasted. So education is the seed, and the economy is the fruit. *Why this version:* your point about business is valid, so it''s kept. But in a teacher''s interview, "economy first" can make the panel ask, "Then why become a teacher?"'
