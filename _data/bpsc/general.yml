- id: gen-020
  bank: general
  category: The school system and daily teaching
  question: What are the levels of government schools?
  answer: Primary school is Kachi (pre-primary) to Class 5. Middle school is Classes 6 to 8; primary and middle together are called elementary. High school is Classes 9 and 10, ending with the matric exam of the Balochistan Board (BBISE, Quetta). Higher secondary is Classes 11 and 12, in higher secondary schools or intermediate colleges.
