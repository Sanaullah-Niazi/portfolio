  question: Tell us about the Nehru Report
  answer: '**Your answer:** In 1928 Lord Birkenhead challenged Indians to make an agreed constitution. An All Parties Conference made a committee under Motilal Nehru, and its report was the Nehru Report (August 1928). It asked for dominion status, rejected separate electorates for Muslims, and refused one third of seats for Muslims in the central legislature. Muslims saw it as a Hindu-majority plan. Quaid-e-Azam proposed amendments that were rejected, and he called it the "parting of the ways". In reply he gave his Fourteen Points in March 1929.'
