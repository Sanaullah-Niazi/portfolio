  category: The school system and daily teaching
  question: How do you teach a class where children are at very different levels, or several classes in one room?
  answer: 'I would divide them into small groups by level. While I teach one group directly, the others do written or practice work. I would pair a strong student with a weak one so both learn. I give the same topic at two levels: basic for those who are behind, and an extra challenge for the quick ones. This is normal in multi-grade primary classes in Balochistan.'
