- id: gen-061
  bank: general
  category: 'Sensitive questions: Afghanistan, law and order, BLA, TTP, PTM'
  question: What is the PTM? What do you think of it?
  answer: '*Facts:* The Pashtun Tahaffuz Movement was founded in 2018 by Manzoor Pashteen after the killing of Naqeebullah Mehsud in Karachi. It demanded an end to extrajudicial killings, the clearing of landmines, and the release of missing persons. The federal government banned it in October 2024, saying its activities threatened peace. *Version A:* The PTM is now a banned organisation, and as a government servant I respect the government''s decision. Pashtun concerns are being addressed through elected representatives, development in the merged districts and the courts. Any movement that uses anti-state slogans or creates hatred between the people and the armed forces only helps the enemy. *Version B:* As a government servant I respect the ban. At the same time, the issues it raised in 2018, like Naqeebullah''s killing, landmines and missing persons, were real issues that many Pashtun families felt, and some of them were acknowledged by the state. The right way is to raise such issues
    peacefully, through parliament and courts, without hatred against any institution.'
