  bank: general
  category: The school system and daily teaching
  question: How have government schools changed in recent years?
  answer: 'They have improved a lot. Not long ago, most children sat on a taat on the floor. Now many schools have desks, and some have computer labs and libraries. Teachers are better trained; NGOs and the department give training in computers, now even AI, and in child psychology. The biggest change is in discipline. Earlier, beating students was common. Now the approach is "maar nahi, pyar": teach with love, not punishment. Corporal punishment is now against the law, and I fully agree with it, because a child who is afraid cannot learn.'
