- id: gen-056
  bank: general
  category: The national anthem
  question: The anthem speaks of the power of the people, so why doesn't democracy work properly in our country, our homes and our schools?
  answer: The anthem says our system rests on *quwwat-e-akhuwwat-e-awaam*, the strength of the people's brotherhood. Democracy is more than voting. It is a habit of listening, tolerance and accepting the majority while protecting the minority. In our country, early leaders died soon after independence, and we had long periods without elected governments, so democratic habits did not grow deep. Low literacy and tribal and family traditions also mean that decisions are often made by one elder or one person. The place to change this is the school. If a teacher lets students elect class monitors, discuss in groups, give their opinion and respect others' views, they become democratic citizens. That is what I would do in my class.
  personal: false
