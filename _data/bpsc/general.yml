- id: gen-026
  bank: general
  category: The school system and daily teaching
  question: How will you deal with a weak student, an absent student, or an orphan?
  answer: For a weak student, I would find the exact gap, give extra time and simple practice, sit him with a helpful classmate, and praise small progress. For a student who is often absent, I would find out why, through classmates or by contacting the parents, because it is often poverty or work at home, and help him catch up. For an orphan or a child in a difficult family situation, I would be kind and patient, never embarrass him in front of others, connect him with stipend or welfare support such as the Edhi Foundation or Bait-ul-Maal if he needs it, and make sure he feels he belongs in class.
