- id: gen-031
  bank: general
  category: The school system and daily teaching
  question: What advice would you give a new teacher? (also asked as "What makes a good teacher?")
  answer: 'First, be punctual and disciplined. Come on time, leave on time, and respect every period. Students learn discipline by watching the teacher. Second, remember you are teaching more than a subject. Today children spend most of their day with teachers: school in the morning, madrasa in the afternoon, then tuition. So a teacher shapes their manners, their ethics and their goals, not just their marks in maths or computer science. Talk to them about careers and their future too. Third, don''t give up on any student. Some will ignore you completely. Don''t get angry and don''t stop. Study each child, understand his psychology, and keep changing your method until it reaches him." I believe that is the real test of a teacher.'
  personal: false
