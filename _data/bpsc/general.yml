  bank: general
  category: Thinking and values questions
  question: 'Which is more powerful: the pen or the sword?'
  answer: 'The pen. You can escape a sword, or defeat it once, but you cannot escape an idea written with a pen; it reaches millions and lives for centuries. The sword rules bodies, but the pen rules minds. Pakistan itself was won by the pen: by Sir Syed''s education, Iqbal''s poetry and the Quaid''s legal arguments, not by war. The Quran even swears by the pen: "Noon. By the pen and what they write" (Surah Al-Qalam 68:1).'
