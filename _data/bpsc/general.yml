  bank: general
  category: 'Sensitive questions: Afghanistan, law and order, BLA, TTP, PTM'
  question: How can law and order improve in Balochistan?
  answer: '*Both versions:* firm action against terrorists under the National Action Plan; well-trained and well-equipped police and Levies; intelligence-based operations; development that local people can see (roads, schools, hospitals, jobs for locals in CPEC and mining); dialogue with all peaceful stakeholders; and above all education, because an educated young person with a skill is the hardest to recruit. As an IT teacher, that is my contribution.'
