  question: "What are hamd, naat, marsiya and qasida?"
  answer: "Hamd is poetry in praise of Allah. Naat is poetry in praise of the Holy Prophet ﷺ. Marsiya is an elegy, especially on the martyrs of Karbala; Mir Anees and Mirza Dabeer are its masters. Qasida is a praise poem, usually of a person."
