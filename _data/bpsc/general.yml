- id: gen-027
  bank: general
  category: The school system and daily teaching
  question: Why are so many girls in Balochistan out of school?
  answer: 'The first reason is poverty. Education in government schools is free, but families still have to pay for uniforms, transport and copies, and many need the children''s help at home. The second is early marriage: many girls are married young and leave school. Then there are practical reasons. There are few girls'' schools, especially middle and high schools; in Chaman district, for example, only 34 of the 246 government schools are girls'' primary schools. Schools are far away, and many parents won''t let a daughter travel alone. Some schools have no female teacher, no boundary wall and no toilet. And in some families there is still a feeling that girls don''t need much education. Girls are also kept at home for housework: cooking, cleaning, ironing and looking after younger brothers and sisters. Many parents think a girl will be married anyway, so education is not needed. She tells parents: "Your daughter can become a doctor. Our women need female doctors. She can become a teacher
    and earn well." She talks to the fathers too, and sometimes she has to be firm and insist that the girl must come to school. Slowly girls are coming back. NGOs help with books, notebooks, uniforms and bags. Solutions: more girls'' middle and high schools close to home, more female teachers, stipends that keep girls in school, and awareness through religious scholars and elders, because Islam makes seeking knowledge a duty for every Muslim, man and woman. *If they follow up:* "Talab ul ilmi farizatun ala kulli Muslim" (seeking knowledge is an obligation on every Muslim; Sunan Ibn Majah).'
  personal: false
  frequency: 1
