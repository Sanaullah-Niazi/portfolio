  question: Which is the largest national park, where is it, and why is it called a national park?
  answer: '**Your answer:** In the world: Northeast Greenland National Park. In Pakistan: Hingol National Park in Balochistan, along the Makran coast (Lasbela, Awaran and Gwadar), about 6,100 km², declared in 1988. It has the Princess of Hope rock, the Sphinx-like rock, Kund Malir beach, mud volcanoes, the Hinglaj Mata temple, and animals like the ibex and marsh crocodile. It is called a national park because the government protects it by law, for wildlife, nature and natural beauty: hunting, cutting trees and building are restricted, and the public can visit to learn and enjoy it.'
