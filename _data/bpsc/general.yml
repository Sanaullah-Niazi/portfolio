- id: gen-034
  bank: general
  category: IT classroom and school situations
  question: A student is found viewing inappropriate content on the lab computer. What will you do?
  answer: 'I will stay calm and not shame him in front of the class. I will close it, then talk to him privately and explain, including from our religious values, why it is harmful. I will keep it confidential, because in our society, if the matter spreads, the child could be pulled out of school or face harsh punishment at home, and then he loses his education. I will quietly try to understand his background, and if he needs more guidance, I will involve someone he trusts, like an elder brother, and inform the head teacher. Then I will fix the cause: install a content filter, keep screens facing the teacher, and supervise the lab properly. I will also teach the whole class about online safety, without naming him.'
