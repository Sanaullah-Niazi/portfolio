  answer: '**Your answer:** Mawakhat means brotherhood. After the Hijrat, the Prophet ﷺ made each Muhajir (emigrant from Makkah) the brother of an Ansari (helper of Madina). The Ansar shared their homes, land and wealth with them. A famous pair was Hazrat Abdur Rahman bin Auf (RA) and Hazrat Saad bin Rabi (RA); Abdur Rahman thanked him and asked only to be shown the market. There was also an earlier Mawakhat among the Muslims of Makkah.'
