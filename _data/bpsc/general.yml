- id: gen-021
  bank: general
  category: The school system and daily teaching
  question: Who runs a government school?
  answer: 'The head teacher (or headmaster) runs the school day to day: timetable, attendance, discipline and records. At district level the District Education Officer (DEO) manages all schools, with deputy and sub-divisional officers who visit schools. At province level the School Education Department, headed by the Secretary, makes policy, and the Directorate of Education carries it out. The Balochistan Textbook Board prints the books, and BBISE takes the matric and intermediate exams. Every school also has a Parent Teacher School Management Committee (PTSMC) of parents and teachers.'
