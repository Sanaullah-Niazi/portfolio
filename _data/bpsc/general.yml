  category: The school system and daily teaching
  question: Who supports schools in Balochistan besides the government?
  answer: NGOs and donors give books, notebooks, uniforms and bags, and train teachers. The FC, the Frontier Corps Balochistan, which is a federal paramilitary force under the Interior Ministry, also runs and supports schools in many areas, including repair of buildings. Parent Teacher School Management Committees (PTSMCs) get funds for small repairs and are meant to link parents with the school. They work best when members are trained and roles are clear, so that they help the teachers rather than add pressure.
