- id: gen-071
  bank: general
  category: Thinking and values questions
  question: Is the joint family system good or bad?
  answer: 'It has both sides. It is good because elders are cared for, children grow up with values and love, and the family supports each other in hard times. But when brothers marry, a big joint house can bring problems of privacy and purdah, since a brother''s wife is non-mahram for the other brothers, and disputes can arise. So I think the best is a middle way: separate homes for each couple, close to each other, while our parents always live with us, are cared for and respected, as Islam commands. *Tone:* don''t say "all Pakistani schools are bad" or "teachers are corrupt". Describe the problem and the fix, and show that you are part of the fix.'
