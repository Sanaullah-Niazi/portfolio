  category: IT classroom and school situations
  question: Explain the internet to a Class 6 child in five minutes.
  answer: 'I would say: "In this class, you and your friends have each other''s phone numbers, so you are connected. That is a small network. Now imagine millions of computers and phones all over the world connected with each other, through cables, WiFi and mobile signals. That is the internet: a network of networks. That''s why you can watch a cartoon on YouTube at home, and your friend can watch the same cartoon in Quetta at the same time." Then I would ask them to name things they use the internet for.'
