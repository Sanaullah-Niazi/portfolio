  question: "What are matla, maqta, takhallus, sher and misra?"
  answer: "A sher is a couplet and a misra is one line of it. Matla is the first couplet of a ghazal, in which both lines rhyme. Maqta is the last couplet containing the poet's takhallus (pen name), such as \"Ghalib\" or \"Faraz\"."
