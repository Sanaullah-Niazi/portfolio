- id: gen-018
  bank: general
  category: Opinion and scenario questions
  question: What are the three biggest problems in Balochistan's schools? How would you fix one?
  answer: 'First, teacher absence. Outside Quetta, some teachers live in the city and their schools run on substitutes, or don''t run at all. Second, facilities. Many schools have weak buildings and no electricity, clean water, toilets or boundary walls, and many primary schools have only one or two teachers. NGOs are helping, but the gap is big. Third, children out of school, especially girls. Balochistan has the highest share of out-of-school children of any province. Where children do attend, cheating in exams hurts the honest students most. The one I would fix first is teacher presence, because a school with a teacher present can solve the other problems step by step. Recruiting teachers through BPSC on merit and posting them to their own districts, as this recruitment does, is the right start. Add regular monitoring visits and attendance checks, and give the parents'' committees a role so the community can report an absent teacher. **Follow-up: "Tell us more. What else is wrong?"**
    (the longer list; pick two or three, never read out all of them) - **Too few teachers, no specialists.** In many primary schools one teacher teaches every subject to several classes. - **Untrained teachers.** The curriculum has been updated, with IT now from Class 6, but many teachers have not been trained on the new books or methods. - **No resources.** No labs, equipment, libraries or even proper furniture in many schools. - **Weak buildings.** Some schools have damaged rooms or no boundary wall, which especially keeps girls away. - **Dropouts.** Poor families often take children out halfway to work or help in the family business. - **Weak community support.** Every school has a Parent Teacher School Management Committee (PTSMC). When it is active, it helps the teachers and the school a lot. In many places it needs to be strengthened, so that the community supports teachers instead of putting pressure on them.'
  personal: false
  frequency: 1
  tags: []
  sources: []
  verified_on: '2026-11-24'
  check_again: false
  status: published
  added: '2026-11-25'
- id: gen-019
  bank: general
  category: Opinion and scenario questions
  question: How would you fix these problems?
  answer: 'Sir, I would start with three things. First, the right teacher for the right subject. In some high schools there is a physics teacher teaching chemistry, or a maths teacher teaching computer science, because there is no specialist. Every subject needs a trained teacher of its own, and that is exactly why BPSC is now recruiting IT teachers. Second, proper facilities. Many schools still need safe buildings, electricity, furniture and equipment. In many classrooms children still sit on a taat, a floor mat, and teachers use chalk and blackboard. With solar power, desks, whiteboards and a few computers, the same teacher can do much more. Third, clear roles. Checking teachers and schools is the job of the education officers, like the DEO, the SDO and learning coordinators, and they should visit regularly. The community has an equally important role: making sure every child, especially every girl, in the village comes to school. If the community and the school committee take on that
    job, teachers can focus on teaching. *Tone:* say "many schools" and "some schools", not "all". Don''t compare Balochistan with KP or Sindh in front of the panel; it can sound like you''re putting your own province down. Say the community "has a role", not that it "interferes".'
