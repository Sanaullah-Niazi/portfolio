  category: The school system and daily teaching
  question: What is a JVT, JET, EST or SST?
  answer: JVT is Junior Vernacular Teacher, mainly for primary classes, teaching Urdu, maths, Islamiat and general subjects. JET is Junior English Teacher. EST is Elementary School Teacher, for the elementary classes up to Class 8. SST is Secondary School Teacher, a subject specialist for Classes 9 and 10. The IT Teacher I am applying for is BPS-17, a specialist post for IT from Class 6 upward. (See the cadre table earlier in this section for grades.)
