# The banks of the BPSC interview prep section (/bpsc-interview/), in the order they are shown.
# From the first import (BPSC_Interview_Banks.zip), plus the Urdu names. Each bank's questions are in
# _data/bpsc/<slug>.yml, and every item's category must be one of its bank's categories (scripts/bpsc_validate.py
# checks this). Never change a slug once it is live: it is part of every link to the bank.
# The question counts are worked out from the files when the site is built.
