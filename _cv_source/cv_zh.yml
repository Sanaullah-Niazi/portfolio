statement:
  intro: 我走向网络安全的道路并不笔直，但每一步都把我引向了它。
  parts:
    - h: 我从哪里来
      p:
        - 我在俾路支省的查曼长大。中学毕业后，我不确定该选择什么职业，花了大约一年时间准备参军选拔，同时探索其他出路。我家乡的很多人都通过安全类资格证书发展职业，于是我在白沙瓦完成了三年制的职业健康、安全与环境工程专科，第一年全日制就读，之后转为非全日制。这段学习教会我用风险、危害和预防的方式思考问题，如今我把这种思维方式用在数字系统上。
    - h: 我的学业
      p:
        - 2019 年，我开始在奎达的 BUITEMS 攻读信息技术学士学位。坦白说，我的本科 CGPA（2.73）并不能反映我的真实能力。本科期间的大部分时间里，我把精力主要放在体育上，参加板球比赛，在足球队里踢后卫；从 2021 年起，我还在 Upwork 上做自由职业，以 100% 的 Job Success Score 完成了 40 多个项目。到了本科后期，我学会了管理时间，开始认真对待学业。
        - 在巴哈瓦尔布尔伊斯兰大学攻读人工智能硕士是我的转折点。我努力学习，以 3.66 的 CGPA 毕业，并与不同的研究团队合作发表了三篇同行评审论文。我的学位论文用深度学习（LSTM、BERT 和混合模型）区分 AI 生成的文本和人类写作，准确率达到 99.65%，目前我正在以此为基础撰写自己的期刊论文。与此同时，我在费萨拉巴德政府学院大学（莱亚校区）担任客座讲师，讲授“信息与通信技术导论”和“计算机网络”。
    - h: 为什么选择网络安全
      p:
        - 我之所以在硕士阶段选择人工智能，是因为我的大学没有网络安全方向，而我认为 AI 是正确的基础：这两个领域正越来越紧密地结合在一起。之后，我通过 Cisco 的 Junior Cybersecurity Analyst 和 Ethical Hacker 课程，以及 NAVTTC 的数字取证与网络安全课程，自学建立了安全方面的技能。
        - 我的动力也来自个人经历。我曾遭遇网络诈骗和勒索软件攻击，也看到巴基斯坦的网络防护仍然薄弱。自新冠疫情以来，企业和日常生活都转移到了线上，而 AI 正在让攻击变得更快、更有说服力。我希望站在防御的一方。
    - h: 我的目标
      p:
        - 我希望继续以研究为导向的研究生学习，把我的 AI 背景与严谨、实践性强的安全训练结合起来。之后，我希望从事基于 AI 的威胁与欺诈检测工作，无论是在研究领域还是在安全运营中（SOC、蓝队或红队岗位，或治理、风险与合规），并不断考取更多专业证书。从长远来看，我希望帮助解决真实的网络安全问题，无论是在巴基斯坦，还是在我工作的任何地方。
    - h: 学习之外
      p:
        - 我踢足球、打板球，喜欢去山里徒步，会做传统美食，也关注 UFC。
