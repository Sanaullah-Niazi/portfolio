profile: >-
  Absolvent der Informationstechnik mit einem MS in Künstlicher Intelligenz (CGPA 3,66/4,00) und einem wachsenden
  Schwerpunkt auf Cybersicherheit. In meiner Masterarbeit habe ich Deep-Learning-Modelle (LSTM, BERT und hybride
  Architekturen) entwickelt, die KI-generierte von menschlich geschriebenen Texten mit bis zu 99,65 % Genauigkeit auf
  rund 500.000 Beispielen unterscheiden. Ich bin Erstautor eines begutachteten Artikels über KI-gestützte
  Betrugserkennung für die Cybersicherheit im FinTech-Bereich und habe Zertifikate von Cisco und NAVTTC in
  Cybersicherheit, Ethical Hacking und digitaler Forensik. Ich bewerbe mich für ein weiterführendes Studium in
  Cybersicherheit und KI, um eine Laufbahn in KI-gestützter Bedrohungserkennung und Security Operations aufzubauen.
