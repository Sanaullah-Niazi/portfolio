statement:
  intro: Mein Weg zur Cybersicherheit verlief nicht geradlinig, aber jeder Schritt hat mich ihr nähergebracht.
  parts:
    - h: Woher ich komme
      p:
        - Ich bin in Chaman in Belutschistan aufgewachsen. Nach der Schule wusste ich nicht genau, welchen Beruf ich ergreifen sollte. Etwa ein Jahr lang bereitete ich mich auf die Auswahl für die Streitkräfte vor und prüfte verschiedene Möglichkeiten. Viele Menschen aus meiner Region bauten sich mit Qualifikationen im Arbeitsschutz eine Laufbahn auf. Deshalb absolvierte ich in Peshawar ein dreijähriges Diplom in Arbeitssicherheit, Gesundheits- und Umwelttechnik, im ersten Jahr in Vollzeit und danach in Teilzeit. Dort lernte ich, in Risiken, Gefahren und Prävention zu denken, eine Denkweise, die ich heute auf digitale Systeme anwende.
    - h: Mein Studium
      p:
        - "2019 begann ich einen BS in Informationstechnik an der BUITEMS in Quetta. Ich will ehrlich sein: Mein Bachelor-CGPA (2,73) spiegelt nicht wider, was ich kann. Während eines großen Teils des Studiums verbrachte ich die meiste Zeit mit Sport, spielte Cricketturniere und Fußball als Verteidiger, und ab 2021 arbeitete ich außerdem freiberuflich auf Upwork, wo ich mehr als 40 Aufträge mit einem Job Success Score von 100 % abschloss. Gegen Ende meines Bachelorstudiums lernte ich, meine Zeit einzuteilen und das Studium ernst zu nehmen."
        - Mein MS in Künstlicher Intelligenz an der Islamia University of Bahawalpur war der Wendepunkt. Ich arbeitete hart, schloss mit einem CGPA von 3,66 ab und veröffentlichte drei begutachtete Artikel mit verschiedenen Forschungsteams. In meiner Masterarbeit nutzte ich Deep Learning (LSTM, BERT und hybride Modelle), um KI-generierte Texte von menschlichem Schreiben zu unterscheiden, mit 99,65 % Genauigkeit. Derzeit bereite ich daraus einen eigenen Artikel vor. Gleichzeitig unterrichtete ich als Gastdozent an der GC University Faisalabad (Campus Layyah) „Einführung in die IKT“ und „Rechnernetze“.
    - h: Warum Cybersicherheit
      p:
        - "Für meinen Master wählte ich KI, weil meine Universität keinen Schwerpunkt Cybersicherheit anbot und ich KI als die richtige Grundlage sah: Beide Felder arbeiten zunehmend Hand in Hand. Meine Sicherheitskenntnisse baute ich anschließend selbst auf, mit den Cisco-Programmen Junior Cybersecurity Analyst und Ethical Hacker und einem NAVTTC-Kurs in digitaler Forensik und Cybersicherheit."
        - Meine Motivation ist auch persönlich. Ich wurde Opfer eines Online-Betrugs und eines Ransomware-Angriffs, und ich sehe, wie schwach der Schutz vor Cyberangriffen in Pakistan noch ist. Seit COVID-19 haben sich Unternehmen und Alltag ins Internet verlagert, während KI Angriffe schneller und überzeugender macht. Ich möchte auf der Seite stehen, die sich dagegen verteidigt.
    - h: Meine Ziele
      p:
        - Ich möchte mein Studium forschungsorientiert fortsetzen und dabei meinen KI-Hintergrund mit fundierter, praktischer Sicherheitsausbildung verbinden. Danach möchte ich an KI-gestützter Bedrohungs- und Betrugserkennung arbeiten, in der Forschung oder in Security Operations (SOC, Blue- oder Red-Team-Rollen oder Governance, Risk & Compliance), und weitere Berufszertifikate erwerben. Langfristig möchte ich helfen, echte Cyberprobleme zu lösen, in Pakistan und überall, wo ich arbeite.
    - h: Außerhalb des Studiums
      p:
        - Ich spiele Fußball und Cricket, wandere in den Bergen, koche traditionelle Gerichte und verfolge UFC.
