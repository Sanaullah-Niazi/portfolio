statement:
  intro: سائبر سیکیورٹی تک میرا راستہ سیدھا نہیں تھا، لیکن ہر قدم مجھے اسی کی طرف لے گیا۔
  parts:
    - h: میں کہاں سے ہوں
      p:
        - میں بلوچستان کے شہر چمن میں پلا بڑھا۔ اسکول کے بعد مجھے یقین نہیں تھا کہ کون سا پیشہ اپناؤں۔ میں نے تقریباً ایک سال مسلح افواج میں انتخاب کی تیاری اور مختلف راستوں کو جانچنے میں گزارا۔ میرے علاقے کے بہت سے لوگ سیفٹی کی قابلیتوں کے ذریعے اپنا کیریئر بنا رہے تھے، اس لیے میں نے پشاور سے ہیلتھ، سیفٹی اور انوائرنمنٹل انجینئرنگ میں تین سالہ ڈپلوما کیا، پہلے سال باقاعدگی سے اور اس کے بعد جز وقتی۔ اس نے مجھے خطرات، نقصانات اور بچاؤ کے انداز میں سوچنا سکھایا، اور آج میں یہی سوچ ڈیجیٹل نظاموں پر لاگو کرتا ہوں۔
    - h: میری تعلیم
      p:
        - "2019 میں میں نے BUITEMS کوئٹہ میں انفارمیشن ٹیکنالوجی میں بی ایس شروع کیا۔ میں ایمانداری سے کہوں گا: میرا بی ایس کا CGPA (2.73) میری صلاحیت کی عکاسی نہیں کرتا۔ ڈگری کے زیادہ تر عرصے میں میرا بیشتر وقت کھیلوں میں گزرا، کرکٹ ٹورنامنٹ اور فٹبال میں ڈیفنڈر کے طور پر، اور 2021 سے میں Upwork پر فری لانسر کے طور پر بھی کام کر رہا تھا، جہاں میں نے 100% Job Success Score کے ساتھ 40 سے زائد کام مکمل کیے۔ بی ایس کے آخری حصے میں میں نے اپنا وقت سنبھالنا اور پڑھائی کو سنجیدگی سے لینا سیکھا۔"
        - اسلامیہ یونیورسٹی بہاولپور سے مصنوعی ذہانت میں ایم ایس میری زندگی کا اہم موڑ تھا۔ میں نے محنت کی، 3.66 CGPA کے ساتھ ڈگری مکمل کی، اور مختلف تحقیقی ٹیموں کے ساتھ تین ہم مرتبہ جائزہ شدہ مقالے شائع کیے۔ میرے مقالے میں ڈیپ لرننگ (LSTM، BERT اور ہائبرڈ ماڈلز) کے ذریعے مصنوعی ذہانت کے لکھے اور انسان کے لکھے متن میں 99.65% درستگی سے فرق کیا گیا، اور اب میں اس پر مبنی اپنا تحقیقی مضمون تیار کر رہا ہوں۔ اسی دوران میں نے جی سی یونیورسٹی فیصل آباد (لیہ کیمپس) میں وزیٹنگ لیکچرر کے طور پر آئی سی ٹی کا تعارف اور کمپیوٹر نیٹ ورکس پڑھائے۔
    - h: سائبر سیکیورٹی کیوں
      p:
        - "میں نے ایم ایس کے لیے مصنوعی ذہانت اس لیے چنی کہ میری یونیورسٹی میں سائبر سیکیورٹی کا شعبہ نہیں تھا، اور میں مصنوعی ذہانت کو درست بنیاد سمجھتا تھا: یہ دونوں شعبے تیزی سے ایک ساتھ کام کر رہے ہیں۔ اس کے بعد میں نے Cisco کے Junior Cybersecurity Analyst اور Ethical Hacker پروگرامز اور NAVTTC کے ڈیجیٹل فرانزک اور سائبر سیکیورٹی کورس کے ذریعے سیکیورٹی کی مہارتیں خود سیکھیں۔"
        - میری وجہ ذاتی بھی ہے۔ میں آن لائن فراڈ اور رینسم ویئر حملے کا شکار ہو چکا ہوں، اور دیکھتا ہوں کہ پاکستان میں سائبر تحفظ ابھی کتنا کمزور ہے۔ کووڈ-19 کے بعد کاروبار اور روزمرہ زندگی آن لائن منتقل ہو گئی ہے، جبکہ مصنوعی ذہانت حملوں کو تیز اور زیادہ قائل کرنے والا بنا رہی ہے۔ میں ان کے خلاف دفاع کرنے والوں کی صف میں ہونا چاہتا ہوں۔
    - h: میرے مقاصد
      p:
        - میں تحقیق پر مبنی اعلیٰ تعلیم جاری رکھنا چاہتا ہوں جو میرے مصنوعی ذہانت کے پس منظر کو مضبوط اور عملی سیکیورٹی تربیت کے ساتھ جوڑے۔ اس کے بعد میں مصنوعی ذہانت پر مبنی خطرات اور فراڈ کی پہچان پر کام کرنا چاہتا ہوں، تحقیق میں یا سیکیورٹی آپریشنز میں (SOC، بلیو یا ریڈ ٹیم کے کردار، یا گورننس، رسک اور کمپلائنس)، اور مزید پیشہ ورانہ سرٹیفکیٹس حاصل کرتا رہنا چاہتا ہوں۔ طویل مدت میں میں حقیقی سائبر مسائل حل کرنے میں مدد کرنا چاہتا ہوں، پاکستان میں اور جہاں بھی میں کام کروں۔
    - h: پڑھائی کے علاوہ
      p:
        - میں فٹبال اور کرکٹ کھیلتا ہوں، پہاڑوں میں ہائیکنگ کرتا ہوں، روایتی کھانے پکاتا ہوں اور UFC دیکھتا ہوں۔
