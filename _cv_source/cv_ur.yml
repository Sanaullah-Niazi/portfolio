profile: >-
  انفارمیشن ٹیکنالوجی کا گریجویٹ، مصنوعی ذہانت میں ایم ایس (CGPA 3.66/4.00) کے ساتھ، اور سائبر سیکیورٹی پر بڑھتی ہوئی توجہ۔
  میرے ایم ایس مقالے میں ڈیپ لرننگ ماڈلز (LSTM، BERT اور ہائبرڈ ساختیں) بنائے گئے جو تقریباً 5 لاکھ نمونوں پر مصنوعی ذہانت کے
  لکھے اور انسان کے لکھے متن میں 99.65% تک درستگی سے فرق کرتے ہیں۔ میں فن ٹیک سائبر سیکیورٹی کے لیے مصنوعی ذہانت پر مبنی فراڈ
  کی پہچان پر ہم مرتبہ جائزہ شدہ مقالے کا پہلا مصنف ہوں، اور سائبر سیکیورٹی، ایتھیکل ہیکنگ اور ڈیجیٹل فرانزک میں Cisco اور NAVTTC
  کے سرٹیفکیٹس رکھتا ہوں۔ میں سائبر سیکیورٹی اور مصنوعی ذہانت میں اعلیٰ تعلیم کے لیے درخواست دے رہا ہوں تاکہ مصنوعی ذہانت پر مبنی
  خطرات کی پہچان اور سیکیورٹی آپریشنز میں اپنا کیریئر بنا سکوں۔
