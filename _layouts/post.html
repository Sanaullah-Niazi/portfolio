---
layout: default
---
{% include i18n.html %}
<article class="wrap page">
  <p class="eyebrow"><a href="{{ L }}/blog/"><span class="back-arrow" aria-hidden="true">←</span> {{ S.notes_all }}</a></p>
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{% include date.html date=page.date long=true %}</time></p>
    {% if page.tags.size > 0 %}<ul class="tags" aria-label="{{ S.topics }}">{% for t in page.tags %}<li>{{ t }}</li>{% endfor %}</ul>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
