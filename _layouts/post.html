---
layout: default
---
<article class="wrap page">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">← All notes</a></p>
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time></p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
