---
layout: default
---
<article class="wrap page">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">← <span data-i18n="notes_all">All notes</span></a></p>
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time></p>
    {% if page.tags.size > 0 %}<ul class="tags" aria-label="Topics">{% for t in page.tags %}<li>{{ t }}</li>{% endfor %}</ul>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
