<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>
<a class="skip" href="#main"><span data-i18n="skip">Skip to content</span></a>
{% include header.html %}
<main id="main" tabindex="-1">
<p class="ur-notice" hidden><span data-i18n="ur_notice"></span></p>
{{ content }}
</main>
{% include footer.html %}
{%- comment -%} Urdu text for the language switch. A JSON block is data, not a script, so the security policy allows it. {%- endcomment %}
<script type="application/json" id="i18n-ur">{{ site.data.ur | jsonify }}</script>
</body>
</html>
