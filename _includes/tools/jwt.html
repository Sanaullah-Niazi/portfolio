<section class="card tool" id="jwt" aria-label="{{ T.jwt_title }}">
  <label class="field-label" for="jwt-input">{{ T.jwt_label }}</label>
  <textarea class="field mono" id="jwt-input" rows="3" dir="ltr" spellcheck="false" placeholder="eyJhbGciOi..."></textarea>
  <div class="btn-row">
    <button class="btn btn-sm" type="button" id="jwt-sample"><span>{{ T.try_sample }}</span></button>
  </div>
  <div class="tool-out" id="jwt-out" aria-live="polite"></div>
</section>
