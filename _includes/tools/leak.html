<section class="card tool" id="leak" aria-label="{{ T.leak_title }}">
  <label class="field-label" for="leak-input">{{ T.pw_label }}</label>
  <div class="field-row">
    <input class="field mono" id="leak-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" dir="ltr">
    <button class="btn btn-sm" type="button" id="leak-show" aria-pressed="false" aria-controls="leak-input"><span>{{ T.show }}</span></button>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary btn-sm" type="button" id="leak-check">{% include icon.html name="shield" px=16 %}<span>{{ T.leak_check }}</span></button>
  </div>
  <div class="tool-out" id="leak-out" aria-live="polite"></div>
  <p class="tool-note">{{ T.leak_note }} <a href="https://haveibeenpwned.com/" rel="noopener" target="_blank">{{ T.leak_email }}</a></p>
</section>
