<section class="card tool" id="exif" aria-label="{{ T.exif_title }}">
  <label class="drop" for="exif-file">{% include icon.html name="image" px=22 %}<span>{{ T.exif_pick }}</span></label>
  <input id="exif-file" type="file" accept="image/*" class="sr-only">
  <div class="tool-out" id="exif-out" aria-live="polite"></div>
</section>
